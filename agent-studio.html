/* ---------- downloads ---------- */
function download(name,text){
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function downloadAll(){
  if(!gen)return toast('Nothing built yet');
  gen.files.forEach(function(f,i){
    setTimeout(function(){download(f.path.replace(/\//g,'-'),f.body)},i*220)});
  toast('Downloading '+gen.files.length+' files');
}

/* Same call the main app makes. The redirect is unconditional: if the POST
   fails the cookie may still be gone, and leaving someone on a studio that
   thinks they are signed in is worse than an extra trip to the front page. */
function signOutFlow(btn){
  if(btn){btn.disabled=true;btn.textContent='Signing out…'}
  fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})
    .catch(function(){})
    .then(function(){try{localStorage.removeItem('scen.agentstudio.v1')}catch(e){}
                     location.href='/'});
}

function revokeFlow(t){
  var undo=busyBtn(t,'Revoking…');
  N.revokeOtherSessions().then(function(d){
    undo();renderMain();toast('Signed out '+(d.revoked||0)+' other session(s)');
  },function(e){undo();toast(N.msg(e))});
}

/* Real photographs for a build. Each one is 25 credits on the image gateway,
   so the number is said before anything is spent and the client decides. The
   prompts come from the brief, never from the page's own words, so a gym does
   not get a picture of its own headline. */
var IMG_COST=25;
/* An image plan, not four calls to the same prompt.

   What was here asked for "a wide establishing photograph" and then three of
   "a photograph of <gallery label>", in one aspect ratio each, with the mood
   taken from the style name. Four pictures that had nothing to do with one
   another arrived, and a page with a luxury hero, a cartoon second section and
   a stock third is the thing the client's standard names as the failure.

   So: one direction for the whole set, a subject and a ratio chosen for the
   slot each image lands in, negative space put where the text will sit, and
   the same lighting, palette and lens language named in every prompt so they
   read as one shoot. §25–36 of docs/BUILD-SKILL.md. */
var IMG_LOOK={
  restaurant:{dir:'cinematic food photography',use:'real ingredients, macro detail, steam and texture, the room at service, warm directional light',
    avoid:'artificial-looking food, unrelated stock dishes'},
  education:{dir:'documentary editorial photography',use:'authentic learning, a workshop mid-session, students working, a teacher explaining something, daylight through windows',
    avoid:'corporate office stock photography, posed groups facing the camera'},
  fitness:{dir:'athletic documentary photography',use:'real movement, chalk and sweat, strong directional light, the actual room, energetic crops',
    avoid:'generic bodybuilding stock, mirror selfies'},
  clinic:{dir:'calm clinical editorial photography',use:'clean rooms, natural materials, soft even light, hands and detail rather than faces',
    avoid:'stock smiling doctors, blue medical clip-art tones'},
  fashion:{dir:'fashion editorial photography',use:'fabric texture, considered styling, studio or location light with intent, full-length and detail crops',
    avoid:'catalogue cut-outs, cheap ecommerce lighting'},
  realestate:{dir:'architectural photography',use:'strong geometry, natural materials, dramatic light, minimal compositions, editorial framing',
    avoid:'fake futuristic renders, wide-angle distortion, generic office blocks'},
  agency:{dir:'editorial studio photography',use:'work in progress, materials, hands, considered still life, controlled light',
    avoid:'people pointing at whiteboards, handshake stock'},
  saas:{dir:'restrained technical photography',use:'original product visuals, abstract spatial compositions, precise materials, controlled light',
    avoid:'robots, glowing brains, neon circuitry, cliché AI imagery'},
  portfolio:{dir:'quiet editorial photography',use:'the work itself, gallery light, generous negative space',avoid:'busy collages'},
  travel:{dir:'cinematic travel photography',use:'place and light, early or late sun, wide environment and one human-scale detail',
    avoid:'oversaturated postcard shots'},
  events:{dir:'documentary event photography',use:'the room filling, stage light, crowd texture, motion held rather than frozen',
    avoid:'confetti stock'},
  games:{dir:'high-contrast product photography',use:'a lit setup at night, screen glow on real materials, controller detail',
    avoid:'esports stock crowds'},
  other:{dir:'editorial photography',use:'real environments, considered composition, natural directional light',
    avoid:'generic business stock'}
};
/* The design step names a photographic direction; it leads when it is there. */
var IMG_DIRS={cinematic:'cinematic photography, anamorphic feel, deep shadows',
  editorial:'editorial magazine photography, 35mm, honest light',
  studio:'studio photography, controlled light, seamless backdrop',
  documentary:'documentary photography, available light, nothing posed',
  architectural:'architectural photography, strong geometry, natural materials',
  lifestyle:'lifestyle photography, warm natural light, real moments',
  macro:'macro product photography, shallow depth of field, material detail',
  monochrome:'monochrome photography, high contrast, grain'};

function imagePlan(b,n){
  n=n||4;
  var P=pack(b);
  /* INDUSTRIES.other is labelled "Something else", which is fine in a menu and
     absurd in a prompt: "a photograph for a Something else website". When the
     trade is not one we know, the business describes itself. */
  var trade=(b.industry==='other')
    ? (b.industryOther||String(P.kicker||'').split('·')[0].trim()||b.name||'business')
    : (INDUSTRIES[b.industry]||INDUSTRIES.other).l;
  var look=IMG_LOOK[b.industry]||IMG_LOOK.other;
  var ui=b.__ui||{};
  var dir=(ui.images&&IMG_DIRS[ui.images])||look.dir;
  var dark=!!(STYLES[b.style]&&STYLES[b.style].dark);
  /* One line repeated in every prompt — this is what makes four images read as
     one campaign rather than four searches. */
  var campaign=' Art direction: '+dir+'; '+look.use+'; '+
    (dark?'low-key lighting, deep shadows, restrained palette':'clean daylight, soft shadows, restrained palette')+
    '; realistic materials and skin tones; consistent lens language across the set.'+
    ' Avoid: '+look.avoid+', text of any kind, logos, watermarks, user interface, borders.';
  /* §28 — the subject sits away from the words. A centred hero keeps its
     middle clear; a left-aligned one puts the subject right. */
  var centred=(ui.heroAlign||'center')==='center';
  var heroAspect=(ui.hero==='full')?'21:9':'16:9';
  var out=[{slot:'hero',aspect:heroAspect,alt:'',
    prompt:'Wide establishing photograph for the top of a '+trade+' website. Subject: '+
      (saneLine(b)||P.pitch||trade)+'. Composition: '+
      (centred?'subject centred and low in the frame, clean uncluttered space across the top third for a headline'
             :'subject weighted to the right, generous clean negative space on the left for a headline')+
      '.'+campaign}];
  /* the panels beside the copy, in the ratio the layout actually uses */
  var subjects=(P.gallery||[]).slice(0,4).filter(Boolean);
  if(!subjects.length)subjects=(P.services||[]).map(function(x){return x[0]}).slice(0,4);
  for(var i=0;out.length<n;i++){
    var sub=subjects[i%Math.max(1,subjects.length)]||('a detail from a '+trade);
    out.push({slot:'feature',aspect:(i%2?'4:5':'4:3'),alt:String(sub),
      prompt:'Photograph of '+sub+', for a '+trade+' website, same shoot as the others. '+
        'Composition: one clear subject, room around it, nothing centred by default.'+campaign});
  }
  return out.slice(0,n);
}
/* kept: everything downstream asks for prompts, not for a plan */
function imagePrompts(b,n){return imagePlan(b,n)}
/* The image run as a build step: one plan, n calls, a budget of its own, and
   whatever came back goes into the brief before the pages are composed. It
   never throws — a build does not stop because a photograph did not arrive. */
function buildImages(n){
  n=n||4;
  var list;
  try{list=imagePlan(S.brief,n)}
  catch(e){return Promise.resolve(L('could not plan the images — kept the placeholders',
                                    'image plan nahi bana — placeholders rakhe'))}
  /* Four images, one after another, took most of a two-minute build. The
     gateway charges per image either way, and they do not depend on each
     other, so they are asked for at once and whatever has arrived when the
     budget runs out is what gets used. */
  var done=0,reason='';
  thinkingSay(L('Making '+list.length+' pictures…','Photos bana raha hoon — '+list.length+'…'));
  function one(slot){
    return N.heroImage(slot.prompt,slot.aspect).then(function(img){
      done++;thinkingSay(L('Made '+done+' of '+list.length+'…',done+'/'+list.length+' ban gayin…'));
      /* §38 — the hero is the one anybody looks at, so it is the one that is
         checked, and reshot once from the reviewer's own description. */
      if(slot.slot!=='hero')return{slot:slot,url:img.url};
      return X.reviewPhoto(img.url).then(function(v){
        if(v&&v.usable===false&&v.reshoot){
          reason=L('reshot the hero: '+(v.faults[0]||'not usable'),
                   'hero dobara: '+(v.faults[0]||'theek nahi thi'));
          return N.heroImage(v.reshoot+' Photographic, no text, no logos, no interface.',slot.aspect)
            .then(function(img2){return{slot:slot,url:img2.url}},
                  function(){return{slot:slot,url:img.url}});
        }
        return{slot:slot,url:img.url};
      },function(){return{slot:slot,url:img.url}});
    },function(e){
      if(e&&(e.status===402||/credit/i.test(String(e.message||''))))reason=L('ran out of credits','credits khatam');
      return null;
    });
  }
  var budget=new Promise(function(res){setTimeout(function(){res('__timeout')},70000)});
  return Promise.race([Promise.all(list.map(one)),budget]).then(function(results){
    var got=(results==='__timeout')?[]:results.filter(Boolean);
    var hero='',made=[];
    got.forEach(function(g){if(g.slot.slot==='hero'&&!hero)hero=g.url;else made.push(g.url)});
    S.brief.__imagesRun=true;
    if(hero)S.brief.__heroImage=hero;
    if(made.length)S.brief.__art=made;
    if(hero||made.length){save();N.ensure('credits',true);setAcctPill()}
    var count=made.length+(hero?1:0);
    if(results==='__timeout'&&!count)return L('the pictures did not arrive in time — kept the placeholders',
                                              'photos time par nahi aayin — placeholders rakhe');
    return count?(count+L(' photographs, art-directed as one set',' photos, ek hi set ki tarah')+(reason?' · '+reason:''))
                :(reason||L('no images came back — kept the placeholders','koi image nahi aayi — placeholders rakhe'));
  });
}

function imageFlow(n){
  n=n||4;
  if(!signedIn()){
    agentSay(L('Sign in first — the image gateway needs your workspace.',
               'Pehle sign in karo — image gateway ko aapka workspace chahiye.'));
    return;
  }
  var list;
  try{list=imagePrompts(S.brief,n)}
  catch(e){
    agentSay(L('I could not put the image plan together — '+esc(String((e&&e.message)||e)).slice(0,120)+
               '. The build keeps its placeholders.',
               'Image plan nahi ban paaya — '+esc(String((e&&e.message)||e)).slice(0,120)+
               '. Build placeholders ke saath rahega.'));
    return;
  }
  var made=[],hero='';
  thinking(L('Making image 1 of '+n+'…','Image bana raha hoon 1/'+n+'…'));
  (function next(i){
    if(i>=list.length){
      clearThinking();
      if(!made.length&&!hero){
        agentSay(L('No images came back — nothing was charged for the ones that failed.',
                   'Koi image nahi aayi — jo fail hui unka kuch nahi kata.'));
        return;
      }
      if(hero)S.brief.__heroImage=hero;
      if(made.length)S.brief.__art=made;
      save();
      rebuild(L('Put '+(made.length+(hero?1:0))+' generated photographs into the build.',
                (made.length+(hero?1:0))+' generated photos build mein daal diye.'));
      N.ensure('credits',true);setAcctPill();
      return;
    }
    thinkingSay(L('Making image '+(i+1)+' of '+n+'…','Image bana raha hoon '+(i+1)+'/'+n+'…'));
    N.heroImage(list[i].prompt,list[i].aspect).then(function(img){
      if(i===0)hero=img.url;else made.push(img.url);
      next(i+1);
    },function(e){
      /* 402 is the only one worth stopping for: nothing else will succeed */
      if(e&&(e.status===402||/credit/i.test(String(e.message||'')))){
        clearThinking();
        agentSay(L('Not enough credits for the rest — '+(made.length+(hero?1:0))+' were made. Top up and say "images" again.',
          'Baaki ke liye credits kam pad gaye — '+(made.length+(hero?1:0))+' ban gayin. Credits daal ke phir "images" bol dena.'));
        if(hero)S.brief.__heroImage=hero;
        if(made.length){S.brief.__art=made;save();rebuild(L('Used the images that were made.','Jo images bani wo laga di.'))}
        return;
      }
      next(i+1);
    });
  })(0);
}

/* Three honest answers, never a guess: yes, no with the reason, or "I have
   not been able to check". */
function publishNote(){
  var c=API.capabilities;
  if(!c)return 'Checking whether publishing is connected\u2026';
  var pub=c.publish||c.publishing||(c.capabilities&&(c.capabilities.publish||c.capabilities.publishing));
  if(pub===undefined||pub===null)return 'I could not read whether publishing is connected.';
  var ok=(pub===true)||(pub&&(pub.enabled===true||pub.available===true||pub.status==='ready'));
  if(ok)return 'Publishing is connected \u2014 <b>Publish</b> puts it live.';
  var why=(pub&&(pub.reason||pub.detail||pub.message))||'';
  return 'Publishing is not connected'+(why?' \u2014 '+esc(String(why).slice(0,90)):'')+'.';
}

function setAiPill(){
  var p=$('#aiPill'),live=AI.state==='live'||AI.state==='ready';
  p.textContent=AI.enabled?X.label():'AI off';
  p.className='pill'+(!AI.enabled?'':live?' ok':AI.state==='unknown'?'':' warn');
  $('#aiBtn').classList.toggle('on',AI.enabled);
  var note=$('#composerNote');
  if(!AI.enabled)
    note.textContent='Live AI is switched off — the local writers are producing the copy, the plan and the code.';
  /* A running total of requests and tokens under the box someone types into is
     the studio talking about itself. When it is working, it says nothing. */
  else if(AI.state==='live')
    note.innerHTML=AI.fell?'<span style="color:#ffcf87">'+esc(AI.fell)+'</span>':'';
  else if(AI.state==='ready')
    note.innerHTML='';
  else if(AI.state==='signedout')
    /* /login renders the sign-in form directly. "/" lands on the public page,
   which on a phone means opening the menu and hunting for Log in. */
    note.innerHTML='Not signed in, so the gateway is refusing requests. <a href="/login" style="color:var(--acid)">Sign in on Scen</a> and reload, or keep building with the local writers.';
  else if(AI.state==='offline')
    note.textContent='The /api routes are not reachable from this page, so everything is being generated locally in your browser.';
  else if(AI.state==='error')
    note.textContent='Gateway error: '+AI.lastError+' — falling back to the local writers.';
  else note.textContent='';
  if(S.tool==='aigateway'&&S.tab==='tools')renderMain();
}

/* attachments */
$('#attachBtn').addEventListener('click',function(){$('#filePick').click()});
$('#filePick').addEventListener('change',function(e){
  var files=Array.prototype.slice.call(e.target.files||[]).slice(0,4);
  files.forEach(function(file){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas');cv.width=cv.height=24;
        var cx=cv.getContext('2d');cx.drawImage(img,0,0,24,24);
        var d=cx.getImageData(0,0,24,24).data,r=0,g=0,b2=0,n=0;
        for(var i=0;i<d.length;i+=4){
          var mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
          if(mx<28||mn>238)continue;            // skip near-black and near-white
          r+=d[i];g+=d[i+1];b2+=d[i+2];n++;
        }
        var col=n?C.rgbToHex(r/n,g/n,b2/n):'#dfff45';
        S.atts.push({url:fr.result,color:col});
        renderAtts();sendBtn.disabled=false;
        if(S.phase==='interview'&&step()&&step().id==='accent'){
          S.brief.refs=S.brief.refs.concat([{url:fr.result,color:col}]);
          renderAnswerBox();
        }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
  e.target.value='';
});
function renderAtts(){
  var strip=$('#attStrip');
  strip.classList.toggle('hidden',!S.atts.length);
  strip.innerHTML=S.atts.map(function(a,i){

    gen=buildFiles();

      stream.innerHTML='<span class="caps">Build · '+esc(S.brief.name)+'</span><div id="stepList">'+

          return '<div class="step done"><span class="mark">✓</span><span>'+esc(s.l)+
            '<span class="sub">'+esc(s.s)+'</span></span><span class="ms">'+s.ms+'ms</span></div>'}).join('')+'</div>';
    }
  }
  setPhasePill();setDepthLabel();
  input.placeholder=S.phase==='built'?L('Tell me what to change…','Kya badalna hai, bolo…'):

  if(S.phase==='interview'){
    var last=S.msgs[S.msgs.length-1];
    // the question is already in the transcript — only the answer box needs rebuilding
    if(last&&last.who==='agent'&&S.pending==='q')renderAnswerBox();
    else askCurrent(false);

  else if(S.phase==='review')finishReviewButtons();

  S.phase='interview';S.step=0;S.brief=C.freshBrief();S.msgs=[];S.pending=null;
  S.skip=[];S.seedLabel='';S.mode='design';S.tab='tools';S.tool='brief';S.file='';

  S.previewKind='site';S.device='desktop';S.preset=null;S.pane=false;S.picking=false;S.pick='';
  presetSrc='';presetState='';previewSig='';

/* The preset is a file, so it arrives after the page does. Whatever was drawn
   without it — the empty preview, a build with the agent's own home page — is
   redrawn once it lands. */
var autoPreview=false;   /* true when the studio opened the pane, not the customer */
function whenPreset(){
  if(presetState!=='ready'){
    /* the file never arrived — a preset with nothing behind it, or no network.
       Nobody should be left looking at an empty pane they did not ask for. */
    if(autoPreview&&S.tab==='preview'&&!gen)return setTab('tools',true);
    if(S.tab==='preview')renderMain();
    return;
  }
  previewSig=briefSig();
  if(S.built&&S.brief.pages.length){
    gen=buildFiles();
    S.files=gen.files.map(function(f){return f.path});
  }
  renderMain();
}
function openPreset(){
  /* A shared link still names the preset when no seed was handed over. But if
     a seed *was* read and carried no file — the hero's brief goes to
     "?template=brief", which is not a preset at all — that is the site saying
     there is no page to show, and guessing an address only finds the rewrite. */
  if(!S.preset&&!S.seedLabel)S.preset=C.presetFromUrl();
  if(!presetFile())return false;
  loadPreset(whenPreset);
  return true;
}
function boot(){
  setDepthLabel();setAiPill();setAcctPill();setModelLabel();
  X.probe().then(function(){
    setAiPill();setModelLabel();
    X.readModels().then(setModelLabel);
    if(S.tool==='aigateway'&&S.tab==='tools')renderMain();
  });
  N.ensureAll();
  var seed=C.seedFromUrl();
  var had=C.load();
  if(seed&&(!had||!S.msgs.length||S.seedLabel!==seed.label)){
    resetState();C.applySeed(seed);
    if(S.brief.name)$('#projName').textContent=S.brief.name;
    renderTools();setMode('design');setPhasePill();
    /* The preset is the thing they pressed Customize on, so it is what the
       studio opens on — not a brief pane and not an empty preview. On a
       phone the chat is the whole screen, and the pane is a tap away. */
    var opening=openPreset();
    autoPreview=opening&&innerWidth>980;
    setTab(autoPreview?'preview':'tools',true);
    /* §5 — "Five questions and I build it" promised a form, and set the tone
       for everything after it. The agent asks what it still needs, which on a
       seeded brief is usually one thing. */
    agentSay('Starting from <b>'+esc(seed.label)+'</b> — the look, the pages and the palette are '+
      'already in the brief.<br/><br/>Tell me about your place and I will build it. '+
      'Anything you want changed after, just say it.');
    save();setTimeout(function(){askCurrent(true)},760);
    return;
  }
  if(had&&S.msgs.length){openPreset();return restore()}
  /* No seed to read, but the address can still name a preset — a shared link,
     or storage that was cleared between the gallery and here. */
  autoPreview=openPreset()&&innerWidth>980;
  S.tool='brief';S.mode='design';
  renderTools();setMode('design');setPhasePill();
  setTab(autoPreview?'preview':'tools',true);
  askCurrent(true);
}
boot();
})();
</script>
