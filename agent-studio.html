  site.pages.forEach(function(p){files.push({path:p.path||p.file,lang:'html',body:p.html,page:p.page})});
  files.push({path:'site/styles.css',lang:'css',body:site.css});
  files.push({path:'site/app.js',lang:'js',body:site.js});
  if(b.kind==='app'||b.kind==='both'){
    files.push({path:'app/App.jsx',lang:'jsx',body:makeApp(b)});
    files.push({path:'app/theme.js',lang:'js',body:makeTheme(b)});
  }
  files.push({path:'brief.json',lang:'json',body:JSON.stringify(briefJson(b,depth),null,2)});
  files.push({path:'README.md',lang:'md',body:readme(b,depth,site.pages)});
  return{files:files,site:site};
}
function briefJson(b,depth){
  return{project:b.name,kind:b.kind,industry:INDUSTRIES[b.industry].l,customIndustry:b.industryOther||undefined,
    pitch:b.pitch,goal:b.goal,audience:b.audience||undefined,pages:b.pages,features:b.features,
    design:{style:b.style,styleLabel:STYLES[b.style].l,accent:b.accent,motion:b.motion},
    content:b.content,languages:b.languages,domain:b.domain||slug(b.name)+'.scen.space',
    depth:depth,generatedAt:new Date().toISOString()};
}
function readme(b,depth,pages){
  return['# '+b.name,'','> '+b.pitch,'',
'Generated by the Scen agent from a project brief.','',
'## What is here','',
'```',
'site/',
pages.map(function(p){return '  '+p.file.replace('site/','')+(p.page==='Home'?'   ← start here':'')}).join('\n'),
'  styles.css','  app.js',
(b.kind==='app'||b.kind==='both'?'app/\n  App.jsx\n  theme.js':''),
'brief.json','README.md','```','',
'## Run it','',
'Open `site/index.html` in a browser. Nothing to install — the pages are plain HTML, one stylesheet and one script.','',
(b.kind==='app'||b.kind==='both'?
'The app files are React Native components. Drop `App.jsx` and `theme.js` into an Expo project and run `npx expo start`.\n':''),
'## Not connected yet','',
'- Forms do not send anywhere until a form endpoint is configured.',
(has(b,'store')?'- The cart counts items in the page; checkout needs the store module.\n':'')+
(has(b,'bookings')?'- Booking slots are selectable but nothing is reserved until the bookings module is connected.\n':'')+
'- Images are CSS placeholders. Replace them with your own photographs.','',
'## Design tokens','',
'| Token | Value |','| --- | --- |',
'| Accent | `'+b.accent+'` |','| Style | '+STYLES[b.style].l+' |',
'| Motion | '+b.motion+' |','| Languages | '+b.languages.join(', ')+' |',''].filter(Boolean).join('\n');
}

/* preview documents */
var PREVIEW_BRIDGE='<scr'+'ipt>document.addEventListener("click",function(e){'+
'var a=e.target.closest&&e.target.closest("a[href$=\\".html\\"]");'+
'if(a){e.preventDefault();parent.postMessage({scenNav:a.getAttribute("href")},"*")}'+
'},true);</scr'+'ipt>';

function previewDoc(gen,file){
  var f=gen.files.filter(function(x){return x.path===file})[0]||gen.files[0];
  return f.body
    .replace('<link rel="stylesheet" href="styles.css"/>','<style>\n'+gen.site.css+'\n</style>')
    .replace('<scr'+'ipt src="app.js"></scr'+'ipt>','<scr'+'ipt>\n'+gen.site.js+'\n</scr'+'ipt>'+PREVIEW_BRIDGE);
}

window.__SCEN_GEN={generate:generate,previewDoc:previewDoc,appPreviewDoc:appPreviewDoc,
  tokens:tokens,pageFile:pageFile,sectionsFor:sectionsFor,pack:pack,has:has,appTabs:appTabs};
})();
</script>
<script>
(function(){
"use strict";
/* ============================================================
   Live AI — the Scen gateway
   POST /api/ai/generate  { feature, input, system, maxOutputTokens, temperature }
   →      { text, provider, model, usage, requestId }
   The route requires a signed-in session cookie, so this only works on a
   domain that proxies /api to the Scen backend. Every call falls back to
   the local generators, and the UI says which one produced the build.
   ============================================================ */
var C=window.__SCEN_CORE;
var INDUSTRIES=C.INDUSTRIES,STYLES=C.STYLES,FEATURES=C.FEATURES,GOALS=C.GOALS;

var AI={
  enabled:true,
  state:'unknown',        // unknown | ready | live | signedout | offline | error
  provider:'',model:'',requests:0,inTok:0,outTok:0,cost:0,lastMs:0,lastError:'',
  usedForBuild:''         // '' | 'live' | 'local'
};

function post(feature,input,system,opts){
  opts=opts||{};
  return fetch('/api/ai/generate',{
    method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({feature:feature,input:input,system:system,
      maxOutputTokens:opts.maxOutputTokens||1400,
      temperature:opts.temperature==null?0.7:opts.temperature})
  }).then(function(r){
    return r.text().then(function(t){
      var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t||('HTTP '+r.status)}}
      if(!r.ok){
        var err=new Error(d.error||('Request failed ('+r.status+')'));
        err.status=r.status;err.code=d.code;throw err;
      }
      return d;
    });
  });
}
function record(d,ms){
  AI.requests++;AI.lastMs=ms;AI.state='live';AI.lastError='';
  if(d.provider)AI.provider=d.provider;
  if(d.model)AI.model=d.model;
  var u=d.usage||{};
  AI.inTok+=Number(u.inputTokens||0);
  AI.outTok+=Number(u.outputTokens||0);
  AI.cost+=Number(u.estimatedCostUsd||0);
}
function failed(e){
  var s=e&&e.status;
  if(s===401||s===403){AI.state='signedout';AI.lastError='Not signed in on this domain.'}
  else if(s===503||(e&&e.code==='missing_key')){AI.state='error';AI.lastError='No provider key configured on the server.'}
  else if(!s||s===404){AI.state='offline';AI.lastError='The /api routes are not reachable from this page.'}
  else{AI.state='error';AI.lastError=(e&&e.message)||('Gateway error ('+s+')')}
  return null;
}
function probe(){
  return fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){
    if(r.ok){if(AI.state!=='live')AI.state='ready';AI.lastError='';return AI.state}
    if(r.status===401){AI.state='signedout';AI.lastError='Not signed in on this domain.';return AI.state}
    AI.state='offline';AI.lastError='The /api routes are not reachable from this page.';return AI.state;
  }).catch(function(){
    AI.state='offline';AI.lastError='The /api routes are not reachable from this page.';return AI.state;
  });
}
function usable(){return AI.enabled&&(AI.state==='ready'||AI.state==='live')}
function label(){
  return AI.state==='live'?'Live AI':AI.state==='ready'?'AI ready':
    AI.state==='signedout'?'Sign in for AI':AI.state==='offline'?'Local only':
    AI.state==='error'?'AI error':'Checking…';
}

/* ---------- tolerant JSON ---------- */
function jsonFrom(text){
  if(!text)return null;
  var s=String(text).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{return JSON.parse(s.slice(a,b+1))}catch(e){}
  // one repair pass: models sometimes trail a comma before a closer
  try{return JSON.parse(s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1'))}catch(e){}
  return null;
}
function str(v,fb){return typeof v==='string'&&v.trim()?v.trim():fb}
function pairList(v,n,fb){
  if(!Array.isArray(v))return fb;
  var out=v.map(function(x){
    if(Array.isArray(x))return[str(x[0],''),str(x[1],'')];
    if(x&&typeof x==='object')return[str(x.title||x.t||x.k||x.q||x.name||x.value,''),
      str(x.body||x.d||x.v||x.a||x.answer||x.label||x.text,'')];
    return null;
  }).filter(function(p){return p&&p[0]});
  return out.length>=n?out.slice(0,n):fb;
}
function strList(v,n,fb){
  if(!Array.isArray(v))return fb;
  var out=v.map(function(x){return str(x,'')}).filter(Boolean);
  return out.length>=n?out.slice(0,n):fb;
}

/* ---------- the brief, as the model sees it ---------- */
function briefSummary(b){
  var P=INDUSTRIES[b.industry]||INDUSTRIES.other;
  return JSON.stringify({
    brand:b.name,
    business:b.industryOther||P.l,
    oneLiner:b.pitch,
    goal:GOALS[b.goal]||b.goal||'',
    audience:b.audience||'',
    pages:b.pages,
    features:(b.features||[]).map(function(f){return FEATURES[f]?FEATURES[f].l:f}),
    look:STYLES[b.style]?STYLES[b.style].l:'',
    /* Captured from "clone of <site>" and passed as direction, not as
       something to reproduce. Without this the reference was stored on the
       brief and never reached the model that writes the site. */
    referenceSite:b.reference||'',
    accent:b.accent,motion:b.motion,
    languages:b.languages
  });
}

var VOICE=
 'You are a website copywriter. Reply with one JSON object and nothing else — no prose, '+
 'no markdown fence. Plain, specific, human sentences that sound like the business wrote them. '+
 'Never use: seamless, unlock, elevate, journey, solutions, empower, cutting-edge, game-changing, '+
 'transform, revolutionise. No exclamation marks. Write about the business itself — never mention '+
 'websites, design, templates or the tool that built it.';

function copyPrompt(b,hist){
  return 'Write the copy for this business.\n\nBRIEF:\n'+briefSummary(b)+
  /* Same reason as readEdit: the brief cannot carry what was actually said —
     an aside about tone, a name they rejected, the customer they described. */
  (hist&&hist.length?'\n\nConversation so far (oldest first):\n'+hist.join('\n')+'\n':'')+
  '\n\nReturn exactly this shape:\n'+
  '{"kicker":"three short words joined by a middle dot",'+
  '"pitch":"one sentence under 22 words that sits below the headline",'+
  '"services":[["title","one or two sentences"],["title","..."],["title","..."]],'+
  '"gallery":["short image label","short image label","short image label","short image label"],'+
  '"stats":[["figure","what it counts"],["figure","..."],["figure","..."]],'+
  '"quote":["a sentence a real customer would say","First name and last initial"],'+
  '"faq":[["question","answer"],["question","answer"],["question","answer"]],'+
  '"cta":["heading for the closing block","one supporting sentence","button label under 4 words"]}';
}
function coerceCopy(o,b){
  var base=INDUSTRIES[b.industry]||INDUSTRIES.other,out={};
  Object.keys(base).forEach(function(k){out[k]=base[k]});
  out.kicker=str(o.kicker,base.kicker);
  out.pitch=str(o.pitch,base.pitch);
  out.services=pairList(o.services,3,base.services);
  out.gallery=strList(o.gallery,4,base.gallery);
  out.stats=pairList(o.stats,3,base.stats);
  out.quote=strList(o.quote,2,base.quote);
  out.faq=pairList(o.faq,3,base.faq);
  out.cta=strList(o.cta,3,base.cta);
  out.__ai=true;
  return out;
}
function writeCopy(b,hist){
  var t0=Date.now();
  return post('chat',copyPrompt(b,hist),VOICE,{maxOutputTokens:1400,temperature:.78})
    .then(function(d){
      record(d,Date.now()-t0);
      var o=jsonFrom(d.text);
      if(!o)throw Object.assign(new Error('The model did not return usable JSON'),{status:502});
      return{copy:coerceCopy(o,b),provider:d.provider,model:d.model,ms:Date.now()-t0};
    })
    .catch(function(e){failed(e);return null});
}

/* ---------- page plan ---------- */
var SECTION_IDS=['logos','services','servicelist','showcase','stats','products','booking',
  'pricing','testimonial','faq','posts','team','contact','map','steps','prose'];
function planPrompt(b,hist){
  return 'Lay out the sections for each page of this website.\n\nBRIEF:\n'+briefSummary(b)+
  /* Same reason as readEdit: the brief cannot carry what was actually said —
     an aside about tone, a name they rejected, the customer they described. */
  (hist&&hist.length?'\n\nConversation so far (oldest first):\n'+hist.join('\n')+'\n':'')+
  '\n\nAllowed section ids, use these exact strings:\n'+SECTION_IDS.join(', ')+
  '\n\nRules: 4 to 7 sections per page. Do not include a hero, a page header or a closing '+
  'call to action — those are added automatically. Only use "products" if the brief has a store, '+
  '"booking" if it has bookings, "posts" if it has a blog, "map" if it has a map. '+
  'Never repeat a section within one page.\n\n'+
  'Return: {"pages":[{"name":"'+(b.pages[0]||'Home')+'","sections":["services","showcase"]}]} '+
  'with one entry for every page in the brief.';
}
function readPlan(o,b){
  if(!o||!Array.isArray(o.pages))return null;
  var out={},hits=0;
  o.pages.forEach(function(p){
    var name=str(p&&p.name,'');
    var match=b.pages.filter(function(x){return x.toLowerCase()===name.toLowerCase()})[0];
    if(!match||!Array.isArray(p.sections))return;
    var seen={},ids=[];
    p.sections.forEach(function(s){
      s=str(s,'').toLowerCase();
      if(SECTION_IDS.indexOf(s)<0||seen[s])return;
      seen[s]=1;ids.push(s);
    });
    if(!ids.length)return;
    // the frame is ours: hero or page header first, call to action last
    out[match]=[match.toLowerCase()==='home'?'hero':'phero'].concat(ids.slice(0,7)).concat(['cta']);
    hits++;
  });
  return hits?out:null;
}
function writePlan(b,hist){
  var t0=Date.now();
  return post('planning',planPrompt(b,hist),
    'You plan website structure. Reply with one JSON object and nothing else.',
    {maxOutputTokens:900,temperature:.4})
    .then(function(d){
      record(d,Date.now()-t0);
      var plan=readPlan(jsonFrom(d.text),b);
      if(!plan)throw Object.assign(new Error('The model did not return a usable plan'),{status:502});
      return{plan:plan,provider:d.provider,model:d.model,ms:Date.now()-t0};
    })
    .catch(function(e){failed(e);return null});
}

/* ---------- change requests the regex parser could not read ---------- */
function editPrompt(text,b,hist){
  return 'Current project:\n'+briefSummary(b)+
  /* The brief is a filled form; it cannot say what was already discussed,
     refused or asked twice. Without the transcript the model re-reads the
     same struct every turn and answers as if the client just walked in. */
  (hist&&hist.length?'\n\nConversation so far (oldest first):\n'+hist.join('\n'):'')+
  '\n\nThe client said: "'+String(text).slice(0,600)+'"\n\n'+
  'Return only the keys that should change:\n'+
  '{"name":"","pitch":"","accent":"#rrggbb","style":"cinematic|minimal|editorial|luxury|playful",'+
  '"motion":"subtle|cinematic|full","depth":"lite|pro","addPages":[],"dropPages":[],'+
  '"addFeatures":[],"dropFeatures":[],"rewriteCopy":false,'+
  '"reply":"one short sentence, past tense, describing what you changed"}\n'+
  'Feature names must come from: '+Object.keys(FEATURES).join(', ')+'. '+
  'If the client asked a question rather than requesting a change, answer it '+
  'in "reply" and return no other keys. '+
  'If nothing about the site should change, return only {"reply":"..."}.';
}
function readEdit(text,b,hist){
  var t0=Date.now();
  return post('analysis',editPrompt(text,b,hist),
    'You turn a website change request into JSON. Reply with one JSON object and nothing else.',
    {maxOutputTokens:600,temperature:.2})
    .then(function(d){
      record(d,Date.now()-t0);
      var o=jsonFrom(d.text);
      if(!o)throw Object.assign(new Error('The model did not return usable JSON'),{status:502});
      return o;
    })
    .catch(function(e){failed(e);return null});
}

function test(){
  var t0=Date.now();
  return post('chat','Reply with exactly one word: ready',
    'You reply with one word and nothing else.',{maxOutputTokens:16,temperature:0})
    .then(function(d){record(d,Date.now()-t0);return{ok:true,text:(d.text||'').trim(),provider:d.provider,model:d.model,ms:Date.now()-t0}})
    .catch(function(e){failed(e);return{ok:false,error:AI.lastError}});
}

window.__SCEN_AI={AI:AI,probe:probe,usable:usable,label:label,
  writeCopy:writeCopy,writePlan:writePlan,readEdit:readEdit,test:test,SECTION_IDS:SECTION_IDS};
})();
</script>
<script>
(function(){
"use strict";
/* ============================================================
   Scen backend — the rest of the API
   Everything here hits the same origin with the session cookie, exactly
   like the main app does. Nothing is mocked: if a call fails, the pane
   shows the failure instead of inventing a number.
   ============================================================ */
var C=window.__SCEN_CORE,slug=C.slug;

var API={
  me:null,credits:null,projects:null,domains:null,assets:null,sessions:null,products:null,
  err:{},busy:{},projectId:'',projectSlug:'',published:null,onchange:null
};

function req(path,opts){
  opts=opts||{};
  return fetch(path,{
    method:opts.method||'GET',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    return r.text().then(function(t){
      var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t||('HTTP '+r.status)}}
      if(!r.ok){
        var e=new Error(d.error||('Request failed ('+r.status+')'));
        e.status=r.status;e.code=d.code;throw e;
      }
      return d;
    });
  });
}
function msg(e){
  if(!e)return 'Failed';
  if(e.status===401)return 'Not signed in on this domain.';
  if(e.status===404)return 'This route is not reachable from here.';
  return String(e.message||'Failed');
}

var LOADERS={
  me:function(){return req('/api/auth/me')},
  credits:function(){return req('/api/billing/credits')},
  projects:function(){return req('/api/projects').then(function(d){return d.projects||[]})},
  domains:function(){return req('/api/domains').then(function(d){return d.domains||d.list||[]})},
  assets:function(){return req('/api/assets?limit=50').then(function(d){return d.assets||[]})},
  sessions:function(){return req('/api/auth/sessions').then(function(d){return d.sessions||[]})},
  products:function(){return req('/api/store/products').then(function(d){return d.products||[]})}
};

function ensure(name,force){
  if(!LOADERS[name])return;
  if(!force&&(API[name]!==null||API.busy[name]))return;
  API.busy[name]=true;
  LOADERS[name]().then(function(v){API[name]=v;API.err[name]=''},
                       function(e){API.err[name]=msg(e);if(API[name]===null)API[name]=Array.isArray(API[name])?[]:false})
    .then(function(){API.busy[name]=false;if(API.onchange)API.onchange(name)});
}
function ensureAll(){['me','credits','projects'].forEach(function(n){ensure(n)})}
function reset(){
  ['me','credits','projects','domains','assets','sessions','products'].forEach(function(n){API[n]=null});
  API.err={};API.busy={};
}

/* ---------- what gets stored and published ---------- */
function manifest(gen){
  return (gen&&gen.files||[]).map(function(f){return{path:f.path,bytes:f.body.length,lang:f.lang}});
}
function settingsFor(b,gen,depth){
  return{
    source:'agent-studio',
    brief:{kind:b.kind,name:b.name,industry:b.industry,pitch:b.pitch,goal:b.goal,
      audience:b.audience,pages:b.pages,features:b.features,style:b.style,accent:b.accent,
      motion:b.motion,content:b.content,languages:b.languages,domain:b.domain},
    depth:depth,files:manifest(gen),
    copyWrittenBy:b.__copy?'gateway':'local',
    planWrittenBy:b.__plan?'gateway':'local'
  };
}
function siteSnapshot(b,gen){
  var pages=(gen&&gen.site&&gen.site.pages||[]).map(function(p){
    return{page:p.page,file:p.file.replace(/^site\//,''),html:p.html}});
  return{
    kind:'scen-agent-build',v:1,generatedAt:new Date().toISOString(),
    /* the older renderer reads these, so a snapshot is never blank */
    palette:{accent:b.accent,accent2:'#7beeff'},
    heroTitle:b.name,heroSubtitle:b.pitch,
    components:b.pages.slice(0,6),sectionCopy:[],sections:[],ctas:[],
    /* what the agent build actually needs */
    accent:b.accent,style:b.style,pages:pages,
    css:gen&&gen.site?gen.site.css:'',js:gen&&gen.site?gen.site.js:''
  };
}

/* ---------- writes ---------- */
function saveProject(b,gen,depth){
  var body={name:b.name||'Untitled project',slug:slug(b.name||''),settings:settingsFor(b,gen,depth)};
  if(API.projectId)
    return req('/api/projects/'+encodeURIComponent(API.projectId),{method:'PATCH',body:body})
      .then(function(d){var p=d.project||d;API.projectSlug=p.slug||API.projectSlug;return p});
  return req('/api/projects',{method:'POST',body:body}).then(function(d){
    var p=d.project||d;API.projectId=p.id||'';API.projectSlug=p.slug||'';
    if(Array.isArray(API.projects))API.projects.unshift(p);
    return p;
  });
}
function saveVersion(label,b,gen,depth){
  if(!API.projectId)return Promise.resolve(null);
  return req('/api/projects/'+encodeURIComponent(API.projectId)+'/versions',
    {method:'POST',body:{label:label,summary:label,data:settingsFor(b,gen,depth)}})
    .then(function(d){return d.version||null},function(){return null});
}
function listVersions(){
  if(!API.projectId)return Promise.resolve([]);
  return req('/api/projects/'+encodeURIComponent(API.projectId)+'/versions')
    .then(function(d){return d.versions||[]},function(){return []});
}
function publish(address,b,gen){
  return req('/api/publish',{method:'POST',body:{
    slug:address,projectName:b.name||address,site:siteSnapshot(b,gen)}})
    .then(function(d){API.published=d;return d});
}
function addDomain(host,address){
  return req('/api/domains',{method:'POST',body:{host:host,slug:address||undefined}})
    .then(function(d){
      if(d.domain){if(!Array.isArray(API.domains))API.domains=[];API.domains.unshift(d.domain)}
      return d;
    });
}
function invite(email,role){
  return req('/api/workspaces/invitations',{method:'POST',body:{email:email,role:role||'member'}});
}
function revokeOtherSessions(){
  return req('/api/auth/sessions?others=true',{method:'DELETE'}).then(function(d){
    ensure('sessions',true);return d;});
}
function heroImage(prompt,aspect){
  return req('/api/image/generate',{method:'POST',body:{
    mode:'generate',prompt:prompt,aspectRatio:aspect||'16:9',size:'1K',quality:'medium',
    format:'webp',count:1}}).then(function(d){
    var img=(d.images||[])[0]||null;
    if(!img)throw new Error('The image gateway returned nothing');
    ensure('credits',true);ensure('assets',true);
    return{url:img.url||('/api/assets/'+encodeURIComponent(img.assetId||img.id||'')+'/content'),
      assetId:img.assetId||img.id||'',provider:d.provider||'',model:d.model||''};
  });
}

window.__SCEN_API={API:API,ensure:ensure,ensureAll:ensureAll,reset:reset,req:req,msg:msg,
  saveProject:saveProject,saveVersion:saveVersion,listVersions:listVersions,publish:publish,
  addDomain:addDomain,invite:invite,revokeOtherSessions:revokeOtherSessions,heroImage:heroImage,
  siteSnapshot:siteSnapshot,settingsFor:settingsFor};
})();
</script>
<script>
(function(){
"use strict";
var C=window.__SCEN_CORE,G=window.__SCEN_GEN,X=window.__SCEN_AI,AI=X.AI;
var N=window.__SCEN_API,API=N.API;
var S=C.S,FLOW=C.FLOW,INDUSTRIES=C.INDUSTRIES,STYLES=C.STYLES,FEATURES=C.FEATURES,GOALS=C.GOALS;
var $=C.$,$$=C.$$,esc=C.esc,save=C.save,toast=C.toast,modal=C.modal,closeModal=C.closeModal;
var slug=C.slug,wait=C.wait,bytes=C.bytes,findColor=C.findColor;
var gen=null;               // current generated file set

/* ============================================================
   Chat rendering
   ============================================================ */
var body=$('#chatBody'),stream=$('#streamBody'),input=$('#input'),sendBtn=$('#sendBtn');

function scrollChat(){requestAnimationFrame(function(){body.scrollTop=body.scrollHeight})}

function nodeFor(m){
  var d=document.createElement('div');
  d.className='msg '+m.who;
  if(m.who==='user'){
    d.innerHTML=(m.atts&&m.atts.length?'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">':'')+
      '<div class="bubble">'+esc(m.text)+'</div>'+
      (m.atts&&m.atts.length?'<div class="att-row">'+m.atts.map(function(a){
        return '<img class="att" src="'+a.url+'" alt=""/>'}).join('')+'</div></div>':'');
  }else{
    d.innerHTML='<div class="who"><span class="avatar"></span><b>Scen Agent</b></div>'+
      '<div class="text">'+m.html+'</div>'+
      (m.worked?'<div class="worked"><span class="ring"></span>Worked for '+m.worked+' second'+(m.worked===1?'':'s')+'</div>':'');
  }
  return d;
}
/* Last few turns as plain text. Tags out, entities back, length capped so a
   long build log cannot crowd out the actual request. */
function transcript(n){
  return (S.msgs||[]).slice(-(n||10)).map(function(m){
    var t=String(m.html||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ')
           .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
           .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
    if(!t)return '';
    return (m.who==='agent'?'Agent: ':'Client: ')+t.slice(0,300);
  }).filter(Boolean);
}
function pushMsg(m,animate){
  S.msgs.push(m);
  var n=nodeFor(m);
  if(!animate)n.style.animation='none';
  body.appendChild(n);scrollChat();save();
  return n;
}
function agentSay(html,worked){return pushMsg({who:'agent',html:html,worked:worked||null},true)}
function userSay(text,atts){return pushMsg({who:'user',text:text,atts:atts||[]},true)}

function thinking(){
  var d=document.createElement('div');
  d.className='msg agent';d.id='thinkNode';
  d.innerHTML='<div class="who"><span class="avatar thinking"></span><b>Scen Agent</b></div>'+
    '<div class="text"><span class="typing"><i></i><i></i><i></i></span></div>';
  body.appendChild(d);scrollChat();return d;
}
function clearThinking(){var t=$('#thinkNode');if(t)t.remove()}

function clearAnswerBox(){var a=$('#answerBox');if(a)a.remove()}

/* ============================================================
   Question / answer
   ============================================================ */
function step(){return FLOW[S.step]}

function askCurrent(animate){
  // a seeded brief already answers some steps — walk past them
  while(FLOW[S.step]&&(S.skip||[]).indexOf(FLOW[S.step].id)>=0)S.step++;
  var st=step();if(!st)return finishInterview();
  S.pending='q';save();
  var text=st.q(S.brief);
  if(animate===false){agentSay(text.replace(/\n/g,'<br/>'));renderAnswerBox();return}
  var t0=Date.now();
  thinking();
  var delay=520+Math.min(900,text.length*4);
  setTimeout(function(){
    clearThinking();
    agentSay(text.replace(/\n/g,'<br/>'),Math.max(1,Math.round((Date.now()-t0)/1000)));
    renderAnswerBox();
  },delay);
}

function renderAnswerBox(){
  clearAnswerBox();
  var st=step();if(!st)return;
  var box=document.createElement('div');
  box.id='answerBox';box.className='msg agent';box.style.marginTop='-8px';
  var b=S.brief;

  if(st.type==='single'||st.type==='color'){
    var opts=st.opts(b);
    box.innerHTML='<div class="chips">'+opts.map(function(o){
      return '<button data-v="'+esc(o.v)+'">'+(o.sw?'<span class="sw" style="background:'+esc(o.sw)+'"></span>':'')+esc(o.l||o.v)+'</button>'
    }).join('')+'</div>'+(st.type==='color'?
      '<div class="chips-go"><span class="hint">…or type any colour — “deep teal”, “#0f766e”.</span></div>':'')+
      (st.optional?'<div class="chips-go"><button class="skip" data-skip="1">Skip this</button></div>':'');
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t)return answer(t.dataset.v,t.textContent.trim());
      if(e.target.dataset.skip)return answer('__skip','Skip');
    });
  }
  else if(st.type==='multi'){
    var chosen=(st.val?st.val(b):[]).slice();
    var opts2=st.opts(b);
    box.innerHTML='<div class="chips" id="multiChips">'+opts2.map(function(o){
      return '<button data-v="'+esc(o.v)+'"'+(chosen.indexOf(o.v)>=0?' class="on"':'')+'>'+esc(o.l||o.v)+'</button>'
    }).join('')+'</div>'+
    '<div class="chips-go"><button class="btn primary sm" data-go="1">Continue</button>'+
    '<span class="hint" id="multiCount">'+chosen.length+' selected</span>'+
    '<span class="grow"></span><span class="hint">or type your own and press ↑</span></div>';
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t){
        var v=t.dataset.v,i=chosen.indexOf(v);
        if(i>=0){chosen.splice(i,1);t.classList.remove('on')}else{chosen.push(v);t.classList.add('on')}
        $('#multiCount',box).textContent=chosen.length+' selected';
        return;
      }
      if(e.target.dataset.go){
        if(st.min&&chosen.length<st.min)return toast('Pick at least '+st.min);
        answer(chosen,chosen.join(', '));
      }
    });
  }
  else{ /* text */
    var extras=st.extra?st.extra(b):[];
    box.innerHTML=(extras.length?'<div class="chips">'+extras.map(function(o){
      return '<button data-v="'+esc(o.v)+'">'+esc(o.l)+'</button>'}).join('')+'</div>':'')+
      (st.optional?'<div class="chips-go"><button class="skip" data-skip="1">Skip this</button></div>':'');
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t)return answer(t.dataset.v,t.textContent.trim());
      if(e.target.dataset.skip)return answer('__skip','Skip');
    });
    input.placeholder=st.ph||'Type your answer…';
    setTimeout(function(){input.focus()},60);
  }
  body.appendChild(box);scrollChat();
}

function answer(value,label){
  var st=step();if(!st)return;
  clearAnswerBox();
  var show=Array.isArray(value)?(value.length?value.join(', '):'Nothing extra'):
    (value==='__skip'?'Skip':(label||value));
  var atts=S.atts.slice();
  if(atts.length){S.brief.refs=S.brief.refs.concat(atts);S.atts=[];renderAtts()}
  userSay(show,atts);
  if(value!=='__skip'||!st.optional)st.set(S.brief,value);
  else st.set(S.brief,'__skip');
  S.pending=null;
  if(!S.projectName&&S.brief.name){S.projectName=S.brief.name;$('#projName').textContent=S.brief.name}
  save();refreshTools();if(S.tool==='brief')renderMain();

  function advance(){
    if(S.__resumeReview){S.__resumeReview=false;save();return finishInterview()}
    S.step++;save();askCurrent(true);
  }
  var ack=st.ack?st.ack(S.brief,value):'';
  if(ack){
    var t0=Date.now();thinking();
    setTimeout(function(){
      clearThinking();
      agentSay(ack.replace(/\n/g,'<br/>'),Math.max(1,Math.round((Date.now()-t0)/1000)));
      setTimeout(advance,260);
    },420+Math.random()*220);
  }else advance();
}

/* free text from the composer */
/* What the customer actually said, before it gets filed under whatever
   question happens to be on screen.

   The interview used to assign every message to the current step, so typing
   "clone of netflix.com/browse" at the name question made that the project
   name. Intent is read first now; only what is left becomes the answer. */
/* A hostname, not a filename. "index.html", "App.tsx" and "index.css" all
   matched the old pattern, so pasting a code spec made Scen announce
   index.html as the reference site. Either a real scheme, or a real TLD. */
var TLD='com|net|org|io|co|dev|app|ai|space|in|uk|us|me|xyz|design|studio|shop|store|site|tech|cloud|page|link';
var URL_RE=new RegExp(
  '\\b(https?:\\/\\/[^\\s]+'                                  /* explicit scheme wins */
  +'|(?:[a-z0-9-]+\\.)+(?:'+TLD+')(?![a-z])(?:\\/[^\\s]*)?)','i');
var REF_RE=/\b(clone|cloan|copy|like|similar to|inspired by|same as)\b/i;
/* What the sentence is trying to do. The name was already here but it only
   ever pulled out a reference URL — every other message fell through to
   "answer to whatever question is on screen", which is how "hero chota kro"
   became someone's business name. Kinds map to routes, nothing else. */
var INTENT={
  greeting:/^\s*(hi+|hey|hello|yo|hola|namaste|sup|good (morning|evening|afternoon))\b[\s!.?]*$/i,
  approve : /\b(approve|go ahead|build it|bana do|banao ab|start kro|shuru kro|theek hai|thik hai|ok(ay)? go|looks good|perfect|haan)\b/i,
  reject  : /\b(nahi|nahin|no thanks|don'?t|mat |hatao|remove that|cancel|rehne do)\b/i,
  /* Hinglish carries the instruction in the verb at the end — "kr do", "kro",
     "rakho" — and the thing being changed is often just a noun. Without these
     "theek hai but accent gold kr do" scored as plain approval and built. */
  edit    : /\b(chota|bada|badal|badlo|change|make it|hatao|nikal|add |jodo|daal|colour|color|font|bigger|smaller|darker|lighter|move |swap|instead|k[ar]r? ?do|kro|karo|rakho|rakh ?do|lagao|lga ?do|hata ?do|badha|ghata)\b/i,
  question: /\b(kitna|kitne|kya |kaise|kyu|why|how (long|much|do)|what (is|does)|can you|price|cost|time lagega)\b/i
};
function classify(text){
  var t=String(text||'').trim();
  if(!t)return 'empty';
  if(INTENT.greeting.test(t))return 'greeting';
  if(isBriefLike(t))return 'brief';
  if(INTENT.question.test(t))return 'question';
  /* A sentence that agrees AND asks for a change is a change, not approval —
     "theek hai but accent gold kr do" must not start a build. Edit verbs
     therefore veto both confirmations. */
  if(INTENT.approve.test(t)&&t.length<40&&!INTENT.edit.test(t))return 'approve';
  if(INTENT.edit.test(t))return 'edit';
  if(INTENT.reject.test(t)&&t.length<40)return 'reject';
  return 'answer';
}
function readIntent(text){
  var out={ref:'',rest:text,kind:classify(text)};
  var m=text.match(URL_RE);
  if(m&&!/\.(png|jpg|jpeg|webp|mp4|gif)$/i.test(m[1])){
    out.ref=m[1];
    out.rest=text.replace(m[1],'').replace(REF_RE,'').replace(/\s{2,}/g,' ').trim();
    out.rest=out.rest.replace(/^(of|a|an|the|to|make|lets|let's|build|create)\s+/i,'').trim();
  }
  return out;
}
/* A short field should not swallow a paragraph. */
function looksLikeBrief(st,text){
  return (st.id==='name')&&(text.length>36||URL_RE.test(text));
}

/* ── Absorbing a whole brief ───────────────────────────────────────────────
   Someone who pastes a specification has already answered half the interview.
   Reading it one field at a time — which is what the FLOW did — threw the
   rest away and then asked for it again. This pulls out what is actually
   stated, marks those questions answered, and leaves the genuinely open ones
   to be asked. Nothing is guessed: a field is only filled when the text says
   it. ── */
/* Order matters: the first match wins. "yoga studio" was landing on agency
   because that pattern carried a bare "studio", so the specific trades are
   tested first and agency no longer claims the word on its own. */
var IND_WORDS={
  fitness:/fitness|gym|yoga|pilates|workout|training studio|crossfit|jim/i,
  clinic:/clinic|health|medical|dental|therapy|wellness|mindful|spa/i,
  restaurant:/restaurant|caf|bistro|diner|menu|eatery|food/i,
  realestate:/real ?estate|property|properties|realty|listing/i,
  fashion:/fashion|clothing|apparel|boutique|lookbook|wear/i,
  agency:/agency|consultanc|creative firm|design studio/i,
  saas:/saas|software|platform|dashboard|app for|b2b|api/i,
  portfolio:/portfolio|my work|personal site|photographer|designer/i,
  education:/course|school|academy|educat|tutor|learning/i,
  events:/event|conference|festival|ticket|wedding/i,
  travel:/travel|resort|hotel|tour|destination|stay/i};
var FEAT_WORDS={store:/shop|store|e-?commerce|checkout|cart|sell/i,
  bookings:/book|appointment|reservation|schedul/i,
  blog:/blog|articles|posts|cms|journal/i,
  forms:/contact form|enquiry|inquiry|lead form|get in touch/i,
  accounts:/login|sign ?up|account|member|auth/i,
  multilang:/multi-?lang|translat|bilingual|locales?/i,
  gallery:/gallery|lookbook|photos|portfolio grid/i,
  maps:/map|directions|location/i,
  analytics:/analytics|tracking/i,
  chat:/live chat|chat widget|whatsapp/i};
var STYLE_WORDS={cinematic:/cinematic|filmic|dramatic|immersive/i,
  minimal:/minimal|clean|simple|spare|understated/i,
  editorial:/editorial|magazine|typographic|serif/i,
  luxury:/luxur|premium|elegant|refined|high-?end/i,
  playful:/playful|fun|bright|energetic|bold colou?r/i};
var GOAL_WORDS={sell:/sell|purchase|buy|revenue|checkout/i,
  book:/book|appointment|reservation/i,
  lead:/enquir|inquir|lead|contact us|get in touch/i,
  signup:/sign ?up|waitlist|subscribe|trial/i,
  show:/showcase|portfolio|display our work/i};

function matchOne(map,text){for(var k in map)if(map[k].test(text))return k;return ''}
function matchMany(map,text){var o=[];for(var k in map)if(map[k].test(text))o.push(k);return o}

/* Long, or written like a spec rather than an answer. */
var BUILD_VERB=/\b(bna|bana|banao|bnao|banani|banana|banado|chahiye|chaiye|make|build|create|design|develop|need|want)\b/i;
function isBriefLike(text){
  if(text.length>=80)return true;
  if(/\n/.test(text)&&text.length>50)return true;
  /* "RamsFitness gym ki premium dark website bnao …" is a full brief at 106
     characters — length alone kept missing real ones, especially in Hinglish
     where the same request is simply shorter. */
  if(BUILD_VERB.test(text)&&text.trim().split(/\s+/).length>=6)return true;
  return (text.split(/[.!?]\s/).length>2&&text.length>70);
}

/* The bar for starting: a name, what it is, what trade, and pages to put it
   on. Everything else has a defensible default. */
function haveEnough(b){
  return !!(b.name && b.kind && b.industry && (b.pages||[]).length);
}
/* Assumptions a designer would make without stopping to ask. All editable. */
function fillDefaults(b){
  if(!b.style)b.style='minimal';
  if(!b.motion)b.motion='cinematic';
  if(!b.content)b.content='agent';
  if(!(b.languages||[]).length)b.languages=['English'];
  if(!b.goal)b.goal=(b.features||[]).indexOf('store')>=0?'sell':
                    ((b.features||[]).indexOf('bookings')>=0?'book':'lead');
  if(!b.accent){var P=INDUSTRIES[b.industry];b.accent=(P&&P.accent)||'#dfff45'}
}

function absorbBrief(text){
  var b=S.brief,got=[];
  if(!b.pitch){b.pitch=text.replace(/\s+/g,' ').trim().slice(0,240);got.push('the brief')}

  /* A quoted name is exact. Unquoted, take up to three capitalised words —
     "Serenity Flow" was being cut to "Serenity" by stopping at the first
     space. */
  var nm=text.match(/["\u201c]([^"\u201d]{1,40})["\u201d]/)
        ||text.match(/\b(?:called|named|naam)\s+((?:[A-Z][\w&']*)(?:[ -](?:[A-Z][\w&']*|of|and|&)){0,2})/)
        /* Brands are usually written CamelCase or capitalised up front, with
           no "called" anywhere — "RamsFitness gym ki website bnao". */
        ||text.match(/\b([A-Z][a-z0-9]+[A-Z][\w]*)\b/)
        ||text.match(/^\s*([A-Z][\w&']{2,20})\b(?=\s)/);
  if(nm&&!b.name){b.name=nm[1].trim();got.push('name <b>'+C.esc(b.name)+'</b>')}

  /* Step 0 carries the agent's introduction, so leaving kind unset made the
     agent introduce itself again after the customer had already written a
     brief. Read it from the ordinary words people use. */
  if(!b.kind&&/\b(mobile app|ios|android|app store)\b/i.test(text)){b.kind='app';got.push('a mobile app')}
  else if(!b.kind&&/\b(web ?site|site|landing page|hero section|home ?page|web app|page for|websit|vebsite)\b/i.test(text)){b.kind='website';got.push('a website')}
  else if(!b.kind&&/\bapp\b/i.test(text)){b.kind='app';got.push('an app')}

  var ind=matchOne(IND_WORDS,text);
  if(ind&&!b.industry){
    b.industry=ind;
    got.push(INDUSTRIES[ind]?INDUSTRIES[ind].l:ind);
    /* Answering the industry question is what loads that trade's page set and
       feature list. Setting the field directly skipped that, so the pages
       step opened with nothing ticked and Continue did nothing — the flow
       dead-ended on a screen that looked fine. */
    var P=INDUSTRIES[ind];
    if(P){
      if(!(b.pages||[]).length&&P.pages)b.pages=P.pages.slice();
      if(!(b.features||[]).length&&P.feats)b.features=P.feats.slice();
      if(!b.accent&&P.accent)b.accent=P.accent;
    }
  }

  var gl=matchOne(GOAL_WORDS,text);
  if(gl&&!b.goal){b.goal=gl;got.push(GOALS[gl]||gl)}

  var st=matchOne(STYLE_WORDS,text);
  if(st&&!b.style){b.style=st;got.push((STYLES[st]?STYLES[st].l:st)+' look')}

  var fe=matchMany(FEAT_WORDS,text);
  if(fe.length){
    b.features=(b.features||[]).slice();
    fe.forEach(function(f){if(b.features.indexOf(f)<0)b.features.push(f)});
    got.push(fe.map(function(f){return FEATURES[f]?FEATURES[f].l:f}).join(', '));
  }

  var hex=text.match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
  if(hex&&!b.accent){b.accent='#'+hex[1];got.push('accent <b>#'+C.esc(hex[1])+'</b>')}

  /* Only skip what is now actually filled. */
  S.skip=(S.skip||[]).slice();
  [['name',b.name],['industry',b.industry],['pitch',b.pitch],['goal',b.goal],
   ['style',b.style],['accent',b.accent],['kind',b.kind],
   ['features',(b.features||[]).length]].forEach(function(pair){
    if(pair[1]&&S.skip.indexOf(pair[0])<0)S.skip.push(pair[0]);
  });
  /* advance() is what normally pushes the name into the top bar; absorbing
     skips it, so the project stayed "Untitled project" with a name in hand. */
  if(b.name&&!S.projectName){
    S.projectName=b.name;
    var el=$('#projName');if(el)el.textContent=b.name;
  }
  save();
  return got;
}

function handleText(text){
  var atts=S.atts.slice();
  if(S.phase==='interview'){
    var st=step();
    if(!st)return;

    var intent=readIntent(text);

    /* A change request in the middle of the interview is not the answer to
       whatever question happens to be on screen. "hero chota kro" used to be
       filed as a business name. Only once there is something to change, and
       only when the gateway can actually read it — otherwise carry on. */
    if((intent.kind==='edit'||intent.kind==='question')&&S.brief.name&&X.usable()){
      userSay(text,atts);S.atts=[];renderAtts();
      var t0=Date.now();thinking();
      X.readEdit(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        var changed=o?applyPatch(o):[];
        if(changed.length){
          agentSay(changed.join('<br/>'),Math.max(1,Math.round((Date.now()-t0)/1000)));
          save();return askCurrent(true);        /* back to the open question */
        }
        agentSay(esc(String((o&&o.reply)||'').slice(0,240))||
                 'I did not catch what to change \u2014 say it plainly and I will fix it.');
        askCurrent(true);
      }).catch(function(){clearThinking();askCurrent(true)});
      return;
    }

    if(intent.ref){
      userSay(text,atts);S.atts=[];renderAtts();
      S.brief.reference=intent.ref;
      /* Only if something meaningful survived. Stripping the URL out of
         "clone of <site>" leaves "of", which is not a pitch. */
      if(intent.rest.length>8)S.brief.pitch=S.brief.pitch||intent.rest;
      save();
      /* Said plainly, because Scen builds in the direction of a reference —
         it does not reproduce someone else's site, and implying otherwise
         would set up a promise the build cannot keep. */
      agentSay('Noted <b>'+C.esc(intent.ref)+'</b> as a reference. I will take the '+
        'layout and feel as direction — I build your own site from it, not a copy of theirs.');
      if(looksLikeBrief(st,text)){askCurrent(true);return}
      return askCurrent(true);
    }
    /* "Hi" is not a brief. Small talk should stay conversation — the machine
       used to file it as the answer to whatever question was on screen. */
    if(/^\s*(hi+|hey|hello|yo|hola|namaste|sup|good (morning|evening|afternoon))\b[\s!.?]*$/i.test(text)){
      userSay(text,atts);S.atts=[];renderAtts();
      agentSay('Hey. What do you want to build?');
      return;
    }

    /* A pasted brief or spec answers several questions at once. */
    if(isBriefLike(text)){
      userSay(text,atts);S.atts=[];renderAtts();
      var got=absorbBrief(text);
      /* Enough to start beats asking the rest. Someone who wrote a brief
         should see progress, not eleven more questions — the defaults are all
         things they can change afterwards. */
      if(haveEnough(S.brief)){
        fillDefaults(S.brief);
        agentSay((got.length?'Read that as the brief. I took '+got.join(' · ')+'.<br/><br/>':'')+
                 'That is enough to start. Here is what I would build — change anything you like.');
        S.skip=(S.skip||[]).concat(FLOW.map(function(f){return f.id}));
        S.step=0;save();
        return askCurrent(true);        /* walks past everything to finishInterview() */
      }
      agentSay(got.length
        ? 'Read that as the brief. I took '+got.join(' · ')+'. I will ask only what is still missing.'
        : 'Kept that as the brief.');
      S.step=0;                        /* re-enter and let skip jump the answered ones */
      return askCurrent(true);
    }
    if(looksLikeBrief(st,text)){
      userSay(text,atts);S.atts=[];renderAtts();
      S.brief.pitch=text;save();
      agentSay('Got it — I have kept that as the brief. What should the site be <b>called</b>?');
      return;
    }

    if(st.type==='multi'){
      var cur=(st.val?st.val(S.brief):[]).slice();
      text.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
        var t=C.titleCase(x);if(cur.indexOf(t)<0&&cur.indexOf(x)<0)cur.push(t)});
      return answer(cur,cur.join(', '));
    }
    return answer(text,text);
  }
  if(S.phase==='review'){userSay(text,atts);S.atts=[];renderAtts();return handleReviewText(text)}
  userSay(text,atts);
  if(atts.length){S.brief.refs=S.brief.refs.concat(atts);S.atts=[];renderAtts()}
  applyEdit(text);
}

/* ============================================================
   Review → plan → build
   ============================================================ */
var SECLABEL={hero:'Hero',phero:'Page header',logos:'Marquee',services:'Services',servicelist:'Service detail',
  showcase:'Gallery',stats:'Stats',products:'Products',booking:'Booking',pricing:'Pricing',
  testimonial:'Testimonial',faq:'FAQ',posts:'Blog teaser',team:'Team',contact:'Contact form',
  map:'Map',steps:'Process',prose:'Story',cta:'Call to action'};

function planData(){
  var b=S.brief,pro=S.depth==='pro';
  var pages=b.pages.map(function(p){
    return{name:p,file:G.pageFile(p),secs:G.sectionsFor(p,b,pro)}});
  var total=pages.reduce(function(n,p){return n+p.secs.length},0);
  var files=pages.length+2+((b.kind==='app'||b.kind==='both')?2:0)+2;
  var credits=total*2+b.features.length*8+((b.kind==='both')?30:b.kind==='app'?18:0);
  return{pages:pages,sections:total,files:files,credits:credits};
}

function finishInterview(){
  S.phase='review';save();setPhasePill();
  input.placeholder='Reply, or ask for a change…';
  var b=S.brief,P=planData();
  var lines=['Here is what I have.','',
    '<b>'+esc(b.name)+'</b> — '+esc(b.pitch),'',
    '<ul>',
    '<li>'+P.pages.length+' pages · '+P.sections+' sections</li>',
    '<li>'+(b.features.length?b.features.map(function(f){return FEATURES[f].l}).join(', '):'no extra modules')+'</li>',
    '<li>'+STYLES[b.style].l+' · accent <code>'+esc(b.accent)+'</code> · '+esc(b.motion)+' motion</li>',
    '<li>'+(b.kind==='both'?'Website and app':b.kind==='app'?'App plus a landing page':'Website')+'</li>',
    '</ul>'].join('\n');

  var t0=Date.now();thinking();
  setTimeout(function(){
    clearThinking();
    agentSay(lines,Math.max(2,Math.round((Date.now()-t0)/1000)));
    S.tool='plan';renderTools();renderMain();
    if(S.planFirst){
      agentSay('The full plan is open on the right — every page with the sections I will write into it. Approve it and I start writing files.');
      var box=document.createElement('div');
      box.id='answerBox';box.className='msg agent';box.style.marginTop='-8px';
      box.innerHTML='<div class="chips">'+
        '<button data-go="build">✦  Approve &amp; build</button>'+
        '<button data-go="change">Change something</button>'+
        '<button data-go="depth">'+(S.depth==='pro'?'Build fewer sections':'Build more sections')+'</button>'+
        '</div>';
      box.addEventListener('click',function(e){
        var t=e.target.closest('button[data-go]');if(!t)return;
        if(t.dataset.go==='build'){clearAnswerBox();userSay('Approve & build');startBuild()}
        if(t.dataset.go==='change'){clearAnswerBox();userSay('Change something');offerChange()}
        if(t.dataset.go==='depth'){
          S.depth=S.depth==='pro'?'lite':'pro';setDepthLabel();save();
          clearAnswerBox();userSay(S.depth==='pro'?'Build more sections':'Build fewer sections');
          var p=planData();

          renderMain();finishReviewButtons();

      body.appendChild(box);scrollChat();

  },900);
}
function finishReviewButtons(){
  var box=document.createElement('div');

function offerChange(){
  agentSay('Which part? Pick one, or just tell me in a sentence — “make it teal”, “drop the blog”, “call it Ember &amp; Oak”.');
  var jump=[['name','the name'],['pitch','the one-liner'],['pages','the pages'],['features','the features'],
    ['style','the style'],['accent','the accent'],['motion','the motion']];

  box.id='answerBox';box.className='msg agent';box.style.marginTop='-8px';

  });

function handleReviewText(text){
  var kind=classify(text);

  /* "haan theek hai" is the same instruction as the Approve button. Typing it
     used to fall through to the edit reader, which found nothing to change
     and offered a menu. */
  if(kind==='approve')return startBuild();
  if(kind==='reject'){
    agentSay('Held off. Tell me what to change and I will redo the plan \u2014 '+
             'a page, the look, the colour, anything.');
    return finishReviewButtons();
  }

  var applied=parseEdit(text);
  if(applied){
    agentSay(applied+'<br/><br/>Plan updated on the right. Approve when it looks right.');
    renderMain();finishReviewButtons();
  }else if(X.usable()){
    /* The pattern reader could not place it. Review used to stop here with a
       menu, while the post-build path handed the same sentence to the model.
       There is no reason review should understand less than editing does. */
    var t0=Date.now();thinking();
    X.readEdit(text,S.brief,transcript()).then(function(o){
      clearThinking();setAiPill();
      var changed=o?applyPatch(o):[];
      if(changed.length){
        agentSay(changed.join('<br/>')+'<br/><br/>Plan updated on the right. Approve when it looks right.',
                 Math.max(1,Math.round((Date.now()-t0)/1000)));
        renderMain();
      }else{
        agentSay(esc(String((o&&o.reply)||'').slice(0,240))||reviewEditHelp());
      }
      finishReviewButtons();
    }).catch(function(){clearThinking();agentSay(reviewEditHelp());finishReviewButtons()});
  }else{
    agentSay(reviewEditHelp());
    finishReviewButtons();
  }
}
function reviewEditHelp(){ return "I can change the name, the one-liner, the pages, the features, the style, the accent colour or the motion. Say it plainly — “make it warm gold”, “add a pricing page”, “drop the blog”."; }

/* ============================================================
   The build run
   ============================================================ */
function buildPlanSteps(){
  var b=S.brief,pro=S.depth==='pro',P=planData(),out=[],live=X.usable();
  out.push({l:'Reading the brief',s:FLOW.length+' answers · '+b.pages.length+' pages',ms:420});

  if(live)out.push({l:'Planning the structure',s:'asking the gateway to lay out the pages…',ms:560,
    run:function(){
      return X.writePlan(b,transcript()).then(function(r){
        if(!r){delete b.__plan;setAiPill();return 'gateway unavailable — used the local planner'}
        b.__plan=r.plan;setAiPill();
        return r.provider+' · '+r.model+' — '+Object.keys(r.plan).length+' pages laid out';
      });
    }});
  else{delete b.__plan;
    out.push({l:'Planning the structure',s:P.sections+' sections across '+P.pages.length+' pages',ms:560})}

  out.push({l:'Building the design system',s:STYLES[b.style].l+' · '+b.accent+' · '+b.motion+' motion',ms:520});

  if(live)out.push({l:'Writing copy',s:'asking the gateway for headlines, sections and FAQs…',ms:640,compose:true,
    run:function(){
      return X.writeCopy(b,transcript()).then(function(r){
        if(!r){delete b.__copy;setAiPill();return 'gateway unavailable — used the local writer'}
        b.__copy=r.copy;setAiPill();
        return r.provider+' · '+r.model+' — '+r.ms+'ms, written for this brief';
      });
    }});
  else{delete b.__copy;
    out.push({l:'Writing copy',compose:true,
      s:(b.content==='own'?'draft copy, marked for replacement':'headlines, sections, FAQs and buttons'),ms:640})}
  P.pages.forEach(function(p){
    out.push({l:'Writing site/'+p.file,ms:300,file:'site/'+p.file,
      s:p.secs.map(function(x){return SECLABEL[x]||x}).join(' · '),
      // read at write time, so a live plan that arrives mid-build is what gets logged
      subFn:function(){return G.sectionsFor(p.name,b,pro).map(function(x){return SECLABEL[x]||x}).join(' · ')}})});
  out.push({l:'Compiling styles.css',s:'tokens, layout, responsive rules',ms:460,file:'site/styles.css'});
  out.push({l:'Wiring behaviour',s:'scrolling, menus and forms',ms:380,file:'site/app.js'});
  b.features.forEach(function(f){out.push({l:'Wiring '+FEATURES[f].l,s:FEATURES[f].mod,ms:300})});
  if(b.kind==='app'||b.kind==='both'){
    out.push({l:'Generating app/App.jsx',s:'screens, tab bar and shared tokens',ms:520,file:'app/App.jsx'});
    out.push({l:'Generating app/theme.js',s:'one set of colours for the site and the app',ms:280,file:'app/theme.js'});
  }
  out.push({l:'Writing brief.json + README',s:'so the build can be rerun from the same answers',ms:300,file:'brief.json'});
  out.push({l:'Running checks',s:'headings, link targets, contrast, mobile widths',ms:640});
  return out;
}

function startBuild(){
  S.phase='building';S.built=false;S.files=[];S.buildLog=[];save();
  setPhasePill();setMode('build');
  setTab('preview');
  var steps=buildPlanSteps();
  stream.innerHTML='<span class="caps">Build · '+esc(S.brief.name)+'</span><div id="stepList"></div>';
  var list=$('#stepList');
  gen=null;                       // composed once the copy and plan are settled

  var i=0,t0=Date.now();
  function run(){
    if(i>=steps.length)return done();
    var st=steps[i],row=document.createElement('div');
    row.className='step run';
    row.innerHTML='<span class="mark"></span><span>'+esc(st.l)+'<span class="sub">'+esc(st.s)+'</span></span><span class="ms"></span>';
    list.appendChild(row);stream.scrollTop=stream.scrollHeight;
    var a=Date.now();

    function finish(sub){
      sub=sub||(st.subFn?st.subFn():'');
      row.className='step done';
      row.querySelector('.mark').textContent='✓';
      if(sub)row.querySelector('.sub').textContent=sub;
      row.querySelector('.ms').textContent=(Date.now()-a)+'ms';
      if(st.compose){
        gen=G.generate(S.brief,S.depth);
        if(S.tab==='preview')renderMain();
      }
      if(st.file)emitFile(st.file);
      S.buildLog.push({l:st.l,s:sub||st.s,ms:Date.now()-a});
      i++;run();
    }

    if(st.run){
      // a real network step — it finishes when the gateway answers
      st.run().then(function(sub){finish(sub)},function(){finish('fell back to the local writer')});
      return;
    }
    setTimeout(function(){finish()},st.ms);
  }
  function done(){
    S.phase='built';S.built=true;S.files=gen.files.map(function(f){return f.path});
    if(!S.file)S.file=gen.files[0].path;
    input.placeholder='Tell me what to change…';
    save();setPhasePill();
    var secs=((Date.now()-t0)/1000).toFixed(1);
    var row=document.createElement('div');
    row.className='step done';
    row.innerHTML='<span class="mark">✓</span><span><b style="color:#e9e9ef">Build complete</b>'+
      '<span class="sub">'+gen.files.length+' files · '+secs+'s</span></span>';
    list.appendChild(row);
    refreshTools();renderMain();
    setTimeout(function(){
      setMode('design');
      var P=planData();
      agentSay('Done — <b>'+esc(S.brief.name)+'</b> is built.<ul>'+
        '<li>'+gen.files.length+' files, '+P.sections+' sections, '+secs+'s</li>'+
        '<li>'+(S.brief.__copy?'Copy written live by '+esc(AI.provider)+' · '+esc(AI.model):
          'Copy written by the local writer — '+esc(X.label().toLowerCase()))+'</li>'+
        '<li>Preview is open on the right — switch pages and devices from the bar</li>'+
        '<li>Every file is readable under <b>Code</b>, and downloadable</li>'+
        (signedIn()?'<li>Signed in as '+esc(accountName())+' — <b>Publishing</b> can save it to your workspace and put it live</li>':
          '<li>Not signed in, so saving and publishing are off — the build itself is finished either way</li>')+
        '</ul><br/>Tell me what to change and I rebuild it: <code>make it deep teal</code>, '+
        '<code>add a pricing page</code>, <code>drop the blog</code>, <code>rename it to Ember &amp; Oak</code>, '+
        '<code>more sections</code>.',Math.round((Date.now()-t0)/1000));
      $('#prevBadge').classList.remove('hidden');
    },420);
  }
  run();
}
function emitFile(path){
  refreshTools();
  if(S.tab==='code'||S.tool==='files'){
    if(!S.file)S.file=path;
    renderMain();
    var el=$$('.file').filter(function(f){return f.dataset.path===path})[0];
    if(el)el.classList.add('new');
  }
}

/* ============================================================
   Edits after the build
   ============================================================ */
function parseEdit(text){
  var b=S.brief,t=text.toLowerCase().trim(),done=[];

  var m=t.match(/(?:rename(?: it)?(?: to)?|call it|name it)\s+(.+)/i);
  if(m){var nm=text.slice(text.toLowerCase().indexOf(m[1])).trim().replace(/["'.]+$/,'');
    b.name=nm.slice(0,48);S.projectName=b.name;$('#projName').textContent=b.name;
    done.push('renamed it to <b>'+esc(b.name)+'</b>')}

  var tag=text.match(/(?:tagline|one[- ]liner|headline|strapline)\s*[:—-]\s*(.+)/i);
  if(tag){b.pitch=tag[1].trim().slice(0,180);done.push('rewrote the one-liner')}

  var col=findColor(text);
  if(col&&/colour|color|accent|make it|switch to|palette|teal|gold|green|blue|red|violet|purple|pink|orange|amber|cyan|lime|coral|mint|rose|magenta|indigo|emerald|crimson|bronze|peach|sky/.test(t)){
    b.accent=col;done.push('accent is now <code>'+esc(col)+'</code>')}

  var aboutMotion=/\bmotion|parallax|animat/.test(t);
  Object.keys(STYLES).forEach(function(k){
    if(k==='cinematic'&&aboutMotion)return;   // "cinematic motion" is not a style change
    if(new RegExp('\\b'+k+'\\b').test(t)||t.indexOf(STYLES[k].l.toLowerCase())>=0){
      if(b.style!==k){b.style=k;done.push('switched the style to <b>'+STYLES[k].l+'</b>')}}});
  if(/\bdark\b/.test(t)&&!STYLES[b.style].dark){b.style='cinematic';done.push('switched to a dark style')}
  if(/\blight\b/.test(t)&&STYLES[b.style].dark){b.style='minimal';done.push('switched to a light style')}

  if(/\b(more|extra|richer|full|deeper|pro)\b.*(section|page|content|build)|\bmore sections\b/.test(t)){
    if(S.depth!=='pro'){S.depth='pro';setDepthLabel();done.push('turned on the deeper build — stats, testimonials, FAQ and a marquee')}}
  if(/\b(fewer|less|simpler|shorter|lite|trim)\b/.test(t)&&/(section|page|build)/.test(t)){
    if(S.depth!=='lite'){S.depth='lite';setDepthLabel();done.push('trimmed back to the core sections')}}

  if(/\b(no|less|subtle|calm|still)\b.*motion|\bcalm it down\b/.test(t)){b.motion='subtle';done.push('dialled the motion back')}
  else if(/\b(3d|three d|full motion|cinematic|parallax)\b/.test(t)){
    b.motion=/3d|three d|full/.test(t)?'full':'cinematic';done.push('motion is now <b>'+b.motion+'</b>')}

  var FKEY={store:/\b(shop|store|cart|checkout|ecommerce|e-commerce|products?)\b/,
    bookings:/\b(booking|bookings|reservation|appointment|slots?)\b/,
    blog:/\b(blog|cms|posts?|articles?|writing)\b/,
    forms:/\b(form|forms|enquiry|inquiry|contact form|leads?)\b/,
    accounts:/\b(accounts?|login|sign[- ]?in|sign[- ]?up|members?)\b/,
    multilang:/\b(languages?|multi[- ]?lingual|translation|hindi|french|arabic|spanish)\b/,
    gallery:/\b(gallery|photos?|images?|lookbook)\b/,maps:/\b(maps?|directions?|location)\b/,
    analytics:/\b(analytics|tracking|stats?)\b/,chat:/\b(live chat|chat widget|support widget)\b/};
  var adding=/\b(add|include|put in|i want|need|with)\b/.test(t),
      dropping=/\b(drop|remove|delete|without|take out|no more|get rid of)\b/.test(t);
  Object.keys(FKEY).forEach(function(k){
    if(!FKEY[k].test(t))return;
    if(dropping&&b.features.indexOf(k)>=0){
      b.features.splice(b.features.indexOf(k),1);done.push('removed <b>'+FEATURES[k].l+'</b>')}
    else if(adding&&b.features.indexOf(k)<0){
      b.features.push(k);done.push('added <b>'+FEATURES[k].l+'</b>')}});

  var pageWord=text.match(/\b(?:add|include)\s+(?:an?\s+)?([a-z][a-z ]{1,22}?)\s+page\b/i);
  if(pageWord){var pn=C.titleCase(pageWord[1].trim());
    if(b.pages.indexOf(pn)<0){b.pages.push(pn);done.push('added a <b>'+esc(pn)+'</b> page')}}
  var dropPage=text.match(/\b(?:drop|remove|delete)\s+(?:the\s+)?([a-z][a-z ]{1,22}?)\s+page\b/i);
  if(dropPage){var dn=C.titleCase(dropPage[1].trim());
    var idx=b.pages.map(function(p){return p.toLowerCase()}).indexOf(dn.toLowerCase());
    if(idx>=0){b.pages.splice(idx,1);done.push('dropped the <b>'+esc(dn)+'</b> page')}}

  if(/\b(rewrite|redo|new|different)\b.*\b(copy|words|text|wording)\b/.test(t)){
    b.variant=(b.variant||0)+1;delete b.__copy;S.__recopy=true;
    done.push('rewrote the copy with a fresh angle')}

  if(!done.length)return null;
  save();
  return done.length===1?C.titleCase(done[0].charAt(0))+done[0].slice(1):
    'Done:<ul>'+done.map(function(d){return '<li>'+d+'</li>'}).join('')+'</ul>';
}

/* the gateway's answer to a change request, applied field by field */
function applyPatch(o){
  var b=S.brief,done=[];
  if(typeof o.name==='string'&&o.name.trim()){
    b.name=o.name.trim().slice(0,48);S.projectName=b.name;$('#projName').textContent=b.name;
    done.push('renamed it to <b>'+esc(b.name)+'</b>')}
  if(typeof o.pitch==='string'&&o.pitch.trim()){b.pitch=o.pitch.trim().slice(0,180);done.push('rewrote the one-liner')}
  if(typeof o.accent==='string'&&/^#[0-9a-f]{6}$/i.test(o.accent.trim())){
    b.accent=o.accent.trim();done.push('accent is now <code>'+esc(b.accent)+'</code>')}
  if(STYLES[o.style]&&b.style!==o.style){b.style=o.style;done.push('switched the style to <b>'+STYLES[o.style].l+'</b>')}
  if(['subtle','cinematic','full'].indexOf(o.motion)>=0&&b.motion!==o.motion){
    b.motion=o.motion;done.push('motion is now <b>'+esc(o.motion)+'</b>')}
  if((o.depth==='lite'||o.depth==='pro')&&S.depth!==o.depth){
    S.depth=o.depth;setDepthLabel();done.push(o.depth==='pro'?'turned on the deeper build':'trimmed back to the core sections')}
  (Array.isArray(o.addPages)?o.addPages:[]).forEach(function(p){
    p=C.titleCase(String(p||'').trim());
    if(p&&b.pages.map(function(x){return x.toLowerCase()}).indexOf(p.toLowerCase())<0){
      b.pages.push(p);done.push('added a <b>'+esc(p)+'</b> page')}});
  (Array.isArray(o.dropPages)?o.dropPages:[]).forEach(function(p){
    var i=b.pages.map(function(x){return x.toLowerCase()}).indexOf(String(p||'').trim().toLowerCase());
    if(i>=0){done.push('dropped the <b>'+esc(b.pages[i])+'</b> page');b.pages.splice(i,1)}});
  (Array.isArray(o.addFeatures)?o.addFeatures:[]).forEach(function(f){
    f=String(f||'').trim();
    if(FEATURES[f]&&b.features.indexOf(f)<0){b.features.push(f);done.push('added <b>'+FEATURES[f].l+'</b>')}});
  (Array.isArray(o.dropFeatures)?o.dropFeatures:[]).forEach(function(f){
    f=String(f||'').trim();
    var i=b.features.indexOf(f);
    if(i>=0){b.features.splice(i,1);done.push('removed <b>'+FEATURES[f].l+'</b>')}});
  if(o.rewriteCopy){b.variant=(b.variant||0)+1;delete b.__copy;S.__recopy=true;done.push('rewrote the copy')}
  if(done.length)save();
  return done;
}

function applyEdit(text){
  var t0=Date.now();thinking();
  setTimeout(function(){
    clearThinking();
    var res=parseEdit(text);
    if(!res&&X.usable()){
      // the pattern reader could not place it — hand the sentence to the gateway
      thinking();
      X.readEdit(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        if(!o)return editHelp(t0);
        var changed=applyPatch(o);
        if(!changed.length){
          agentSay(esc(String(o.reply||'').slice(0,240))||
            "That did not land as a change to the site — tell me what to alter and I will rebuild.",
            Math.max(1,Math.round((Date.now()-t0)/1000)));
          return;
        }
        var summary=changed.length===1?C.titleCase(changed[0].charAt(0))+changed[0].slice(1):
          'Done:<ul>'+changed.map(function(d){return '<li>'+d+'</li>'}).join('')+'</ul>';
        if(S.brief.__copy||!X.usable())return rebuild(summary,t0);
        rebuildWithCopy(summary,t0);
      });
      return;
    }
    if(!res)return editHelp(t0);
    if(S.__recopy&&X.usable()){S.__recopy=false;return rebuildWithCopy(res,t0)}
    S.__recopy=false;
    rebuild(res,t0);
  },500);
}

function editHelp(t0){
  agentSay("I did not catch a change in that. I can do these right now:<ul>"+
    "<li><code>make it deep teal</code> — any colour name or hex</li>"+
    "<li><code>switch to minimal light</code> — cinematic, minimal, editorial, luxury or playful</li>"+

/* an edit that needs fresh copy: ask the gateway again, then rebuild */
function rebuildWithCopy(summary,t0){
  thinking();
  X.writeCopy(S.brief,transcript()).then(function(r){
    clearThinking();setAiPill();
    if(r){S.brief.__copy=r.copy;save()}
    rebuild(summary+(r?'<br/><br/>New copy written by '+esc(r.provider)+' · '+esc(r.model)+'.':
      '<br/><br/>The gateway did not answer, so the local writer filled the copy in.'),t0);
  });
}

function rebuild(reason,t0){
  gen=G.generate(S.brief,S.depth);
  S.files=gen.files.map(function(f){return f.path});
  if(S.files.indexOf(S.file)<0)S.file=S.files[0];
  save();refreshTools();renderMain();
  // once the build is a project in the workspace, every rebuild is versioned there
  if(API.projectId)N.saveProject(S.brief,gen,S.depth).then(function(){
    return N.saveVersion(String(reason).replace(/<[^>]+>/g,'').slice(0,80),S.brief,gen,S.depth)
  }).then(function(){if(S.tool==='publishing'&&S.tab==='tools')renderMain()},function(){});
  var P=planData();
  agentSay(reason+'<br/><br/>Rebuilt — '+gen.files.length+' files, '+P.sections+' sections. The preview is live.',
    Math.max(1,Math.round((Date.now()-(t0||Date.now()-1400))/1000)));
  var list=$('#stepList');
  if(list){
    var row=document.createElement('div');
    row.className='step done';
    row.innerHTML='<span class="mark">✓</span><span>Rebuild<span class="sub">'+
      reason.replace(/<[^>]+>/g,'').slice(0,80)+'</span></span>';
    list.appendChild(row);
  }
}

/* ============================================================
   Panels — tools column
   ============================================================ */
/* Sixteen panels used to be listed at once, so the studio opened on a wall of
   infrastructure. Simple Mode shows the four that belong to the project; the
   cloud and setup panels move behind Advanced, which is the same
   `scen.uimode` key the main app uses, so the two surfaces agree.
   Labels follow the client-facing vocabulary (AI gateway → AI, and so on);
   the panels themselves are untouched and all still reachable. */
var TOOLS=[
  ['PROJECT','simple',[['brief','▤','Brief'],['plan','◇','Plan'],['files','⌸','Files'],['log','⌁','Activity']]],
  ['SCEN CLOUD','advanced',[['aigateway','✦','AI'],['publishing','◈','Publishing'],['domains','🌐','Domain'],['database','⛁','Data'],
    ['users','◍','Login & Users'],['monitoring','📈','Site Health'],['storage','▦','Storage'],
    ['security','⛨','Security']]],
  ['SETUP','advanced',[['integrations','⧉','Connections'],['git','⑂','GitHub'],['secrets','🔑','API Keys'],
    ['skills','✦','AI Skills']]]
];
var MODE_KEY='scen.uimode';
function uiMode(){try{return localStorage.getItem(MODE_KEY)==='advanced'?'advanced':'simple'}catch(e){return 'simple'}}
function setUiMode(m){
  try{localStorage.setItem(MODE_KEY,m)}catch(e){}
  /* A panel that is being hidden must not stay selected underneath. */
  if(m==='simple'&&!toolIsSimple(S.tool)){S.tool='brief';save()}
  renderTools();renderMain();
}
function toolIsSimple(id){
  for(var i=0;i<TOOLS.length;i++)
    if(TOOLS[i][1]==='simple')
      for(var j=0;j<TOOLS[i][2].length;j++)
        if(TOOLS[i][2][j][0]===id)return true;
  return false;
}
function renderTools(){
  var col=$('#toolsCol'),out='',adv=uiMode()==='advanced';
  out+='<div class="modeRow" role="tablist" aria-label="Interface complexity">'+
    '<button role="tab" aria-selected="'+(!adv)+'" class="'+(adv?'':'on')+'" data-uimode="simple">Simple</button>'+
    '<button role="tab" aria-selected="'+adv+'" class="'+(adv?'on':'')+'" data-uimode="advanced">Advanced</button>'+
  '</div>';
  TOOLS.forEach(function(grp){
    if(grp[1]==='advanced'&&!adv)return;
    out+='<span class="caps">'+grp[0]+'</span>';
    grp[2].forEach(function(t){
      var meta='';
      if(t[0]==='brief')meta='<span class="cnt">'+briefFilled()+'/10</span>';
      if(t[0]==='plan'&&S.brief.pages.length)meta='<span class="cnt">'+S.brief.pages.length+'</span>';
      if(t[0]==='files'&&S.files.length)meta='<span class="cnt">'+S.files.length+'</span>';
      if(t[0]==='log'&&S.buildLog.length)meta='<span class="cnt">'+S.buildLog.length+'</span>';
      out+='<button class="tool'+(S.tool===t[0]?' on':'')+'" data-tool="'+t[0]+'"><em>'+t[1]+'</em>'+esc(t[2])+meta+'</button>';
    });
  });
  if(!adv)out+='<button class="toolAdv" data-uimode="advanced"><em>⚙</em>Advanced tools<span class="cnt">12</span></button>';
  col.innerHTML=out;
}
function refreshTools(){renderTools()}
function briefFilled(){
  var b=S.brief,keys=['kind','name','industry','pitch','goal','pages','features','style','accent','motion'];
  return keys.filter(function(k){var v=b[k];return Array.isArray(v)?v.length:!!v}).length;

/* code pane */
function hl(code){
  var s=esc(code);
  return s.replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/|(?:^|\s)\/\/[^\n]*)|(&quot;[^&\n]*?&quot;|&#39;[^&\n]*?&#39;)|(&lt;\/?[a-zA-Z][\w-]*)|\b(function|return|const|var|let|if|else|import|export|from|new|default|StyleSheet)\b/g,
    function(m,c,str,tag,kw){
      if(c)return '<span class="c">'+c+'</span>';
      if(str)return '<span class="s">'+str+'</span>';
      if(tag)return '<span class="t">'+tag+'</span>';
      return '<span class="k">'+kw+'</span>';
    });
}
function paneCode(){
  if(!gen)return '<div class="empty"><div><div class="orb"></div><h2>No source yet</h2>'+
    '<p>The agent writes real files during the build — HTML, CSS, JS and the app screens. They open here.</p></div></div>';

  gen.files.forEach(function(f){
    var dir=f.path.indexOf('/')>0?f.path.split('/')[0]:'root';
    (groups[dir]=groups[dir]||[]).push(f)});
  var cur=gen.files.filter(function(f){return f.path===S.file})[0]||gen.files[0];
  S.file=cur.path;
  var tree='';
  Object.keys(groups).forEach(function(d){
    tree+='<div class="ftfolder">'+esc(d==='root'?'project':d+'/')+'</div>';
    groups[d].forEach(function(f){
      var icon={html:'◧',css:'◈',js:'⚙',jsx:'⚛',json:'{}',md:'¶'}[f.lang]||'·';
      tree+='<button class="file'+(f.path===cur.path?' on':'')+'" data-path="'+esc(f.path)+'">'+
        '<em>'+icon+'</em>'+esc(f.path.split('/').pop())+'<span class="sz">'+bytes(f.body.length)+'</span></button>';
    });
  });
  return '<div class="code-shell"><div class="filetree">'+tree+'</div>'+
    '<div class="codewrap"><div class="codebar"><span class="path">'+esc(cur.path)+'</span>'+
    '<span class="pill">'+cur.body.split('\n').length+' lines</span><span class="grow"></span>'+
    '<button class="btn sm" data-act="copy">Copy</button>'+

/* one delegated handler for the whole main pane — renderMain() replaces its
   innerHTML constantly, so per-render listeners would stack up */
$('#mainPane').addEventListener('click',function(e){
  var f=e.target.closest('.file');
  if(f){S.file=f.dataset.path;save();renderMain();return}
  var t=e.target.closest('button[data-act], button[data-page], button[data-pk], button[data-dev]');
  if(!t)return;
  var a=t.dataset.act;
  if(t.dataset.pk){S.previewKind=t.dataset.pk;save();return renderMain()}
  if(t.dataset.dev){S.device=t.dataset.dev;save();return renderMain()}
  if(t.dataset.page){S.previewKind='site';S.file='site/'+G.pageFile(t.dataset.page);return setTab('preview')}
  if(a==='reload'){$('#prevFrame').srcdoc=currentDoc();return toast('Preview reloaded')}
  if(a==='newtab'){
    var blob=new Blob([currentDoc()],{type:'text/html'});
    return window.open(URL.createObjectURL(blob),'_blank');
  }
  if(a==='dlAll')return downloadAll();
  if(a==='openCode')return setTab('code');
  if(a==='publish')return publishFlow();
  if(a==='saveProject')return saveProjectFlow(t);
  if(a==='addDomain')return addDomainFlow(t);
  if(a==='revokeOthers')return revokeFlow(t);
  if(a==='heroClear'){delete S.brief.__heroImage;save();rebuild('Put the gradient art back in the hero.');return renderMain()}
  if(a==='heroImage')return heroImageFlow(t);
  if(a==='aiToggle'){AI.enabled=!AI.enabled;setAiPill();renderMain();
    return toast(AI.enabled?'Live AI on for the next build':'Live AI off — local writers only')}
  if(a==='aiProbe'){toast('Re-checking…');return X.probe().then(function(){setAiPill();renderMain()})}
  if(a==='aiTest'){
    t.disabled=true;t.textContent='Sending…';
    return X.test().then(function(r){
      setAiPill();renderMain();
      toast(r.ok?'Gateway answered in '+r.ms+'ms — '+r.provider+' · '+r.model:'Gateway failed: '+r.error);
    });
  }
  if(!gen)return;
  var cur=gen.files.filter(function(x){return x.path===S.file})[0];
  if(!cur)return;
  if(a==='copy')navigator.clipboard.writeText(cur.body).then(
    function(){toast('Copied '+cur.path)},function(){toast('Clipboard blocked — use Download')});
  if(a==='dl')download(cur.path.split('/').pop(),cur.body);
});

/* ---------- downloads ---------- */
function download(name,text){
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function downloadAll(){
  if(!gen)return toast('Nothing built yet');
  gen.files.forEach(function(f,i){
    setTimeout(function(){download(f.path.replace(/\//g,'-'),f.body)},i*220)});
  toast('Downloading '+gen.files.length+' files');
}

function busyBtn(t,label){if(!t)return function(){};var old=t.textContent;t.disabled=true;t.textContent=label;
  return function(){try{t.disabled=false;t.textContent=old}catch(e){}}}

function saveProjectFlow(t){
  if(!gen)return toast('Nothing built yet');
  var undo=busyBtn(t,'Saving…');
  var first=!API.projectId;
  N.saveProject(S.brief,gen,S.depth).then(function(p){
    return N.saveVersion(first?'First build':'Rebuild',S.brief,gen,S.depth).then(function(){return p})
  }).then(function(p){
    undo();renderMain();
    toast(first?'Saved as a project in your workspace':'Project updated');
    if(first)agentSay('Saved to your workspace as <b>'+esc(p.name||S.brief.name)+'</b>'+
      (p.slug?' (<code>'+esc(p.slug)+'</code>)':'')+'. Every rebuild from here adds a version.');
  },function(e){undo();toast('Save failed: '+N.msg(e))});
}

function publishFlow(){
  if(!gen)return toast('Nothing built yet');
  if(!signedIn()){
    modal('<div class="modal-head"><span class="avatar"></span><b>Sign in to publish</b></div>'+
      '<div class="modal-body">Publishing writes to your workspace, so it needs a Scen session on this domain. '+
      'Sign in on Scen in this browser, reload this page, and the button works.<br/><br/>'+
      'The build is finished either way — every file is under <b>Code</b> and downloads in one click.</div>'+
      '<div class="modal-foot"><button class="btn ghost" data-act="close">Close</button>'+
      '<button class="btn primary" id="mdl">Download the build</button></div>');
    $('#mdl').addEventListener('click',function(){closeModal();downloadAll()});
    return;
  }
  var addr=($('#subIn')&&$('#subIn').value||slug(S.brief.name||'')).toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
  if(addr.length<3)return toast('The address needs at least 3 characters');
  S.pubSlug=addr;save();
  modal('<div class="modal-head"><span class="avatar"></span><b>Publish '+esc(S.brief.name)+'?</b></div>'+
    '<div class="modal-body">This uploads the built site to your workspace and makes it publicly readable at:'+
    '<div class="field" style="margin-top:12px"><label>Address</label>'+
    '<input value="'+esc(location.origin+'/s/'+addr)+'" readonly/></div>'+
    gen.files.length+' files · '+S.brief.pages.length+' pages. Republishing the same address replaces what is there.</div>'+
    '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>'+
    '<button class="btn primary" id="mdl">Publish it</button></div>');
  $('#mdl').addEventListener('click',function(){
    var b=$('#mdl');b.disabled=true;b.textContent='Publishing…';
    N.publish(addr,S.brief,gen).then(function(d){
      closeModal();renderMain();
      toast('Published to '+d.url);
      agentSay('Published. <a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="color:var(--acid)">'+
        esc(d.url)+'</a> is live and public.<br/><br/>Republishing the same address replaces it, so keep editing '+
        'here and press Publish again whenever you want the change to go out.');
    },function(e){
