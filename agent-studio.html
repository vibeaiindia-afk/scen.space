function handleReviewText(text){
  var kind=classify(text);

  /* "haan theek hai" is the same instruction as the Approve button. Typing it
     used to fall through to the edit reader, which found nothing to change
     and offered a menu. */
  if(kind==='approve')return startBuild();
  if(kind==='reject'){
    agentSay('Held off. Tell me what to change and I will redo the plan \u2014 '+
             'a page, the look, the colour, anything.');
    return finishReviewButtons();
  }

  var applied=parseEdit(text);
  if(applied){
    agentSay(applied+'<br/><br/>Plan updated on the right. Approve when it looks right.');
    renderMain();finishReviewButtons();
  }else if(X.usable()){
    /* The pattern reader could not place it. Review used to stop here with a
       menu, while the post-build path handed the same sentence to the model.
       There is no reason review should understand less than editing does. */
    var t0=Date.now();thinking();
    X.readEdit(text,S.brief,transcript()).then(function(o){
      clearThinking();setAiPill();
      var changed=o?applyPatch(o):[];
      if(changed.length){
        agentSay(changed.join('<br/>')+'<br/><br/>Plan updated on the right. Approve when it looks right.',
                 Math.max(1,Math.round((Date.now()-t0)/1000)));
        renderMain();
      }else{
        agentSay(esc(String((o&&o.reply)||'').slice(0,240))||reviewEditHelp());
      }
      finishReviewButtons();
    }).catch(function(){clearThinking();agentSay(reviewEditHelp());finishReviewButtons()});
  }else{
    agentSay(reviewEditHelp());
    finishReviewButtons();
  }
}
function reviewEditHelp(){ return "I can change the name, the one-liner, the pages, the features, the style, the accent colour or the motion. Say it plainly — “make it warm gold”, “add a pricing page”, “drop the blog”."; }

/* ============================================================
   The build run
   ============================================================ */
/* What the art director decided, written into the brief the generator already
   reads. Nothing new is invented here: the background goes through __bg, which
   derives ink, panels and hairlines from it exactly as a typed colour does, and
   a colour the client asked for by name is never overwritten. */
/* Said on the build row itself, because that is where someone is looking while
   it happens, not in a pane they have to go and open. */
function fellNote(){return AI.fell?'  ·  '+AI.fell:''}

function applyDesign(d){
  var b=S.brief;
  delete b.__fixCss;          /* patched against the previous look */
  b.__ui={display:d.display,body:d.body,radius:d.radius,heroAlign:d.heroAlign,
          density:d.density,caps:d.caps,surface:d.surface,idea:d.idea||''};
  if(/^#[0-9a-f]{6}$/i.test(d.bg||''))b.__bg=d.bg;
  if(/^#[0-9a-f]{6}$/i.test(d.accent||'')&&!b.__accentAsked)b.accent=d.accent;
  save();
}

function buildPlanSteps(){
  var b=S.brief,pro=S.depth==='pro',P=planData(),out=[],live=X.usable();
  out.push({l:L('Setting up your pages','Pages taiyaar kar raha hoon'),s:b.pages.length+' pages',ms:420});

  if(live)out.push({l:L('Laying out the page','Page ka layout bana raha hoon'),s:'',ms:560,
    run:function(){
      return X.writePlan(b,transcript()).then(function(r){
        if(!r){delete b.__plan;setAiPill();return 'gateway unavailable — used the local planner'}
        b.__plan=r.plan;setAiPill();
        return r.provider+' · '+r.model+' — '+Object.keys(r.plan).length+' pages laid out'+fellNote();
      });
    }});
  else{delete b.__plan;
    out.push({l:L('Laying out the page','Page ka layout bana raha hoon'),s:P.sections+' sections across '+P.pages.length+' pages',ms:560})}

  /* The design comes before the words, the way it would with a person: the
     model decides the palette, the type, the radius, the density and where the
     hero sits for this one business, and the rest of the build is written to
     match. Without a gateway the deterministic direction stands, which is what
     every build used to get. */
  if(live)out.push({l:L('Creating the visual direction','Visual direction bana raha hoon'),s:'',ms:520,
    run:function(){
      return X.designUI(b,transcript()).then(function(r){
        if(!r){delete b.__ui;setAiPill();return 'gateway unavailable — used the built-in direction'}
        applyDesign(r.design);setAiPill();
        return (r.design.idea?String(r.design.idea).slice(0,90):(r.provider+' · '+r.model))+fellNote();
      });
    }});
  else out.push({l:L('Creating the visual direction','Visual direction bana raha hoon'),s:STYLES[b.style].l+' · '+b.accent,ms:520});

  if(live)out.push({l:L('Writing the words','Words likh raha hoon'),s:'',ms:640,compose:true,
    run:function(){
      return X.writeCopy(b,transcript()).then(function(r){
        if(!r){delete b.__copy;setAiPill();return 'gateway unavailable — used the local writer'}
        b.__copy=r.copy;setAiPill();
        return r.provider+' · '+r.model+' — '+r.ms+'ms, written for this brief'+fellNote();
      });
    }});
  else{delete b.__copy;
    out.push({l:L('Writing the words','Words likh raha hoon'),compose:true,
      s:(b.content==='own'?'draft copy, marked for replacement':'headlines, sections, FAQs and buttons'),ms:640})}

  /* §42 — the pictures are made before the page is written, and after the words.
     They used to run once the build had finished and trigger a second build, so
     the client watched a site of grey rectangles appear and then rebuild. Moving
     them to just after the direction was too far the other way: the plan asks
     the copy pack what the subjects are, and with no copy yet it was shooting
     "Project one" and "Project two". Direction, then words, then the pictures
     those words describe. */
  if(live&&signedIn()&&!b.__art&&!b.__noImages&&S.autoImages!==false){
    out.push({l:L('Making the pictures','Photos bana raha hoon'),s:'4 images · '+(4*IMG_COST)+' credits',ms:600,
      compose:true,run:function(){return buildImages(4)}});
  }
  P.pages.forEach(function(p){
    out.push({l:L('Building the ','Bana raha hoon — ')+p.name+' page',ms:300,file:'site/'+p.file,
      s:p.secs.map(function(x){return SECLABEL[x]||x}).join(' · '),
      // read at write time, so a live plan that arrives mid-build is what gets logged
      subFn:function(){return G.sectionsFor(p.name,b,pro).map(function(x){return SECLABEL[x]||x}).join(' · ')}})});
  out.push({l:L('Applying the design system','Design system laga raha hoon'),s:L('type, spacing, colour, responsive rules','type, spacing, colour, responsive rules'),ms:460,file:'site/styles.css'});
  out.push({l:L('Adding the interactions','Interactions daal raha hoon'),s:L('scrolling, menus and forms','scroll, menu aur forms'),ms:380,file:'site/app.js'});
  b.features.forEach(function(f){out.push({l:L('Adding ','Jod raha hoon — ')+FEATURES[f].l,s:FEATURES[f].mod,ms:300})});
  if(b.kind==='app'||b.kind==='both'){
    out.push({l:L('Building the app screens','App ki screens bana raha hoon'),s:L('screens, tab bar and shared tokens','screens, tab bar aur shared tokens'),ms:520,file:'app/App.jsx'});
    out.push({l:L('Matching the app to the site','App ko site se milaa raha hoon'),s:L('one set of colours for both','dono ke liye ek hi colours'),ms:280,file:'app/theme.js'});
  }
  out.push({l:L('Saving the project','Project save kar raha hoon'),s:L('so this build can be rerun exactly','taaki ye build dobara waisi hi ban sake'),ms:300,file:'brief.json'});
  out.push({l:L('Checking mobile and contrast','Mobile aur contrast check kar raha hoon'),s:L('headings, links, tap targets, widths','headings, links, tap targets, widths'),ms:640});
  return out;
}

function startBuild(){
  S.phase='building';S.built=false;S.files=[];S.buildLog=[];S.qaRuns=0;S.qaVerdict='';save();
  setPhasePill();
  /* The build used to hide the conversation and put a log in its place, so the
     moment someone asked for a site the thing they were talking to disappeared.
     The work belongs in the conversation — one card, filling in as it goes,
     with the preview beside it. */
  setMode('design');
  setTab('preview',true);
  /* The build stream is a different pane, so from the chat the studio looked
     frozen for a minute. One line, in the conversation, saying what is being
     written right now. */
  thinking(L('Writing the code…','Code likh raha hoon…'));
  /* And draw the site straight away rather than after the gateway answers:
     a client watching an empty preview while a model thinks has no way to
     tell waiting from broken. */
  try{
    gen=buildFiles();
    S.files=gen.files.map(function(f){return f.path});
    if(!S.file)S.file=S.files[0];
    if(S.tab==='preview')renderMain();
  }catch(e){}
  var steps=buildPlanSteps();
  var card=document.createElement('div');
  card.className='msg agent workcard';
  card.innerHTML='<div class="work"><b class="work-h">'+L('Building ','Bana raha hoon ')+esc(S.brief.name)+'</b>'+
                 '<div class="steps"></div>'+
                 '<div class="seg2"><button data-card="details" class="on">'+L('Details','Details')+'</button>'+
                 '<button data-card="preview">'+L('Previewing','Preview')+'</button></div></div>';
  card.addEventListener('click',function(e){
    var t=e.target.closest('button[data-card]');if(!t)return;
    var det=t.dataset.card==='details';
    card.querySelectorAll('.seg2 button').forEach(function(x){x.classList.toggle('on',x===t)});
    card.querySelector('.steps').style.display=det?'':'none';
    if(!det)setTab('preview');
  });
  body.appendChild(card);jumpChat();
  var list=card.querySelector('.steps');
  /* the Build pane is still there for anyone who opens it */
  stream.innerHTML='<span class="caps">Build · '+esc(S.brief.name)+'</span><div id="stepList"></div>';
  gen=null;                       // composed once the copy and plan are settled

  var i=0,t0=Date.now();
  function run(){
    if(i>=steps.length)return qaPass(done);
    var st=steps[i],row=document.createElement('div');
    row.className='step run';
    row.innerHTML='<span class="mark"></span><span>'+esc(st.l)+'<span class="sub">'+esc(st.s)+'</span></span><span class="ms"></span>';
    list.appendChild(row);list.scrollTop=list.scrollHeight;jumpChat();
    var a=Date.now();

    function finish(sub){
      sub=sub||(st.subFn?st.subFn():'');
      row.className='step done';
      row.querySelector('.mark').textContent='✓';
      if(sub)row.querySelector('.sub').textContent=sub;
      row.querySelector('.ms').textContent=(Date.now()-a)+'ms';
      if(st.compose){
        /* Composing is where a bad value from the gateway shows up. Thrown
           here it used to stop the chain dead: every row ticked, no files, an
           empty preview and a pill that said "Building…" forever. */
        try{gen=buildFiles()}
        catch(err){
          gen=null;
          try{delete S.brief.__copy;delete S.brief.__plan;gen=buildFiles()}catch(e2){}
          agentSay(gen?
            'The live copy and plan could not be assembled — '+esc(String(err&&err.message||err).slice(0,140))+
            '. I built the page with the local writer instead, so nothing is lost.':
            'The build failed while putting the pages together — '+esc(String(err&&err.message||err).slice(0,140))+
            '. Tell me to try again and I will rerun it.');
        }
        if(S.tab==='preview')renderMain();
      }
      if(st.file){
        emitFile(st.file);
        thinkingSay(L('Writing ','Likh raha hoon ')+st.file.replace(/^site\//,''));
      }
      S.buildLog.push({l:st.l,s:sub||st.s,ms:Date.now()-a});
      i++;run();
    }

    if(st.run){
      // a real network step — it finishes when the gateway answers, or when
      // this gives up on it. Both paths call finish() exactly once.
      /* Not `done` — that is the name of the function that ends the build, and
         a var here shadows it for the whole of run(), so every build threw
         "done is not a function" at the last step and sat on "Building…". */
      var settled=false;
      var give=setTimeout(function(){
        if(settled)return;settled=true;
        finish(L('gateway took too long — used the local writer','gateway ne der ki — local writer se likha'));
      },70000);
      st.run().then(function(sub){
        if(settled)return;settled=true;clearTimeout(give);finish(sub);
      },function(){
        if(settled)return;settled=true;clearTimeout(give);finish('fell back to the local writer');
      });
      return;
    }
    setTimeout(function(){finish()},st.ms);
  }
  function drainQueued(){
    var q=(S.queued||[]);if(!q.length)return;
    S.queued=[];save();
    /* One line, in the order they were said, so a person who typed three
       changes while waiting gets all three. */
    var next=function(){
      if(!q.length)return;
      applyEdit(q.shift());
      if(q.length)setTimeout(next,1200);
    };
    agentSay(q.length>1?'Now the '+q.length+' things you asked for while that ran.'
                       :'Now the change you asked for while that ran.');
    setTimeout(next,600);
  }
  /* A picture of the preview, taken inside the page.

     There is no screenshot API in a browser tab and no library may be loaded
     here, so the iframe's own document is serialised into an SVG
     foreignObject and drawn to a canvas. Two things break it and both are
     handled: a generated photograph that has not finished loading taints
     nothing but arrives blank, so the shot waits a beat for images; and a
     document that will not serialise at all returns nothing, which sends the
     review back to reading markup instead of failing the build. */
  function shotOfPreview(){
    return new Promise(function(resolve){
      var f=document.querySelector('#previewFrame')||document.querySelector('iframe');
      var doc=null;try{doc=f&&f.contentDocument}catch(e){}
      if(!doc||!doc.documentElement)return resolve('');
      var w=Math.min(1100,doc.documentElement.clientWidth||1100);
      var h=Math.min(1300,Math.max(680,doc.documentElement.clientHeight||860));
      var html;
      try{
        var clone=doc.documentElement.cloneNode(true);
        /* scripts never run inside foreignObject and only bloat the payload */
        Array.prototype.slice.call(clone.querySelectorAll('script')).forEach(function(n){n.remove()});
        /* …but the page's own reveal animation starts everything at opacity 0
           and is turned on by one of those scripts. Without this the review
           was handed a black rectangle with a navigation bar on it, and would
           have marked the design on a page nobody can see. */
        var unhide=doc.createElement('style');
        unhide.textContent='[data-reveal],[data-reveal] *{opacity:1!important;transform:none!important;'+
          'filter:none!important;clip-path:none!important;visibility:visible!important}'+
          'html,body{overflow:visible!important}'+
          '*{animation:none!important;transition:none!important}';
        (clone.querySelector('head')||clone).appendChild(unhide);
        html=new XMLSerializer().serializeToString(clone);
      }catch(e){return resolve('')}
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
        '<foreignObject width="100%" height="100%">'+
        '<div xmlns="http://www.w3.org/1999/xhtml">'+html+'</div>'+
        '</foreignObject></svg>';
      var img=new Image(),url;
      try{url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
      catch(e){return resolve('')}
      var settled=false;
      var give=setTimeout(function(){if(!settled){settled=true;resolve('')}},9000);
      img.onload=function(){
        if(settled)return;settled=true;clearTimeout(give);
        /* a frame that has not painted yet serialises to almost nothing */
        try{
          var cv=document.createElement('canvas');
          cv.width=Math.round(w*0.62);cv.height=Math.round(h*0.62);
          var cx=cv.getContext('2d');
          cx.fillStyle='#0b0b0f';cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img,0,0,cv.width,cv.height);
          resolve(cv.toDataURL('image/jpeg',0.62));
        }catch(e){resolve('')}
      };
      img.onerror=function(){if(!settled){settled=true;clearTimeout(give);resolve('')}};
      img.src=url;
    });
  }

  /* §16–§18 — mark the page, fix the worst of it, stop. Two passes at most,
     and the second only if the first actually changed something: a loop that
     keeps regenerating is a build that never ends. */
  function applyQaFix(f){
    var b=S.brief,u=b.__ui||(b.__ui={});
    var m=String(f).split(':'),k=m[0],v=m[1];
    if(k==='hero'){u.hero=v;return L('reshaped the first screen','pehli screen ka shape badla')}
    if(k==='density'){u.density=v;return L('opened up the spacing','spacing khol di')}
    if(k==='align'){u.heroAlign=v;return L('moved the hero '+v,'hero '+v+' kar diya')}
    if(k==='caps'){u.caps=(v==='on');return L('changed the heading case','heading ka case badla')}
    if(k==='radius'){u.radius=(v==='sharp')?2:20;return L('changed the corners','corners badle')}
    if(k==='sections'){
      S.depth=(v==='more')?'pro':'lite';setDepthLabel();
      return L('built '+(v==='more'?'more':'fewer')+' sections',(v==='more'?'aur':'kam')+' sections banaye');
    }
    if(k==='images'){delete b.__art;delete b.__heroImage;return L('reshot the pictures','photos dobara')}
    return '';
  }
  function qaPass(after){
    var b=S.brief;
    if(!X.usable()||(S.qaRuns||0)>=2)return after();
    S.qaRuns=(S.qaRuns||0)+1;
    var home=(gen&&gen.files.filter(function(f){return /index\.html$/.test(f.path)})[0])||null;
    if(!home)return after();
    var row=document.createElement('div');
    row.className='step run';
    row.innerHTML='<span class="mark"></span><span>'+esc(L('Reviewing the design','Design ko parakh raha hoon'))+
      '<span class="sub"></span></span><span class="ms"></span>';
    list.appendChild(row);list.scrollTop=list.scrollHeight;jumpChat();
    var a=Date.now(),settled=false;
    function close(sub){
      row.className='step done';row.querySelector('.mark').textContent='✓';
      row.querySelector('.sub').textContent=sub||'';
      row.querySelector('.ms').textContent=(Date.now()-a)+'ms';
      jumpChat();
    }
    /* the review is one more network call at the end of a build; it may not
       hold it up for longer than a step would */
    var give=setTimeout(function(){
      if(settled)return;settled=true;
      close(L('review took too long','review mein der lagi'));after();
    },30000);
    /* Look at it, the way the client's workflow says: a picture of the page
       goes to the vision model. Only when a shot cannot be taken does this
       fall back to reading the markup. */
    function onReview(r,how){
      if(settled)return;settled=true;clearTimeout(give);
      setAiPill();
      if(!r){close(L('review unavailable','review nahi ho paaya'));return after()}
      var sc=r.review.scores,vals=[];
      Object.keys(sc).forEach(function(k){if(sc[k]!=null)vals.push(sc[k])});
      var low=vals.length?Math.min.apply(null,vals):null;
      S.qaVerdict=r.review.verdict||'';
      var did=[];
      if(low!=null&&low<8)r.review.fixes.forEach(function(f){var t=applyQaFix(f);if(t)did.push(t)});
      var head=(low!=null?low+'/10 '+L('at its weakest','sabse kamzor'):'')+
               (how?' · '+how:'')+(did.length?' · '+did.join(', '):'');
      /* §"the model fixes the code" — the levers are blunt, so what it saw is
         handed back for a stylesheet patch. CSS only, appended last so it
         wins, and validated before it goes anywhere near the build. */
      var problems=(r.review.problems||[]).slice(0,3);
      if(low!=null&&low<8&&problems.length&&(S.qaRuns||0)<=1){
        X.patchCss(b,problems,(gen&&gen.files.filter(function(f){return /styles\.css$/.test(f.path)})[0]||{}).body||'')
          .then(function(pr){
            setAiPill();
            if(pr&&pr.css){b.__fixCss=pr.css;did.push(L('rewrote part of the stylesheet','stylesheet ka hissa dobara likha'))}
            finishPass(head+(pr&&pr.css?' · '+L('css patched','css patch'):''),did);
          },function(){finishPass(head,did)});
        return;
      }
      finishPass(head,did);
    }
    function finishPass(head,did){
      close(head);
      if(!did.length)return after();
      save();
      try{gen=buildFiles()}catch(e){}
      if(S.tab==='preview')renderMain();
      /* the preview has just been replaced; screenshotting it in the same tick

/* ============================================================
   Edits after the build
   ============================================================ */
/* An address the customer typed: a full URL, a page of their own site, or an
   anchor. URLONLY_RE is the same thing without the bare paths, since "/mnt" in
   a sentence is not a video. */
var HREF_RE=/(https?:\/\/[^\s"'<>]+|\/[a-z0-9][a-z0-9\-\/\.]{0,60}|#[a-z0-9\-]{1,40})/i;
var URLONLY_RE=/https?:\/\/[^\s"'<>]+/i;
/* "menu me Home, Menu aur Contact daal do" — the items are what is left once
   the instruction words are taken out. */
/* What a sentence can point at on a preset, and what it can ask of it. */
var PART={
  title:/\b(title|heading|headline|h1|hero text|bada text|bade text)\b/i,
  text :/\b(text|paragraph|para|subtitle|caption|description|copy|likha|likhi|line)\b/i,
  menu :/\b(menu|nav(?:igation)?|top ?bar|upper ?bar|uu?p+er wali bar|header)\b/i,
  brand:/\b(logo|brand|pill)\b/i,
  object:/\b(3d|3-d|object|model)\b/i,
  page :/\b(page|site|website|sab kuch|everything|whole page|poora)\b/i
};
var LOOK={
  bigger :/\b(bigger|larger|big|bada|bda|bara|badha|badhao|increase|grow)\b/i,
  smaller:/\b(smaller|chota|chhota|chhoti|choti|reduce|shrink|decrease|kam kar)\b/i,
  center :/\b(cent(?:er|re)|beech|bich|middle)\b/i,
  left   :/\b(left|baye|baayi)\b/i,
  right  :/\b(right|daye|daayi)\b/i,
  up     :/\b(upar|uper|top|raise)\b/i,
  down   :/\b(neeche|niche|down|lower)\b/i,
  caps   :/\b(uppercase|caps|capital)\b/i,
  lower  :/\b(lowercase|small letters)\b/i,
  bold   :/\b(bold|heavy|thick|mota|moti)\b/i,
  thin   :/\b(thin|lightweight|patla|patli)\b/i,
  wide   :/\b(wide|spaced|spacing|tracking|khula|khuli)\b/i,
  tight  :/\b(tight|narrow|compact|chipk)\b/i,
  serif  :/\bserif\b/i,
  sans   :/\bsans\b/i,
  mono   :/\bmono(space)?\b/i
};
var FONTS={serif:'Georgia,"Times New Roman",serif',
  sans:'"Helvetica Neue",Helvetica,Arial,sans-serif',
  mono:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'};
function partNamed(text){
  var keys=['title','text','menu','brand','object','page'];
  for(var i=0;i<keys.length;i++)if(PART[keys[i]].test(text))return keys[i];
  return '';
}
function looksLikePresetEdit(text){
  return /\b(menu|nav(?:igation)?|top ?bar|upper ?bar|uu?p+er wali bar|header|link|href|video|film|clip|reel|image|photo|picture|logo|button)\b/i.test(text)&&
    (HREF_RE.test(text)||
     /\b(add|put|daal|dal|lga|lgao|lagao|change|replace|swap|badal|badlo|point|open|khol|kholo|connect|jodo|joro|rakho|karo|kro|kar do|kr do|chahiye|le ja)\b/i.test(text));
}
function menuItemsFrom(text){
  return String(text)
    .replace(/\b(menu|navigation|nav|top ?bar|upper ?bar|uu?p+er|upar|wali|header|bar)\b/gi,' ')
    .replace(/\b(me|mein|m|par|pe|in|into|to|the|a|an|add|please|kar|kr|do|daal|dal|daalo|dalo|lga|lgao|lagao|put|karo|kro|banao|bna|chahiye|rakho|rakh|items?|links?|options?|pages?)\b/gi,' ')
    .replace(/[:\-\u2013\u2014"'\u201c\u201d]/g,' ')
    .split(/\s*(?:,|\/|\||\band\b|\baur\b)\s*/i)
    .map(function(x){return C.titleCase(x.replace(/\s+/g,' ').trim())})
    .filter(function(x){return x&&x.length<=22&&/[a-z]/i.test(x)})
    .slice(0,6);
}
function parseEdit(text){
  var b=S.brief,t=text.toLowerCase().trim(),done=[];

  /* A pasted brief is not an instruction. Read word by word, a long spec
     scores against a dozen rules at once — a page that mentions "title",
     "compact", "bold", "serif" and a background hex came back as eleven
     changes, one of them painting the accent the colour of the background,
     and the brief itself was never read. Anything this long belongs to the
     brief reader, or to the gateway. */
  if(text.length>320||text.split(/\n/).length>4)return null;

  var m=t.match(/(?:rename(?: it)?(?: to)?|call it|name it)\s+(.+)/i);
  if(m){var nm=text.slice(text.toLowerCase().indexOf(m[1])).trim().replace(/["'.]+$/,'');
    b.name=nm.slice(0,48);S.projectName=b.name;$('#projName').textContent=b.name;
    done.push('renamed it to <b>'+esc(b.name)+'</b>')}

  /* "koi aur design dikhao" — the whole art direction, not a colour. */
  /* "koi aur design dikhao" carries the ask in "aur … dikhao", not in a verb
     the English list knew about. The noun is the anchor; almost anything asking
     for change beside it counts. */
  if(/\b(design|look|layout|theme|style|direction|shakal|dizain)\b/i.test(text)&&
     /\b(different|another|new|change|switch|try|badal|badlo|dusr\w*|doosr\w*|alag|aur|naya|nayi|dikhao|dikha)\b/i.test(text)&&
     !findColor(text)){
    var cur=G.DIR_KEYS.indexOf(b.__dir||'cinematic');
    b.__dir=G.DIR_KEYS[(cur+1)%G.DIR_KEYS.length];
    done.push(L('switched the design direction to <b>'+esc(G.DIRS[b.__dir].l)+'</b>',
                'design direction <b>'+esc(G.DIRS[b.__dir].l)+'</b> kar diya'));
  }

  /* The look of a named part — its size, where it sits, its case, its type.
     Read before the colour rule, or "title ko blue kr do" repaints the whole
     site's accent instead of the title. Everything lands as an override on the
     preset, so the designer's own rules are never edited. */
  if(presetHome()){
    var part=partNamed(text);
    if(part){
      var st0=(b.__style&&b.__style[part])||{},st1={};
      Object.keys(st0).forEach(function(k){st1[k]=st0[k]});
      var look=[];
      if(LOOK.bigger.test(t)&&!LOOK.smaller.test(t)){
        st1.zoom=Math.min(2.5,Math.round((st1.zoom||1)*125)/100);look.push('bigger')}
      if(LOOK.smaller.test(t)){
        st1.zoom=Math.max(0.4,Math.round((st1.zoom||1)*80)/100);look.push('smaller')}
      if(LOOK.center.test(t)){st1.align='center';look.push('centred')}
      else if(LOOK.left.test(t)){st1.align='left';look.push('moved left')}
      else if(LOOK.right.test(t)){st1.align='right';look.push('moved right')}
      if(LOOK.up.test(t)){st1.dy='-6vh';look.push('moved up')}
      if(LOOK.down.test(t)){st1.dy='6vh';look.push('moved down')}
      if(LOOK.caps.test(t)){st1.transform='uppercase';look.push('in capitals')}
      if(LOOK.lower.test(t)){st1.transform='lowercase';look.push('in lower case')}
      if(LOOK.bold.test(t)){st1.weight=700;look.push('bolder')}
      if(LOOK.thin.test(t)){st1.weight=300;look.push('lighter')}
      if(LOOK.wide.test(t)){st1.track='.08em';look.push('more spaced out')}
      if(LOOK.tight.test(t)){st1.track='-.02em';look.push('tighter')}
      if(LOOK.serif.test(t)){st1.font=FONTS.serif;look.push('in a serif')}
      else if(LOOK.mono.test(t)){st1.font=FONTS.mono;look.push('in a monospace')}
      else if(LOOK.sans.test(t)){st1.font=FONTS.sans;look.push('in a sans')}
      var pc=findColor(text);
      if(pc&&/\b(colou?r|rang|kar ?do|kr ?do|karo|kro|make|paint)\b/i.test(t)){st1.color=pc;look.push('now '+pc)}
      if(look.length){
        b.__style=b.__style||{};b.__style[part]=st1;
        done.push('the <b>'+esc(part)+'</b> is '+esc(look.join(', ')));
      }
    }
  }

  /* A .glb link is unambiguous — read it before the motion rule sees "3d" and
     files the whole sentence as a request for more parallax. */
  if(presetHome()){
    var glb=(text.match(/https?:\/\/[^\s"'<>]+\.(?:glb|gltf)(?:\?[^\s"'<>]*)?/i)||[])[0];
    if(glb){
      b.__object={url:glb};
      done.push('put your 3D model on the '+esc(presetName())+' page — it turns on its own and a drag '+
        'spins it. If nothing appears, that address is not serving a .glb');
    }else if(PART.object.test(text)&&/\b(add|put|daal|dal|lga|lgao|lagao|chahiye|karo|kro|kar do|kr do|banao)\b/i.test(text)&&
             !LOOK.bigger.test(t)&&!LOOK.smaller.test(t)){
      done.push('send me the model’s address and I will place it — a <code>.glb</code> or <code>.gltf</code> '+
        'link. There is no object library wired into the studio, so it has to be a file on the web');
    }
  }

  var tag=text.match(/(?:tagline|one[- ]liner|headline|strapline)\s*[:—-]\s*(.+)/i);
  if(tag){b.pitch=tag[1].trim().slice(0,180);done.push('rewrote the one-liner')}

  if(/\b(no|off|band|mat|nahi|without|skip)\b/i.test(text)&&/\b(image|images|photo|photos|picture|tasveer)\b/i.test(text)){
    S.autoImages=false;b.__noImages=true;save();
    return L('No images — the drawn placeholders stay, and nothing is charged.',
             'Theek hai — images nahi banaunga, placeholders hi rahenge aur kuch nahi katega.');
  }

  /* "images bana do" — the only edit that spends credits, so it never runs
     from a guess: the words have to name images and ask for them. */
  if(/\b(image|images|photo|photos|picture|pictures|tasveer|photograph)\b/i.test(text)&&
     /\b(generate|make|banao|bana ?do|bna ?do|add|real|asli|daal|lga|lagao|chahiye)\b/i.test(text)&&
     !HREF_RE.test(text)){
    setTimeout(function(){imageFlow(4)},60);
    return L('Making them now — 4 images, '+(4*IMG_COST)+' credits.',
             'Abhi bana raha hoon — 4 images, '+(4*IMG_COST)+' credits.');
  }

  /* The page's background, when that is what was named. Read before the
     accent rule, or "background ka color red kr do" comes back as an accent —
     which is what the client saw, and it is not what they asked for. */
  var bgWord=/\b(background|backgound|backgournd|back ?ground|bg|page colou?r|site colou?r|canvas|pichhe|peeche)\b/i.test(text);
  var col=findColor(text);
  if(bgWord&&col){
    b.__bg=col;
    done.push(L('the background is now <code>'+esc(col)+'</code>',
                'background ab <code>'+esc(col)+'</code> hai'));
  }
  else if(col&&/colour|color|accent|make it|switch to|palette|teal|gold|green|blue|red|violet|purple|pink|orange|amber|cyan|lime|coral|mint|rose|magenta|indigo|emerald|crimson|bronze|peach|sky/.test(t)){
    b.accent=col;b.__accentAsked=1;done.push(L('accent is now <code>'+esc(col)+'</code>',
                             'accent ab <code>'+esc(col)+'</code> hai'))}

  var aboutMotion=/\bmotion|parallax|animat/.test(t);
  Object.keys(STYLES).forEach(function(k){
    if(k==='cinematic'&&aboutMotion)return;   // "cinematic motion" is not a style change
    if(new RegExp('\\b'+k+'\\b').test(t)||t.indexOf(STYLES[k].l.toLowerCase())>=0){
      if(b.style!==k){b.style=k;done.push('switched the style to <b>'+STYLES[k].l+'</b>')}}});
  if(/\bdark\b/.test(t)&&!STYLES[b.style].dark){b.style='cinematic';done.push('switched to a dark style')}
  if(/\blight\b/.test(t)&&STYLES[b.style].dark){b.style='minimal';done.push('switched to a light style')}

  if(/\b(more|extra|richer|full|deeper|pro)\b.*(section|page|content|build)|\bmore sections\b/.test(t)){
    if(S.depth!=='pro'){S.depth='pro';setDepthLabel();done.push('turned on the deeper build — stats, testimonials, FAQ and a marquee')}}
  if(/\b(fewer|less|simpler|shorter|lite|trim)\b/.test(t)&&/(section|page|build)/.test(t)){
    if(S.depth!=='lite'){S.depth='lite';setDepthLabel();done.push('trimmed back to the core sections')}}

  if(b.__bg&&/\b(reset|default|original|purana|wapas|revert)\b/.test(t)&&bgWord){
    delete b.__bg;done.push(L('put the background back','background wapas pehle jaisa'))}

  if(/\b(no|less|subtle|calm|still)\b.*motion|\bcalm it down\b/.test(t)){b.motion='subtle';done.push('dialled the motion back')}
  /* "3d object daal do" is an object, not a request for more parallax */
  else if(/\b(3d|three d|full motion|cinematic|parallax)\b/.test(t)&&!/\b(object|model|glb|gltf)\b/.test(t)){
    b.motion=/3d|three d|full/.test(t)?'full':'cinematic';done.push('motion is now <b>'+b.motion+'</b>')}

  var FKEY={store:/\b(shop|store|cart|checkout|ecommerce|e-commerce|products?)\b/,
    bookings:/\b(booking|bookings|reservation|appointment|slots?)\b/,
    blog:/\b(blog|cms|posts?|articles?|writing)\b/,
    forms:/\b(form|forms|enquiry|inquiry|contact form|leads?)\b/,
    accounts:/\b(accounts?|login|sign[- ]?in|sign[- ]?up|members?)\b/,
    multilang:/\b(languages?|multi[- ]?lingual|translation|hindi|french|arabic|spanish)\b/,
    gallery:/\b(gallery|photos?|images?|lookbook)\b/,maps:/\b(maps?|directions?|location)\b/,
    analytics:/\b(analytics|tracking|stats?)\b/,chat:/\b(live chat|chat widget|support widget)\b/};
  var adding=/\b(add|include|put in|i want|need|with)\b/.test(t),
      dropping=/\b(drop|remove|delete|without|take out|no more|get rid of)\b/.test(t);
  Object.keys(FKEY).forEach(function(k){
    if(!FKEY[k].test(t))return;
    if(dropping&&b.features.indexOf(k)>=0){
      b.features.splice(b.features.indexOf(k),1);done.push('removed <b>'+FEATURES[k].l+'</b>')}
    else if(adding&&b.features.indexOf(k)<0){
      b.features.push(k);done.push('added <b>'+FEATURES[k].l+'</b>')}});

  var pageWord=text.match(/\b(?:add|include)\s+(?:an?\s+)?([a-z][a-z ]{1,22}?)\s+page\b/i);
  if(pageWord){var pn=C.titleCase(pageWord[1].trim());
    if(b.pages.indexOf(pn)<0){b.pages.push(pn);done.push('added a <b>'+esc(pn)+'</b> page')}}
  var dropPage=text.match(/\b(?:drop|remove|delete)\s+(?:the\s+)?([a-z][a-z ]{1,22}?)\s+page\b/i);
  if(dropPage){var dn=C.titleCase(dropPage[1].trim());
    var idx=b.pages.map(function(p){return p.toLowerCase()}).indexOf(dn.toLowerCase());
    if(idx>=0){b.pages.splice(idx,1);done.push('dropped the <b>'+esc(dn)+'</b> page')}}

  if(/\b(rewrite|redo|new|different)\b.*\b(copy|words|text|wording)\b/.test(t)){
    b.variant=(b.variant||0)+1;delete b.__copy;S.__recopy=true;
    done.push('rewrote the copy with a fresh angle')}

  /* The preset's own page — its top bar, its links, its film, its words. All
     read last and each one checked against what the page really has, so they
     can never steal a colour or a page edit from the rules above, and the
     studio never reports changing something that is not there. */
  if(!done.length&&presetHome()){
    /* menu items in the top bar: "menu me Home, Menu, Contact daal do" */
    if(/\b(menu|nav(?:igation)?|top ?bar|upper ?bar|uu?p+er wali bar|header)\b/i.test(text)&&
       /\b(add|put|daal|dal|lga|lgao|lagao|chahiye|banao|bna|karo|kro|kar do|kr do|rakho|rakh)\b/i.test(text)){
      var items=menuItemsFrom(text);
      if(items.length&&presetHas('header,[class*=nav],[class*=header]')){
        b.__menu=items;
        done.push('put <b>'+esc(items.join(' · '))+'</b> in the top bar');
      }else if(items.length){
        done.push('could not add the menu \u2014 the '+esc(presetName())+' page has no top bar to put it in');
      }
    }
  }
  if(!done.length&&presetHome()){
    /* an address for something the page already says */
    var href=(text.match(HREF_RE)||[])[0]||'';
    if(href&&/\b(link|linked|point|open|khol|kholo|jao|jaye|le ja|href|connect|joro|jodo)\b/i.test(text)){
      var lead=text.slice(0,text.indexOf(href))
        .replace(/\b(please|link|linked|point|open|khol(?:o|na)?|connect|jodo|joro|make|kar|kr|do|the|to|par|pe|ko|se|of|us|is|isko|ise|button|pill|word|text|label)\b/gi,' ')
        .replace(/["'\u2018\u201c\u2019\u201d]/g,' ');
      var target=presetSays(lead);
      if(target){
        b.__links=(b.__links||[]).filter(function(pr){return pr[0]!==target});
        b.__links.push([target,href]);
        done.push('pointed <b>'+esc(target)+'</b> at <code>'+esc(href)+'</code>');
      }else{
        done.push('I could not find <b>'+esc(lead.replace(/\s+/g,' ').trim().slice(0,40))+
          '</b> on the '+esc(presetName())+' page \u2014 tell me the exact words it says and I will link those');
      }
    }
  }
  if(!done.length&&presetHome()){
    /* the film, or a photograph, swapped for one of yours */
    var url=(text.match(URLONLY_RE)||[])[0]||'';
    var wantsVideo=/\b(video|film|clip|reel|footage)\b/i.test(text);
    var wantsImage=/\b(image|images|photo|photos|picture|pic|background|logo|object|graphic|art)\b/i.test(text);
    if(url&&(wantsVideo||wantsImage)){
      var kind=wantsVideo&&!/\.(png|jpe?g|webp|gif|avif|svg)(\?|$)/i.test(url)?'video':'image';
      if(presetHas(kind==='video'?'video':'img')){
        b.__media=(b.__media||[]).filter(function(m){return m.kind!==kind});
        b.__media.push({kind:kind,url:url});
        done.push('put your '+kind+' into the '+esc(presetName())+' page — if the preview goes blank, '+
          'that address is not serving a'+(kind==='video'?' video':'n image')+' the browser can play');
      }else{
        done.push('the '+esc(presetName())+' page has no '+kind+' in it, so there is nothing to swap');
      }
    }else if(!url&&(wantsVideo||wantsImage)&&/\b(change|badal|badlo|replace|swap|daal|lga|lagao|apna|apni|meri|mera|new|naya|nayi)\b/i.test(text)){
      done.push('send me the '+(wantsVideo?'video':'image')+' address \u2014 paste the link and I will put it in. '+
        'Uploading a file from this machine is not wired up yet');
    }
  }
  if(!done.length&&presetHome()){
    var q=text.match(/(?:change|replace|swap|make)\s+(?:the\s+)?["'\u2018\u201c]([^"'\u2019\u201d]{2,60})["'\u2019\u201d]\s*(?:to|with|into|say|read)\s*["'\u2018\u201c]?([^"'\u2019\u201d]{1,80}?)["'\u2019\u201d]?\s*$/i)
         ||text.match(/(?:change|replace|swap)\s+(?:the\s+)?(.{2,44}?)\s+(?:to|with|into)\s+(.{1,80}?)\s*$/i);
    if(q){
      var was=presetSays(q[1]),now=String(q[2]).trim().replace(/[.]$/,'');
      if(was&&now&&was!==now){
        b.__words=(b.__words||[]).filter(function(pr){return pr[0]!==was});
        b.__words.push([was,now]);
        done.push('changed <b>'+esc(was)+'</b> to <b>'+esc(now)+'</b> on the '+esc(presetName())+' page');
      }
    }
  }

  if(!done.length)return null;
  save();
  return done.length===1?C.titleCase(done[0].charAt(0))+done[0].slice(1):
    'Done:<ul>'+done.map(function(d){return '<li>'+d+'</li>'}).join('')+'</ul>';
}

/* the gateway's answer to a change request, applied field by field */
function applyPatch(o){
  var b=S.brief,done=[];
  if(typeof o.name==='string'&&o.name.trim()){
    b.name=o.name.trim().slice(0,48);S.projectName=b.name;$('#projName').textContent=b.name;
    done.push('renamed it to <b>'+esc(b.name)+'</b>')}
  if(typeof o.pitch==='string'&&o.pitch.trim()){b.pitch=o.pitch.trim().slice(0,180);done.push('rewrote the one-liner')}
  if(typeof o.accent==='string'&&/^#[0-9a-f]{6}$/i.test(o.accent.trim())){
    b.accent=o.accent.trim();b.__accentAsked=1;done.push('accent is now <code>'+esc(b.accent)+'</code>')}
  if(STYLES[o.style]&&b.style!==o.style){b.style=o.style;done.push('switched the style to <b>'+STYLES[o.style].l+'</b>')}
  if(['subtle','cinematic','full'].indexOf(o.motion)>=0&&b.motion!==o.motion){
    b.motion=o.motion;done.push('motion is now <b>'+esc(o.motion)+'</b>')}
  if((o.depth==='lite'||o.depth==='pro')&&S.depth!==o.depth){
    S.depth=o.depth;setDepthLabel();done.push(o.depth==='pro'?'turned on the deeper build':'trimmed back to the core sections')}
  (Array.isArray(o.addPages)?o.addPages:[]).forEach(function(p){
    p=C.titleCase(String(p||'').trim());
    if(p&&b.pages.map(function(x){return x.toLowerCase()}).indexOf(p.toLowerCase())<0){
      b.pages.push(p);done.push('added a <b>'+esc(p)+'</b> page')}});
  (Array.isArray(o.dropPages)?o.dropPages:[]).forEach(function(p){
    var i=b.pages.map(function(x){return x.toLowerCase()}).indexOf(String(p||'').trim().toLowerCase());
    if(i>=0){done.push('dropped the <b>'+esc(b.pages[i])+'</b> page');b.pages.splice(i,1)}});
  (Array.isArray(o.addFeatures)?o.addFeatures:[]).forEach(function(f){
    f=String(f||'').trim();
    if(FEATURES[f]&&b.features.indexOf(f)<0){b.features.push(f);done.push('added <b>'+FEATURES[f].l+'</b>')}});
  (Array.isArray(o.dropFeatures)?o.dropFeatures:[]).forEach(function(f){
    f=String(f||'').trim();
    var i=b.features.indexOf(f);
    if(i>=0){b.features.splice(i,1);done.push('removed <b>'+FEATURES[f].l+'</b>')}});
  if(o.rewriteCopy){b.variant=(b.variant||0)+1;delete b.__copy;S.__recopy=true;done.push('rewrote the copy')}
  if(done.length)save();
  return done;
}

function applyEdit(text){
  var t0=Date.now();thinking();
  setTimeout(function(){
    clearThinking();
    var res=parseEdit(text);
    if(!res&&X.usable()){
      // the pattern reader could not place it — hand the sentence to the gateway
      thinking();
      X.readEdit(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        if(!o)return editHelp(t0);
        var changed=applyPatch(o);
        if(!changed.length){
          agentSay(esc(String(o.reply||'').slice(0,240))||
            "That did not land as a change to the site — tell me what to alter and I will rebuild.",
            Math.max(1,Math.round((Date.now()-t0)/1000)));
          return;
        }
        var summary=changed.length===1?C.titleCase(changed[0].charAt(0))+changed[0].slice(1):
          'Done:<ul>'+changed.map(function(d){return '<li>'+d+'</li>'}).join('')+'</ul>';
        if(S.brief.__copy||!X.usable())return rebuild(summary,t0);
        rebuildWithCopy(summary,t0);
      });
      return;
    }
    if(!res)return editHelp(t0);
    if(S.__recopy&&X.usable()){S.__recopy=false;return rebuildWithCopy(res,t0)}
    S.__recopy=false;
    rebuild(res,t0);
  },500);
}

/* an edit that needs fresh copy: ask the gateway again, then rebuild */
function rebuildWithCopy(summary,t0){
  thinking();
  X.writeCopy(S.brief,transcript()).then(function(r){
    clearThinking();setAiPill();
    if(r){S.brief.__copy=r.copy;save()}
    rebuild(summary+(r?'<br/><br/>New copy written by '+esc(r.provider)+' · '+esc(r.model)+'.':
      '<br/><br/>The gateway did not answer, so the local writer filled the copy in.'),t0);
  });
}

function rebuild(reason,t0){
  /* Read from the last build rather than from the brief: the edit has already
     been applied to the brief by the time this runs, so re-rendering the page
     here would only ever compare it with itself. */
  var homeBefore=builtHome;
  gen=buildFiles();
  /* The preset carries a name, a line, a colour and its own words. A change to
     the sections, the pages or the style has nowhere to land on it, and saying
     "the preview is live" without saying that reads as a preview that ignored
     the request. */
  var elsewhere=(homeBefore&&homeBefore===builtHome)?
    '<br/><br/>The <b>'+esc(presetName())+'</b> page itself is unchanged — that one lands on the pages around it.':'';
  S.files=gen.files.map(function(f){return f.path});
  if(S.files.indexOf(S.file)<0)S.file=S.files[0];
  save();refreshTools();renderMain();
  // once the build is a project in the workspace, every rebuild is versioned there
  if(API.projectId)N.saveProject(S.brief,gen,S.depth).then(function(){
    return N.saveVersion(String(reason).replace(/<[^>]+>/g,'').slice(0,80),S.brief,gen,S.depth)
  }).then(function(){if(S.tool==='publishing'&&S.tab==='tools')renderMain()},function(){});
  var P=planData();
  agentSay(reason+elsewhere+'<br/><br/>'+L('Rebuilt — '+gen.files.length+' files, '+P.sections+' sections. The preview is live.',
    'Dobara bana diya — '+gen.files.length+' files, '+P.sections+' sections. Preview live hai.'),
    Math.max(1,Math.round((Date.now()-(t0||Date.now()-1400))/1000)));
  var list=$('#stepList');
  if(list){
    var row=document.createElement('div');
    row.className='step done';
    row.innerHTML='<span class="mark">✓</span><span>Rebuild<span class="sub">'+
      reason.replace(/<[^>]+>/g,'').slice(0,80)+'</span></span>';
    list.appendChild(row);
  }
}

/* ============================================================
   Panels — tools column
   ============================================================ */
/* Sixteen panels used to be listed at once, so the studio opened on a wall of
   infrastructure. Simple Mode shows the four that belong to the project; the
   cloud and setup panels move behind Advanced, which is the same
   `scen.uimode` key the main app uses, so the two surfaces agree.
   Labels follow the client-facing vocabulary (AI gateway → AI, and so on);
   the panels themselves are untouched and all still reachable. */
/* PROJECT — Brief, Plan, Files, Activity — is gone. Those four are the build
   talking about itself: a form of the answers, a list of the sections it will
   write, the files it wrote and a log of the steps. The conversation says all
   of it in a sentence, the preview shows the result and Code shows the files,
   so the group was a fourth copy of things the client had already been told.
   The panels themselves are still built and still render; nothing links to
   them from here. */
var TOOLS=[
  ['SCEN CLOUD','advanced',[['aigateway','✦','AI'],['publishing','◈','Publishing'],['domains','🌐','Domain'],['database','⛁','Data'],
    ['users','◍','Login & Users'],['monitoring','📈','Site Health'],['storage','▦','Storage'],
    ['security','⛨','Security']]],
  ['SETUP','advanced',[['integrations','⧉','Connections'],['git','⑂','GitHub'],['secrets','🔑','API Keys'],
    ['skills','✦','AI Skills']]]
];
var MODE_KEY='scen.uimode';
function uiMode(){try{return localStorage.getItem(MODE_KEY)==='advanced'?'advanced':'simple'}catch(e){return 'simple'}}
function setUiMode(m){
  try{localStorage.setItem(MODE_KEY,m)}catch(e){}
  /* A panel that is being hidden must not stay selected underneath. */
  if(m==='simple'&&!toolIsSimple(S.tool)){S.tool='aigateway';save()}
  renderTools();renderMain();
}
function toolIsSimple(id){
  for(var i=0;i<TOOLS.length;i++)
    if(TOOLS[i][1]==='simple')
      for(var j=0;j<TOOLS[i][2].length;j++)
        if(TOOLS[i][2][j][0]===id)return true;
  return false;
}
function renderTools(){
  var col=$('#toolsCol'),out='',adv=uiMode()==='advanced';
  out+='<div class="modeRow" role="tablist" aria-label="Interface complexity">'+
    '<button role="tab" aria-selected="'+(!adv)+'" class="'+(adv?'':'on')+'" data-uimode="simple">Simple</button>'+
    '<button role="tab" aria-selected="'+adv+'" class="'+(adv?'on':'')+'" data-uimode="advanced">Advanced</button>'+
  '</div>';
  TOOLS.forEach(function(grp){
    if(grp[1]==='advanced'&&!adv)return;
    out+='<span class="caps">'+grp[0]+'</span>';
    grp[2].forEach(function(t){
      var meta='';
      if(t[0]==='brief')meta=haveEnough(S.brief)?'<span class="cnt">ready</span>':'';
      if(t[0]==='plan'&&S.brief.pages.length)meta='<span class="cnt">'+S.brief.pages.length+'</span>';
      if(t[0]==='files'&&S.files.length)meta='<span class="cnt">'+S.files.length+'</span>';
      if(t[0]==='log'&&S.buildLog.length)meta='<span class="cnt">'+S.buildLog.length+'</span>';
      out+='<button class="tool'+(S.tool===t[0]?' on':'')+'" data-tool="'+t[0]+'"><em>'+t[1]+'</em>'+esc(t[2])+meta+'</button>';
    });
  });
  if(!adv)out+='<button class="toolAdv" data-uimode="advanced"><em>⚙</em>Advanced tools<span class="cnt">12</span></button>';
  col.innerHTML=out;
}
function refreshTools(){renderTools()}
function briefFilled(){
  var b=S.brief,keys=['kind','name','industry','pitch','goal','pages','features','style','accent','motion'];
  return keys.filter(function(k){var v=b[k];return Array.isArray(v)?v.length:!!v}).length;
}

  if(S.tab==='code')return m.innerHTML=paneCode(),bindCode();

}

var PANE={};

PANE.brief=function(){

                 :'Nothing yet. Describe the place in a line and I will work the rest out.')+

    (known.length&&blank.length?'<p style="margin-top:18px;font-size:12.5px;color:#6f6f7a;line-height:1.7">'+
      'Everything else I decide myself.</p>':'')+
    (b.refs&&b.refs.length?'<h2>References you attached</h2><div style="display:flex;gap:9px;flex-wrap:wrap">'+
      b.refs.map(function(r){return '<img class="att" style="width:96px;height:96px" src="'+r.url+'" alt=""/>'}).join('')+'</div>':'')+
    '</div>';
};

PANE.plan=function(){
  if(!S.brief.pages.length)return '<div class="pane"><div class="empty"><div><div class="orb"></div>'+
    '<h2>No plan yet</h2><p>Answer a few more questions and the page-by-page plan appears here.</p></div></div></div>';

PANE.aigateway=function(){
  var live=AI.state==='live',ready=AI.state==='ready';
  var head='<div class="pane">'+
    '<h1>AI gateway</h1><p class="lead">The studio posts to <code>/api/ai/generate</code> on this domain, '+
    'which proxies to the Scen backend and picks a provider per feature. The session cookie is the only credential — '+
    'this page never sees a key.</p>';
  var status=!AI.enabled?['warn','Switched off','You turned live AI off in the composer. Everything is generated locally.']:
    live?['ok','Live','Answering requests.']:
    ready?['ok','Signed in','The gateway will be used on the next build.']:
    AI.state==='signedout'?['warn','Not signed in','The route returned 401. Sign in on Scen in this browser, then reload this page.']:
    AI.state==='offline'?['warn','Not reachable','No /api routes on this origin — that is expected when the file is opened on its own.']:
    AI.state==='error'?['warn','Error',AI.lastError]:['','Checking','Probing the session route.'];
  var rows=[
    ['Endpoint','<code>POST /api/ai/generate</code>'],
    ['Status','<span class="pill '+status[0]+'">'+esc(status[1])+'</span>'],
    ['Provider',AI.provider?esc(AI.provider):'—'],
    ['Model',AI.model?esc(AI.model):'—'],
    ['Requests this session',String(AI.requests)],
    ['Tokens in / out',AI.requests?AI.inTok.toLocaleString()+' / '+AI.outTok.toLocaleString():'—'],
    ['Estimated cost',AI.cost?'$'+AI.cost.toFixed(4):'—'],
    ['Last response',AI.lastMs?AI.lastMs+'ms':'—'],
    ['Last error',AI.lastError?'<span style="color:#ffcf87">'+esc(AI.lastError)+'</span>':'none'],
    ['Fell back from',AI.fell?'<span style="color:#ffcf87">'+esc(AI.fell)+'</span>':'nothing — the primary answered']
  ];
  var uses=[
    ['Page layout','<code>planning</code> — picks the sections for every page',!!S.brief.__plan],
    ['Written content','<code>chat</code> — kicker, headline, services, stats, FAQ, buttons',!!S.brief.__copy],
    ['Your change requests','<code>analysis</code> — turns a plain sentence into a change',AI.requests>0]
  ];
  return head+
    '<div class="info'+(status[0]==='warn'?' warn':'')+'"><em>'+(live||ready?'✦':'◐')+'</em><div><b>'+esc(status[1])+'</b>'+esc(status[2])+'</div></div>'+
    '<div class="spec">'+rows.map(function(r){
      return '<div class="row"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span></div>'}).join('')+'</div>'+
    '<h2>What it is used for</h2>'+
    '<div class="spec">'+uses.map(function(u){
      return '<div class="row"><span style="color:#d8d8e0">'+esc(u[0])+'</span>'+
        '<span style="color:#7d7d88;text-align:left;flex:1;margin-left:14px">'+u[1]+'</span>'+
        '<span class="pill'+(u[2]?' ok':'')+'">'+(u[2]?'used':'idle')+'</span></div>'}).join('')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn primary" data-act="aiTest">Send a test request</button>'+
      '<button class="btn" data-act="aiProbe">Re-check the session</button>'+
      '<button class="btn ghost" data-act="aiToggle">'+(AI.enabled?'Switch live AI off':'Switch live AI on')+'</button>'+
    '</div>'+
    '<p style="margin-top:14px;color:#7d7d88;font-size:12.5px">A failed call never blocks a build — the local writers '+
    'take over and the build log records which one produced the copy.</p></div>';
};

/* ---------- shared bits for the workspace panes ---------- */
function netState(name){
  if(API.busy[name])return '<div class="info"><em>◌</em><div><b>Loading…</b>Reading it from the workspace.</div></div>';
  if(API.err[name])return '<div class="info warn"><em>◐</em><div><b>Could not load</b>'+esc(API.err[name])+'</div></div>';
  return '';
}
function signedIn(){return !!(API.me&&API.me!==false)}
function signInBlock(what){
  return '<div class="info warn"><em>◐</em><div><b>Not signed in</b>'+esc(what)+
    ' needs a Scen session on this domain. <a href="/" style="color:var(--acid)">Sign in</a>, then come back and reload.</div></div>';
}
function listRows(rows,empty){
  if(!rows||!rows.length)return '<div class="info"><em>○</em><div><b>Nothing yet</b>'+esc(empty)+'</div></div>';
  return '<div class="spec">'+rows.map(function(r){
    return '<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'}).join('')+'</div>';
}
function when(v){
  if(!v)return '—';
  var d=new Date(v);if(isNaN(d))return esc(String(v)).slice(0,16);
  return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

PANE.git=function(){return simple('Git',

/* ============================================================
   The preset behind a Customize
   ------------------------------------------------------------
   Pressing Customize on a preset used to hand over a brief and nothing else:
   the studio opened on "Nothing to preview yet", and the build that followed
   was the agent's own layout, so the page the customer had actually chosen
   was never seen again. The preset is a real file, so it is fetched here —
   shown in the preview from the first second, and kept as the home page of
   the build. Everything the brief changes is a swap of something the preset
   already says: its name, its opening line, its accent. Nothing is added and
   no layout is touched, which is what keeps the design intact.
   ============================================================ */
var presetSrc='',presetState='';        /* '' | 'loading' | 'ready' | 'failed' */

function presetFile(){return (S.preset&&S.preset.file)||''}
function presetName(){return (S.preset&&S.preset.name)||'the preset'}

function loadPreset(then){
  var file=presetFile();
  if(!file||presetState==='loading'||presetState==='ready')return;
  presetState='loading';
  /* a preset can be a folder with an index.html in it as easily as one file */
  var tries=[file].concat(/\.html?$/i.test(file)?[]:[file.replace(/\/$/,'')+'/index.html']);
  if(/\.html$/i.test(file))tries.push(file.replace(/\.html$/i,'/index.html'));
  (function next(i){
    if(i>=tries.length){presetState='failed';if(then)then();return}
    fetch(tries[i],{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error(String(r.status));
      return r.text();
    }).then(function(txt){
      if(!/<\/html>/i.test(txt))throw new Error('not a page');
      /* A path with nothing behind it does not 404 here: the SPA rewrite hands
         back index.html with a 200, so an address that was never a preset came
         back as the whole workspace — and the preview then rendered the studio
         inside itself, over and over. A preset is a standalone page and never
         loads the app's bundles. */
      if(/assets\/js\/\d\d-/.test(txt)||/__SCEN_CORE/.test(txt))throw new Error('the app, not a preset');
      presetSrc=txt;presetState='ready';S.preset.file=tries[i];save();
      if(then)then();
    },function(){next(i+1)});
  })(0);
}

function rxEsc(x){return String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
/* Tags become spaces, not nothing: a title split across two block spans has
   no whitespace between them in the markup, and joining them would read as
   one word that matches nothing. */
function flat(html){return String(html==null?'':html)
  .replace(/<[^>]*>/g,' ').replace(/[\s\u00a0]+/g,' ').trim()}
function sameHex(a,b){return String(a||'').toLowerCase().replace('#','')===String(b||'').toLowerCase().replace('#','')}

/* A preset whose accent is its black or its white is using it for text and
   backgrounds, not as a colour — swapping that repaints the whole page. */
function tintable(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex||''))return false;
  var c=C.hexToRgb(hex),mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]);
  return (mx-mn)>40&&mx>40&&mn<236;
}
function recolour(src,from,to){
  var f=C.hexToRgb(from),t=C.hexToRgb(to),six=from.replace('#','');
  var out=src.replace(new RegExp(rxEsc(from),'gi'),to);
  if(six.length===6&&six[0]===six[1]&&six[2]===six[3]&&six[4]===six[5])
    out=out.replace(new RegExp('#'+six[0]+six[2]+six[4]+'\\b','gi'),to);
  /* the glows and shadows are usually written as rgb(), not as the hex */
  return out.replace(new RegExp('(rgba?\\()\\s*'+f[0]+'\\s*,\\s*'+f[1]+'\\s*,\\s*'+f[2],'g'),
    '$1'+t[0]+','+t[1]+','+t[2]);
}

/* the brand, wherever the preset writes it in words — never in its script */
function renameIn(doc,was,now){
  var rx=new RegExp('\\b'+rxEsc(was)+'\\b','g');
  var w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){
    var p=n.parentNode&&n.parentNode.nodeName;
    if(p==='SCRIPT'||p==='STYLE')continue;
    rx.lastIndex=0;
    if(rx.test(n.nodeValue)){rx.lastIndex=0;n.nodeValue=n.nodeValue.replace(rx,now)}
  }
}
/* New words into the element's existing text nodes rather than over its
   markup. Presets animate their titles one line or one word at a time, and
   replacing the innerHTML would throw away the spans those animations run on
   — the line would arrive unstyled, or not arrive at all. */
function fill(el,text){
  var w=el.ownerDocument.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),leaves=[],n;
  while((n=w.nextNode()))if(n.nodeValue&&n.nodeValue.trim())leaves.push(n);
  if(!leaves.length){el.textContent=text;return}
  var words=String(text||'').trim().split(/\s+/),per=Math.ceil(words.length/leaves.length),at=0;
  leaves.forEach(function(node,i){
    var take=(i===leaves.length-1)?words.slice(at):words.slice(at,at+per);
    at+=take.length;
    node.nodeValue=take.join(' ');
  });
}
/* Finds the element that carries a line the preset is known to open with —
   the wording in the file is rarely identical to the wording in the gallery,
   so the first few words decide it. */
/* the element that carries a line the preset is known to open with */
function pickLine(doc,was,sel){
  var want=flat(was).toLowerCase();
  if(!want)return null;
  var key=want.split(' ').slice(0,4).join(' ');
  var els=doc.querySelectorAll(sel),best=null,bestLen=1e9;
  for(var i=0;i<els.length;i++){
    var have=flat(els[i].innerHTML).toLowerCase();
    if(!have||els[i].querySelector('img,video,svg,a,button'))continue;
    var hit=have===want||have.indexOf(key)===0||
      (want.indexOf(have)===0&&have.length>14&&have.length>=want.length*0.4);
    if(!hit||have.length>want.length*3||have.length>=bestLen)continue;
    best=els[i];bestLen=have.length;
  }
  return best;
}
function swapLine(doc,was,now,sel){
  var want=flat(was).toLowerCase();
  if(!want||!String(now||'').trim())return false;
  var key=want.split(' ').slice(0,4).join(' ');
  var els=doc.querySelectorAll(sel),best=null,bestLen=1e9;
  for(var i=0;i<els.length;i++){
    var have=flat(els[i].innerHTML).toLowerCase();
    if(!have||els[i].querySelector('img,video,svg,a,button'))continue;
    /* the shorter-in-the-page case only counts when it is most of the line —
       a two-word kicker is not the paragraph the gallery quoted */
    var hit=have===want||have.indexOf(key)===0||
      (want.indexOf(have)===0&&have.length>14&&have.length>=want.length*0.4);
    /* A hero wrapper starts with its own title too, and matching it would
       scatter the new words across every line in the section. The shortest
       element that carries the line is the line. */
    if(!hit||have.length>want.length*3||have.length>=bestLen)continue;
    best=els[i];bestLen=have.length;
  }
  if(!best)return false;
  fill(best,now);
  return true;
}

/* What the preset actually says, so "change the Download button to Order now"
   can be checked against the page before it is believed. Returns the phrase in
   the preset's own casing, or '' when the page never says it. */
function presetSays(phrase){
  if(presetState!=='ready')return '';
  var want=String(phrase||'').toLowerCase().replace(/[\s\u00a0]+/g,' ').trim()
    .replace(/^(?:the|that)\s+/,'')
    .replace(/\s+(?:button|link|label|text|word|words|wording|heading|title|line)$/,'')
    .replace(/^["'\u201c\u2018]|["'\u201d\u2019]$/g,'').trim();
  if(want.length<2||want.length>60)return '';
  var doc=null;
  try{doc=new DOMParser().parseFromString(presetSrc,'text/html')}catch(e){}
  if(!doc||!doc.body)return '';
  var w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){
    var host=n.parentNode&&n.parentNode.nodeName;
    if(host==='SCRIPT'||host==='STYLE')continue;
    var said=String(n.nodeValue).replace(/[\s\u00a0]+/g,' ').trim();
    if(!said)continue;
    if(said.toLowerCase()===want)return said;
    /* a word inside a longer line still counts, as long as it is a whole word */
    if(want.split(' ').length<=4&&new RegExp('(^|\\s)'+rxEsc(want)+'($|[\\s.,!?])','i').test(said)){
      var m=said.match(new RegExp(rxEsc(want),'i'));
      if(m)return m[0];
    }
  }
  return '';
}
/* the swaps the customer asked for by name, kept on the brief so they survive
   a rebuild and a reload */
function replaceWords(doc,pairs){
  pairs.forEach(function(pair){
    var rx=new RegExp(rxEsc(pair[0]),'g');
    var w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null),n;
    while((n=w.nextNode())){
      var host=n.parentNode&&n.parentNode.nodeName;
      if(host==='SCRIPT'||host==='STYLE')continue;
      rx.lastIndex=0;
      if(rx.test(n.nodeValue)){rx.lastIndex=0;n.nodeValue=n.nodeValue.replace(rx,pair[1])}
    }
  });
}

/* Does the preset have one of these at all? Asked before an instruction is
   accepted, so the studio never reports changing a video a page does not have. */
function presetHas(sel){
  if(presetState!=='ready')return false;
  var doc=null;
  try{doc=new DOMParser().parseFromString(presetSrc,'text/html')}catch(e){}
  return !!(doc&&doc.body&&doc.body.querySelector(sel));
}
/* the smallest element that says exactly this */
function findPhrase(doc,phrase){
  var want=flat(phrase).toLowerCase();
  if(!want)return null;
  var els=doc.body.querySelectorAll('*'),best=null,bestLen=1e9;
  for(var i=0;i<els.length;i++){
    var have=flat(els[i].innerHTML).toLowerCase();
    if(have!==want||have.length>=bestLen)continue;
    best=els[i];bestLen=have.length;
  }
  return best;
}
/* Point the preset's own words at an address. An anchor already around them is
   re-pointed; anything else is wrapped, inheriting its colour and weight so the
   design does not suddenly grow a blue underline. */
function applyLinks(doc,list){
  list.forEach(function(pair){
    var el=findPhrase(doc,pair[0]);if(!el)return;
    var a=el.closest?el.closest('a'):null;
    if(!a){
      a=doc.createElement('a');
      a.style.cssText='color:inherit;text-decoration:none;font:inherit';
      while(el.firstChild)a.appendChild(el.firstChild);
      el.appendChild(a);
    }
    a.setAttribute('href',pair[1]);
    if(/^https?:/i.test(pair[1])){a.setAttribute('target','_blank');a.setAttribute('rel','noopener')}
    else{a.removeAttribute('target');a.removeAttribute('rel')}
  });
}
/* The film and the photographs. Same element, new source — nothing about the
   layout, the scrubbing or the filters changes. */
function applyMedia(doc,list){
  list.forEach(function(m){
    if(m.kind==='video'){
      var v=doc.querySelector('video');if(!v)return;
      v.setAttribute('src',m.url);
      var srcs=v.querySelectorAll('source');
      for(var i=0;i<srcs.length;i++)srcs[i].setAttribute('src',i?'':m.url);
      for(var j=srcs.length-1;j>0;j--)srcs[j].parentNode.removeChild(srcs[j]);
    }else{
      var img=doc.querySelector('img');if(!img)return;
      img.setAttribute('src',m.url);
      img.removeAttribute('srcset');
    }
  });
}
/* Menu items in the preset's own top bar. Appended to the header it already
   has, inheriting its type — a row of links, not a second navigation. */
function applyMenu(doc,items){
  var host=doc.querySelector('header')||doc.querySelector('[class*=nav]')||doc.querySelector('[class*=header]');
  if(!host||!items.length)return;
  var old=host.querySelector('[data-scen-menu]');
  if(old)old.parentNode.removeChild(old);
  var nav=doc.createElement('nav');
  nav.setAttribute('data-scen-menu','');
  nav.style.cssText='display:flex;gap:16px;align-items:center;font:inherit;margin:0 14px;flex-wrap:wrap';
  items.forEach(function(label){
    var a=doc.createElement('a');
    a.setAttribute('href',menuHref(label));
    a.style.cssText='color:inherit;text-decoration:none;font:inherit;opacity:.82;white-space:nowrap';
    a.textContent=label;
    nav.appendChild(a);
  });
  /* after the first group, so a two-ended header keeps its shape */
  if(host.children.length>1)host.insertBefore(nav,host.children[1]);
  else host.appendChild(nav);
}
function menuHref(label){
  var pages=S.brief.pages||[];
  for(var i=0;i<pages.length;i++)
    if(String(pages[i]).toLowerCase()===String(label).toLowerCase())return G.pageFile(pages[i]);
  return '#';
}

/* The parts of a preset worth naming in a sentence. Marked once, so a style
   rule can point at "the title" without knowing which template is open. */
function tagParts(doc,P){
  function mark(el,name){if(el&&!el.getAttribute('data-scen'))el.setAttribute('data-scen',name)}
  if(P.title)mark(pickLine(doc,P.title,'h1,h2,h3,.title,[class*=title],[class*=hero]'),'title');
  if(P.subtitle)mark(pickLine(doc,P.subtitle,'p,[class*=micro],[class*=sub],[class*=lead],[class*=copy]'),'text');
  if(P.name){
    var brand=findPhrase(doc,P.name)||findPhrase(doc,S.brief.name||'');
    mark(brand,'brand');
  }
}
/* Overrides, appended last so they win without touching a line the designer
   wrote. zoom rather than a font-size: the preset sizes its type in clamp()
   and vw, and multiplying that keeps it responsive. */
function styleCss(map){
  var out='';
  Object.keys(map).forEach(function(k){
    var v=map[k]||{},sel=k==='page'?'body':'[data-scen="'+k+'"]',d='';
    if(v.zoom)d+='zoom:'+v.zoom+';';
    if(v.color)d+='color:'+v.color+';';
    if(v.weight)d+='font-weight:'+v.weight+';';
    if(v.font)d+='font-family:'+v.font+';';
    if(v.track)d+='letter-spacing:'+v.track+';';
    if(v.transform)d+='text-transform:'+v.transform+';';
    if(v.dy)d+='margin-top:'+v.dy+';';
    if(v.align){
      d+='text-align:'+v.align+';';
      if(v.align==='center')d+='left:0;right:0;margin-left:auto;margin-right:auto;max-width:none;';
      else if(v.align==='left')d+='left:5vw;right:auto;';
      else d+='right:5vw;left:auto;';
    }
    if(d)out+=sel+'{'+d.replace(/;/g,' !important;')+'}\n';
  });
  return out;
}
/* A real 3D model on the preset, loaded by <model-viewer>. The customer brings
   the .glb; nothing here generates one. */
function applyObject(doc,obj){
  if(!obj||!obj.url)return;
  var head=doc.head||doc.documentElement;
  if(!head.querySelector('script[data-scen-mv]')){
    var sc=doc.createElement('script');
    sc.type='module';sc.setAttribute('data-scen-mv','');
    sc.src='https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js';
    head.appendChild(sc);
  }
  var mv=doc.querySelector('model-viewer[data-scen]');
  if(!mv){
    mv=doc.createElement('model-viewer');
    mv.setAttribute('data-scen','object');
    mv.setAttribute('camera-controls','');
    mv.setAttribute('auto-rotate','');
    mv.setAttribute('disable-zoom','');
    mv.setAttribute('shadow-intensity','1');
    mv.setAttribute('alt','3D object');
    mv.style.cssText='position:fixed;z-index:6;right:5vw;bottom:8vh;'+
      'width:min(38vw,420px);height:min(38vw,420px);background:transparent';
    doc.body.appendChild(mv);
  }
  mv.setAttribute('src',obj.url);
}

function presetPage(){
  if(presetState!=='ready'||!S.preset)return '';
  /* marked so the preview can inject its bridge into this page too */
  var P=S.preset,b=S.brief,src=presetSrc;
  if(P.accent&&b.accent&&!sameHex(P.accent,b.accent)&&tintable(P.accent))
    src=recolour(src,P.accent,b.accent);
  var doc=null;
  try{doc=new DOMParser().parseFromString(src,'text/html')}catch(e){}
  if(!doc||!doc.body)return src;
  var name=b.name||P.name;
  /* Only what the customer has actually changed is overwritten. Until they
     rename it, the preset keeps its own title and its own opening line —
     which is the page they were shown in the gallery, exactly. */
  if(name&&P.name&&name!==P.name){
    var t=doc.querySelector('title');
    if(t)t.textContent=name+(b.pitch?' — '+String(b.pitch).split(/[.—–]/)[0].trim().slice(0,60):'');
    renameIn(doc,P.name,name);
    if(P.title)swapLine(doc,P.title,name,'h1,h2,h3,.title,[class*=title],[class*=hero]');
  }
  if(b.pitch&&P.subtitle&&flat(b.pitch)!==flat(P.subtitle))
    swapLine(doc,P.subtitle,b.pitch,'p,[class*=micro],[class*=sub],[class*=lead],[class*=copy]');
  if(b.__words&&b.__words.length)replaceWords(doc,b.__words);
  if(b.__links&&b.__links.length)applyLinks(doc,b.__links);
  if(b.__media&&b.__media.length)applyMedia(doc,b.__media);
  if(b.__menu&&b.__menu.length)applyMenu(doc,b.__menu);
  if(b.__object)applyObject(doc,b.__object);
  tagParts(doc,P);
  if(b.__style&&Object.keys(b.__style).length){
    var css=styleCss(b.__style);
    if(css){
      var st=doc.createElement('style');
      st.setAttribute('data-scen-css','');
      st.textContent=css;
      (doc.head||doc.documentElement).appendChild(st);
    }
  }
  return '<!doctype html>\n'+doc.documentElement.outerHTML;
}

/* The build. When a preset was the starting point it stays the home page,
   carrying the brief, and the agent's own pages are built around it. */
var builtHome='';        /* the preset page as the current build has it */
/* Words the client changed by pointing at them, applied to every page after
   it is generated — the generator writes from the copy pack, so this is the
   only place a one-off correction can live. */
function applyTextEdits(g){
  var pairs=(S.brief.__text||[]);
  if(!pairs.length)return;
  g.files.forEach(function(f){
    if(f.lang!=='html')return;
    pairs.forEach(function(pr){
      f.body=f.body.split('>'+pr[0]+'<').join('>'+pr[1]+'<');
      f.body=f.body.split('>'+pr[0]).join('>'+pr[1]);
    });
  });
  ((g.site&&g.site.pages)||[]).forEach(function(p){
    pairs.forEach(function(pr){
      p.html=p.html.split('>'+pr[0]+'<').join('>'+pr[1]+'<');
      p.html=p.html.split('>'+pr[0]).join('>'+pr[1]);
    });
  });
}
function buildFiles(){
  var g=G.generate(S.brief,S.depth),home=presetPage();
  builtHome=home;
  if(home){
    g.files.forEach(function(f){if(f.path==='site/index.html')f.body=home});
    ((g.site&&g.site.pages)||[]).forEach(function(p){if(p.file==='site/index.html')p.html=home});
  }
  applyTextEdits(g);
  return g;
}

function presetHome(){return !!presetFile()&&presetState==='ready'}

/* The site starts drawing while the questions are still going. Once the brief
   carries enough to compose something, every answer redraws it in the preview —
   so a client watches the site appear instead of waiting for a button. */
var draftSig='';
function maybeDraft(){
  if(S.built||S.phase==='building')return;
  if(!haveEnough(S.brief))return;
  var b=S.brief;
  var sig=[b.name,b.industry,b.style,b.accent,b.motion,S.depth,b.__bg,b.__dir,(b.pages||[]).join(),(b.features||[]).join(),(b.__onepage||[]).join(),
    b.__ui?[b.__ui.display,b.__ui.body,b.__ui.radius,b.__ui.heroAlign,b.__ui.density,b.__ui.caps,b.__ui.surface,b.__ui.hero].join('|'):'',
    b.__heroImage?'img':'',
    b.__fixCss?String(b.__fixCss).length:''].join('\u0000');
  if(sig===draftSig)return;
  draftSig=sig;
  try{
    gen=buildFiles();
    S.files=gen.files.map(function(f){return f.path});
    if(S.files.indexOf(S.file)<0)S.file=S.files[0];
    if(S.tab==='preview')renderMain();
    else if(!S.__draftSeen){$('#prevBadge').classList.remove('hidden')}
    S.__draftSeen=true;
  }catch(e){}
}

/* The preview follows the conversation: every answer that changes the name,
   the line or the colour is repainted into the preset straight away. */
var previewSig='';
function briefSig(){
  var b=S.brief;
  /* everything the preset page reads: what it is called, what it says, its
     colour, and the edits made to its own words, links, film and top bar */
  return [b.name,b.pitch,b.accent,
    JSON.stringify(b.__words||''),JSON.stringify(b.__links||''),
    JSON.stringify(b.__media||''),JSON.stringify(b.__menu||''),
    JSON.stringify(b.__style||''),JSON.stringify(b.__object||'')].join('\u0000');
}
function syncPreview(){
  if(gen||presetState!=='ready')return;
  var sig=briefSig();
  if(sig===previewSig)return;
  previewSig=sig;
  var f=$('#prevFrame');
  if(f&&S.tab==='preview')f.srcdoc=currentDoc();
}

    }).join('')+'</select>'))+

    (appMode?'<span class="pill">390 × 844</span>':

    '<button class="btn sm'+(S.picking?' on':'')+'" data-act="pick" title="Click something in the page and tell me what to change">'+

/* Everything shown in the preview carries the bridge, including a preset page,
   which has no app.js line for previewDoc() to hang it on. */
function withBridge(html){
  if(!html)return html;
  if(html.indexOf('scenPicked')>=0)return html;
  return html.replace(/<\/body>/i,G.bridge()+'</body>');
}
function currentDoc(){
  /* A preset stays on screen until the build is real. Drawing the draft over
     it took away the whole point of pressing Customize: the page they chose
     disappeared a second after it arrived, replaced by a rough version of the
     same home page. The draft still exists for the other pages and the files. */
  if(!S.built&&presetHome()&&(!S.file||S.file==='site/index.html'))return withBridge(presetPage());
  if(!gen)return withBridge(presetPage());
  if(S.previewKind==='app')return G.appPreviewDoc(S.brief);
  var file=S.file&&/^site\/.*\.html$/.test(S.file)?S.file:'site/index.html';
  return G.previewDoc(gen,file);
}
function bindPreview(){
  var f=$('#prevFrame');if(!f)return;
  f.srcdoc=currentDoc();
  f.addEventListener('load',function(){
    try{f.contentWindow.postMessage({scenPick:!!S.picking},'*')}catch(e){}
  });
  var sel=$('#pageSel');
  if(sel)sel.addEventListener('change',function(){S.file=sel.value;save();$('#prevFrame').srcdoc=currentDoc()});
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.scenPicked){
    var p=e.data.scenPicked;
    if(!p.text)return;
    S.pick=p.text;
    /* Selecting stays on until something is picked, then stops: leaving it on
       turned the next click into another selection and the next sentence into
       replacement text for whatever was under the cursor. */
    S.picking=false;save();
    var fr0=$('#prevFrame');
    if(fr0&&fr0.contentWindow)fr0.contentWindow.postMessage({scenPick:false},'*');
    if(S.tab==='preview')renderMain();
    showPick();
    agentSay(L('Selected — “<b>'+esc(p.text)+'</b>”. Tell me what it should say, or what to change about it.',
               '“<b>'+esc(p.text)+'</b>” chun liya. Bolo isme kya likhna hai ya kya badalna hai.'));
    input.focus();
    return;
  }
  if(!e.data||!e.data.scenNav||!gen)return;
  var path='site/'+e.data.scenNav;
  if(S.files.indexOf(path)<0)return;
  S.file=path;save();
  if(S.tab==='preview')renderMain();
});

/* code pane */
function hl(code){
  var s=esc(code);
  return s.replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/|(?:^|\s)\/\/[^\n]*)|(&quot;[^&\n]*?&quot;|&#39;[^&\n]*?&#39;)|(&lt;\/?[a-zA-Z][\w-]*)|\b(function|return|const|var|let|if|else|import|export|from|new|default|StyleSheet)\b/g,
    function(m,c,str,tag,kw){
      if(c)return '<span class="c">'+c+'</span>';
      if(str)return '<span class="s">'+str+'</span>';
      if(tag)return '<span class="t">'+tag+'</span>';
      return '<span class="k">'+kw+'</span>';
    });
}
function paneCode(){
  if(!gen)return '<div class="empty"><div><div class="orb"></div><h2>No source yet</h2>'+
    '<p>The agent writes real files during the build — HTML, CSS, JS and the app screens. They open here.</p></div></div>';
  var groups={};
  gen.files.forEach(function(f){
    var dir=f.path.indexOf('/')>0?f.path.split('/')[0]:'root';
    (groups[dir]=groups[dir]||[]).push(f)});
  var cur=gen.files.filter(function(f){return f.path===S.file})[0]||gen.files[0];
  S.file=cur.path;
  var tree='';
  Object.keys(groups).forEach(function(d){
    tree+='<div class="ftfolder">'+esc(d==='root'?'project':d+'/')+'</div>';
    groups[d].forEach(function(f){
      var icon={html:'◧',css:'◈',js:'⚙',jsx:'⚛',json:'{}',md:'¶'}[f.lang]||'·';
      tree+='<button class="file'+(f.path===cur.path?' on':'')+'" data-path="'+esc(f.path)+'">'+
        '<em>'+icon+'</em>'+esc(f.path.split('/').pop())+'<span class="sz">'+bytes(f.body.length)+'</span></button>';
    });
  });
  return '<div class="code-shell"><div class="filetree">'+tree+'</div>'+
    '<div class="codewrap"><div class="codebar"><span class="path">'+esc(cur.path)+'</span>'+
    '<span class="pill">'+cur.body.split('\n').length+' lines</span><span class="grow"></span>'+
    '<button class="btn sm" data-act="copy">Copy</button>'+
    '<button class="btn sm" data-act="dl">Download</button>'+
    '<button class="btn sm ghost" data-act="dlAll">All files</button></div>'+
    '<pre class="code">'+hl(cur.body)+'</pre></div></div>';
}
/* one delegated handler for the whole main pane — renderMain() replaces its
   innerHTML constantly, so per-render listeners would stack up */
$('#mainPane').addEventListener('click',function(e){
  var f=e.target.closest('.file');
  if(f){S.file=f.dataset.path;save();renderMain();return}
  var t=e.target.closest('button[data-act], button[data-page], button[data-pk], button[data-dev]');
  if(!t)return;
  var a=t.dataset.act;
  if(t.dataset.pk){S.previewKind=t.dataset.pk;save();return renderMain()}
  if(t.dataset.dev){S.device=t.dataset.dev;save();return renderMain()}
  if(t.dataset.page){S.previewKind='site';S.file='site/'+G.pageFile(t.dataset.page);return setTab('preview')}
  if(a==='pick'){
    S.picking=!S.picking;save();
    var fr=$('#prevFrame');
    if(fr&&fr.contentWindow)fr.contentWindow.postMessage({scenPick:S.picking},'*');
    renderMain();
    return toast(S.picking?L('Click anything in the page','Page mein kuch bhi click karo')
                          :L('Selecting off','Select band'));
  }
  if(a==='reload'){$('#prevFrame').srcdoc=currentDoc();return toast('Preview reloaded')}
  if(a==='newtab'){
    var blob=new Blob([currentDoc()],{type:'text/html'});
    return window.open(URL.createObjectURL(blob),'_blank');
  }
  if(a==='dlAll')return downloadAll();
  if(a==='openCode')return setTab('code');
  if(a==='publish')return publishFlow();
  if(a==='saveProject')return saveProjectFlow(t);
  if(a==='addDomain')return addDomainFlow(t);
  if(a==='signOut')return signOutFlow(t);
  if(a==='revokeOthers')return revokeFlow(t);
  if(a==='heroClear'){delete S.brief.__heroImage;save();rebuild('Put the gradient art back in the hero.');return renderMain()}
  if(a==='heroImage')return heroImageFlow(t);
  if(a==='aiToggle'){AI.enabled=!AI.enabled;setAiPill();renderMain();
    return toast(AI.enabled?'Live AI on for the next build':'Live AI off — local writers only')}
  if(a==='aiProbe'){toast('Re-checking…');return X.probe().then(function(){setAiPill();renderMain()})}
  if(a==='aiTest'){
    t.disabled=true;t.textContent='Sending…';
    return X.test().then(function(r){
      setAiPill();renderMain();
      toast(r.ok?'Gateway answered in '+r.ms+'ms — '+r.provider+' · '+r.model:'Gateway failed: '+r.error);
    });
  }
  if(!gen)return;
  var cur=gen.files.filter(function(x){return x.path===S.file})[0];
  if(!cur)return;
  if(a==='copy')navigator.clipboard.writeText(cur.body).then(
    function(){toast('Copied '+cur.path)},function(){toast('Clipboard blocked — use Download')});
  if(a==='dl')download(cur.path.split('/').pop(),cur.body);
});
