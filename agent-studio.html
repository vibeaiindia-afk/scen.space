<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scen Agent Studio — brief → plan → build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507;--panel:#0d0d12;--panel2:#13131a;--ink:#f7f7f4;--muted:#9a9aa7;--line:rgba(255,255,255,.105);
  --acid:#dfff45;--cyan:#7beeff;--violet:#7d6cff;--coral:#ff6b64;--cream:#f4f0df;--danger:#ff7676;--ok:#7ee787;
  --topbar:56px;--rail:52px;--chat:400px;--tools:236px;--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--acid);color:#0b0b0d}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#22222b;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#33333f;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}.muted{color:var(--muted)}.grow{flex:1}
.caps{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6d6d78;font-weight:600}
.tiny{font-size:11.5px}.small{font-size:12.5px}

/* ---------- shared controls ---------- */
.btn{border:1px solid var(--line);background:#141419;color:#f5f5f2;padding:7px 13px;border-radius:10px;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;font-size:13px;transition:.16s ease;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.24);background:#1a1a21}
.btn.primary{background:var(--acid);color:#090a08;border-color:var(--acid);font-weight:700}
.btn.primary:hover{background:#e8ff6a}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.42;pointer-events:none}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#8b8b96;transition:.16s}
.ico:hover{background:#17171e;color:#fff}
.pill{padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:#b9b9c2;background:rgba(255,255,255,.035);white-space:nowrap}
.pill.acid{border-color:rgba(223,255,69,.4);color:var(--acid);background:rgba(223,255,69,.08)}
.pill.warn{border-color:rgba(255,190,90,.35);color:#ffcf87;background:rgba(255,190,90,.07)}
.pill.ok{border-color:rgba(126,231,135,.32);color:var(--ok);background:rgba(126,231,135,.07)}
button.pill{font:inherit;font-size:11px;cursor:pointer;transition:.16s}
button.pill:hover{border-color:rgba(255,255,255,.28);color:#fff}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid);flex:0 0 auto}
.dot.idle{background:#4b4b57;box-shadow:none}

/* ---------- app frame ---------- */
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--line);background:#08080b;position:relative;z-index:20}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px}
.tb-right{margin-left:auto}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.04em;padding-right:4px}
.logo b{text-transform:lowercase;font-size:16px;
  background:linear-gradient(180deg,#fff 0%,#e7edf1 34%,#9aa6ae 52%,#f4f8fa 66%,#aab5bd 86%,#79848c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo-mark{width:24px;height:24px;flex:0 0 auto;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22p%22%20x1%3D%220.1%22%20y1%3D%220%22%20x2%3D%220.9%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238dff5e%22%2F%3E%3Cstop%20offset%3D%22.38%22%20stop-color%3D%22%2325c455%22%2F%3E%3Cstop%20offset%3D%22.78%22%20stop-color%3D%22%230a7a32%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23053b18%22%2F%3E%3C%2FlinearGradient%3E%3Cpath%20id%3D%22pet%22%20d%3D%22M53%2053C51%2033%2061%2016%2084%209c7%2022%200%2040-19%2049-5%202-10%201-12-5Z%22%2F%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22url%28%23p%29%22%3E%3Cuse%20href%3D%22%23pet%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%2890%2050%2050%29%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%28180%2050%2050%29%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%28270%2050%2050%29%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/contain no-repeat;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo-mark{animation:none}}
.proj{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;font-size:13px;color:#d6d6de;max-width:220px}
.proj:hover{background:#15151c}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj i{font-style:normal;color:#6f6f7a;font-size:11px}
.seg{display:flex;background:#101016;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;margin-left:4px}
.seg button{padding:5px 13px;border-radius:8px;font-size:12.5px;color:#8d8d99;transition:.16s}
.seg button.on{background:#20202a;color:#fff}
.seg button:hover:not(.on){color:#d5d5de}
.tab{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;font-size:13px;color:#8d8d99;transition:.16s}
.tab:hover{color:#e2e2e8;background:#141419}
.tab.on{color:#fff;background:#17171f;box-shadow:inset 0 0 0 1px var(--line)}
.tab em{font-style:normal;opacity:.85}
.tab .badge{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 8px var(--acid)}

.shell{flex:1;min-height:0;display:flex}

/* ---------- left rail ---------- */
.rail{width:var(--rail);flex:0 0 auto;border-right:1px solid var(--line);background:#08080b;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0}
.rail button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#6c6c78;font-size:16px;transition:.16s;position:relative}
.rail button:hover{background:#15151c;color:#e6e6ec}
.rail button.on{background:#191921;color:var(--acid);box-shadow:inset 0 0 0 1px rgba(223,255,69,.25)}

/* ---------- chat panel ---------- */
.chat{width:var(--chat);flex:0 0 auto;border-right:1px solid var(--line);background:#0a0a0e;display:flex;flex-direction:column;min-width:0}
.chat-head{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 8px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{width:7px}

.msg{margin-bottom:18px;animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:rgba(223,255,69,.09);border:1px solid rgba(223,255,69,.2);color:#f2f6dd;
  padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:86%;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.agent .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg.agent .who b{font-size:12px;font-weight:600;color:#c9c9d2;letter-spacing:-.01em}
.avatar{width:20px;height:20px;border-radius:7px;flex:0 0 auto;
  background:conic-gradient(from 210deg,#dfff45,#7beeff,#7d6cff,#dfff45);
  box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.avatar.thinking{animation:pulseAv 1.15s ease-in-out infinite}
@keyframes pulseAv{50%{filter:brightness(1.5) saturate(1.3)}}
.msg.agent .text{font-size:13.7px;line-height:1.62;color:#dcdce3;white-space:pre-wrap;word-break:break-word}
.msg.agent .text b{color:#fff;font-weight:600}
.msg.agent .text code{background:#16161d;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px;color:var(--cyan)}
.msg.agent .text ul{margin:8px 0 0;padding-left:17px}
.msg.agent .text li{margin-bottom:4px}
.msg .worked{display:flex;align-items:center;gap:8px;margin-top:11px;color:#5f5f6a;font-size:11.5px}
.msg .worked .ring{width:15px;height:15px;border-radius:50%;border:1.5px solid #2a2a34;border-top-color:#6e6e7c}
.msg .worked.run .ring{animation:spin .8s linear infinite}

.typing{display:inline-flex;gap:4px;align-items:center;height:16px}
.typing i{width:5px;height:5px;border-radius:50%;background:#5c5c68;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* answer chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips button{border:1px solid #23232c;background:#101016;color:#b6b6c1;border-radius:999px;padding:7px 12px;font-size:12.5px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.chips button:hover{border-color:rgba(223,255,69,.45);color:#fff;background:rgba(223,255,69,.07)}
.chips button.on{border-color:var(--acid);color:var(--acid);background:rgba(223,255,69,.1)}
.chips button.on:before{content:"✓";font-size:10px}
.chips .sw{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.chips-go{display:flex;align-items:center;gap:9px;margin-top:11px}
.chips-go .hint{font-size:11.5px;color:#5f5f6a}
.skip{color:#6e6e7a;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.skip:hover{color:#b9b9c4}

/* attachments */
.att-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.att{width:62px;height:62px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:#111117}
.att-strip{display:flex;gap:7px;flex-wrap:wrap;padding:0 2px 9px}
.att-strip .a{position:relative}
.att-strip img{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--line);display:block}
.att-strip .x{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:#1c1c24;
  border:1px solid #33333e;color:#c9c9d2;font-size:10px;display:grid;place-items:center}

/* composer */
.composer{flex:0 0 auto;padding:10px 14px 14px;border-top:1px solid var(--line);background:#0a0a0e}
.comp-box{border:1px solid #22222b;background:#101016;border-radius:15px;padding:9px 10px 8px;transition:.18s}
.comp-box:focus-within{border-color:rgba(223,255,69,.42);box-shadow:0 0 0 3px rgba(223,255,69,.06)}
.comp-box textarea{width:100%;background:transparent;border:0;outline:0;resize:none;min-height:44px;max-height:150px;
  font-size:13.5px;line-height:1.55;padding:3px 4px}
.comp-box textarea::placeholder{color:#5e5e6a}
.comp-bar{display:flex;align-items:center;gap:6px;padding-top:5px}
.comp-bar .ico{width:29px;height:29px;font-size:14px}
.mini{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;font-size:11.5px;color:#8d8d99;transition:.15s}
.mini:hover{background:#17171e;color:#dcdce3}
.mini.on{background:rgba(223,255,69,.1);color:var(--acid);box-shadow:inset 0 0 0 1px rgba(223,255,69,.28)}
.mini i{font-style:normal;font-size:10px;opacity:.7}
.send{width:30px;height:30px;border-radius:9px;background:var(--acid);color:#090a08;display:grid;place-items:center;
  font-weight:800;font-size:14px;transition:.16s}
.send[disabled]{background:#1c1c24;color:#5a5a66;pointer-events:none}
.send:hover{transform:translateY(-1px)}
.note{font-size:11px;color:#5b5b66;text-align:center;padding:9px 6px 0;line-height:1.5}

/* build stream in the chat column */
.stream{padding:16px}
.stream .caps{margin-bottom:12px;display:block}
.step{display:flex;gap:11px;padding:8px 0;font-size:12.8px;color:#7e7e8a;position:relative}
.step:before{content:"";position:absolute;left:8.5px;top:26px;bottom:-8px;width:1px;background:#1e1e26}
.step:last-child:before{display:none}
.step .mark{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:1.5px solid #26262f;display:grid;place-items:center;font-size:9px;background:#0a0a0e;margin-top:1px}
.step.run .mark{border-color:var(--acid);border-top-color:transparent;animation:spin .75s linear infinite}
.step.run{color:#e9e9ef}
.step.done .mark{border-color:rgba(126,231,135,.5);color:var(--ok);background:rgba(126,231,135,.09)}
.step.done{color:#a6a6b2}
.step .ms{margin-left:auto;font-size:11px;color:#4f4f5a;font-variant-numeric:tabular-nums}
.step .sub{display:block;color:#5c5c67;font-size:11.5px;margin-top:2px}

/* ---------- tools column ---------- */
.tools{width:var(--tools);flex:0 0 auto;border-right:1px solid var(--line);background:#08080b;overflow-y:auto;padding:14px 10px}
.tools .caps{padding:0 8px;margin:14px 0 7px;display:block}
.tools .caps:first-child{margin-top:0}
.tool{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:10px;font-size:13px;color:#9d9da8;transition:.14s;text-align:left}
.modeRow{display:flex;gap:3px;padding:3px;border:1px solid #1e1e26;border-radius:10px;background:#0b0b0f;margin:0 0 12px}
.modeRow button{flex:1;padding:6px 5px;border-radius:7px;font-size:11px;font-weight:700;color:#7d7d88;transition:.14s}
.modeRow button.on{background:#17171e;color:#fff}
.toolAdv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;margin-top:12px;border-top:1px solid #1a1a22;
  border-radius:0 0 10px 10px;font-size:13px;color:#7f7f8a;text-align:left;transition:.14s}
.toolAdv:hover{color:#fff}
.toolAdv .cnt{margin-left:auto;font-size:10px;color:#5d5d67}
.tool:hover{background:#101017;color:#e6e6ec}
.tool.on{background:#15151c;color:#fff}
.tool em{font-style:normal;width:16px;text-align:center;opacity:.9;font-size:13px}
.tool .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;color:#5a5a65;text-transform:uppercase}
.tool .tag.live{color:var(--acid)}
.tool .cnt{margin-left:auto;font-size:10.5px;color:#5a5a65;font-variant-numeric:tabular-nums}

/* ---------- main pane ---------- */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--bg);position:relative}
.pane{padding:26px 30px 60px;max-width:1000px}
.pane.wide{max-width:none}
.pane h1{font-size:27px;letter-spacing:-.035em;margin:0 0 6px;font-weight:650}
.pane>p.lead{color:#8c8c98;margin:0 0 22px;font-size:13.5px;line-height:1.6;max-width:640px}
.pane h2{font-size:15px;margin:26px 0 11px;letter-spacing:-.02em;font-weight:600}
.info{display:flex;gap:11px;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:#0e0e13;
  font-size:12.8px;line-height:1.55;color:#a4a4b0;margin-bottom:20px}
.info em{font-style:normal;font-size:14px;line-height:1.2}
.info b{color:#e4e4ea;display:block;margin-bottom:3px;font-weight:600}
.info.warn{border-color:rgba(255,190,90,.22);background:rgba(255,190,90,.045)}

.empty{display:grid;place-items:center;min-height:65vh;text-align:center;padding:30px}
.empty .orb{width:88px;height:88px;border-radius:50%;margin:0 auto 20px;
  background:radial-gradient(circle at 32% 28%,#fff 0 2%,#e8ff99 5%,#6d7e20 15%,#222516 36%,#090a08 66%,#020203 80%);
  box-shadow:0 0 50px rgba(223,255,69,.22),0 0 110px rgba(123,238,255,.08);animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-11px) rotate(8deg)}}
.empty h2{font-size:21px;margin:0 0 8px;letter-spacing:-.03em}
.empty p{color:#7d7d89;max-width:400px;margin:0 auto;line-height:1.6;font-size:13px}

/* brief */
.meter{height:4px;border-radius:99px;background:#17171e;overflow:hidden;margin:4px 0 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--cyan));transition:width .5s cubic-bezier(.2,.7,.3,1)}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.bcard{padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#0c0c11;min-height:78px;transition:.2s}
.bcard.filled{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border-color:rgba(255,255,255,.14)}
.bcard .k{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.bcard .v{font-size:13.5px;color:#eaeaf0;line-height:1.5;word-break:break-word}
.bcard .v.none{color:#4e4e59;font-style:italic}
.bcard .v .tk{display:inline-block;background:#16161d;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11.5px;margin:0 4px 4px 0;color:#c3c3cc}
.swatch{width:15px;height:15px;border-radius:5px;display:inline-block;vertical-align:-3px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.16)}

/* plan */
.plan-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;align-items:start}
@media (max-width:1180px){.plan-grid{grid-template-columns:1fr}}
.page-row{border:1px solid var(--line);border-radius:13px;background:#0c0c11;margin-bottom:9px;overflow:hidden}
.page-row>button{width:100%;display:flex;align-items:center;gap:11px;padding:13px 15px;text-align:left}
.page-row>button:hover{background:#101017}
.page-row .num{width:22px;height:22px;border-radius:7px;background:#16161d;display:grid;place-items:center;
  font-size:10.5px;color:#8b8b96;flex:0 0 auto;font-variant-numeric:tabular-nums}
.page-row b{font-size:13.5px;font-weight:600}
.page-row .cnt{margin-left:auto;font-size:11px;color:#5f5f6a}
.page-row .secs{padding:0 15px 13px 48px;display:flex;flex-wrap:wrap;gap:6px}
.page-row .secs span{font-size:11.5px;color:#9c9ca7;border:1px solid var(--line);background:#101016;border-radius:7px;padding:3px 8px}
.spec{padding:15px;border-radius:13px;border:1px solid var(--line);background:#0c0c11;margin-bottom:11px}
.spec .row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.8px;border-bottom:1px solid rgba(255,255,255,.05)}
.spec .row:last-child{border-bottom:0}
.spec .row span:first-child{color:#797984}
.spec .row span:last-child{margin-left:auto;color:#e6e6ec;text-align:right}

/* files + code */
.code-shell{display:grid;grid-template-columns:246px 1fr;height:calc(100vh - var(--topbar));border-top:0}
.filetree{border-right:1px solid var(--line);overflow-y:auto;padding:14px 9px;background:#08080b}
.ftfolder{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#5c5c67;padding:11px 9px 5px}
.file{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:8px;font-size:12.5px;color:#94949f;text-align:left;transition:.14s}
.file:hover{background:#101017;color:#dedee6}
.file.on{background:#16161d;color:#fff}
.file em{font-style:normal;font-size:11px;opacity:.8;width:14px}

var TEMPLATE_SEEDS={
  mostar:{label:'the Mostar template',name:'Mostar',industry:'travel',
    pitch:'A stone arch, emerald water, and a compact old city made for slow mornings, late light, and one unforgettable crossing.',

var SEED_SKIP=['kind','industry','pitch','audience','pages','style','motion','content','languages'];
function seedFromUrl(){
  var p=new URLSearchParams(location.search);
  var t=(p.get('template')||'').toLowerCase().trim();
  if(t){
    // the site hands the full template over in storage, since it knows more
    // about the preset than a query string can carry
    try{
      var raw=localStorage.getItem('scen.agentstudio.seed');
      if(raw){var o=JSON.parse(raw);if(o&&String(o.slug||'').toLowerCase()===t)return o}
    }catch(e){}
    if(TEMPLATE_SEEDS[t])return TEMPLATE_SEEDS[t];
  }
  var i=(p.get('start')||'').toLowerCase().trim();
  if(i&&INDUSTRIES[i]){
    var P=INDUSTRIES[i];
    return{label:P.l.toLowerCase()+' starting point',industry:i,pitch:P.pitch,accent:P.accent,
      style:'cinematic',motion:'cinematic',kind:'website',content:'agent',
      pages:P.pages.slice(),features:P.feats.slice(),languages:['English']};
  }
  return null;
}
function applySeed(seed){
  Object.keys(seed).forEach(function(k){
    if(k==='label'||k==='slug')return;
    var v=seed[k];
    if(v==null||v===''||(Array.isArray(v)&&!v.length))return;   // blanks fall through to the pack
    S.brief[k]=v;
  });
  var b=S.brief,P=INDUSTRIES[b.industry]||INDUSTRIES.other;
  if(!b.industry)b.industry='other';
  if(!b.pages.length)b.pages=P.pages.slice();
  if(!b.features.length)b.features=P.feats.slice();
  if(!b.accent)b.accent=P.accent;
  if(!b.pitch)b.pitch=P.pitch;
  if(!b.style)b.style='cinematic';
  if(!b.motion)b.motion='cinematic';
  if(!b.kind)b.kind='website';
  if(!b.content)b.content='agent';
  if(!b.languages.length)b.languages=['English'];
  S.seedLabel=seed.label||'a template';
  S.skip=SEED_SKIP.slice();
  S.projectName=b.name||'';
}

'.nav-in{display:flex;align-items:center;gap:20px;height:70px}',
'.brand{font-family:'+st.disp+';font-weight:'+Math.max(600,st.w)+';font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}',
'.brand i{width:11px;height:11px;border-radius:50%;background:var(--a);font-style:normal;flex:0 0 auto}',
'.nav-links{display:flex;gap:26px;margin-left:auto;font-size:14px}',
'.nav-links a{color:var(--sub);transition:.18s}',
'.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--ink)}',
'.nav-cta{margin-left:26px}',
'.burger{display:none;margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;align-items:center;justify-content:center}',
/* hero */
'.hero{padding-top:clamp(56px,7vw,96px);overflow:hidden}',
'.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}',
'.hero p.lead{font-size:clamp(16px,1.35vw,19px);max-width:520px;margin:24px 0 32px}',
'.hero-cta{display:flex;gap:12px;flex-wrap:wrap}',
'.proof{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}',
'.proof span{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:7px 13px}',
/* hero art */
'.stage{aspect-ratio:1;display:grid;place-items:center;position:relative;perspective:1100px}',
'.orb{width:44%;aspect-ratio:1;border-radius:50%;position:relative;z-index:2;',
'  background:radial-gradient(circle at 31% 26%, #fff 0 2%, '+mix(t.a,'#ffffff',.4)+' 6%, '+t.a+' 17%, '+mix(t.a,st.bg,.6)+' 42%, '+st.bg+' 76%);',
'  box-shadow:0 0 70px '+mix(t.a,st.bg,.35)+', inset -22px -26px 48px rgba(0,0,0,.5)}',
'.ring{position:absolute;border:1px solid var(--line);border-radius:50%;transform-style:preserve-3d}',
'.ring.r1{width:66%;aspect-ratio:1;transform:rotateX(70deg);animation:sp 17s linear infinite}',
'.ring.r2{width:88%;aspect-ratio:1;border-color:'+mix(t.a,st.bg,.6)+';transform:rotateX(62deg) rotateY(30deg);animation:sp2 26s linear infinite}',
'@keyframes sp{to{transform:rotateX(70deg) rotateZ(360deg)}}',
'@keyframes sp2{to{transform:rotateX(62deg) rotateY(30deg) rotateZ(-360deg)}}',
'.card3d{position:absolute;width:32%;padding:14px;border-radius:calc(var(--rad) * .8);z-index:3;',
'  background:color-mix(in srgb, var(--bg2) 88%, transparent);border:1px solid var(--line);backdrop-filter:blur(10px);',
'  box-shadow:0 24px 60px rgba(0,0,0,.35);font-size:11px;color:var(--sub)}',
'.card3d b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}',
'.card3d.c1{left:-4%;top:14%;animation:fl 6s ease-in-out infinite alternate}',
'.card3d.c2{right:-3%;bottom:16%;animation:fl 7.5s 1s ease-in-out infinite alternate}',
'@keyframes fl{to{transform:translateY(-16px)}}',
/* generic blocks */
'.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}',
'.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}',
'.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}',
'.box{border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);padding:28px}',
'.box p{margin-top:10px;font-size:14.5px}',
'.box .n{font-size:11px;letter-spacing:.16em;color:var(--a);display:block;margin-bottom:20px}',
'.tile{border-radius:var(--rad);aspect-ratio:4/3;position:relative;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;padding:20px}',
'.tile b{position:relative;z-index:2;font-size:15px;font-weight:600}',
'.tile:before{content:"";position:absolute;inset:0;transition:.6s ease}',
'.tile:hover:before{transform:scale(1.07)}',
'.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.55), transparent 55%)}',
'.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:44px 0}',
'.stats div b{font-family:'+st.disp+';font-size:clamp(32px,3.6vw,50px);letter-spacing:-.04em;display:block;line-height:1}',
'.stats div span{font-size:12.5px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase}',
'.marq{border-block:1px solid var(--line);overflow:hidden;padding:16px 0;background:var(--bg2)}',
'.marq-t{display:flex;gap:48px;width:max-content;animation:mv 30s linear infinite;',
'  font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}',
'@keyframes mv{to{transform:translateX(-50%)}}',
/* products */
'.prod{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--bg2);display:flex;flex-direction:column}',
'.prod .ph{aspect-ratio:4/5;position:relative}',
'.prod .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:5px;flex:1}',
'.prod .body b{font-size:15px;font-weight:600}',
'.prod .body .pr{color:var(--a);font-weight:600;font-size:15px}',
'.prod button{margin-top:12px;padding:11px;border-radius:calc(var(--rad) * .5);border:1px solid var(--line);',
'  font-size:13.5px;transition:.18s;width:100%}',
'.prod button:hover{background:var(--a);color:var(--aink);border-color:var(--a)}',
'.cartbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin-top:26px}',
/* booking */
'.bk{display:grid;grid-template-columns:1fr 1fr;gap:16px}',
'.svc{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--rad);',
'  background:var(--bg2);margin-bottom:9px;cursor:pointer;transition:.18s;width:100%;text-align:left}',
'.svc:hover,.svc[aria-pressed="true"]{border-color:var(--a)}',
'.svc b{font-size:14.5px}.svc .t{margin-left:auto;font-size:13px;color:var(--a)}',
'.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}',
'.slot{padding:11px 6px;border:1px solid var(--line);border-radius:calc(var(--rad) * .5);font-size:13px;transition:.16s}',
'.slot:hover{border-color:var(--a);color:var(--a)}',
'.slot[aria-pressed="true"]{background:var(--a);color:var(--aink);border-color:var(--a)}',
/* pricing */
'.price{border:1px solid var(--line);border-radius:var(--rad);padding:28px;background:var(--bg2);display:flex;flex-direction:column}',
'.price.pop{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}',
'.price .amt{font-family:'+st.disp+';font-size:42px;letter-spacing:-.04em;margin:14px 0 4px;display:block;line-height:1}',
'.price ul{list-style:none;padding:0;margin:20px 0 24px;display:grid;gap:9px;font-size:14px;color:var(--sub);flex:1}',
'.price li:before{content:"—  ";color:var(--a)}',
/* quote, faq, posts, team, contact */
'.quote{max-width:820px}',
'.quote q{font-family:'+st.disp+';font-size:clamp(24px,3.1vw,40px);line-height:1.24;letter-spacing:-.03em;quotes:none;display:block}',
'.quote cite{display:block;margin-top:22px;font-style:normal;font-size:13.5px;color:var(--sub)}',
'details.faq{border-bottom:1px solid var(--line);padding:22px 0}',
'details.faq summary{cursor:pointer;font-size:17px;font-weight:600;list-style:none;display:flex;gap:16px;align-items:center}',
'details.faq summary::-webkit-details-marker{display:none}',
'details.faq summary:after{content:"+";margin-left:auto;color:var(--a);font-size:20px;transition:.2s}',
'details.faq[open] summary:after{transform:rotate(45deg)}',
'details.faq p{margin-top:14px;font-size:15px;max-width:720px}',
'.post{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--bg2)}',
'.post .ph{aspect-ratio:16/9}',
'.post .body{padding:20px}',
'.post .body span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}',
'.post .body h3{margin:10px 0 8px}',
'.member{text-align:center}',
'.member .ph{aspect-ratio:1;border-radius:var(--rad);margin-bottom:14px}',
'.member b{font-size:15px}.member span{font-size:13px;color:var(--sub);display:block;margin-top:2px}',
'form.enq{display:grid;gap:13px;max-width:520px}',
'form.enq label{font-size:12.5px;color:var(--sub);display:grid;gap:6px}',
'form.enq input,form.enq textarea{background:var(--bg2);border:1px solid var(--line);border-radius:calc(var(--rad) * .5);',
'  padding:13px 15px;color:var(--ink);font:inherit;font-size:14.5px;outline:0}',
'form.enq input:focus,form.enq textarea:focus{border-color:var(--a)}',
'form.enq textarea{min-height:120px;resize:vertical}',
'.formnote{font-size:12.5px;color:var(--sub);margin-top:4px}',
'.mapblock{border:1px solid var(--line);border-radius:var(--rad);padding:30px;background:var(--bg2);display:grid;gap:8px;align-content:center;min-height:280px;',
'  background-image:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 46px)}',
'.step-row{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}',
'.step-row i{font-style:normal;font-family:'+st.disp+';font-size:26px;color:var(--a);width:44px;flex:0 0 auto}',
'.prose{max-width:720px;display:grid;gap:18px;font-size:16px}',
'.prose p{font-size:16px}',
/* cta + footer */
'.cta-band{border:1px solid var(--line);border-radius:calc(var(--rad) * 1.3);padding:clamp(38px,5vw,68px);',
'  background:radial-gradient(circle at 18% 10%, '+mix(t.a,st.bg,.82)+', var(--bg2) 60%);text-align:center}',
'.cta-band p{max-width:460px;margin:16px auto 28px;font-size:15.5px}',
'footer{border-top:1px solid var(--line);padding:56px 0 40px;margin-top:clamp(60px,8vw,110px)}',
'.foot-in{display:flex;gap:34px;flex-wrap:wrap;justify-content:space-between}',
'.foot-links{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}',
'.foot-links a:hover{color:var(--a)}',
'.foot-bot{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:16px;',
'  justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}',
'.langs{display:flex;gap:8px}',
'.langs button{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 11px}',
'.langs button[aria-pressed="true"]{color:var(--a);border-color:var(--a)}',
/* page hero */
'.phero{padding:clamp(56px,7vw,104px) 0 clamp(34px,4vw,56px);border-bottom:1px solid var(--line)}',
'.phero p{max-width:560px;margin-top:18px;font-size:16px}',
/* motion */
'[data-reveal]{opacity:0;transform:translateY(22px)}',
'[data-reveal].in{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}',
'@media (prefers-reduced-motion:reduce){',
'  *{animation:none!important;transition:none!important}[data-reveal]{opacity:1;transform:none}}',
/* responsive */
'@media (max-width:900px){',
'  .hero-grid,.bk,.grid2{grid-template-columns:1fr}',
'  .grid3,.grid4,.stats{grid-template-columns:repeat(2,1fr)}',
'  .nav-links{position:fixed;inset:70px 0 auto;background:var(--bg);flex-direction:column;gap:0;',
'    padding:10px 22px 22px;border-bottom:1px solid var(--line);display:none}',
'  .nav-links.open{display:flex}.nav-links a{padding:13px 0;border-bottom:1px solid var(--line)}',
'  .burger{display:flex}.nav-cta{display:none}',
'  .stage{order:-1;max-width:420px;margin-inline:auto}',
'}',
'@media (max-width:560px){.grid3,.grid4,.stats,.slots{grid-template-columns:1fr}.stats{gap:26px}}'
].join('\n');
}

/* ---------- site javascript ---------- */
function makeJs(b){
  var lines=[
'/* '+b.name+' — behaviour */',
'(function(){',
'  var burger=document.querySelector(".burger"),links=document.querySelector(".nav-links");',
'  if(burger)burger.addEventListener("click",function(){links.classList.toggle("open")});',
'',
'  var reveal=[].slice.call(document.querySelectorAll("[data-reveal]"));',
'  reveal.forEach(function(el,i){el.style.transitionDelay=(i%4)*70+"ms"});',
'  function revealNow(){',
'    var vh=window.innerHeight||document.documentElement.clientHeight;',
'    reveal=reveal.filter(function(el){',
'      if(el.getBoundingClientRect().top<vh*0.92){el.classList.add("in");return false}',
'      return true;',
'    });',
'  }',
'  addEventListener("scroll",revealNow,{passive:true});',
'  addEventListener("resize",revealNow);',
'  addEventListener("load",revealNow);',
'  revealNow();requestAnimationFrame(revealNow);setTimeout(revealNow,250);'];
  if(b.motion==='full'||b.motion==='cinematic')lines=lines.concat([
'',
'  var stage=document.querySelector(".stage");',
'  if(stage&&!matchMedia("(prefers-reduced-motion:reduce)").matches){',
'    addEventListener("pointermove",function(e){',
'      var x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);',
'      stage.style.transform="rotateY("+(x*7)+"deg) rotateX("+(-y*5)+"deg)";',
'    },{passive:true});',
'  }']);
  if(has(b,'store'))lines=lines.concat([
'',
'  var count=0,badge=document.querySelector("[data-cart-count]");',
'  document.querySelectorAll("[data-add]").forEach(function(btn){',
'    btn.addEventListener("click",function(){',
'      count++;if(badge)badge.textContent=count;',
'      btn.textContent="Added ✓";setTimeout(function(){btn.textContent="Add to cart"},1400);',
'    })});']);
  if(has(b,'bookings'))lines=lines.concat([
'',
'  function group(sel){',
'    var els=document.querySelectorAll(sel);',
'    els.forEach(function(el){el.addEventListener("click",function(){',
'      els.forEach(function(o){o.setAttribute("aria-pressed","false")});',
'      el.setAttribute("aria-pressed","true");',
'      var out=document.querySelector("[data-booking-summary]");',
'      if(out){var s=document.querySelector(\'.svc[aria-pressed="true"] b\'),',
'        t=document.querySelector(\'.slot[aria-pressed="true"]\');',
'        out.textContent=(s?s.textContent:"Pick a service")+(t?" · "+t.textContent:"");}',
'    })})}',
'  group(".svc");group(".slot");']);
  if(has(b,'forms'))lines=lines.concat([
'',
'  document.querySelectorAll("form.enq").forEach(function(f){',
'    f.addEventListener("submit",function(e){',
'      e.preventDefault();',
'      var note=f.querySelector(".formnote");',
'      if(note)note.textContent="Thanks — connect a form endpoint in Scen to start receiving these.";',
'      f.reset();',
'    })});']);
  if(b.languages&&b.languages.length>1)lines=lines.concat([
'',
'  var langs=document.querySelectorAll(".langs button");',
'  langs.forEach(function(l){l.addEventListener("click",function(){',
'    langs.forEach(function(o){o.setAttribute("aria-pressed","false")});',
'    l.setAttribute("aria-pressed","true");',
'    document.documentElement.lang=l.dataset.lang;',
'  })});']);
  lines.push('})();');
  return lines.join('\n');
}

/* ---------- section renderers ---------- */
function tint(t,i,ratio){return mix(t.a,t.st.bg,ratio==null?(.72+((i||0)%4)*.06):ratio)}
function ph(t,i,extra){ /* placeholder art block */
  return 'style="background:linear-gradient('+(120+i*26)+'deg,'+tint(t,i,.68)+','+t.bg3+' 62%,'+t.st.bg+')'+(extra||'')+'"';
}

function nav(b,current){
  var links=b.pages.map(function(p){
    return '      <a href="'+pageFile(p)+'"'+(p===current?' aria-current="page"':'')+'>'+esc(p)+'</a>'}).join('\n');
  var cta=pack(b).cta[2];
  return ['  <header class="nav">',
'    <div class="wrap nav-in">',
'      <a class="brand" href="index.html"><i></i>'+esc(b.name)+'</a>',
'      <button class="burger" aria-label="Menu">☰</button>',
'      <nav class="nav-links">',links,'      </nav>',
      (has(b,'store')?'      <a class="btn ghost nav-cta" href="'+pageFile(b.pages.filter(function(p){return /shop|menu|tickets/i.test(p)})[0]||'Contact')+'">Cart (<span data-cart-count>0</span>)</a>':''),
'      <a class="btn nav-cta" href="'+pageFile(lastPage(b))+'">'+esc(cta)+'</a>',
'    </div>',
'  </header>'].filter(Boolean).join('\n');
}
function lastPage(b){
  var pref=['Contact','Book','Reservations','Shop','Pricing'];
  for(var i=0;i<pref.length;i++)if(b.pages.indexOf(pref[i])>=0)return pref[i];
  return b.pages[b.pages.length-1]||'Home';
}

        return '      <div class="step-row" data-reveal><i>0'+(i+1)+'</i><div><h3>'+esc(s[0])+'</h3><p style="margin-top:8px;max-width:620px">'+esc(s[1])+'</p></div></div>'
      })).concat(['    </div>','  </section>']).join('\n');

  showcase:function(b,t){
    var P=pack(b);
    return ['  <section id="gallery">','    <div class="wrap">',

'      <div class="grid4">'+P.gallery.map(function(g,i){
        return '\n        <div class="tile" data-reveal '+ph(t,i)+'><b>'+esc(g)+'</b></div>'}).join('')+'\n      </div>',

  },
  stats:function(b){
    var P=pack(b);
    return ['  <section style="padding-block:clamp(40px,5vw,64px)">','    <div class="wrap">',
'      <div class="stats" data-reveal>'+P.stats.map(function(s){
        return '\n        <div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>'}).join('')+'\n      </div>',
'    </div>','  </section>'].join('\n');

function sectionsFor(page,b,pro){
  // a live-AI plan wins; it is already validated down to known section ids
  if(b.__plan&&b.__plan[page]&&b.__plan[page].length)return b.__plan[page].slice();
  var n=page.toLowerCase(),out=[];
  if(n==='home'){
    out.push('hero');
    if(pro)out.push('logos');
    out.push('services');
    if(has(b,'gallery')||pro)out.push('showcase');
    if(pro)out.push('stats');
    if(has(b,'store'))out.push('products');
    if(has(b,'bookings'))out.push('booking');
    if(b.goal==='sell'||b.goal==='signup')out.push('pricing');
    if(pro)out.push('testimonial');
    if(pro)out.push('faq');
    out.push('cta');
    return out;
  }
  out.push('phero');
  if(/shop|menu|tickets|store/.test(n))out.push('products');
  else if(/reserv|book|appoint/.test(n))out.push('booking',has(b,'maps')?'map':null);
  else if(/service|treatment|class|course/.test(n))out.push('servicelist',pro?'pricing':null,pro?'faq':null);
  else if(/work|gallery|lookbook|listing|venue/.test(n))out.push('showcase',pro?'testimonial':null);
  else if(/pricing|membership/.test(n))out.push('pricing',pro?'faq':null);
  else if(/blog|writing|news/.test(n))out.push('posts');
  else if(/team|trainer|faculty|people/.test(n))out.push('team');
  else if(/contact/.test(n))out.push('contact',has(b,'maps')?'map':null);
  else if(/faq|question/.test(n))out.push('faq');
  else if(/admission|apply|join/.test(n))out.push('steps','contact');
  else if(/about|story|studio/.test(n))out.push('prose',pro?'stats':null,pro?'team':null);
  else out.push('prose',pro?'services':null);
  out.push('cta');
  return out.filter(Boolean);
}

function makePage(b,page,pro,t){
  var body=sectionsFor(page,b,pro).map(function(id){
    return SEC[id]?SEC[id](b,t,page):''}).filter(Boolean).join('\n\n');
  var title=page.toLowerCase()==='home'?b.name+' — '+pack(b).kicker.replace(/ · /g,', '):page+' · '+b.name;
  return ['<!doctype html>','<html lang="'+((b.languages[0]||'English').slice(0,2).toLowerCase())+'">','<head>',
'<meta charset="utf-8"/>',
'<meta name="viewport" content="width=device-width,initial-scale=1"/>',
'<title>'+esc(title)+'</title>',
'<meta name="description" content="'+esc(b.pitch)+'"/>',
'<meta property="og:title" content="'+esc(title)+'"/>',
'<meta property="og:description" content="'+esc(b.pitch)+'"/>',
'<link rel="stylesheet" href="styles.css"/>',
'</head>','<body>',
nav(b,page),'',body,'',footer(b),
'<scr'+'ipt src="app.js"></scr'+'ipt>',
'</body>','</html>'].join('\n');
}

function buildSite(b,depth){
  b.__depth=depth;
  var t=tokens(b),pro=depth==='pro';
  var pages=b.pages.map(function(p){
    return{page:p,file:'site/'+pageFile(p),html:makePage(b,p,pro,t)}});
  return{pages:pages,css:makeCss(b),js:makeJs(b)};
}
