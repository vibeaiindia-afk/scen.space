  host.querySelector('button').onclick=function(){S.pick='';save();showPick()};
}
/* A message while something is selected is about that thing. Plain new words
   replace it; anything else is read as an instruction about it. */
function applyPick(text){
  var b=S.brief,was=S.pick,now=String(text||'').trim();
  if(!was||!now)return null;
  /* "koi aur design dikhao" is a request about the site, not the words to put
     in the thing that was selected. Anything that reads as an instruction goes
     back to the ordinary edit path. */
  if(/\b(design|layout|theme|direction|section|page|colou?r|background|image|images|font|bigger|smaller|dikhao|dikha|badal|badlo|rebuild|publish)\b/i.test(now))return null;
  var m=now.match(/^(?:change (?:it|this) to|make (?:it|this)|say|likho|kar do|kr do|isko)\s+(.+)$/i);
  if(m)now=m[1].trim();
  now=now.replace(/^["'\u201c]|["'\u201d]$/g,'').trim();
  if(!now||now===was)return null;
  /* nothing longer than a line replaces a line — that is an instruction */
  if(now.length>120)return null;
  b.__text=(b.__text||[]).filter(function(pr){return pr[0]!==was});
  b.__text.push([was,now]);
  S.pick='';save();showPick();
  return L('“'+esc(was)+'” is now “<b>'+esc(now)+'</b>”.','“'+esc(was)+'” ab “<b>'+esc(now)+'</b>” hai.');
}

/* ============================================================
   Question / answer
   ============================================================ */
function step(){return FLOW[S.step]}

function askCurrent(animate){
  /* skip the trade question wherever the flow lands on it */
  while(FLOW[S.step]&&FLOW[S.step].id==='industry'){settleIndustry(S.brief);S.step++}
  // a seeded brief already answers some steps — walk past them
  while(FLOW[S.step]&&(S.skip||[]).indexOf(FLOW[S.step].id)>=0)S.step++;
  var st=step();if(!st)return finishInterview();
  S.pending='q';save();
  var text=st.q(S.brief);
  /* Buttons made this a form, and the form is gone: whatever the client types
     is the brief, gateway or no gateway — the word lists read it when there is
     no model to. A row of chips under the first question is the one thing this
     flow must never show, because picking "A website" answers nothing. */
  var guided=false;
  if(animate===false){agentSay(text.replace(/\n/g,'<br/>'));if(guided)renderAnswerBox();return}
  var t0=Date.now();
  thinking();
  var delay=520+Math.min(900,text.length*4);
  setTimeout(function(){
    clearThinking();
    agentSay(text.replace(/\n/g,'<br/>'));
    if(guided)renderAnswerBox();
  },delay);
}

function renderAnswerBox(){
  clearAnswerBox();
  var st=step();if(!st)return;
  var box=document.createElement('div');
  box.id='answerBox';box.className='msg agent';box.style.marginTop='-8px';
  var b=S.brief;

  if(st.type==='single'||st.type==='color'){
    var opts=st.opts(b);
    box.innerHTML='<div class="chips">'+opts.map(function(o){
      return '<button data-v="'+esc(o.v)+'">'+(o.sw?'<span class="sw" style="background:'+esc(o.sw)+'"></span>':'')+esc(o.l||o.v)+'</button>'
    }).join('')+'</div>'+(st.type==='color'?
      '<div class="chips-go"><span class="hint">…or type any colour — “deep teal”, “#0f766e”.</span></div>':'')+
      (st.optional?'<div class="chips-go"><button class="skip" data-skip="1">Skip this</button></div>':'');
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t)return answer(t.dataset.v,t.textContent.trim());
      if(e.target.dataset.skip)return answer('__skip','Skip');
    });
  }
  else if(st.type==='multi'){
    var chosen=(st.val?st.val(b):[]).slice();
    var opts2=st.opts(b);
    box.innerHTML='<div class="chips" id="multiChips">'+opts2.map(function(o){
      return '<button data-v="'+esc(o.v)+'"'+(chosen.indexOf(o.v)>=0?' class="on"':'')+'>'+esc(o.l||o.v)+'</button>'
    }).join('')+'</div>'+
    '<div class="chips-go"><button class="btn primary sm" data-go="1">Continue</button>'+
    '<span class="hint" id="multiCount">'+chosen.length+' selected</span>'+
    '<span class="grow"></span><span class="hint">or type your own and press ↑</span></div>';
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t){
        var v=t.dataset.v,i=chosen.indexOf(v);
        if(i>=0){chosen.splice(i,1);t.classList.remove('on')}else{chosen.push(v);t.classList.add('on')}
        $('#multiCount',box).textContent=chosen.length+' selected';
        return;
      }
      if(e.target.dataset.go){
        if(st.min&&chosen.length<st.min)return toast('Pick at least '+st.min);
        answer(chosen,chosen.join(', '));
      }
    });
  }
  else{ /* text */
    var extras=st.extra?st.extra(b):[];
    box.innerHTML=(extras.length?'<div class="chips">'+extras.map(function(o){
      return '<button data-v="'+esc(o.v)+'">'+esc(o.l)+'</button>'}).join('')+'</div>':'')+
      (st.optional?'<div class="chips-go"><button class="skip" data-skip="1">Skip this</button></div>':'');
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-v]');
      if(t)return answer(t.dataset.v,t.textContent.trim());
      if(e.target.dataset.skip)return answer('__skip','Skip');
    });
    input.placeholder=st.ph||'Type your answer…';
    setTimeout(function(){input.focus()},60);
  }
  body.appendChild(box);scrollChat();
}

function answer(value,label,quiet){
  var st=step();if(!st)return;
  clearAnswerBox();
  var show=Array.isArray(value)?(value.length?value.join(', '):'Nothing extra'):
    (value==='__skip'?'Skip':(label||value));
  var atts=S.atts.slice();
  if(atts.length){S.brief.refs=S.brief.refs.concat(atts);S.atts=[];renderAtts()}
  if(!quiet)userSay(show,atts);
  if(value!=='__skip'||!st.optional)st.set(S.brief,value);
  else st.set(S.brief,'__skip');
  S.pending=null;
  if(!S.projectName&&S.brief.name){S.projectName=S.brief.name;$('#projName').textContent=S.brief.name}
  save();refreshTools();if(S.tool==='brief')renderMain();

  function advance(){
    if(S.__resumeReview){S.__resumeReview=false;save();return finishInterview()}
    S.step++;save();askCurrent(true);
  }
  var ack=st.ack?st.ack(S.brief,value):'';
  if(ack){
    var t0=Date.now();thinking();
    setTimeout(function(){
      clearThinking();
      agentSay(ack.replace(/\n/g,'<br/>'),Math.max(1,Math.round((Date.now()-t0)/1000)));
      setTimeout(advance,260);
    },420+Math.random()*220);
  }else advance();
}

/* free text from the composer */
/* What the customer actually said, before it gets filed under whatever
   question happens to be on screen.

   The interview used to assign every message to the current step, so typing
   "clone of netflix.com/browse" at the name question made that the project
   name. Intent is read first now; only what is left becomes the answer. */
/* A hostname, not a filename. "index.html", "App.tsx" and "index.css" all
   matched the old pattern, so pasting a code spec made Scen announce
   index.html as the reference site. Either a real scheme, or a real TLD. */
var TLD='com|net|org|io|co|dev|app|ai|space|in|uk|us|me|xyz|design|studio|shop|store|site|tech|cloud|page|link';
var URL_RE=new RegExp(
  '\\b(https?:\\/\\/[^\\s]+'                                  /* explicit scheme wins */
  +'|(?:[a-z0-9-]+\\.)+(?:'+TLD+')(?![a-z])(?:\\/[^\\s]*)?)','i');
var REF_RE=/\b(clone|cloan|copy|like|similar to|inspired by|same as)\b/i;
/* What the sentence is trying to do. The name was already here but it only
   ever pulled out a reference URL — every other message fell through to
   "answer to whatever question is on screen", which is how "hero chota kro"
   became someone's business name. Kinds map to routes, nothing else. */
var INTENT={
  greeting:/^\s*(hi+|hey|hello|yo|hola|namaste|sup|good (morning|evening|afternoon))\b[\s!.?]*$/i,
  approve : /\b(approve|go ahead|build it|bana do|banao ab|start kro|shuru kro|theek hai|thik hai|ok(ay)? go|looks good|perfect|haan)\b/i,
  reject  : /\b(nahi|nahin|no thanks|don'?t|mat |hatao|remove that|cancel|rehne do)\b/i,
  /* Hinglish carries the instruction in the verb at the end — "kr do", "kro",
     "rakho" — and the thing being changed is often just a noun. Without these
     "theek hai but accent gold kr do" scored as plain approval and built. */
  edit    : /\b(chota|bada|badal|badlo|change|make it|hatao|nikal|add |jodo|daal|colour|color|font|bigger|smaller|darker|lighter|move |swap|instead|k[ar]r? ?do|kro|karo|rakho|rakh ?do|lagao|lga ?do|hata ?do|badha|ghata)\b/i,
  question: /\b(kitna|kitne|kya |kaise|kyu|why|how (long|much|do)|what (is|does)|can you|price|cost|time lagega)\b/i,
  /* Feel words on their own are answers, not instructions — "premium" is what
     someone types when asked to pick a style. They only mean "change this"
     when something points at the site: isko, thoda, zyada, aur, lge, feel. */
  feel    : /\b(halka|halki|halke|gehra|gehri|gehre|bhaari|bhari|simple|saaf|clean|modern|premium|bold|soft|warm|thanda|garam|shaant|chamkeela|bright|elegant|classy|fresh|minimal|luxury|royal|sober|heavy|light|dark|serious|fun|playful|bharosemand|professional|mast|rangeen|rangin|rangila|colou?rful|chamakdar|chamkila|bhadak|bhadkila|sada|saada|sundar|kh(u|oo)bsurat|aakarshak|akarshak|shandar|jhakaas|umda|nafees|dhinchak|bharkam|desi|traditional|paramparik|naya|nayi|naye|purana|purani|jawan|energetic|calm|cozy|rich|sasta|mehnga|stylish|trendy|funky|corporate|formal|casual|earthy|natural|techy|futuristic|retro|vintage|garmi|thandak|khula|khuli|bhara|bhari hui)\b/i,
  nudge   : /\b(isko|ise|iska|isme|thoda|thodi|zyada|jyada|aur|kam|bilkul|ekdum|jaisa|jesa|jese|jaise|feel|look|vibe|lge|lge?ga|lage|lagna|dikhe|dikhna|dikhna chahiye|banao|bnao|kro|karo)\b/i
};
function classify(text){
  var t=String(text||'').trim();
  if(!t)return 'empty';
  if(INTENT.greeting.test(t))return 'greeting';
  if(isBriefLike(t))return 'brief';
  if(INTENT.question.test(t))return 'question';
  /* A sentence that agrees AND asks for a change is a change, not approval —
     "theek hai but accent gold kr do" must not start a build. Edit verbs
     therefore veto both confirmations. */
  if(INTENT.approve.test(t)&&t.length<40&&!INTENT.edit.test(t))return 'approve';
  if(INTENT.edit.test(t))return 'edit';
  if(INTENT.feel.test(t)&&INTENT.nudge.test(t))return 'edit';
  if(INTENT.reject.test(t)&&t.length<40)return 'reject';
  return 'answer';
}
function readIntent(text){
  var out={ref:'',rest:text,kind:classify(text)};
  var m=text.match(URL_RE);
  if(m&&!/\.(png|jpg|jpeg|webp|mp4|gif)$/i.test(m[1])){
    out.ref=m[1];
    out.rest=text.replace(m[1],'').replace(REF_RE,'').replace(/\s{2,}/g,' ').trim();
    out.rest=out.rest.replace(/^(of|a|an|the|to|make|lets|let's|build|create)\s+/i,'').trim();
  }
  return out;
}
/* Worth asking the model about? One or two words are an answer, and text that
   matches an option on screen is an answer. Everything else, once there is a
   project to change, is a real question the regex cannot settle. */
function ambiguous(st,text){
  var w=String(text).trim().split(/\s+/).length;
  if(w<3)return false;
  if(st.opts){
    var os=st.opts()||[],lc=text.toLowerCase();
    for(var i=0;i<os.length;i++){
      var v=String(os[i].v||'').toLowerCase(),l=String(os[i].l||'').toLowerCase();
      if(v&&lc.indexOf(v)>=0)return false;
      if(l&&lc.indexOf(l)>=0)return false;
    }
    return true;
  }
  return w>=4;
}

/* A short field should not swallow a paragraph. */
function looksLikeBrief(st,text){
  return (st.id==='name')&&(text.length>36||URL_RE.test(text));
}

/* ── Absorbing a whole brief ───────────────────────────────────────────────
   Someone who pastes a specification has already answered half the interview.
   Reading it one field at a time — which is what the FLOW did — threw the
   rest away and then asked for it again. This pulls out what is actually
   stated, marks those questions answered, and leaves the genuinely open ones
   to be asked. Nothing is guessed: a field is only filled when the text says
   it. ── */
/* Order matters: the first match wins. "yoga studio" was landing on agency
   because that pattern carried a bare "studio", so the specific trades are
   tested first and agency no longer claims the word on its own. */
var IND_WORDS={
  games:/\bgames?\b|gaming|arcade|browser game|multiplayer|esports|\.io\b/i,
  fitness:/fitness|gym|yoga|pilates|workout|training studio|crossfit|jim/i,
  clinic:/clinic|health|medical|dental|therapy|wellness|mindful|spa/i,
  restaurant:/restaurant|caf|bistro|diner|menu|eatery|food|bakery|bakehouse|patisserie|coffee|dhaba|kitchen/i,
  realestate:/real ?estate|property|properties|realty|listing/i,
  fashion:/fashion|clothing|apparel|boutique|lookbook|wear/i,
  agency:/agency|consultanc|creative firm|design studio/i,
  saas:/saas|software|platform|dashboard|app for|b2b|api/i,
  portfolio:/portfolio|my work|personal site|photographer|designer/i,
  education:/course|school|academy|educat|tutor|learning/i,
  events:/event|conference|festival|ticket|wedding/i,
  travel:/travel|resort|hotel|tour|destination|stay/i};
var FEAT_WORDS={store:/shop|store|e-?commerce|checkout|cart|sell/i,
  bookings:/book|appointment|reservation|schedul/i,
  blog:/blog|articles|posts|cms|journal/i,
  forms:/contact form|enquiry|inquiry|lead form|get in touch/i,
  accounts:/login|sign ?up|account|member|auth/i,
  multilang:/multi-?lang|translat|bilingual|locales?/i,
  gallery:/gallery|lookbook|photos|portfolio grid/i,
  maps:/map|directions|location/i,
  analytics:/analytics|tracking/i,
  chat:/live chat|chat widget|whatsapp/i};
var STYLE_WORDS={cinematic:/cinematic|filmic|dramatic|immersive/i,
  minimal:/minimal|clean|simple|spare|understated/i,
  editorial:/editorial|magazine|typographic|serif/i,
  luxury:/luxur|premium|elegant|refined|high-?end/i,
  playful:/playful|fun|bright|energetic|bold colou?r/i};
var GOAL_WORDS={sell:/sell|purchase|buy|revenue|checkout/i,
  book:/book|appointment|reservation/i,
  lead:/enquir|inquir|lead|contact us|get in touch/i,
  signup:/sign ?up|waitlist|subscribe|trial/i,
  show:/showcase|portfolio|display our work/i};

function matchOne(map,text){for(var k in map)if(map[k].test(text))return k;return ''}
/* The trade, by weight of evidence rather than by whichever word came first.
   A brief for an iPhone concept site says "gaming" once, in a line about
   performance, and first-match-wins turned the whole build into a games
   platform — sidebar, categories, catalogue and all. What counts is how many
   *different* words of a trade appear, and whether the opening sentence — the
   one that says what the thing is — is one of them. */
/* Does this brief really support that trade? Same bar as choosing one: a word
   in the opening line, or two different words of it further down. */
function industrySupported(k,text){
  if(!k||!IND_WORDS[k])return false;
  var t=String(text||''),subject=t.split(/[.\n]/)[0]||'',terms=IND_WORDS[k].source.split('|'),d=0,sub=false;
  terms.forEach(function(term){
    var rx;try{rx=new RegExp(term,'i')}catch(e){return}
    if(rx.test(t)){d++;if(rx.test(subject))sub=true}
  });
  if(sub)return true;
  return t.length<=120?d>=1:d>=2;
}
function bestIndustry(text){
  var t=String(text||''),subject=t.split(/[.\n]/)[0]||'',best='',bestN=0,bestD=0;
  Object.keys(IND_WORDS).forEach(function(k){
    var terms=IND_WORDS[k].source.split('|'),distinct=0,inSubject=false;
    terms.forEach(function(term){
      var rx;try{rx=new RegExp(term,'i')}catch(e){return}
      if(rx.test(t)){distinct++;if(rx.test(subject))inSubject=true}
    });
    var score=distinct+(inSubject?2:0);
    if(score>bestN){bestN=score;best=k;bestD=distinct}
  });
  if(!best)return '';
  /* The opening line is the client saying what the thing is, so one word there
     settles it. Anywhere else, one word is a mention: "console-quality gaming"
     in a phone brief, "coffee" in a bookshop's. Past a line of text it takes
     two different words of a trade to name it. */
  var terms=IND_WORDS[best].source.split('|'),inSubject=false;
  terms.forEach(function(term){
    var rx;try{rx=new RegExp(term,'i')}catch(e){return}
    if(rx.test(subject))inSubject=true;
  });
  if(inSubject)return best;
  return (t.length<=120||bestD>=2)?best:'';
}
function matchMany(map,text){var o=[];for(var k in map)if(map[k].test(text))o.push(k);return o}

/* Long, or written like a spec rather than an answer. */
var BUILD_VERB=/\b(bna|bana|banao|bnao|banani|banana|banado|chahiye|chaiye|make|build|create|design|develop|need|want)\b/i;
function isBriefLike(text){
  if(text.length>=80)return true;
  if(/\n/.test(text)&&text.length>50)return true;
  /* "RamsFitness gym ki premium dark website bnao …" is a full brief at 106
     characters — length alone kept missing real ones, especially in Hinglish
     where the same request is simply shorter. */
  if(BUILD_VERB.test(text)&&text.trim().split(/\s+/).length>=6)return true;
  return (text.split(/[.!?]\s/).length>2&&text.length>70);
}

/* The bar for starting: a name, what it is, what trade, and pages to put it
   on. Everything else has a defensible default. */
/* The bar used to be a form: a name, a trade and a page set before anything
   could be built. A client who wrote two paragraphs about their business had
   given more than enough — the missing fields are decisions, and the agent is
   supposed to make those. */
function briefGiven(b){
  return !!(b.pitch&&String(b.pitch).trim().length>40)||!!(b.__onepage&&b.__onepage.length);
}
function haveEnough(b){
  if(briefGiven(b)&&b.name)return true;      /* they described it — that is the brief */
  return !!(b.name && b.kind && (b.pages||[]).length);
}
/* Assumptions a designer would make without stopping to ask. All editable. */
/* The trade was a wall of thirteen chips with emoji on them, and it decided
   nothing the agent cannot decide itself. It is never asked now: the brief's
   own words settle it, the gateway settles it, or it falls to the general pack
   — and the client is never handed a menu of businesses to classify
   themselves into. */
function settleIndustry(b){
  if(b.industry&&INDUSTRIES[b.industry])return;
  b.industry='other';
}
function fillDefaults(b){
  settleIndustry(b);
  /* The trade question used to load the page set and the feature list when it
     was answered. Nobody answers it any more, and nothing else did it — so a
     brief the word lists could not place built a site with no pages at all:
     "Done — Dubai is live. 0 pages, 0 sections". */
  var P0=INDUSTRIES[b.industry]||INDUSTRIES.other;
  if(!(b.pages||[]).length)b.pages=P0.pages.slice();
  if(!(b.features||[]).length)b.features=P0.feats.slice();
  /* §3 and §49 — the agent decides these, and says so in one line rather than
     leaving the brief to show "not answered yet" beside "enough to start".
     Returns what it chose so the conversation can mention it. */
  var chose=[];
  if(!b.style){b.style='minimal';chose.push(STYLES.minimal.l.toLowerCase()+' look')}
  if(!b.motion)b.motion='cinematic';
  if(!b.content)b.content='agent';
  if(!(b.languages||[]).length)b.languages=['English'];
  if(!b.goal){
    b.goal=(b.features||[]).indexOf('store')>=0?'sell':
           ((b.features||[]).indexOf('bookings')>=0?'book':'lead');
    chose.push(GOALS[b.goal].toLowerCase());
  }
  if(!b.accent){
    var P=INDUSTRIES[b.industry];b.accent=(P&&P.accent)||'#dfff45';
    chose.push('an accent that suits the trade');
  }
  return chose;
}
/* One sentence, only when something was actually decided. */
function saidDefaults(chose){
  if(!chose||!chose.length)return '';
  return '<br/><br/>I picked '+chose.join(', ')+' — say the word and I change any of it.';
}

/* Merge what the model read. §48 — an explicit statement outranks whatever we
   inferred, so anything present here simply overwrites. Pages and features go
   through the same add/drop the edit reader already uses. */
function applyTurn(o){
  var b=S.brief,u=o&&o.brief_updates;
  /* The check against the brief's own words used to live at the end of this
     function, so a turn that carried no updates — a plain question, a model
     that answered with only a reply — returned before any of it ran. That is
     how a games trade left over from an earlier project survived an iPhone
     brief: nothing ever re-read the words. */
  if(!u){if(o&&o.__text)groundTurn(o.__text);return}
  /* Every field here is written straight into the brief the generator reads,
     so a trade the studio has never heard of — "gaming", "entertainment" —
     used to land in b.industry and the build then threw on
     INDUSTRIES[b.industry].l, four steps in, with the pill stuck on
     "Building…" and nothing said. The model names things; this decides
     whether the name is one the build can use. */
  ['name','pitch','location'].forEach(function(k){if(u[k])b[k]=u[k]});
  if(u.industry){
    var ind=String(u.industry).toLowerCase().trim();
    if(INDUSTRIES[ind])b.industry=ind;
    else{b.industry='other';b.industryOther=String(u.industry).slice(0,40)}
  }
  if(u.kind&&['website','app','both'].indexOf(String(u.kind).toLowerCase())>=0)b.kind=String(u.kind).toLowerCase();
  if(u.goal&&GOALS[String(u.goal).toLowerCase()])b.goal=String(u.goal).toLowerCase();
  if(u.style&&STYLES[String(u.style).toLowerCase()])b.style=String(u.style).toLowerCase();
  if(u.accent){
    /* Cyan on the warm-brown Luxury palette is what "the model picked a colour
       nobody asked for" looks like. A colour is taken when the client's own
       words called for one; otherwise the trade's accent, which was chosen to
       sit on that palette, stands. */
    var ac=C.findColor(String(u.accent))||String(u.accent);
    var asked=o.__text&&/\b(colou?r|accent|rang|palette|theme)\b/i.test(o.__text);
    if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(ac)&&(asked||!b.accent)){b.accent=ac;if(asked)b.__accentAsked=1}
  }
  if(Array.isArray(u.languages)&&u.languages.length)b.languages=u.languages;
  if(Array.isArray(u.addPages))u.addPages.forEach(function(p){
    p=C.titleCase(String(p));if(b.pages.indexOf(p)<0)b.pages.push(p)});
  if(Array.isArray(u.dropPages))u.dropPages.forEach(function(p){
    b.pages=b.pages.filter(function(x){return x.toLowerCase()!==String(p).toLowerCase()})});
  if(Array.isArray(u.addFeatures))u.addFeatures.forEach(function(f){
    if(FEATURES[f]&&b.features.indexOf(f)<0)b.features.push(f)});
  if(Array.isArray(u.dropFeatures))u.dropFeatures.forEach(function(f){
    b.features=b.features.filter(function(x){return x!==f})});
  if(o.__text)groundTurn(o.__text);
  renderMain();
}

/* Some briefs describe one long page, not a site: a list of sections under a
   "Sections:" or "Structure:" heading, or bullets that start at a hero and end
   at a footer. Those are chapters of a single page — turning them into pages
   would put a "Hero" and a "Footer" in the navigation. */
function sectionListFrom(text){
  var t=String(text);
  /* A brief written as headings — "HERO SECTION", "CAMERA SECTION",
     "BATTERY SECTION" — is a list of chapters too. It was only being read when
     the client happened to write bullets under the word "Sections". */
  var heads=t.split(/\n/).map(function(l){return l.trim()})
    .filter(function(l){return /^[A-Z][A-Z0-9 &/\.\-]{2,28}$/.test(l)&&!/^(IMPORTANT|GOAL|OVERALL STYLE|TECH STACK|PERFORMANCE REQUIREMENTS|ANIMATION REQUIREMENTS|RESPONSIVE DESIGN)$/.test(l)})
    .map(function(l){return C.titleCase(l.replace(/\bSECTION\b/i,'').replace(/\s+/g,' ').trim().toLowerCase())})
    .filter(function(l){return l&&l.length<=26});
  if(heads.length>=4){
    var seenH={},outH=[];
    heads.forEach(function(h){var k=h.toLowerCase();if(seenH[k])return;seenH[k]=1;outH.push(h)});
    if(outH.length>=4)return outH.slice(0,10);
  }
  var m=t.match(/\b(?:sections?|structure|page structure|layout|blocks?)\s*[:\-\u2014]?\s*\n([\s\S]{0,900})/i);
  var body=m?m[1]:t;
  var lines=body.split(/\n/).map(function(l){return l.trim()})
    .filter(function(l){return /^[*\-\u2022\d.#]+\s*\S/.test(l)})
    .map(function(l){return l.replace(/^[*\-\u2022\d.#\s]+/,'').replace(/[*_`]/g,'').trim()})
    .map(function(l){return l.split(/[\u2014\-:(]/)[0].trim()})
    .filter(function(l){return l&&l.length<=28&&/[a-z]/i.test(l)});
  if(lines.length<4)return null;
  var seen={},out=[];
  lines.forEach(function(l){
    var name=C.titleCase(l.replace(/\bsection\b/i,'').replace(/\s+/g,' ').trim());
    var k=name.toLowerCase();
    if(!name||seen[k])return;seen[k]=1;out.push(name);
  });
  return out.length>=4?out.slice(0,10):null;
}

/* The pages a brief spells out in its navigation. Shared, because both the
   gateway path and the local reader need the same answer — two copies of this
   drifted apart the moment one of them was fixed. */
function navPagesFrom(text){
  var line=String(text).split(/\n|(?<=[.!?])\s/).filter(function(l){
    return /\b(sidebar|navigation|nav items?|menu items?|left nav|navigation items)\b/i.test(l)&&l.split(',').length>=3})[0];
  if(!line)return null;
  var items=line.replace(/^[^:]*[:(]|\)/g,'')
    .replace(/\b(sticky|left|top|sidebar|navigation|nav|menu|items?|with|should|have|contain|the|a|an|plus|and)\b/gi,' ')
    .split(/\s*(?:,|\||\/)\s*/)
    .map(function(x){return C.titleCase(x.replace(/[^\w. ]/g,' ').replace(/\s+/g,' ').trim().replace(/[.\s]+$/,''))})
    .filter(function(x){return x&&x.length<=20&&/[a-z]/i.test(x)});
  if(items.length<3)return null;
  if(items[0].toLowerCase()!=='home')items.unshift('Home');
  if(!items.some(function(x){return /contact/i.test(x)}))items.push('Contact');
  return items.slice(0,8);
}

/* The model reads a brief; the brief also says things outright. A gaming
   platform came back as a portfolio with no name, while the text it was given
   said "called MADGAMES.FUN" and "gaming" a dozen times — so where the words
   are explicit and the model's answer is not supported by them, the words
   win. Nothing here overrules a field the model got from the text; it fills
   what was left blank and corrects what the text contradicts. */
function groundTurn(text){
  var b=S.brief;
  if(!b.name){
    /* A dot is part of a domain, never a sentence: allowing \w and '.' in one
       run turned "called MADGAMES.FUN. The website…" into the brand
       "MADGAMES.FUN. The". The plain capitalised form is tried first, since a
       brief that gives both usually means the shorter one for the logo. */
    var nm=text.match(/["\u201c]([^"\u201d]{1,40})["\u201d]/)
         ||text.match(/\b(?:called|named|naam)\s+((?:[A-Z][\w&']*)(?:[ -](?:[A-Z][\w&']*|of|and|&)){0,2})/)
         ||text.match(/\b(?:called|named)\s+([A-Za-z0-9][\w&']*(?:\.[A-Za-z]{2,6})+)/)
         ||text.match(/\b(?:website|site|app|brand|project)\s+name\s*[:\u2014-]?\s*([^\n.,]{2,40})/i);
    if(nm){var v=nm[1].trim().replace(/[.,]+$/,'').replace(/\s+(?:The|A|An)$/,'');if(v)b.name=v.slice(0,48)}
  }
  /* Dark or light is never a guess when the brief says it outright. */
  var wantsDark=/\b(dark|near-?black|charcoal|midnight|black (?:ui|interface|background))\b/i.test(text),
      wantsLight=/\b(light (?:ui|theme|interface|mode)|white background|bright and clean)\b/i.test(text);
  if(wantsDark&&!wantsLight&&STYLES[b.style]&&!STYLES[b.style].dark)b.style='cinematic';
  if(wantsLight&&!wantsDark&&STYLES[b.style]&&STYLES[b.style].dark)b.style='minimal';

  /* The accent, when the brief names one. A specification is full of hex —
     backgrounds, surfaces, cards — so only the sentence that says "accent"
     counts, and a colour word in it beats a hex that belongs to the page. */
  var acc=text.split(/(?<=[.!?\n])\s/).filter(function(l){return /\baccent\b/i.test(l)})[0];
  if(acc){
    var named=acc.match(/\b(lime|neon green|yellow-?green|acid green|electric blue|hot pink|neon [a-z]+|[a-z]+ green)\b/i);
    var col=(named&&findColor(named[0]))||findColor(acc.replace(/#[0-9a-f]{3,8}/gi,''))||(acc.match(/#[0-9a-f]{6}\b/i)||[])[0];
    if(col)b.accent=col;
  }

  /* The pages, when the brief lists a navigation. A model that answers with
     one page has not read the sidebar the client spelled out. */
  var navLine=navPagesFrom(text);
  if(navLine)b.pages=navLine;

  /* The model names a trade too, and it was taken as long as one of that
     trade's words appeared anywhere. An iPhone brief that says "console-quality
     gaming" once satisfied that, so the model's "games" stood and the build
     came out as a games platform. The model's answer is now held to the same
     bar as the studio's own reading. */
  var ind=bestIndustry(text);
  if(b.industry&&!industrySupported(b.industry,text)){
    var swap=ind||'other';
    if(swap!==b.industry){
      var was=INDUSTRIES[b.industry]||INDUSTRIES.other,now=INDUSTRIES[swap];
      if(now){
        b.industryOther=ind?'':b.industryOther;
        b.industry=swap;
        if(!b.pages.length||b.pages.join()===was.pages.join())b.pages=now.pages.slice();
        if(!b.features.length||b.features.join()===was.feats.join())b.features=now.feats.slice();
        if(!b.accent||b.accent===was.accent)b.accent=now.accent;
        if(!b.pitch||b.pitch===was.pitch)b.pitch='';
      }
    }
    return refineBrief(text),undefined;
  }
  if(!ind||ind===b.industry)return refineBrief(text),undefined;
  var cur=IND_WORDS[b.industry];
  if(cur&&cur.test(text))return;          /* the model's trade is in the words too */
  var old=INDUSTRIES[b.industry]||INDUSTRIES.other,P=INDUSTRIES[ind];
  if(!P)return;
  b.industry=ind;b.industryOther='';
  /* the pack that came with the wrong trade goes with it */
  if(!b.pages.length||(b.pages.join()===old.pages.join()&&!navLine))b.pages=P.pages.slice();
  if(!b.features.length||b.features.join()===old.feats.join())b.features=P.feats.slice();
  if(!b.accent||b.accent===old.accent)b.accent=P.accent;
  if(!b.pitch||b.pitch===old.pitch)b.pitch='';
  refineBrief(text);
}
/* The model could not be read. Carry on with the old path, without echoing
   the client's line twice — it is already on screen. */
function resumeInterview(text){
  var st=step();if(!st)return;
  /* The gateway failing must not cost the client their brief. This is the path
     a timeout lands on, and it was answering the question on screen with the
     whole paste — "A website. Good." — and moving on, so a two-page
     specification left the brief pane reading "not answered yet" all the way
     down. A brief goes to the reader that knows how to take one apart. */
  if(isBriefLike(text)&&(text.length>200||/\n/.test(text))){
    var got=absorbBrief(text);
    if(haveEnough(S.brief)){
      var chose=fillDefaults(S.brief);
      agentSay((got.length?L('Read that as the brief. I took ','Ise brief maan liya. Maine liya — ')+got.join(' · ')+'.<br/><br/>':'')+
               L('That is enough to start.','Itna shuru karne ke liye kaafi hai.')+saidDefaults(chose));
      S.skip=(S.skip||[]).concat(FLOW.map(function(f){return f.id}));
      S.step=0;save();
      return askCurrent(true);
    }
    if(got.length)agentSay(L('Read that as the brief. I took ','Ise brief maan liya. Maine liya — ')+got.join(' · ')+'.');
    save();
    return askCurrent(true);
  }
  if(st.type==='multi'){
    var cur=(st.val?st.val(S.brief):[]).slice();
    text.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
      var t=C.titleCase(x);if(cur.indexOf(t)<0&&cur.indexOf(x)<0)cur.push(t)});
    return answer(cur,cur.join(', '),true);
  }
  answer(text,text,true);
}

function absorbBrief(text){
  var b=S.brief,got=[];
  /* A font stack is full of capitalised words and quotes — BlinkMacSystemFont,
     "SF Pro Display", Helvetica — and every name pattern hits one of them. The
     lines that talk about type are taken out before a name is looked for. */
  var nameText=String(text).split(/\n/).filter(function(l){
    return !/\b(font|font-family|typeface|typography|stack|serif|sans-serif|monospace|helvetica|arial|blinkmac|-apple-system)\b/i.test(l);
  }).join('\n');
  if(!b.pitch){
    /* The one-liner goes under the headline, so it cannot be the instruction
       that asked for the site: "Build a complete, production-ready online
       browser gaming website called…" is not a sentence to print on a home
       page. The first sentence is used when it describes the place; when it
       gives an order, the trade's own line stands in until the copy is
       written. */
    var first=text.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s/)[0]||'';
    var orders=/^\s*(build|make|create|design|develop|generate|banao|bana do|chahiye|i want|i need|please)\b/i;
    b.pitch=(first&&first.length<=160&&!orders.test(first))?first:'';
    got.push('the brief');
  }

  /* A quoted name is exact. Unquoted, take up to three capitalised words —
     "Serenity Flow" was being cut to "Serenity" by stopping at the first
     space. */
  /* "SF Pro Display" became the project's name because it was the first quoted
     string in the brief — inside a font stack. What names a project is
     "called X", not any pair of quotes, and a quote sitting in a line about
     fonts, families or stacks is never it. */
  var quoted=null,qm=nameText.match(/["\u201c]([^"\u201d]{1,40})["\u201d]/);
  if(qm){
    var line=(text.split(/\n|(?<=[.!?])\s/).filter(function(l){return l.indexOf(qm[1])>=0})[0])||'';
    if(!/\b(font|family|stack|typeface|typography|serif|sans|weight|css)\b/i.test(line)&&
       !/\b(pro display|pro text|neue|grotesk|mono)\b/i.test(qm[1]))quoted=qm;
  }
  var nm=nameText.match(/\b(?:called|named|naam)\s+((?:[A-Z][\w&']*)(?:[ -](?:[A-Z][\w&']*|of|and|&)){0,2})/)
        /* "…bana do — Copper Oven, warm aur simple" — the dash is how people
           hand over a name in a sentence that started in Hinglish */
        ||nameText.match(/[\u2014\u2013-]\s*([A-Z][\w&']*(?:\s[A-Z][\w&']*){0,2})\b/)
        ||quoted
        /* Brands are usually written CamelCase or capitalised up front, with
           no "called" anywhere — "RamsFitness gym ki website bnao". */
        ||nameText.match(/\b([A-Z][a-z0-9]+[A-Z][\w]*)\b/)
        ||nameText.match(/^\s*([A-Z][\w&']{2,20})\b(?=\s)/);
  if(nm&&!b.name){b.name=nm[1].trim();got.push('name <b>'+C.esc(b.name)+'</b>')}

  /* Step 0 carries the agent's introduction, so leaving kind unset made the
     agent introduce itself again after the customer had already written a
     brief. Read it from the ordinary words people use. */
  if(!b.kind&&/\b(mobile app|ios|android|app store)\b/i.test(text)){b.kind='app';got.push('a mobile app')}
  else if(!b.kind&&/\b(web ?site|site|landing page|hero section|home ?page|web app|page for|websit|vebsite)\b/i.test(text)){b.kind='website';got.push('a website')}
  else if(!b.kind&&/\bapp\b/i.test(text)){b.kind='app';got.push('an app')}

  /* The client's own accent is read first. The trade pack fills the field a
     few lines down, and "Accent: deep green" was arriving too late to win. */
  if(!b.accent){
    var aLines=text.split(/\n|(?<=[.!?])\s/);
    for(var ai=0;ai<aLines.length;ai++){
      if(!/\baccent\b/i.test(aLines[ai]))continue;
      var ah=aLines[ai].match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
      var ac2=ah?('#'+ah[1]):C.findColor(aLines[ai]);
      if(ac2){b.accent=ac2;b.__accentAsked=1;got.push('accent <b>'+C.esc(ac2)+'</b>');break}
    }
  }

  var ind=bestIndustry(text);
  if(ind&&!b.industry){
    b.industry=ind;
    got.push(INDUSTRIES[ind]?INDUSTRIES[ind].l:ind);
    /* Answering the industry question is what loads that trade's page set and
       feature list. Setting the field directly skipped that, so the pages
       step opened with nothing ticked and Continue did nothing — the flow
       dead-ended on a screen that looked fine. */
    var P=INDUSTRIES[ind];
    if(P){
      if(!(b.pages||[]).length&&P.pages)b.pages=P.pages.slice();
      if(!(b.features||[]).length&&P.feats)b.features=P.feats.slice();
      if(!b.accent&&P.accent)b.accent=P.accent;
    }
  }

  var gl=matchOne(GOAL_WORDS,text);
  if(gl&&!b.goal){b.goal=gl;got.push(GOALS[gl]||gl)}

  var st=matchOne(STYLE_WORDS,text);
  if(st&&!b.style){b.style=st;got.push((STYLES[st]?STYLES[st].l:st)+' look')}

  var fe=matchMany(FEAT_WORDS,text);
  if(fe.length){
    b.features=(b.features||[]).slice();
    fe.forEach(function(f){if(b.features.indexOf(f)<0)b.features.push(f)});
    got.push(fe.map(function(f){return FEATURES[f]?FEATURES[f].l:f}).join(', '));
  }

  /* Not the first hex in the brief — that is usually the background. A brief
     that names its palette names several, and only the one in a sentence about
     the accent is the accent; a hex sitting in a background or surface line is
     explicitly not. */
  if(!b.accent){
    var lines=text.split(/\n|(?<=[.!?])\s/);
    var acc='',i2;
    for(i2=0;i2<lines.length;i2++){
      if(!/\baccent\b/i.test(lines[i2]))continue;
      var m2=lines[i2].match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
      if(m2){acc='#'+m2[1];break}
      var named=C.findColor(lines[i2]);
      if(named){acc=named;break}
    }
    if(!acc){
      for(i2=0;i2<lines.length;i2++){
        if(/\b(background|bg|surface|card|canvas|base)\b/i.test(lines[i2]))continue;
        var m3=lines[i2].match(/#([0-9a-f]{6}|[0-9a-f]{3})\b/i);
        if(m3){acc='#'+m3[1];break}
      }
    }
    if(acc){b.accent=acc;b.__accentAsked=1;got.push('accent <b>'+C.esc(acc)+'</b>')}
  }

  got=got.concat(refineBrief(text));

  /* Only skip what is now actually filled. */
  S.skip=(S.skip||[]).slice();
  [['name',b.name],['industry',b.industry],['pitch',b.pitch],['goal',b.goal],
   ['style',b.style],['accent',b.accent],['kind',b.kind],
   ['features',(b.features||[]).length]].forEach(function(pair){
    if(pair[1]&&S.skip.indexOf(pair[0])<0)S.skip.push(pair[0]);
  });
  /* advance() is what normally pushes the name into the top bar; absorbing
     skips it, so the project stayed "Untitled project" with a name in hand. */
  if(b.name&&!S.projectName){
    S.projectName=b.name;
    var el=$('#projName');if(el)el.textContent=b.name;
  }
  save();
  return got;
}

/* A pasted brief is raw material, not a form. Whatever the words imply and
   nobody spelled out is decided here — once, from the brief's own language —
   and every decision is handed back in the reply so the client can argue with
   it instead of discovering it in the build. Nothing is overwritten: this only
   fills what is still empty, and only when the brief points somewhere. */
function refineBrief(text){
  var b=S.brief,t=String(text||'').toLowerCase(),chose=[];

  /* A long, specified brief has earned the deeper build. Lite is for a
     sentence; someone who wrote out sections and a nav wants the sections. */
  if(S.depth!=='pro'&&(text.length>520||/\b(production[- ]ready|complete|full (?:site|website)|premium|detailed|sections?)\b/i.test(text))){
    S.depth='pro';setDepthLabel();
    chose.push('the deeper build — stats, testimonials, an FAQ and a marquee');
  }

  /* The look. Read dark first: "premium dark gaming interface" is a dark
     brief that happens to use the word premium, and answering it with Luxury
     warm gives a games platform a brown page. */
  if(!b.style){
    var look=/\b(dark|near-?black|charcoal|midnight|neon|gaming interface|cinematic|immersive|dramatic)\b/.test(t)?'cinematic':
             /\b(editorial|magazine|type[- ]led|serif)\b/.test(t)?'editorial':
             /\b(luxur|high[- ]end|elegant|classy|boutique|gold)\b/.test(t)?'luxury':
             /\b(minimal|clean|simple|airy|calm|white background|light (?:and )?airy)\b/.test(t)?'minimal':
             /\b(playful|fun|colou?rful|youth|kids)\b/.test(t)?'playful':'';
    if(look&&STYLES[look]){b.style=look;chose.push('a '+STYLES[look].l.toLowerCase()+' look')}
  }

  /* The pages, when the brief lists a navigation. A client who spelled out
     fourteen menu items should not get the trade's five defaults. */
  var P0=INDUSTRIES[b.industry]||INDUSTRIES.other;
  var nav=navPagesFrom(text);
  if(nav&&(!b.pages.length||b.pages.join()===P0.pages.join())){
    b.pages=nav;
    chose.push('the pages from your navigation — '+b.pages.join(', '));
  }

  /* A trade's own accent belongs to its own palette. When the style changed
     after the accent was chosen, the pairing is nobody's decision — put the
     trade's accent back unless the client named a colour. */
  if(b.style&&b.accent&&!/#/.test(text)&&!/\b(colou?r|accent|rang)\b/i.test(text)){
    var PA=INDUSTRIES[b.industry]||INDUSTRIES.other;
    if(PA.accent&&b.accent!==PA.accent&&STYLES[b.style]&&STYLES[b.style].dark!==undefined){
      /* only when the two clash: a light accent on a warm dark page, say */
      var acc=C.hexToRgb(b.accent),bg=C.hexToRgb(STYLES[b.style].bg);
      var warmBg=bg[0]>bg[2],coolAccent=acc[2]>acc[0]+30;
      if(warmBg&&coolAccent){b.accent=PA.accent;chose.push('the accent this trade is built around')}
    }
  }

  /* "Premium, minimal, futuristic, dark" picked Minimal light, because the
     style words were read before the word dark. Dark wins when both appear —
     nobody writes "dark" about a white page. */
  if(/\b(dark|near-?black|charcoal|midnight|black background|night mode)\b/i.test(text)&&
     STYLES[b.style]&&!STYLES[b.style].dark){
    b.style='cinematic';chose.push('the dark palette the brief asks for');
  }

  /* A background the brief actually names settles the palette. "Premium" put
     a gaming platform on Luxury warm — a brown page — while the same brief
     said its background was #0E0F12: near-black and neutral, which is the
     cinematic palette, not the warm one. */
  var bgLine=text.split(/\n|(?<=[.!?])\s/).filter(function(l){return /\b(background|bg|base|canvas|surface)\b/i.test(l)})[0];
  var bgHex=bgLine&&(bgLine.match(/#[0-9a-f]{6}\b/i)||[])[0];
  if(bgHex){
    var rgb=C.hexToRgb(bgHex),mx=Math.max(rgb[0],rgb[1],rgb[2]),mn=Math.min(rgb[0],rgb[1],rgb[2]);
    var nearBlack=mx<70,neutral=(mx-mn)<26;
    if(nearBlack&&neutral&&b.style!=='cinematic'&&b.style!=='editorial'){
      b.style='cinematic';chose.push('the near-black palette your background asks for');
    }
  }

  /* One page or a site. A brief that lists chapters, or says so outright,
     gets a single scrolling page — which is what an "Apple keynote" brief is
     describing, and what a multi-page build gets wrong. */
  if(!b.__onepage){
    var chapters=sectionListFrom(text);
    var saysOne=/\b(one[- ]pager?|single page|one page|landing page|scroll(?:ing|y)? page|long page)\b/i.test(text);
    if(chapters&&(saysOne||/\b(hero|footer)\b/i.test(chapters.join(' ')))){
      b.__onepage=chapters;
      chose.push('one long page with your sections — '+chapters.slice(0,6).join(', ')+
        (chapters.length>6?'…':''));
    }else if(saysOne){
      b.__onepage=['Hero','About','Features','Gallery','Contact'];
      chose.push('one long scrolling page');
    }
    if(b.__onepage)b.pages=['Home'];
  }

  /* Which art direction. The brief decides when it says something about the
     look; otherwise it rotates, so two clients in the same trade do not get
     the same page in a different colour. */
  if(!b.__dir){
    var dir=/\b(editorial|magazine|serif|type[- ]led|newspaper)\b/.test(t)?'editorial':
            /\b(grid|swiss|precise|technical|minimal|clean|architect)\b/.test(t)?'swiss':
            /\b(soft|rounded|friendly|warm|calm|gentle|kids|family)\b/.test(t)?'soft':
            /\b(bold|loud|brutal|strong|heavy|impact|street)\b/.test(t)?'bold':
            /\b(cinematic|premium|luxur|dark|immersive|dramatic)\b/.test(t)?'cinematic':'';
    if(!dir){
      /* nothing said — rotate on the project's own name so it is stable for
         this build and different for the next client */
      var seed=0,nm=String(b.name||'x');
      for(var si=0;si<nm.length;si++)seed=(seed*31+nm.charCodeAt(si))>>>0;
      dir=G.DIR_KEYS[(seed+(b.variant||0))%G.DIR_KEYS.length];
    }
    b.__dir=dir;
    chose.push('a '+(G.DIRS[dir]?G.DIRS[dir].l.toLowerCase():dir)+' direction');
  }

  /* How much it moves. */
  if(!b.motion){
    b.motion=/\b(3d|parallax|immersive|hover zoom|animated|motion|cinematic)\b/.test(t)?'full':
             /\b(no animation|static|calm|quiet|subtle)\b/.test(t)?'subtle':'cinematic';
    if(b.motion!=='cinematic')chose.push(b.motion==='full'?'full motion':'motion kept subtle');
  }

  /* Who it is for — briefs usually say, in passing. */
  if(!b.audience){
    var aud=text.match(/\bfor\s+((?:teenagers?|adults?|students?|professionals?|families|kids|gamers?|players?|beginners?|businesses)[^.\n]{0,60})/i);
    if(aud){b.audience=aud[1].trim().slice(0,120);chose.push('written for '+b.audience.toLowerCase())}
  }

  /* Things the brief asks for by name that the feature list already knows. */
  var extra={accounts:/\b(account|sign ?up|log ?in|profile|favou?rites|saved|leaderboard)\b/i,
    analytics:/\b(analytics|tracking|engagement|most played|popular)\b/i,
    gallery:/\b(thumbnail|gallery|screenshots?|images?|cards?)\b/i,
    store:/\b(shop|store|checkout|buy|purchase|cart)\b/i,
    blog:/\b(blog|news|articles?|updates page)\b/i,
    forms:/\b(contact form|enquiry|inquiry|support form|get in touch)\b/i,
    multilang:/\b(international|multi[- ]?lingual|languages?|translat)\b/i,
    chat:/\b(live chat|support widget|whatsapp)\b/i};
  var added=[];
  b.features=(b.features||[]).slice();
  Object.keys(extra).forEach(function(f){
    if(FEATURES[f]&&extra[f].test(text)&&b.features.indexOf(f)<0){b.features.push(f);added.push(FEATURES[f].l)}
  });
  if(added.length)chose.push(added.join(', ').toLowerCase());

  /* A one-liner for the page, when the brief only gave instructions. */
  if(!b.pitch){
    var P=INDUSTRIES[b.industry]||INDUSTRIES.other;
    b.pitch=P.pitch;chose.push('a one-liner you can rewrite in a sentence');
  }
  if(chose.length)save();
  return chose.map(function(c){return 'chose '+c});
}

/* Everything the panels hold, reachable by asking. The studio put publishing,
   domains, credits and the rest behind a sidebar; a client who only wants to
   talk should not have to find them. Read-only answers come back in the chat;
   anything that reaches the outside world opens its panel instead of firing,
   so publishing is still a decision someone makes on purpose. */
var PANEL_WORDS=[
  [/\b(publish|publishing|live kar|deploy)\b/i,'publishing','Publishing'],
  [/\b(domains?|url|address|dns)\b/i,'domains','Domain'],
  [/\b(database|data|table)\b/i,'database','Data'],
  [/\b(login|users|account|sign ?out|log ?out)\b/i,'users','Login & Users'],
  [/\b(storage|files? upload|media)\b/i,'storage','Storage'],
  [/\b(security|session|revoke)\b/i,'security','Security'],
  [/\b(github|git|repo)\b/i,'git','GitHub'],
  [/\b(api ?key|secret|token)\b/i,'secrets','API Keys'],
  [/\b(connections?|integrat\w*|connect)\b/i,'integrations','Connections'],
  [/\b(health|monitor|uptime)\b/i,'monitoring','Site Health'],
  [/\b(activity|history|log)\b/i,'log','Activity'],
  [/\b(plan|sections?|structure)\b/i,'plan','Plan'],
  [/\b(files?|code)\b/i,'files','Files']
];
/* Questions worth answering outright, from state we already hold. */
function answerAbout(text){
  var t=String(text);
  /* On a phone the studio is now the whole workspace, and there is no billing
     panel in here — so asking is the only way to see a balance. Say the number
     and say plainly where topping up happens, rather than opening the project
     Plan panel, which is about pages and has nothing to do with money. */
  if(/\b(credit|credits|balance|billing|top ?up|recharge|kitne credit|paisa|payment|subscription)\b/i.test(t)){
    var w=API.credits&&(API.credits.wallet||API.credits);
    if(!signedIn())return 'Sign in and I can tell you your balance.';
    if(!w)return 'I cannot read your balance right now.';
    return 'You have '+Number(w.available).toLocaleString()+' credits, and have used '+
           Number(w.lifetimeUsed||0).toLocaleString()+'.<br/><br/>'+
           'Buying more is not something I can do from here \u2014 open Scen on a laptop for billing.';
  }
  if(/\b(kitni files|how many files|files bani)\b/i.test(t))
    return S.files.length?'The build made '+S.files.length+' files. They are all under Files, and downloadable.'
                         :'Nothing is built yet.';
  if(/\b(signed in|logged in|kaun|who am i)\b/i.test(t))
    return signedIn()?'Signed in as '+esc(accountName())+'.':'Not signed in.';
  return '';
}
function panelAsk(text){
  /* "button ka code change karo" contains "code" and "karo" and is plainly an
     edit, not a request for the Files panel. Any edit verb settles it — the
     panels are asked for, never worked on. */
  if(INTENT.edit.test(text))return null;
  if(INTENT.feel.test(text))return null;
  /* And the ask itself has to be navigational. "karo" alone is not; it ends
     half the change requests in this language. */
  if(!/\b(kholo|khol|dikha|dikhao|dekhna|show|open|where|kahan|kidhar|kaise|kaha)\b/i.test(text))return null;
  for(var i=0;i<PANEL_WORDS.length;i++)if(PANEL_WORDS[i][0].test(text))return PANEL_WORDS[i];
  return null;
}

function handleText(text){
  var atts=S.atts.slice();
  clearNextChips();

  /* Something is selected in the preview: this message is about that. */
  if(S.pick){
    var swapped=applyPick(text);
    if(swapped){
      userSay(text,atts);S.atts=[];renderAtts();
      if(S.built)rebuild(swapped);
      else{save();agentSay(swapped);}
      return;
    }
  }

  /* A pasted brief is not a question about the studio. These two rules read
     word by word, so a specification with a "BuySection" in its section list
     came back as a credits balance — the client's whole brief answered with
     "You have 4,277 credits". Anything this long is a brief, and goes to the
     reader that knows what to do with one. */
  var pasted=text.length>320||text.split(/\n/).length>4;

  /* A second brief pasted into a finished project used to be read as an edit
     of the first one, so an iPhone concept inherited the games platform that
     was already in the brief — its trade, its pages, its whole catalogue. A
     brief that arrives on top of a built project is a decision, and it is the
     client's to make. */
  /* Not only a finished project: a half-answered one still carries a name,
     a trade and a page set, and folding a new brief into it is how an iPhone
     brief inherited a games catalogue. */
  var hasProject=S.built||S.phase==='review'||!!S.brief.name||(S.brief.pages||[]).length>0;
  if(pasted&&hasProject&&!S.__newAsked){
    userSay(text,atts);S.atts=[];renderAtts();
    S.__newAsked=text;save();
    agentSay(L('That reads like a new brief. The project open here is <b>'+esc(S.brief.name||'untitled')+
        '</b> — should I start fresh, or fold this into it?',
      'Ye naya brief lag raha hai. Abhi <b>'+esc(S.brief.name||'untitled')+
        '</b> khula hai — naya shuru karun ya isi mein jodun?'));
    var pick=document.createElement('div');
    pick.id='answerBox';pick.className='msg agent';pick.style.marginTop='-8px';
    pick.innerHTML='<div class="chips">'+
      '<button data-new="1">'+L('Start a new project','Naya project banao')+'</button>'+
      '<button data-new="0">'+L('Change this one','Isi mein badlo')+'</button></div>';
    pick.addEventListener('click',function(e){
      var t=e.target.closest('button[data-new]');if(!t)return;
      var again=S.__newAsked;clearAnswerBox();
      if(t.dataset.new==='1'){
        resetState();S.__newAsked=again;
        renderTools();setMode('design');setPhasePill();setTab('tools',true);
        agentSay(L('Fresh project. Reading your brief.','Naya project. Aapka brief padh raha hoon.'));
      }else agentSay(L('Folding it into this one.','Isi mein jod raha hoon.'));
      setTimeout(function(){handleText(again)},220);
    });
    body.appendChild(pick);scrollChat();
    return;
  }
  S.__newAsked='';

  /* Asking about the studio itself — credits, files, who am I — is answered
     here rather than treated as a design change. */
  var about=pasted?null:answerAbout(text);
  if(about){userSay(text,atts);S.atts=[];renderAtts();agentSay(about);return}

  var panel=pasted?null:panelAsk(text);
  if(panel){
    userSay(text,atts);S.atts=[];renderAtts();
    if(uiMode()!=='advanced'&&['plan','files','log'].indexOf(panel[1])<0)setUiMode('advanced');
    S.tool=panel[1];setTab('tools');save();renderTools();renderMain();
    agentSay('Opened <b>'+esc(panel[2])+'</b> on the right.');
    return;
  }

  /* §37 — a message sent while the build runs used to go straight to the edit
     path, mutating the brief the generator was still reading. Hold it instead;
     it is applied the moment the build finishes, so nothing said is lost. */
  if(S.phase==='building'){
    userSay(text,atts);S.atts=[];renderAtts();
    S.queued=(S.queued||[]).concat([text]);save();
    agentSay('Noted — I will do that as soon as this build finishes.');
    return;
  }

  if(S.phase==='interview'){
    var st=step();
    if(!st)return;

    var intent=readIntent(text);

    /* "hi" is not the answer to whatever question is on screen — it used to
       become the project's name. Small talk gets a reply and the question is
       asked again. */
    if(intent.kind==='greeting'){
      userSay(text,atts);S.atts=[];renderAtts();
      agentSay(L('Hello. Tell me what you want built — a line about the business is enough to start.',
                 'Namaste. Bataiye kya banwana hai — business ke baare mein ek line kaafi hai.'));
      return askCurrent(true);
    }

    /* A change asked for during the interview is not the answer to whatever
       question is on screen. This has to be read BEFORE the gateway extracts
       a turn: the extractor's job is to fill the brief, so "make it deep
       blue" came back as the project's name and the preview never moved. With
       the preset sitting in the preview from the first second, asking for a
       change before the questions are done is the normal thing to do, not the
       exception. */
    var isEdit=intent.kind==='edit'&&(S.brief.name||presetHome());
    /* The preset's own furniture — top bar, links, film, photographs — named
       in a sentence that asks for something to be done to it. INTENT.edit is
       about the brief and does not know these words, so "link the Download
       button to …" scored as an answer and its URL was filed as a reference
       site. Only a local, checked edit is accepted on this route; anything it
       cannot place carries on as an answer. */
    /* classify() already calls a long paste a brief, so isEdit is false for
       one — but the preset sniff reads words, and a specification mentions
       menus, logos and buttons all the way down it. */
    var oneLine=text.length<=320&&text.split(/\n/).length<=4&&intent.kind!=='brief';
    if(isEdit||(oneLine&&presetHome()&&looksLikePresetEdit(text))){
      var was=presetHome()?presetPage():'';
      var did=parseEdit(text);
      if(did){
        userSay(text,atts);S.atts=[];renderAtts();
        save();
        var now=presetHome()?presetPage():'';
        agentSay(did+(was&&now&&was!==now?'<br/><br/>'+L('It is in the preview.','Preview mein aa gaya.'):
          presetHome()?'<br/><br/>'+L('That one shows up when the site is built.','Ye site banne par dikhega.'):''));
        return askCurrent(true);            /* back to the open question */
      }
      if(isEdit&&X.usable()){
        userSay(text,atts);S.atts=[];renderAtts();
        var te=Date.now();thinking();
        X.readEdit(text,S.brief,transcript()).then(function(o){
          clearThinking();setAiPill();
          var changed=o?applyPatch(o):[];
          if(changed.length){
            agentSay(changed.join('<br/>'),Math.max(1,Math.round((Date.now()-te)/1000)));
            save();return askCurrent(true);
          }
          agentSay(esc(String((o&&o.reply)||'').slice(0,240))||
                   'I did not catch what to change \u2014 say it plainly and I will fix it.');
          askCurrent(true);
        }).catch(function(){clearThinking();askCurrent(true)});
        return;
      }
      /* nothing local to apply and no gateway — let it be an answer */
    }

    /* One prompt, then the build.

       This used to be fourteen questions — trade, name, one-liner, goal,
       audience, pages, features, style, accent, motion, content, languages,
       domain — and a plan to approve at the end of them. Every one of those is
       a decision a designer makes and shows you, not a form a client fills in,
       and all of them are still changeable by saying so afterwards. So the
       first real sentence is the brief: it goes to the model, the model
       decides the rest, and the build starts. Nothing in between.

       Three things still are not a brief and are handled above or below:
       small talk, an edit to what is already in the preview, and a question
       about the studio itself. */
    if(intent.kind!=='question'&&text.trim().split(/\s+/).length>=2){
      userSay(text,atts);S.atts=[];renderAtts();
      var bare=text.trim().match(/^(?:a |an )?(website|web ?site|site|app|mobile app|both|website \+ app|website and app)[.!]?$/i);
      if(bare){
        var w=bare[1].toLowerCase();
        S.brief.kind=/both|and/.test(w)?'both':(/app/.test(w)?'app':'website');
        save();
        agentSay(L('Right. And what is it for? One line about the business — I take it from there.',
                   'Theek hai. Kis cheez ke liye? Business ke baare mein ek line — aage main sambhal loonga.'));
        return;
      }
      return startFromPrompt(text);
    }

    /* §47 — extraction first. Ask the model what this turn actually contained
       before deciding what to say; the predefined next question is what made
       the studio re-ask things the client had already told it. Everything
       below stays as the fallback when the gateway is absent or the JSON is
       unusable, so nothing here can strand a conversation. */
    if(X.usable()){
      userSay(text,atts);S.atts=[];renderAtts();
      thinking();
      X.readTurn(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        if(!o){
          /* Falling back silently is why a signed-in test looked identical to
             a signed-out one. failed() already recorded why; say it once. */
          if(AI.lastError)agentSay('The gateway did not answer that \u2014 '+
            esc(String(AI.lastError).slice(0,120))+'. Carrying on without it.');
          return resumeInterview(text);
        }
        if(o)o.__text=text;
        applyTurn(o);
        if(o.reply)agentSay(esc(String(o.reply).slice(0,300)));
        if(o.ready_to_build&&haveEnough(S.brief)){
          var chose=fillDefaults(S.brief);
          if(chose.length)agentSay(saidDefaults(chose).replace(/^<br\/><br\/>/,''));
          S.skip=(S.skip||[]).concat(FLOW.map(function(f){return f.id}));
          S.step=0;save();return askCurrent(true);
        }
        var said=String(o.reply||'').replace(/\s+/g,' ').trim().toLowerCase();
        var asks=String(o.next_question||'').replace(/\s+/g,' ').trim().toLowerCase();
        /* the model often puts the same sentence in both; asking it twice in a
           row is what made the studio look like it had lost the thread */
        if(o.should_ask_question&&o.next_question&&asks!==said){
          agentSay(esc(String(o.next_question).slice(0,240)));
          S.awaitingFree=true;save();return;
        }
        save();askCurrent(true);
      }).catch(function(){clearThinking();resumeInterview(text)});
      return;
    }

    /* A question mid-interview goes the same way — asked about the site, not
       answering the question on screen. Edits are handled further up, before
       the extractor sees them. */
    if(intent.kind==='question'&&S.brief.name&&X.usable()){
      userSay(text,atts);S.atts=[];renderAtts();
      var t0=Date.now();thinking();
      X.readEdit(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        var changed=o?applyPatch(o):[];
        if(changed.length){
          agentSay(changed.join('<br/>'),Math.max(1,Math.round((Date.now()-t0)/1000)));
          save();return askCurrent(true);        /* back to the open question */
        }
        agentSay(esc(String((o&&o.reply)||'').slice(0,240))||
                 'I did not catch what to change \u2014 say it plainly and I will fix it.');
        askCurrent(true);
      }).catch(function(){clearThinking();askCurrent(true)});
      return;
    }

    if(intent.ref){
      userSay(text,atts);S.atts=[];renderAtts();
      S.brief.reference=intent.ref;
      /* Only if something meaningful survived. Stripping the URL out of
         "clone of <site>" leaves "of", which is not a pitch. */
      if(intent.rest.length>8)S.brief.pitch=S.brief.pitch||intent.rest;
      save();
      /* Said plainly, because Scen builds in the direction of a reference —
         it does not reproduce someone else's site, and implying otherwise
         would set up a promise the build cannot keep. */
      agentSay('Noted <b>'+C.esc(intent.ref)+'</b> as a reference. I will take the '+
        'layout and feel as direction — I build your own site from it, not a copy of theirs.');
      if(looksLikeBrief(st,text)){askCurrent(true);return}
      return askCurrent(true);
    }
    /* "Hi" is not a brief. Small talk should stay conversation — the machine
       used to file it as the answer to whatever question was on screen. */
    if(/^\s*(hi+|hey|hello|yo|hola|namaste|sup|good (morning|evening|afternoon))\b[\s!.?]*$/i.test(text)){
      userSay(text,atts);S.atts=[];renderAtts();
      agentSay('Hey. What do you want to build?');
      return;
    }

    /* A pasted brief or spec answers several questions at once. */
    if(isBriefLike(text)){
      userSay(text,atts);S.atts=[];renderAtts();
      var got=absorbBrief(text);
      /* Enough to start beats asking the rest. Someone who wrote a brief
         should see progress, not eleven more questions — the defaults are all
         things they can change afterwards. */
      if(haveEnough(S.brief)){
        var chose2=fillDefaults(S.brief);
        agentSay((got.length?L('Read that as the brief. I took ','Ise brief maan liya. Maine liya — ')+got.join(' · ')+'.<br/><br/>':'')+
                 L('That is enough to start.','Itna shuru karne ke liye kaafi hai.')+saidDefaults(chose2));
        S.skip=(S.skip||[]).concat(FLOW.map(function(f){return f.id}));
        S.step=0;save();
        return askCurrent(true);        /* walks past everything to finishInterview() */
      }
      agentSay(got.length
        ? 'Read that as the brief. I took '+got.join(' · ')+'. I will ask only what is still missing.'
        : 'Kept that as the brief.');
      S.step=0;                        /* re-enter and let skip jump the answered ones */
      return askCurrent(true);
    }
    if(looksLikeBrief(st,text)){
      userSay(text,atts);S.atts=[];renderAtts();
      S.brief.pitch=text;save();
      agentSay('Got it — I have kept that as the brief. What should the site be <b>called</b>?');
      return;
    }

    /* The word lists ran out. Rather than growing them forever, let the model
       settle it: hand it the sentence and the conversation, and if it comes
       back with nothing to change then it was an answer after all. Gated hard
       so the ordinary case stays instant and free. */
    if(intent.kind==='answer'&&S.brief.name&&X.usable()&&ambiguous(st,text)){
      userSay(text,atts);S.atts=[];renderAtts();
      var at0=Date.now();thinking();
      X.readEdit(text,S.brief,transcript()).then(function(o){
        clearThinking();setAiPill();
        var changed=o?applyPatch(o):[];
        if(changed.length){
          agentSay(changed.join('<br/>'),Math.max(1,Math.round((Date.now()-at0)/1000)));
          save();return askCurrent(true);
        }
        answer(text,text,true);          /* quiet: the echo is already on screen */
      }).catch(function(){clearThinking();answer(text,text,true)});
      return;
    }

    if(st.type==='multi'){
      var cur=(st.val?st.val(S.brief):[]).slice();
      text.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
        var t=C.titleCase(x);if(cur.indexOf(t)<0&&cur.indexOf(x)<0)cur.push(t)});
      return answer(cur,cur.join(', '));
    }
    return answer(text,text);
  }
  if(S.phase==='review'){userSay(text,atts);S.atts=[];renderAtts();return handleReviewText(text)}
  userSay(text,atts);
  if(atts.length){S.brief.refs=S.brief.refs.concat(atts);S.atts=[];renderAtts()}
  applyEdit(text);
}

/* ============================================================
   Review → plan → build
   ============================================================ */
var SECLABEL={hero:'Hero',phero:'Page header',logos:'Marquee',statement:'Statement',services:'Services',servicelist:'Service detail',
  showcase:'Gallery',stats:'Stats',products:'Products',booking:'Booking',pricing:'Pricing',
  testimonial:'Testimonial',faq:'FAQ',posts:'Blog teaser',team:'Team',contact:'Contact form',
  map:'Map',steps:'Process',prose:'Story',cta:'Call to action'};

function planData(){
  var b=S.brief,pro=S.depth==='pro';
  var pages=b.pages.map(function(p){
    return{name:p,file:G.pageFile(p),secs:G.sectionsFor(p,b,pro)}});
  var total=pages.reduce(function(n,p){return n+p.secs.length},0);
  var files=pages.length+2+((b.kind==='app'||b.kind==='both')?2:0)+2;
  var credits=total*2+b.features.length*8+((b.kind==='both')?30:b.kind==='app'?18:0);
  return{pages:pages,sections:total,files:files,credits:credits};
}

/* One sentence saying what is about to happen, in the order it happens. */
function intentLine(b){
  var what=b.kind==='app'?L('app','app'):b.kind==='both'?L('site and app','site aur app'):L('site','site');
  if(b.__base){
    var m=null;for(var i=0;i<BASES.length;i++)if(BASES[i].name===b.__base)m=BASES[i];
    var shown=C.titleCase(String(b.__base).toLowerCase());
    return L("I'll build <b>"+esc(b.name)+"</b> on <b>"+esc(shown)+"</b> — "+(m?m.what:'one of our built pages')+
             " — and make it yours: your name, your words, your colour. The rest of the pages are written around it.",
             "<b>"+esc(b.name)+"</b> ko <b>"+esc(shown)+"</b> par bana raha hoon — "+(m?m.what:'hamara bana hua page')+
             " — aur ise aapka bana dunga: aapka naam, aapke shabd, aapka colour. Baaki pages iske aas-paas likhunga.");
  }
  return L("I'll build <b>"+esc(b.name)+"</b> — your "+what+". Designing the interface first "+
           "(palette, type, layout), then writing the pages. The preview fills in as it goes.",
           "<b>"+esc(b.name)+"</b> bana raha hoon — aapki "+what+". Pehle interface design karunga "+
           "(colour, type, layout), phir pages likhunga. Preview saath-saath bharega.");
}

/* The client's first sentence, turned into a build without asking anything.
   The model reads it properly when the gateway is up; the word lists read it
   when it is not. Either way the missing decisions are made here, said in one
   line, and every one of them can be changed by talking afterwards. */
/* The best pages in this product are the hand-built ones under /templates —
   Nova is a seventeen-section product launch with sticky scroll scenes and a
   live colour picker, and the generator does not write anything close to it.
   Until now a typed brief could never reach them: they arrived only by
   pressing Customize in the gallery, so someone who asked for an Apple-style
   launch page got the generic brochure the section writer produces.

   A base is used only on a clear match — a phone brief gets Nova, a bakery
   brief gets nothing and the generator writes it as before. Home becomes that
   page carrying the client's name, one-liner and accent; the rest of the site
   is generated around it, which is exactly what Customize already does. */
/* `name` is the word as the page actually writes it: the swap that puts the
   client's name in is case-sensitive, and nova.html says NOVA in all thirteen
   places, so 'Nova' replaced nothing and the build came out still called
   after the template. */
var BASES=[
  {slug:'nova',file:'/templates/nova.html',name:'NOVA',accent:'#0071e3',
   title:'NOVA',subtitle:'Powerful. Beautiful.',
   what:'a cinematic product launch page',
   re:/\b(apple|iphone|phone|smartphone|handset|device|hardware|gadget|laptop|macbook|tablet|ipad|watch|earbud|headphone|drone|console|product launch|launch page|flagship)\b/i},
  {slug:'aura',file:'/templates/aura.html',name:'AURA',accent:'#7FD8FF',title:'AURA',
   what:'a dark product page',
   re:/\b(titanium|matte black|dark product|night mode|stealth)\b/i},
  {slug:'worlds',file:'/templates/worlds.html',name:'Worlds',accent:'#f6f3ec',
   what:'a film-led studio page',
   re:/\b(creative agency|design studio|production house|film studio|vfx|animation studio|immersive)\b/i},
  {slug:'lumora',file:'/templates/lumora.html',name:'Lumora',accent:'#182C41',
   what:'a calm, mood-switching page',
   re:/\b(mindful|meditat|wellness|yoga|calm|breathwork|therapy|mental health)\b/i},
  {slug:'serene',file:'/templates/serene.html',name:'Serene',accent:'#6BADC4',
   what:'a beauty and wellness page',
   re:/\b(beauty|salon|skincare|spa|cosmetic|aesthetic clinic|makeup)\b/i},
  {slug:'synthetic-nature',file:'/templates/synthetic-nature.html',name:'Synthetic Nature',accent:'#ffffff',
   what:'a slow, photographic page',
   re:/\b(photograph|photo studio|wildlife|nature film|documentary|landscape)\b/i},
  {slug:'synapsex',file:'/templates/synapsex.html',name:'SynapseX',accent:'#61ff9e',
   what:'a scroll-scrubbed technology page',
   re:/\b(neuro|biotech|ai research|machine learning|deep tech|robotics|quantum)\b/i},
  {slug:'frame',file:'/templates/frame.html',name:'FRAME',accent:'#d50000',title:'FRAME',
   what:'an editorial film page',
   re:/\b(film|cinema|motion design|music video|editorial fashion)\b/i}
];
function matchBase(text){
  var t=String(text||'');
  for(var i=0;i<BASES.length;i++)if(BASES[i].re.test(t))return BASES[i];
  return null;
}
/* Fetch it before the build starts, and drop it silently if it will not load —
   a base that is not there is not a reason to stop building. */
function withBase(text,cb){
  if(presetFile()||presetState==='ready')return cb();
  var m=matchBase(text+' '+(S.brief.pitch||'')+' '+(S.brief.name||''));
  if(!m)return cb();
  S.preset={slug:m.slug,file:m.file,name:m.name,title:m.title||'',subtitle:m.subtitle||'',accent:m.accent||''};
  S.brief.__base=m.name;save();
  var settled=false;
  var give=setTimeout(function(){
    if(settled)return;settled=true;
    S.preset=null;delete S.brief.__base;save();cb();
  },7000);
  loadPreset(function(){
    if(settled)return;settled=true;clearTimeout(give);
    if(presetState!=='ready'){S.preset=null;delete S.brief.__base;save()}
    cb();
  });
}

function startFromPrompt(text){
  var b=S.brief;
  absorbBrief(text);
  if(!b.pitch)b.pitch=String(text).replace(/\s+/g,' ').trim().slice(0,180);
  var t0=Date.now();
  thinking();

  function go(){
    if(!b.name)b.name=C.suggestName(b);
    fillDefaults(b);
    if(!S.projectName){S.projectName=b.name;$('#projName').textContent=b.name}
    /* nothing is left to ask, and nothing may re-ask it */
    S.skip=(S.skip||[]).concat(FLOW.map(function(f){return f.id}));
    S.step=FLOW.length;save();refreshTools();
    withBase(text,function(){
      clearThinking();
      agentSay(intentLine(b),Math.max(1,Math.round((Date.now()-t0)/1000)));
      setTimeout(startBuild,340);
    });
  }

  if(!X.usable()){setTimeout(go,700);return}
  X.readTurn(text,b,transcript()).then(function(o){
    setAiPill();
    if(o){o.__text=text;applyTurn(o)}
    go();
  }).catch(go);
}

function finishInterview(){
  S.phase='review';save();setPhasePill();
  input.placeholder='Reply, or ask for a change…';
  var b=S.brief,P=planData();
  /* This was a specification read back to the client — pages, sections,
     modules, accent, motion — sitting between them and the thing they asked
     for. It is all on the right, and all of it changes on request. One line. */
  var lines=intentLine(b);

  var t0=Date.now();thinking();
  setTimeout(function(){
    clearThinking();
    agentSay(lines,Math.max(2,Math.round((Date.now()-t0)/1000)));
    S.tool='plan';renderTools();renderMain();
    if(S.planFirst){
      agentSay(L('The full plan is open on the right — every page with the sections I will write into it. Approve it and I start writing files.',
        'Poora plan daayin taraf khula hai — har page aur usme jo sections likhunga. Approve karo, main files likhna shuru karta hoon.'));
      var box=document.createElement('div');
      box.id='answerBox';box.className='msg agent';box.style.marginTop='-8px';
      box.innerHTML='<div class="chips">'+
        '<button data-go="build">✦  '+L('Approve &amp; build','Approve karke bana do')+'</button>'+
        '<button data-go="change">'+L('Change something','Kuch badalna hai')+'</button>'+
        '<button data-go="depth">'+(S.depth==='pro'?L('Build fewer sections','Kam sections'):L('Build more sections','Aur sections'))+'</button>'+
        '</div>';
      box.addEventListener('click',function(e){
        var t=e.target.closest('button[data-go]');if(!t)return;
        if(t.dataset.go==='build'){clearAnswerBox();userSay('Approve & build');startBuild()}
        if(t.dataset.go==='change'){clearAnswerBox();userSay('Change something');offerChange()}
        if(t.dataset.go==='depth'){
          S.depth=S.depth==='pro'?'lite':'pro';setDepthLabel();save();
          clearAnswerBox();userSay(S.depth==='pro'?'Build more sections':'Build fewer sections');
          var p=planData();
          agentSay(L('Switched to <b>'+(S.depth==='pro'?'Pro':'Lite')+'</b> — '+p.sections+' sections across '+p.pages.length+' pages now.',
            '<b>'+(S.depth==='pro'?'Pro':'Lite')+'</b> kar diya — ab '+p.sections+' sections, '+p.pages.length+' pages.'));
