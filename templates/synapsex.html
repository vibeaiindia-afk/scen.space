<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Brain And Body — One Network</title>
<style>
  :root{--fg:#f4f4f4;--muted:rgba(255,255,255,.62);--glass:rgba(255,255,255,.08)}
  *{box-sizing:border-box} html,body{margin:0;background:#000;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;overflow-x:hidden}
  body{min-height:620vh}
  .stage{position:fixed;inset:0;overflow:hidden;background:#000}
  .film{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:center center;filter:saturate(.92) contrast(1.06) brightness(.86);transform:scale(1.02);will-change:transform,filter}
  .shade{position:absolute;inset:0;background:
    radial-gradient(circle at 50% 52%,transparent 25%,rgba(0,0,0,.22) 58%,rgba(0,0,0,.7) 100%),
    linear-gradient(90deg,rgba(0,0,0,.68) 0%,transparent 28%,transparent 68%,rgba(0,0,0,.45) 100%);pointer-events:none}
  .grain{position:absolute;inset:-100%;opacity:.055;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
  header{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-family:Arial,Helvetica,sans-serif;font-size:11px}
  .leftnav{display:flex;gap:7px}.pill{display:flex;align-items:center;gap:7px;height:31px;padding:0 11px;border-radius:999px;background:rgba(26,26,26,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
  .menu{width:31px;justify-content:center;padding:0}.menu i,.menu i:before,.menu i:after{content:"";display:block;width:11px;height:1px;background:#fff;position:relative}.menu i:before{position:absolute;top:-3px}.menu i:after{position:absolute;top:3px}
  .download{background:#fff;color:#000;border:0;padding:0 15px;font-weight:600}.download:before{content:"↓";font-size:12px}
  .hero-copy{position:fixed;z-index:4;inset:0;pointer-events:none}
  .title{position:absolute;margin:0;font-size:clamp(48px,6.1vw,96px);font-weight:400;line-height:.88;letter-spacing:-.07em;text-shadow:0 2px 22px rgba(0,0,0,.35);will-change:transform,opacity,filter}
  .title.left{left:5.2vw;top:11vh;max-width:7ch}.title.right{right:5vw;bottom:14vh;text-align:right;max-width:7ch}
  .micro{position:absolute;left:5.3vw;bottom:15vh;width:min(340px,31vw);font-size:10px;line-height:1.55;letter-spacing:.02em;color:rgba(255,255,255,.69);text-transform:none;will-change:transform,opacity}
  .index{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.42);writing-mode:vertical-rl;text-transform:uppercase}
  .scan{position:absolute;left:50%;top:50%;width:44vw;height:1px;background:linear-gradient(90deg,transparent,rgba(151,255,195,.82),transparent);transform:translate(-50%,-50%) scaleX(0);opacity:0;box-shadow:0 0 18px rgba(97,255,158,.7);will-change:transform,opacity}
  .corner{position:absolute;right:5vw;top:15vh;font-size:9px;color:rgba(255,255,255,.48);letter-spacing:.16em;text-transform:uppercase}
  @media(max-width:760px){body{min-height:500vh}.title{font-size:clamp(44px,13vw,72px)}.title.left{left:7vw;top:13vh}.title.right{right:7vw;bottom:13vh}.micro{left:7vw;bottom:28vh;width:55vw;font-size:8px}.corner,.index{display:none}.film{inset:-6%;width:112%;height:112%}}
  @media(prefers-reduced-motion:reduce){body{min-height:100vh}.grain{animation:none}.title,.micro{transform:none!important;opacity:1!important;filter:none!important}.film{transform:scale(1.02)!important}.scan{display:none}}
</style>
</head>
<body>
  <div class="stage">
    <video id="film" class="film" muted playsinline preload="auto">
      <source src="https://pub-429d8fb4f8ff4b7d9c2624c0d7e4b4b5.r2.dev/workspaces/hf_20260814_013039_5cf05b01-4cea-4c9e-8af5-1b9122611c9b_wm3.mp4" type="video/mp4">
    </video>
    <div class="shade"></div><div class="grain"></div><div class="scan" id="scan"></div>
  </div>

  <header>
    <div class="leftnav"><div class="pill">✦ SynapseX</div><div class="pill menu" aria-label="Menu"><i></i></div></div>
    <div class="pill download">Download</div>
  </header>

  <main class="hero-copy">
    <h1 class="title left" id="leftTitle">Brain<br>And Body</h1>
    <h2 class="title right" id="rightTitle">One<br>Network</h2>
    <p class="micro" id="micro">Built at the intersection of neuroscience and artificial intelligence. SynapseX continuously maps neural pathways, cognitive load, and physiological states into a single adaptive intelligence layer.</p>
    <div class="corner">Neural System / 01</div>
    <div class="index">Cognition — Biology — Signal</div>
  </main>

<script>
(() => {
  const video = document.getElementById('film');
  const left = document.getElementById('leftTitle');
  const right = document.getElementById('rightTitle');
  const micro = document.getElementById('micro');
  const scan = document.getElementById('scan');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current=0,target=0,last=performance.now(),seeking=false;
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  const progress=()=>clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));
  function visuals(p){
    const center=Math.sin(p*Math.PI);
    left.style.transform=`translate3d(${p*-5}vw,${p*-4}vh,0) scale(${1+p*.04})`;
    right.style.transform=`translate3d(${p*4}vw,${p*3}vh,0) scale(${1+p*.03})`;
    left.style.opacity=String(clamp(1-p*.9,.25,1));
    right.style.opacity=String(clamp(.55+p*.65,.4,1));
    left.style.filter=`blur(${Math.max(0,(p-.62)*7)}px)`;
    micro.style.transform=`translateY(${p*-18}px)`;
    micro.style.opacity=String(clamp(1-Math.abs(p-.28)*1.3,.25,.82));
    scan.style.opacity=String(clamp((center-.62)*2.8,0,.7));
    scan.style.transform=`translate(-50%,-50%) scaleX(${clamp((center-.55)*2.4,0,1)})`;
    video.style.transform=`scale(${1.02+p*.07}) translate3d(${(p-.5)*1.1}vw,${Math.sin(p*6.28)*.45}vh,0)`;
    video.style.filter=`saturate(${.9+p*.18}) contrast(1.06) brightness(${.82+p*.08})`;
  }
  function seek(t){if(seeking||!Number.isFinite(t)) return;seeking=true;try{video.currentTime=t}catch{} }
  video.addEventListener('seeked',()=>{seeking=false});
  video.addEventListener('loadedmetadata',()=>{video.pause(); current=0; target=0; try{video.currentTime=0}catch{} });
  video.addEventListener('canplay',()=>video.pause());
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000||0); last=now;
    const p=progress(); visuals(p);
    if(!reduced && Number.isFinite(video.duration) && video.duration>0){
      target=p*Math.max(0,video.duration-.05);
      current += (target-current)*(1-Math.exp(-dt*8));
      if(Math.abs(video.currentTime-current)>.012) seek(current);
    } else if(reduced && video.readyState>=1 && video.currentTime!==0){try{video.currentTime=0}catch{}}
    requestAnimationFrame(frame);
  }
  video.pause(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
