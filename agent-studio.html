  renderMain();
}
function setMode(m){
  S.mode=m;save();
  $$('.seg [data-mode]').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  $('#chatBody').classList.toggle('hidden',m!=='design');
  $('#streamBody').classList.toggle('hidden',m!=='build');
  $('#chatTitle').textContent=m==='build'?'Build':'Scen Agent';
  if(m==='design')scrollChat();
}
function setPhasePill(){
  var p=$('#phasePill'),map={interview:'Interview',review:'Plan',building:'Building…',built:'Live preview'};
  p.textContent=map[S.phase]||'Interview';
  p.className='pill'+(S.phase==='built'?' ok':S.phase==='building'?' acid':'');
  $('#liveDot').classList.toggle('idle',S.phase==='interview');
}
function setDepthLabel(){
  $('#depthBtn').innerHTML='⛁ '+(S.depth==='pro'?'Pro':'Lite')+' <i>⌄</i>';
}

/* ---------- workspace identity and credits ---------- */
function accountName(){
  var me=API.me;if(!me||me===false)return '';
  var u=me.user||me;
  return u.name||u.displayName||u.email||'Signed in';
}
function setAcctPill(){
  var p=$('#acctPill'),me=API.me;
  if(me&&me!==false){
    var w=API.credits&&API.credits.wallet;
    p.textContent=(w?Number(w.available).toLocaleString()+' credits · ':'')+accountName();
    p.className='pill ok';p.title='Signed in — click for the workspace panes';
  }else{
    p.textContent=API.busy.me?'Checking…':'Not signed in';
    p.className='pill'+(API.busy.me?'':' warn');
    p.title='Sign in on Scen in this browser to use the workspace';
  }
}
API.onchange=function(){
  setAcctPill();setAiPill();
  if(S.tab==='tools')renderMain();
};

/* ---------- live AI status ---------- */
function setAiPill(){
  var p=$('#aiPill'),live=AI.state==='live'||AI.state==='ready';
  p.textContent=AI.enabled?X.label():'AI off';
  p.className='pill'+(!AI.enabled?'':live?' ok':AI.state==='unknown'?'':' warn');
  $('#aiBtn').classList.toggle('on',AI.enabled);
  var note=$('#composerNote');
  if(!AI.enabled)
    note.textContent='Live AI is switched off — the local writers are producing the copy, the plan and the code.';
  else if(AI.state==='live')
    note.innerHTML='Live AI on '+esc(AI.provider)+' · '+esc(AI.model)+' — '+AI.requests+
      ' request'+(AI.requests===1?'':'s')+', '+(AI.inTok+AI.outTok).toLocaleString()+' tokens. Publishing is still not connected.';
  else if(AI.state==='ready')
    note.textContent='Signed in — the Scen AI gateway writes the copy and the plan on the next build. Publishing is not connected.';
  else if(AI.state==='signedout')
    note.innerHTML='Not signed in, so the gateway is refusing requests. <a href="/" style="color:var(--acid)">Sign in on Scen</a> and reload, or keep building with the local writers.';
  else if(AI.state==='offline')
    note.textContent='The /api routes are not reachable from this page, so everything is being generated locally in your browser.';
  else if(AI.state==='error')
    note.textContent='Gateway error: '+AI.lastError+' — falling back to the local writers.';
  else note.textContent='Checking the Scen AI gateway…';
  if(S.tool==='aigateway'&&S.tab==='tools')renderMain();
}

/* composer */
function autoGrow(){input.style.height='auto';input.style.height=Math.min(150,input.scrollHeight)+'px'}
input.addEventListener('input',function(){autoGrow();sendBtn.disabled=!input.value.trim()&&!S.atts.length});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
sendBtn.addEventListener('click',send);
function send(){
  var text=input.value.trim();
  if(!text&&!S.atts.length)return;
  input.value='';autoGrow();sendBtn.disabled=true;
  if(!text&&S.atts.length)text='(reference attached)';
  handleText(text);
}

/* attachments */
$('#attachBtn').addEventListener('click',function(){$('#filePick').click()});
$('#filePick').addEventListener('change',function(e){
  var files=Array.prototype.slice.call(e.target.files||[]).slice(0,4);
  files.forEach(function(file){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas');cv.width=cv.height=24;
        var cx=cv.getContext('2d');cx.drawImage(img,0,0,24,24);
        var d=cx.getImageData(0,0,24,24).data,r=0,g=0,b2=0,n=0;
        for(var i=0;i<d.length;i+=4){
          var mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
          if(mx<28||mn>238)continue;            // skip near-black and near-white
          r+=d[i];g+=d[i+1];b2+=d[i+2];n++;
        }
        var col=n?C.rgbToHex(r/n,g/n,b2/n):'#dfff45';
        S.atts.push({url:fr.result,color:col});
        renderAtts();sendBtn.disabled=false;
        if(S.phase==='interview'&&step()&&step().id==='accent'){
          S.brief.refs=S.brief.refs.concat([{url:fr.result,color:col}]);
          renderAnswerBox();
        }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
  e.target.value='';
});
function renderAtts(){
  var strip=$('#attStrip');
  strip.classList.toggle('hidden',!S.atts.length);
  strip.innerHTML=S.atts.map(function(a,i){
    return '<div class="a"><img src="'+a.url+'" alt=""/><button class="x" data-i="'+i+'">×</button></div>'}).join('');
}
$('#attStrip').addEventListener('click',function(e){
  var b=e.target.closest('.x');if(!b)return;
  S.atts.splice(+b.dataset.i,1);renderAtts();
  sendBtn.disabled=!input.value.trim()&&!S.atts.length;
});

/* mic */
$('#micBtn').addEventListener('click',function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('This browser has no speech recognition — type instead');
  if(window.__rec){window.__rec.stop();window.__rec=null;$('#micBtn').style.color='';return}
  var rec=new SR();rec.lang='en-IN';rec.interimResults=true;
  rec.onresult=function(e){
    var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    input.value=t;autoGrow();sendBtn.disabled=!t.trim();
  };
  rec.onend=function(){window.__rec=null;$('#micBtn').style.color=''};
  rec.onerror=function(){toast('Microphone not available');window.__rec=null;$('#micBtn').style.color=''};
  rec.start();window.__rec=rec;$('#micBtn').style.color='#dfff45';
  toast('Listening — tap the mic again to stop');
});

/* depth + plan toggles */
$('#depthBtn').addEventListener('click',function(){
  S.depth=S.depth==='lite'?'pro':'lite';setDepthLabel();save();
  toast(S.depth==='pro'?'Pro — more sections per page':'Lite — core sections only');
  if(S.tool==='plan'||S.tab==='preview')renderMain();
});
$('#aiBtn').addEventListener('click',function(){
  AI.enabled=!AI.enabled;setAiPill();
  if(S.tool==='aigateway'&&S.tab==='tools')renderMain();
  toast(AI.enabled?'Live AI will be used on the next build':'Live AI off — the local writers take over');
});
$('#aiPill').addEventListener('click',function(){
  S.tool='aigateway';setTab('tools');renderTools();
});
$('#acctPill').addEventListener('click',function(){
  if(!signedIn()){N.ensure('me',true);N.ensure('credits',true);toast('Re-checking the session…')}
  S.tool='users';setTab('tools');renderTools();
});
$('#planBtn').addEventListener('click',function(){
  S.planFirst=!S.planFirst;save();
  this.classList.toggle('on',S.planFirst);
  toast(S.planFirst?'The plan is shown before building':'Building starts as soon as the questions are done');
});

/* tabs, modes, rail */
$$('.tab').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab)})});
$$('.seg [data-mode]').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});
$('#toolsCol').addEventListener('click',function(e){
  /* The Simple/Advanced switch lives in this column too, and is not a panel. */
  var m=e.target.closest('[data-uimode]');
  if(m){setUiMode(m.dataset.uimode);return}
  var t=e.target.closest('.tool');if(!t||!t.dataset.tool)return;
  S.tool=t.dataset.tool;S.tab='tools';save();setTab('tools');renderTools();
});
$$('.rail button').forEach(function(b){
  b.addEventListener('click',function(){
    var r=b.dataset.rail;
    if(r==='chat'){setMode('design');scrollChat()}
    if(r==='brief'){S.tool='brief';setTab('tools');renderTools()}
    if(r==='new')confirmReset();
    if(r==='about')aboutModal();
    $$('.rail button').forEach(function(x){x.classList.toggle('on',x===b&&r==='chat')});
  });
});
$('#resetBtn').addEventListener('click',confirmReset);
$('#publishTop').addEventListener('click',function(){S.tool='publishing';setTab('tools');renderTools()});
$('#inviteBtn').addEventListener('click',function(){
  if(!signedIn()){
    modal('<div class="modal-head"><span class="avatar"></span><b>Sign in to invite</b></div>'+
      '<div class="modal-body">Invitations go to your Scen workspace, so this needs a session on this domain. '+
      '<a href="/" style="color:var(--acid)">Sign in</a> and reload.</div>'+
      '<div class="modal-foot"><button class="btn primary" data-act="close">Got it</button></div>');
    return;
  }
  modal('<div class="modal-head"><span class="avatar"></span><b>Invite to the workspace</b></div>'+
  '<div class="modal-body"><div class="field"><label>Email</label>'+
  '<input id="invEmail" type="email" placeholder="name@company.com"/></div>'+
  '<div class="field"><label>Role</label><select id="invRole" class="btn" style="width:100%">'+
  '<option value="member">Member</option><option value="admin">Admin</option></select></div>'+
  'Scen sends the invitation email through <code>/api/workspaces/invitations</code>.</div>'+
  '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>'+
  '<button class="btn primary" id="invGo">Send the invite</button></div>');
  $('#invGo').addEventListener('click',function(){
    var email=$('#invEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('Enter a valid email address');
    var b=$('#invGo');b.disabled=true;b.textContent='Sending…';
    N.invite(email,$('#invRole').value).then(function(){
      closeModal();toast('Invitation sent to '+email);
    },function(e){
      b.disabled=false;b.textContent='Send the invite';
      var host=$('#modalHost').querySelector('.modal-body');
      if(host)host.innerHTML='<span style="color:#ffcf87">'+esc(N.msg(e))+'</span>';
    });
  });
});
$('#projBtn').addEventListener('click',function(){
  modal('<div class="modal-head"><span class="avatar"></span><b>Project name</b></div>'+
  '<div class="modal-body"><div class="field"><label>Name</label>'+
  '<input id="pn" value="'+esc(S.brief.name||S.projectName||'')+'" placeholder="Untitled project"/></div>'+
  'This is the brand name written into every generated page.</div>'+
  '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>'+
  '<button class="btn primary" id="pnGo">Save</button></div>');
  $('#pnGo').addEventListener('click',function(){
    var v=$('#pn').value.trim();if(!v)return closeModal();
    S.brief.name=v.slice(0,48);S.projectName=v;$('#projName').textContent=v;save();closeModal();
    if(S.built)rebuild('Renamed to <b>'+esc(v)+'</b>');else{refreshTools();renderMain()}
  });
});
function confirmReset(){
  modal('<div class="modal-head"><span class="avatar"></span><b>Start a new project?</b></div>'+
  '<div class="modal-body">This clears the conversation, the brief and every generated file. '+
  'Download anything you want to keep first.</div>'+
  '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>'+
  '<button class="btn primary" id="rsGo">Start over</button></div>');
  $('#rsGo').addEventListener('click',function(){
    localStorage.removeItem(KEYNAME);location.reload()});
}
var KEYNAME='scen.agentstudio.v1';
function aboutModal(){
  modal('<div class="modal-head"><span class="avatar"></span><b>What this studio is</b></div>'+
  '<div class="modal-body">The agent interviews you, turns the answers into a plan, then writes real HTML, CSS, '+
  'JavaScript and React Native source you can read and download.<br/><br/>'+
  'Everything runs in this page. There is no server call, no key, and nothing published. '+
  'When the Scen AI gateway is connected, the same six steps call it instead of the local generators.</div>'+
  '<div class="modal-foot"><button class="btn primary" data-act="close">Close</button></div>')}

/* ============================================================
   Boot
   ============================================================ */
function restore(){
  body.innerHTML='';
  S.msgs.forEach(function(m){body.appendChild(nodeFor(m))});
  if(S.built&&S.brief.pages.length){
    gen=G.generate(S.brief,S.depth);
    S.files=gen.files.map(function(f){return f.path});
    if(S.files.indexOf(S.file)<0)S.file=S.files[0];
    if(S.buildLog.length){
      stream.innerHTML='<span class="caps">Build · '+esc(S.brief.name)+'</span><div id="stepList">'+
        S.buildLog.map(function(s){
          return '<div class="step done"><span class="mark">✓</span><span>'+esc(s.l)+
            '<span class="sub">'+esc(s.s)+'</span></span><span class="ms">'+s.ms+'ms</span></div>'}).join('')+'</div>';
    }
  }
  setPhasePill();setDepthLabel();
  input.placeholder=S.phase==='built'?'Tell me what to change…':
    S.phase==='review'?'Reply, or ask for a change…':'Message the agent…';
  $('#planBtn').classList.toggle('on',S.planFirst);
  if(S.brief.name){$('#projName').textContent=S.brief.name}
  renderTools();setMode(S.mode==='build'&&S.phase==='building'?'design':S.mode);setTab(S.tab);
  if(S.phase==='interview'){
    var last=S.msgs[S.msgs.length-1];
    // the question is already in the transcript — only the answer box needs rebuilding
    if(last&&last.who==='agent'&&S.pending==='q')renderAnswerBox();
    else askCurrent(false);
  }
  else if(S.phase==='review')finishReviewButtons();
  scrollChat();setTimeout(function(){body.scrollTop=body.scrollHeight},80);
}
function resetState(){
  S.phase='interview';S.step=0;S.brief=C.freshBrief();S.msgs=[];S.pending=null;
  S.skip=[];S.seedLabel='';S.mode='design';S.tab='tools';S.tool='brief';S.file='';
  S.buildLog=[];S.files=[];S.built=false;S.atts=[];S.projectName='';
  S.previewKind='site';S.device='desktop';
  body.innerHTML='';stream.innerHTML='';gen=null;
}
function boot(){
  setDepthLabel();setAiPill();setAcctPill();
  X.probe().then(function(){setAiPill();if(S.tool==='aigateway'&&S.tab==='tools')renderMain()});
  N.ensureAll();
  var seed=C.seedFromUrl();
  var had=C.load();
  if(seed&&(!had||!S.msgs.length||S.seedLabel!==seed.label)){
    resetState();C.applySeed(seed);
    if(S.brief.name)$('#projName').textContent=S.brief.name;
    renderTools();setMode('design');setPhasePill();setTab('tools');
    agentSay('Starting from <b>'+esc(seed.label)+'</b> — the look, the pages and the palette are '+
      'already filled into the brief on the right.<br/><br/>Five questions and I build it. '+
      'Anything you want changed after that, just say it and I rebuild.');
    save();setTimeout(function(){askCurrent(true)},760);
    return;
  }
  if(had&&S.msgs.length)return restore();
  S.tool='brief';S.tab='tools';S.mode='design';
  renderTools();setMode('design');setPhasePill();setTab('tools');
  askCurrent(true);
}
boot();
})();
