}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function project(id){for(var i=0;i<DB.projects.length;i++)if(DB.projects[i].id===id)return DB.projects[i];return null}
function active(){return project(DB.activeId)}
function newProject(brief){
  var p={id:uid(),name:'Untitled',brief:String(brief||''),lang:sniffLang(brief),
    createdAt:Date.now(),updatedAt:Date.now(),openedAt:Date.now(),starred:false,
    direction:null,files:[],images:{},messages:[],page:'index.html',
    published:null,qa:null,versions:[],dbId:'',photos:true};
  DB.projects.unshift(p);DB.activeId=p.id;save();return p;
}
function touch(p){if(!p)return;p.updatedAt=Date.now();save()}

/* ---------- the gateway ---------- */
var SESSION={state:'unknown',name:'',email:'',role:'',credits:null,providers:[]};

function req(path,opts){
  opts=opts||{};
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var died=setTimeout(function(){try{ctl&&ctl.abort()}catch(e){}},opts.timeout||115000);
  return fetch(path,{
    method:opts.method||'GET',credentials:'same-origin',
    signal:ctl?ctl.signal:undefined,
    headers:{'Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    clearTimeout(died);
    return r.text().then(function(t){
      var d={};
      try{d=t?JSON.parse(t):{}}
      catch(e){
        /* Not every failure comes back as JSON. A proxy, a dev server or a
           gateway answers with an HTML error page, and using that as the
           message printed a whole <!DOCTYPE html> into the chat. */
        d={error:/^\s*<(?:!doctype|html|\?xml)/i.test(t)
            ? ('The server answered with a page instead of an answer (HTTP '+r.status+')')
            : (String(t||'').replace(/\s+/g,' ').trim().slice(0,240)||('HTTP '+r.status))};
      }
      if(!r.ok){var e2=new Error(d.error||('Request failed ('+r.status+')'));
        e2.status=r.status;e2.code=d.code;e2.attempts=d.attempts;throw e2}
      return d;
    });
  },function(e){
    clearTimeout(died);
    if(e&&(e.name==='AbortError'||/aborted/i.test(String(e.message||'')))){
      var t2=new Error('The gateway did not answer in time');t2.status=504;t2.code='timeout';throw t2}
    throw e;
  });
}
/* Whatever comes back from a provider, nothing key-shaped reaches the chat. */
function scrub(text){
  return String(text==null?'':text)
    .replace(/\b(?:xai-|sk-(?:ant-|proj-|live-|test-)?|gsk_|AIza|ghp_|glpat-)[A-Za-z0-9_\-]{12,}\b/g,'[redacted]')
    .replace(/\b[A-Za-z0-9_\-]{40,}\b/g,'[redacted]');
}
function why(e,noun){
  if(!e)return 'Something failed';
  if(e.status===401||e.status===403)
    return 'You are signed out on this domain — sign in on Scen in another tab and try again.';
  if(e.status===404)return 'The /api routes are not reachable from this page.';
  if(e.status===503||e.code==='missing_key')return 'No AI provider key is configured on the server.';
  if(e.code==='timeout')return 'The gateway did not answer in time.';
  if(e.status===402||e.code==='insufficient_credits')return 'Not enough credits for '+(noun||'that')+'.';
  return scrub(e.message||('Could not '+(noun||'do that')));
}

/* One call. The standing instruction goes in `system`; the step's own task
   goes in `input`. Nothing else ever restates the rules. */
var GATE={provider:'',model:'',calls:0,cost:0,lastError:''};
/* Each provider gets 45 seconds (SCEN_AI_TIMEOUT_MS), and the gateway races two
   of them. A long answer simply cannot arrive in that window — a full stylesheet
   lost the race on both providers and ended the build with "AI provider timeout".

   A timeout is not a refusal: nothing was wrong with the request except its
   size. So it is asked again, once, for a shorter answer. Anything else — a bad
   key, no credits, a signed-out session — is fatal on the first try, because
   asking again would say the same thing. */
function ask(feature,input,opts){
  opts=opts||{};
  var max=opts.max||4096,tries=opts.tries==null?2:opts.tries;
  function attempt(n){
    var thisMax=n===0?max:Math.max(700,Math.round(max*0.55));
    var body=n===0?input:(input+
      '\n\nYou ran out of time on the first attempt. Answer again, shorter and '+
      'more directly, in well under half the length. Same format, same rules.');
    return req('/api/ai/generate',{method:'POST',body:{
      feature:feature,input:body,system:SUPER_PROMPT,
      maxOutputTokens:thisMax,
      temperature:opts.temp==null?0.75:opts.temp
    }}).then(function(d){
      GATE.calls++;GATE.lastError='';
      if(d.provider)GATE.provider=d.provider;
      if(d.model)GATE.model=d.model;
      var u=d.usage||{};GATE.cost+=Number(u.estimatedCostUsd||0);
      return String(d.text||'');
    },function(e){
      var slow=e&&(e.code==='timeout'||e.status===504||/timed? ?out/i.test(String(e.message||'')));
      if(slow&&n+1<tries)return attempt(n+1);
      GATE.lastError=why(e,'reach the model');throw e;
    });
  }
  return attempt(0);
}

/* ---------- reading what the model sent back ---------- */
function unfence(t){
  return String(t==null?'':t)
    .replace(/^﻿/,'')
    .replace(/^\s*```[a-zA-Z]*[ \t]*\r?\n/,'')
    .replace(/\r?\n```\s*$/,'');
}
function jsonFrom(text){
  var t=String(text||'');
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)return null;
  var body=t.slice(a,b+1);
  try{return JSON.parse(body)}catch(e){}
  try{return JSON.parse(body.replace(/,\s*([}\]])/g,'$1'))}catch(e){}
  return null;
}
/* Files arrive as raw text between markers rather than inside JSON: a page of
   HTML escaped into a JSON string is the single most reliable way to get a
   truncated, unparseable answer out of any of these models. */
function parseFiles(text){
  var t=unfence(text).replace(/\r/g,'');
  var parts=t.split(/^@@FILE[ \t]+/m);
  var out=[];
  for(var i=1;i<parts.length;i++){
    var seg=parts[i],nl=seg.indexOf('\n');
    if(nl<0)continue;
    var path=seg.slice(0,nl).trim().replace(/["'`]/g,'').replace(/^\.?\//,'');
    var body=seg.slice(nl+1).replace(/\n?@@END[\s\S]*$/,'');
    body=body.replace(/^\s*```[a-zA-Z]*[ \t]*\n/,'').replace(/\n```\s*$/,'');
    if(path&&body.trim())out.push({path:path,body:body.replace(/\s+$/,'')+'\n'});
  }
  return out;
}
function fileNamed(files,path){
  for(var i=0;i<files.length;i++)if(files[i].path===path)return files[i];
  return null;
}
function putFile(files,path,body){
  var f=fileNamed(files,path);
  if(f){var was=f.body;f.body=body;return was===body?'same':'changed'}
  files.push({path:path,body:body});return 'new';
}
/* A follow-up like "replace the <img> with a <video>" needs the markup
   itself touched, not just its styling — a CSS-only answer that reports
   "Done." is a silent miss, not a fix. Deliberately narrow (a literal tag,
   or a short list of structural verbs+nouns) so ordinary styling requests
   ("make the button bigger") don't get flagged and forced into a wasted
   retry. */
function impliesMarkupChange(text){
  var t=String(text||'');
  if(/<[a-z][\w-]*(\s[^<>]*)?>/i.test(t))return true;
  return /\b(replace|swap|remove|delete)\b[^.]{0,40}\b(image|photo|picture|video|hero|section|tag|element)\b/i.test(t)||
    /\badd\b[^.]{0,40}\b(new )?section\b/i.test(t)||
    /\b(image|photo|picture)\b[^.]{0,20}\binto (a |an )?video\b/i.test(t);
}

/* editFiles() had no output validation at all, unlike writeBase() (which
   rejects an answer with no "{") or patch() (which rejects unbalanced
   braces) — a follow-up's CSS could come back cut off mid-declaration and
   still get saved as "Done.". A plain brace count is not enough: a cut that
   lands *between* rules — after the last complete "}" but partway through
   typing the next selector or @-rule, e.g. a file ending "...}\n@media
   (max-width:860" — is still perfectly balanced (every "{" it did write has
   its "}"), so counting alone misses it. Checking that the file also *ends*
   on a closed rule catches both: an unclosed rule leaves depth above zero,
   and a dangling next-selector leaves the trimmed tail not ending in "}". */
function looksTruncatedCss(css){
  var body=String(css||'');
  var depth=0;
  for(var i=0;i<body.length;i++){
    if(body[i]==='{')depth++;
    else if(body[i]==='}')depth--;
  }
  if(depth!==0)return true;
  var trimmed=body.replace(/\s+$/,'');
  return !trimmed||trimmed.charAt(trimmed.length-1)!=='}';
}
/* Same idea for the HTML half of an edit answer — writePage()/fixPage()
   always produce a full document, so one that doesn't reach its closing
   </html> was cut off partway through, not a smaller-but-complete page. */
function looksTruncatedHtml(html){
  return !/<\/html>\s*$/i.test(String(html||''));
}

window.__SUPER={$:$,$$:$$,esc:esc,el:el,toast:toast,sniffLang:sniffLang,
  DB:DB,load:load,save:save,project:project,active:active,newProject:newProject,touch:touch,
  SESSION:SESSION,req:req,scrub:scrub,why:why,ask:ask,GATE:GATE,
  unfence:unfence,jsonFrom:jsonFrom,parseFiles:parseFiles,fileNamed:fileNamed,putFile:putFile,
  impliesMarkupChange:impliesMarkupChange,looksTruncatedCss:looksTruncatedCss,
  looksTruncatedHtml:looksTruncatedHtml};
})();
</script>

<script>
/* ============================================================
   The pipeline — §42, in order.

   brief → understand → creative direction → design system → image plan →
   photographs → build → insert → run → look → review → refine → deliver.

   Every step is one call to the gateway with the standing instruction as its
   system prompt. Nothing here writes a page: it decides what to ask for, keeps
   the steps inside the gateway's own budget, and refuses to call anything done
   that it has not seen come back.
   ============================================================ */
(function(){
"use strict";
var U=window.__SUPER;
var ask=U.ask,req=U.req,why=U.why,jsonFrom=U.jsonFrom,parseFiles=U.parseFiles,putFile=U.putFile;

/* ---------- what both sides of the build agree on ----------
   A naming contract, not a template. The stylesheet styles these, the pages
   may use them, and every section beyond them is the page's own invention. */
var CONTRACT=[
'Shared class vocabulary — the stylesheet defines these and every page may use them:',
'  .wrap            the page container (max-width and gutters)',
'  .site-nav        header bar; inside it .brand, .links, .cta and .nav-toggle (the phone button)',
'  .site-foot       footer',
'  .btn             a button or link-button; .btn--primary and .btn--ghost are its two weights',
'  .eyebrow .display .h2 .lead .meta   the type scale, in that order of size',
'  .sr-only         visually hidden, still read aloud',
'  [data-reveal]    put on any element that should fade up as it scrolls in — the shared',
'                   script adds [data-seen] and the stylesheet already animates it',
'  [data-year]      the shared script writes the current year into it',
'Everything else is yours. Name a page\'s own sections with that page\'s prefix',
'(home-, work-, about-) so two pages can never collide.'
].join('\n');

/* Guaranteed regardless of what any model writes: the reveal hook, no sideways
   scroll, images that cannot overflow, and a real reduced-motion answer. */
var KERNEL=[
'*,*::before,*::after{box-sizing:border-box}',
'html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}',
'body{margin:0;overflow-x:hidden}',
'img,video,svg{max-width:100%;height:auto;display:block}',
'.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}',
'[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.22,.61,.36,1),transform .8s cubic-bezier(.22,.61,.36,1)}',
'[data-reveal][data-seen]{opacity:1;transform:none}',
'@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}[data-reveal]{opacity:1!important;transform:none!important}}'
].join('\n');

var APPJS=[
'(function(){',
'  "use strict";',
'  var still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;',
'  var io=(!still&&"IntersectionObserver" in window)?new IntersectionObserver(function(rows){',
'    rows.forEach(function(r){if(r.isIntersecting){r.target.setAttribute("data-seen","");io.unobserve(r.target)}});',
'  },{rootMargin:"0px 0px -10% 0px",threshold:.08}):null;',
'  function start(){',
'    var reveal=document.querySelectorAll("[data-reveal]");',
'    for(var i=0;i<reveal.length;i++){io?io.observe(reveal[i]):reveal[i].setAttribute("data-seen","")}',
'    var toggle=document.querySelector(".nav-toggle");',
'    if(toggle){',
'      toggle.setAttribute("aria-expanded","false");',
'      toggle.addEventListener("click",function(){',
'        var open=document.documentElement.hasAttribute("data-nav-open");',
'        if(open)document.documentElement.removeAttribute("data-nav-open");',
'        else document.documentElement.setAttribute("data-nav-open","");',
'        toggle.setAttribute("aria-expanded",open?"false":"true");',
'      });',
'    }',
'    var years=document.querySelectorAll("[data-year]");',
'    for(var y=0;y<years.length;y++)years[y].textContent=new Date().getFullYear();',
'    var forms=document.querySelectorAll("form[data-demo]");',
'    for(var f=0;f<forms.length;f++)forms[f].addEventListener("submit",function(e){',
'      e.preventDefault();',
'      var note=this.querySelector("[data-form-note]");',
'      if(note)note.textContent="Thank you — this form is not connected to an inbox yet.";',
'    });',
'  }',
'  if(document.readyState!=="loading")start();',
'  else document.addEventListener("DOMContentLoaded",start);',
'})();'
].join('\n');

function langLine(p){
  return p.lang==='hi'
    ? 'The client writes Roman Hindi. Every sentence you address to them must be Roman Hindi (Latin letters, not Devanagari), the way they write it. The website copy itself stays in the language the business needs — usually English, or Hindi where the audience is Hindi-speaking.'
    : 'Write to the client in English.';
}
function brand(p){
  var d=p.direction||{};
  return ['Business: '+(d.name||p.name||'unnamed'),
    d.trade?'Trade: '+d.trade:'',
    d.audience?'Audience: '+d.audience:'',
    d.personality?'Personality: '+d.personality:'',
    d.concept?'Visual concept: '+d.concept:'',
    d.imageDirection?'Image direction: '+d.imageDirection:'',
    d.motion?'Motion: '+d.motion:'',
    d.conversion?'Conversion goal: '+d.conversion:'',
    d.palette?'Palette: '+JSON.stringify(d.palette):'',
    d.type?'Typography: '+JSON.stringify(d.type):''
  ].filter(Boolean).join('\n');
}

/* ---------- 1. what kind of request is this (§1) ---------- */
var INTENTS=['normal_chat','create_website','create_app','edit_existing_project',
  'visual_upgrade','add_feature','fix_bug','content_change','deploy_or_publish'];
function classify(p,text){
  var built=(p.files&&p.files.length)?'There is already a build in this project: '+
      p.files.map(function(f){return f.path}).join(', ') : 'Nothing has been built in this project yet.';
  var input=['Classify this one message. '+built,
    'Message: """'+text+'"""',
    'Reply with JSON only: {"intent":"one of '+INTENTS.join('|')+'",',
    '"reply":"if and only if the intent is normal_chat, your actual conversational answer, 1-3 sentences",',
    '"ask":["at most 3 questions, and only if you genuinely cannot build without them — usually empty"]}',
    langLine(p)].join('\n');
  return ask('analysis',input,{max:700,temp:.3}).then(function(t){
    var o=jsonFrom(t)||{};
    var intent=INTENTS.indexOf(o.intent)>=0?o.intent:(p.files.length?'edit_existing_project':'create_website');
    return {intent:intent,reply:String(o.reply||''),ask:Array.isArray(o.ask)?o.ask.slice(0,3):[]};
  });
}

/* ---------- 2. creative direction + image plan (§3, §4, §26, §27) ---------- */
/* Pictures this project has already generated and been charged for. A rebuild
   that re-derives the direction would otherwise invent fresh ids, and every one
   of these would be shot and billed a second time. */
function paidFor(p){
  var got=p.images||{};
  return ((p.direction&&p.direction.images)||[]).filter(function(im){
    return got[im.id]&&got[im.id].url;
  });
}
/* A client who names their own scope ("one HTML file", "no extra sections
   beyond the three stats") is not asking for the 3-to-5-page / 5-to-8-section
   defaults below — those are only a fallback for briefs that never say. This
   is deliberately narrow (literal counts and a couple of stock phrases) so it
   only overrides the defaults when the client was actually explicit, rather
   than trying to infer scope from ordinary descriptive language. */
function scopeRules(text){
  var t=String(text||'');
  var singleFile=/\b(single|one)[- ]?(html )?(page|viewport|file)\b/i.test(t)||/\bonly one page\b/i.test(t);
  var mPages=/\bexactly (\d+)\s+pages?\b/i.exec(t)||/\b(\d+)\s+pages?\s+(only|max|maximum)\b/i.exec(t);
  var pages=singleFile?1:(mPages?Math.max(1,Math.min(6,parseInt(mPages[1],10))):null);
  /* Catches "Do not add a thesis section, a loop section... — the page ends
     at X" as well as the original "no extra sections beyond" phrasing — a
     client naming sections they don't want is exactly as explicit as one
     naming a word like "beyond", and missing it left direct()'s default
     "5 to 8 sections" rule active on a page whose own brief had already
     ruled most of that range out, which is part of why that page then had
     more to write than the client actually wanted. */
  var noExtra=/\bno extra section/i.test(t)||/\bnothing (else|more) beyond\b/i.test(t)||
    (/\bbeyond\b/i.test(t)&&/\bsection/i.test(t))||
    /\bdo(?:n['’]?t| not) add\b[\s\S]{0,80}\bsection/i.test(t)||
    /\bonly the sections\b/i.test(t);
  return {pages:pages,noExtra:noExtra};
}
function direct(p,text,mode){
  var scope=scopeRules(text);
  var pageRule=scope.pages?
    ('- The client explicitly asked for exactly '+scope.pages+' page'+(scope.pages>1?'s':'')+
     '. Write exactly '+scope.pages+' — do not add benefits.html, pricing.html or any other file beyond that.'):
    '- 3 to 5 pages. index.html always first. Every other file is lowercase and ends in .html.';
  var sectionRule=scope.noExtra?
    '- The client explicitly limited which sections are allowed. Write ONLY the sections named in their brief above — no extra sections, cards, or CTA blocks beyond what they described.':
    '- 5 to 8 sections on the home page and they must not all be the same shape (§6, §9).';
  var input=[
    'A client asked for this: """'+text+'"""',
    p.direction?'This project already has a direction, which you are revising:\n'+brand(p):'',
    mode==='upgrade'?'This is a visual_upgrade of an existing build. Re-judge the direction against §13 and change what is weak — do not repaint the same layout.':'',
    p.reference?'The client attached a photograph of their own. §34 applies: the image direction and every generated picture must sit beside it, not fight it.':'',
    paidFor(p).length?('These pictures have already been generated and paid for. Keep these exact ids in\n'+
      'your image plan with the same subjects, and place them in the layout — only add a new\n'+
      'picture if the design genuinely needs one:\n'+
      paidFor(p).map(function(im){return '  '+im.id+' ('+im.ratio+') — '+im.prompt.slice(0,150)}).join('\n')):'',
    '',
    'Decide the direction before anything is written, then answer with JSON only, in this shape:',
    '{',
    ' "name":"the business name — invent a good one if none was given",',
    ' "trade":"what it actually does, or \\"\\" if you genuinely cannot tell",',
    ' "audience":"", "personality":"", "concept":"one line naming the visual concept for THIS business",',
    ' "palette":{"bg":"#","surface":"#","ink":"#","muted":"#","line":"#","accent":"#","accentInk":"#"},',
    ' "type":{"display":"a full CSS font-family stack","body":"a full CSS font-family stack",',
    '   "googleFonts":["Family+Name:wght@400;700"],"note":"the hierarchy in one line"},',
    ' "imageDirection":"the one photographic direction every picture shares",',
    ' "images":[{"id":"short-id","ratio":"16:9|21:9|3:2|4:5|3:4|1:1|4:3","alt":"real alt text",',
    '   "use":"which page and section, and where the subject sits",',
    '   "prompt":"a specific art-directed brief: subject, environment, composition, framing, lighting, lens, materials, mood, colour, negative space"}],',
    ' "pages":[{"file":"index.html","title":"Home","nav":"Home","goal":"",',
    '   "sections":[{"id":"hero","shape":"the layout strategy in a few words","note":"what it says and shows"}]}],',
    ' "motion":"", "conversion":"",',
    ' "opening":"what you address to the client: name the business and what the site is for, say plainly which decisions you took without asking and that any of them can change, and name the pages you are about to write. 3-5 sentences.",',
    ' "next":["at most two genuinely useful next moves for THIS business (§20)"]',
    '}',
    '',
    'Rules for this answer:',
    pageRule,
    sectionRule,
    '- The hero must be a deliberate choice from §7, named in its "shape".',
    '- 2 to 4 images, no more. Every one must earn its place (§37) and share one direction (§30).',
    '- Never put website text, logos or interface inside an image prompt (§32).',
    '- Colours must be real hex. The palette carries the brand, not a default blue.',
    langLine(p)
  ].filter(Boolean).join('\n');
  /* 2600 tokens was not enough room for 2-4 richly art-directed image prompts
     plus 3-6 pages of sections — the model ran past the cap and the JSON came
     back cut off mid-object, which reads as "unreadable" even though nothing
     was actually wrong with the request. 3900 leaves ~200 tokens of headroom
     under the gateway's 4096 ceiling (SCEN_AI_MAX_OUTPUT_TOKENS). */
  return ask('planning',input,{max:3900,temp:.85}).then(function(t){
    var d=jsonFrom(t);
    if(!d||!Array.isArray(d.pages)||!d.pages.length)
      throw Object.assign(new Error('The direction came back unreadable'),{status:502});
    d.pages=d.pages.slice(0,scope.pages||6).map(function(pg,i){
      var file=String(pg.file||'').toLowerCase().replace(/[^a-z0-9.\-]/g,'');
      if(i===0||!/\.html$/.test(file))file=i===0?'index.html':(file||('page'+i+'.html'));
      if(!/\.html$/.test(file))file+='.html';
      return {file:file,title:String(pg.title||'Page'),nav:String(pg.nav||pg.title||'Page'),
        goal:String(pg.goal||''),sections:Array.isArray(pg.sections)?pg.sections.slice(0,9):[]};
    });
    d.images=(Array.isArray(d.images)?d.images:[]).slice(0,4).map(function(im,i){
      return {id:String(im.id||('img'+i)).replace(/[^a-z0-9\-]/gi,'')||('img'+i),
        ratio:['1:1','4:3','3:4','16:9','9:16','3:2','2:3'].indexOf(String(im.ratio))>=0?im.ratio:'16:9',
        alt:String(im.alt||''),use:String(im.use||''),prompt:String(im.prompt||'')};
    }).filter(function(im){return im.prompt});
    /* Asking is not enough — a model that drops one of those ids costs real
       money. Whatever it planned, the paid-for pictures stay in the plan. */
    var paid=paidFor(p);
    if(paid.length){
      var fresh=d.images.filter(function(im){
        return !paid.some(function(k){return k.id===im.id});
      });
      d.images=paid.concat(fresh).slice(0,4);
    }
    return d;
  });
}

/* ---------- 3. the design system (§5, §8, §12) ---------- */
function writeBase(p){
  var d=p.direction,nav=d.pages.map(function(pg){return pg.nav+' → '+pg.file}).join(', ');
  var input=[
    brand(p),'','Navigation across the site: '+nav,'',CONTRACT,'',
    'Write the shared stylesheet for this brand — tokens, the type scale, the container, the',
    'buttons, the header and the footer, and the phone behaviour of the header. Nothing else:',
    'each page writes the CSS for its own sections.',
    '',
    '- Open with :root custom properties built from the palette above, and use them throughout.',
    '- Build a real type scale with clamp(): .display is a display size, .h2 clearly smaller,',
    '  .lead larger than body, .eyebrow small and lettered, .meta smallest. They must not look alike (§8).',
    '- .site-nav must work on a phone: .nav-toggle is visible under 860px, .links collapse, and',
    '  html[data-nav-open] .links opens them. Targets at least 44px (§12).',
    '- No @import. Do not restate a CSS reset — one is already prepended. No !important beyond',
    '  the phone navigation. No comments. Be terse: every provider here has 45 seconds and a',
    '  long answer never arrives. Under 3000 characters.',
    '',
    'Answer with the file and nothing else:',
    '@@FILE styles.css',
    '...css...',
    '@@END'
  ].join('\n');
  return ask('code',input,{max:2000,temp:.5}).then(function(t){
    var f=parseFiles(t)[0];
    if(!f||!/\{/.test(f.body))throw Object.assign(new Error('The stylesheet came back unusable'),{status:502});
    return KERNEL+'\n\n/* ---------- '+(d.name||'brand')+' ---------- */\n'+f.body;
  });
}

/* The same stylesheet, written here from the direction the model already gave.

   §41 applies to more than photographs: a step that cannot reach the gateway
   must not end the build. The palette, the two font stacks and the type scale
   are the model's own decisions — this only sets them, so what comes out is
   plain rather than generic, and the pages still bring their own art direction. */
function localBase(d){
  d=d||{};
  var p=d.palette||{},t=d.type||{};
  function c(k,fb){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(p[k]||''))?p[k]:fb}
  var bg=c('bg','#0e0e11'),surface=c('surface','#17171c'),ink=c('ink','#f4f4f0'),
      muted=c('muted','#9b9ba6'),line=c('line','rgba(255,255,255,.12)'),
      accent=c('accent','#c9a227'),accentInk=c('accentInk','#0e0e11');
  var display=String(t.display||'Georgia,"Times New Roman",serif').slice(0,160);
  var bodyFont=String(t.body||'system-ui,-apple-system,"Segoe UI",sans-serif').slice(0,160);
  return KERNEL+'\n\n/* ---------- '+(d.name||'brand')+' ---------- */\n'+[
  ':root{--bg:'+bg+';--surface:'+surface+';--ink:'+ink+';--muted:'+muted+';--line:'+line+
    ';--accent:'+accent+';--accent-ink:'+accentInk+';--wrap:1180px;--gut:clamp(20px,5vw,64px)}',
  'body{background:var(--bg);color:var(--ink);font-family:'+bodyFont+';font-size:17px;line-height:1.6}',
  '.wrap{width:min(var(--wrap),100%);margin-inline:auto;padding-inline:var(--gut)}',
  '.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 1rem}',
  '.display{font-family:'+display+';font-weight:700;font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:.98;letter-spacing:-.03em;margin:0 0 1.4rem}',
  '.h2{font-family:'+display+';font-weight:700;font-size:clamp(1.7rem,3.4vw,2.9rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 1rem}',
  '.lead{font-size:clamp(1.1rem,1.6vw,1.34rem);line-height:1.5;color:var(--ink);max-width:56ch;margin:0 0 1.5rem}',
  '.meta{font-size:.82rem;color:var(--muted);letter-spacing:.02em}',
  'a{color:inherit}',
  '.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:0 1.5rem;border-radius:999px;',
  '  border:1px solid var(--line);text-decoration:none;font-size:.95rem;font-weight:500;transition:.18s ease}',
  '.btn--primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}',
  '.btn--primary:hover{filter:brightness(1.08)}',
  '.btn--ghost{background:transparent}',
  '.btn--ghost:hover{border-color:var(--ink)}',
  '.site-nav{display:flex;align-items:center;gap:2rem;padding:1.25rem var(--gut);',
  '  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--bg)}',
  '.site-nav .brand{font-family:'+display+';font-size:1.15rem;font-weight:700;letter-spacing:-.01em}',
  '.site-nav .links{display:flex;gap:1.6rem;margin-left:auto;font-size:.95rem}',
  '.site-nav .links a{text-decoration:none;color:var(--muted);transition:.16s}',
  '.site-nav .links a:hover,.site-nav .links a[aria-current]{color:var(--ink)}',
  '.site-nav .cta{margin-left:.4rem}',
  '.nav-toggle{display:none;margin-left:auto;min-width:48px;min-height:48px;background:none;',
  '  border:1px solid var(--line);border-radius:12px;color:inherit;font:inherit}',
  '@media (max-width:860px){',
  '  .site-nav{flex-wrap:wrap}',
  '  .site-nav .links{display:none;order:3;width:100%;flex-direction:column;gap:.2rem;padding-top:1rem}',
  '  html[data-nav-open] .site-nav .links{display:flex}',
  '  html[data-nav-open] .site-nav .links a{padding:.7rem 0;font-size:1.05rem}',
  '  .nav-toggle{display:block}',
  '  .site-nav .cta{display:none}',
  '}',
  '.site-foot{border-top:1px solid var(--line);padding:3.5rem var(--gut);color:var(--muted);font-size:.9rem}',
  'section{padding-block:clamp(3.5rem,9vw,8rem)}'
  ].join('\n');
}

/* ---------- 4. one page at a time (§7, §9, §12) ---------- */
function writePage(p,pg,index){
  var d=p.direction;
  var imgs=(d.images||[]).map(function(im){
    return '  {{img:'+im.id+'}}  '+im.ratio+' — '+im.use+' — alt: "'+im.alt+'"'}).join('\n');
  var nav=d.pages.map(function(x){return x.nav+' → '+x.file}).join(', ');
  var sections=(pg.sections||[]).map(function(s,i){
    return '  '+(i+1)+'. '+(s.id||'section')+' — '+(s.shape||'')+(s.note?' — '+s.note:'')}).join('\n');
  var input=[
    brand(p),'','Navigation across the site: '+nav,'',
    'Write '+pg.file+' — "'+pg.title+'"'+(pg.goal?'. The page exists to: '+pg.goal:'')+'.',
    'Its planned sections, which you may sharpen but not flatten into one repeated shape:',
    sections||'  (decide them yourself from the direction)',
    '',CONTRACT,'',
    imgs?('Pictures already planned for this site. Use a token exactly as written wherever the\n'+
          'picture belongs — in src="", or in CSS as url({{img:id}}). Do not invent other tokens,\n'+
          'do not use placeholder services, and never leave an empty <img>:\n'+imgs):
         'No photography is available for this build. Do not link to any external image or\n'+
         'placeholder service — carry the sections with type, colour, rule and space instead (§41).',
    '',
    'Requirements:',
    '- One complete HTML document. In <head>, exactly these two lines and no other stylesheet or script:',
    '    <link rel="stylesheet" href="styles.css"/>',
    '    <script src="app.js"></scr'+'ipt>',
    '- A real <title> and <meta name="description">, and lang on <html>.',
    '- The same .site-nav and .site-foot on every page, with the links above; mark this page current.',
    '- Every internal link points at a real file from the navigation list.',
    index===0?'- This is the first screen of the whole site. §7 applies: it must be memorable, and it must not be a centred headline with two buttons under it unless that is genuinely right here.':'- Do not simply repeat the home page hero; this page opens its own way.',
    '- Vary the section shapes down the page (§9). Real copy about this business — never lorem ipsum,',
    '  never "Your text here", never a dead <a href="#">.',
    '- Put data-reveal on the elements that should arrive as you scroll, not on everything.',
    '- Under 6000 characters of HTML. Every provider here has 45 seconds and a long answer',
    '  never arrives at all, so write tightly — fewer, stronger sections beat more of them.',
    '',
    'Then write only the CSS for THIS page\'s own sections, prefixed so it cannot collide,',
    'including its phone layout. Do not restate anything the shared stylesheet already has.',
    '',
    'Answer with the two files and nothing else:',
    '@@FILE '+pg.file,
    '...html...',
    '@@FILE '+pg.file.replace(/\.html$/,'')+'.page.css',
    '...css...',
    '@@END'
  ].join('\n');
  return ask('code',input,{max:3200,temp:.8}).then(function(t){
    var files=parseFiles(t);
    var html=null,css='';
    files.forEach(function(f){
      if(/\.html$/.test(f.path)&&!html)html=f.body;
      else if(/\.css$/.test(f.path))css+=f.body+'\n';
    });
    if(!html||!/<html|<body|<section|<main/i.test(html))
      throw Object.assign(new Error('The page came back unusable'),{status:502});
    return {html:fixPage(html,p),css:css};
  });
}

/* The two lines the preview and the published renderer both replace by exact
   match. A model that writes them slightly differently breaks both, so they are
   normalised here rather than hoped for. */
function fixPage(html,p){
  var d=p.direction||{},t=String(html);
  t=t.replace(/<link[^>]+rel=["']stylesheet["'][^>]*>/gi,function(m){
    return /styles\.css/.test(m)?'<link rel="stylesheet" href="styles.css"/>':'';
  });
  t=t.replace(/<script[^>]*src=["'][^"']*app\.js["'][^>]*><\/script>/gi,'<scr'+'ipt src="app.js"></scr'+'ipt>');
  if(t.indexOf('href="styles.css"')<0)
    t=t.replace(/<\/head>/i,'<link rel="stylesheet" href="styles.css"/>\n</head>');
  if(t.indexOf('src="app.js"')<0)
    t=t.replace(/<\/body>/i,'<scr'+'ipt src="app.js"></scr'+'ipt>\n</body>');
  var fonts=(d.type&&Array.isArray(d.type.googleFonts))?d.type.googleFonts:[];
  if(fonts.length&&!/fonts\.googleapis/.test(t)){
    var href='https://fonts.googleapis.com/css2?'+fonts.slice(0,2).map(function(f){
      return 'family='+String(f).replace(/^family=/,'').replace(/ /g,'+')}).join('&')+'&display=swap';
    t=t.replace(/<\/head>/i,'<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      '<link rel="stylesheet" href="'+href+'">\n</head>');
  }
  return t;
}
window.__SUPER_BUILD={CONTRACT:CONTRACT,KERNEL:KERNEL,APPJS:APPJS,langLine:langLine,brand:brand,localBase:localBase,
  classify:classify,direct:direct,writeBase:writeBase,writePage:writePage,fixPage:fixPage};
})();
</script>

<script>
/* ============================================================
   Photographs, assembly, and the part that looks at its own work.
   ============================================================ */
(function(){
"use strict";
var U=window.__SUPER,B=window.__SUPER_BUILD;
var ask=U.ask,req=U.req,why=U.why,jsonFrom=U.jsonFrom,parseFiles=U.parseFiles,fileNamed=U.fileNamed;

/* ---------- §41 — a placeholder that still looks finished ---------- */
var RATIO={'1:1':[1,1],'4:3':[4,3],'3:4':[3,4],'16:9':[16,9],'9:16':[9,16],'3:2':[3,2],'2:3':[2,3],'21:9':[21,9]};
function placeholder(ratio,pal,seed){
  var r=RATIO[ratio]||RATIO['16:9'],w=r[0]*90,h=r[1]*90;
  var a=(pal&&pal.accent)||'#6b6b78',b=(pal&&pal.surface)||'#1a1a20',c=(pal&&pal.bg)||'#0d0d11';
  var n=0;for(var i=0;i<String(seed||'x').length;i++)n+=String(seed).charCodeAt(i);
  var ang=(n%4)*40+120;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<defs><linearGradient id="g" gradientTransform="rotate('+ang+' .5 .5)">'+
    '<stop offset="0" stop-color="'+c+'"/><stop offset=".55" stop-color="'+b+'"/>'+
    '<stop offset="1" stop-color="'+a+'" stop-opacity=".55"/></linearGradient></defs>'+
    '<rect width="'+w+'" height="'+h+'" fill="url(#g)"/>'+
    '<circle cx="'+Math.round(w*(0.24+(n%5)*0.13))+'" cy="'+Math.round(h*0.42)+'" r="'+Math.round(h*0.34)+
      '" fill="'+a+'" opacity=".16"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- the photographs (§25–§40) ---------- */
function photograph(spec,dir,reference){
  var prompt=[spec.prompt,
    dir?('Overall direction for this brand: '+dir):'',
    reference?'Match the look of the supplied reference photograph — its light, palette and framing.':'',
    'Photographic, not illustrated unless the direction says otherwise.',
    'No text, no letters, no logos, no watermarks and no interface anywhere in the frame.'
  ].filter(Boolean).join(' ');
  /* §34 — a picture the client handed over steers the shoot rather than being
     ignored. The route takes references as raw base64 with their own type. */
  var refs=[];
  var m=/^data:(image\/[a-z+]+);base64,(.+)$/i.exec(String(reference||''));
  if(m)refs.push({mimeType:m[1],dataBase64:m[2]});
  /* The image route is allowed 180 seconds and the client was giving up at 115.
     A picture that took two minutes was reported as a timeout after the server
     had already generated it and committed the credits — the client saw a
     failure and paid for it anyway. The client now outlasts the server. */
  return req('/api/image/generate',{timeout:175000,method:'POST',body:{
    mode:refs.length?'edit':'generate',prompt:prompt,aspectRatio:spec.ratio,size:'1K',quality:'medium',
    format:'webp',count:1,references:refs}}).then(function(d){
    var img=(d.images||[])[0];
    if(!img)throw new Error('The image gateway returned nothing');
    var id=img.assetId||img.id||'';
    /* A signed storage URL expires in minutes — fine to look at, wrong to build
       with. A picture is referenced by its asset path whenever it has one. */
    return {url:id?('/api/assets/'+encodeURIComponent(id)+'/content'):(img.url||''),
      assetId:id,provider:d.provider||''};
  });
}

/* ---------- tokens → real pictures, or a considered stand-in ---------- */
function paint(text,p){
  var pal=(p.direction&&p.direction.palette)||{};
  var specs={};(((p.direction||{}).images)||[]).forEach(function(im){specs[im.id]=im});
  return String(text==null?'':text).replace(/\{\{img:([a-z0-9\-]+)\}\}/gi,function(_,id){
    var got=p.images&&p.images[id];
    if(got&&got.url)return got.url;
    var spec=specs[id]||{};
    return placeholder(spec.ratio||'16:9',pal,id);
  });
}

/* ---------- assembly ---------- */
var BRIDGE='<scr'+'ipt>document.addEventListener("click",function(e){'+
  'var a=e.target.closest&&e.target.closest("a[href$=\\".html\\"]");'+
  'if(a){e.preventDefault();parent.postMessage({superNav:a.getAttribute("href")},"*")}'+
  '},true);</scr'+'ipt>';
function docFor(p,file,withBridge){
  var f=fileNamed(p.files,file)||fileNamed(p.files,'index.html');
  if(!f)return '';
  var css=(fileNamed(p.files,'styles.css')||{}).body||'';
  var js=(fileNamed(p.files,'app.js')||{}).body||'';
  return paint(f.body,p)
    .replace('<link rel="stylesheet" href="styles.css"/>','<style>\n'+paint(css,p)+'\n</style>')
    .replace('<scr'+'ipt src="app.js"></scr'+'ipt>','<scr'+'ipt>\n'+js+'\n</scr'+'ipt>'+(withBridge?BRIDGE:''));
}

/* A card on the projects screen shows the real build, but it must not run it:
   twelve live pages with their own timers is not a gallery. The script comes
   out — and with it the thing that switches [data-reveal] on, so the reveal is
   forced instead, or every thumbnail would be a blank rectangle. */
function thumbDoc(p){
  var cut=new RegExp('<scr'+'ipt[\\s\\S]*?</scr'+'ipt>','gi');
  var doc=docFor(p,'index.html',false).replace(cut,'');
  var unhide='<style>[data-reveal]{opacity:1!important;transform:none!important}</style>';
  return /<\/head>/i.test(doc)?doc.replace(/<\/head>/i,unhide+'</head>'):(unhide+doc);
}

/* ---------- §12, actually checked ----------
   Not "responsive design applied" — the page is loaded at 390px in a frame
   nobody sees and measured. What comes back is the truth about this build. */
function phoneCheck(p){
  return new Promise(function(resolve){
    var f=document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-same-origin');
    f.style.cssText='position:fixed;left:-9999px;top:0;width:390px;height:844px;border:0;visibility:hidden';
    document.body.appendChild(f);
    var done=false;
    function finish(r){if(done)return;done=true;try{f.remove()}catch(e){}resolve(r)}
    var give=setTimeout(function(){finish({ok:false,reason:'the phone check did not finish'})},9000);
    f.onload=function(){
      setTimeout(function(){
        clearTimeout(give);
        var out={ok:true,overflow:0,wide:[],small:0};
        try{
          var d=f.contentDocument,root=d.documentElement;
          out.overflow=Math.max(0,root.scrollWidth-root.clientWidth);
          var all=d.body.querySelectorAll('*'),lim=root.clientWidth+1;
          for(var i=0;i<all.length&&out.wide.length<4;i++){
            var r=all[i].getBoundingClientRect();
            if(r.width>lim+2&&r.height>4)out.wide.push((all[i].className||all[i].tagName).toString().slice(0,40));
          }
          var taps=d.querySelectorAll('a,button,input,select,textarea');
          for(var j=0;j<taps.length;j++){
            var t=taps[j].getBoundingClientRect();
            if(t.width>0&&t.height>0&&t.height<38)out.small++;
          }
        }catch(e){out.ok=false;out.reason='the phone frame could not be read'}
        finish(out);
      },700);
    };
    f.srcdoc=docFor(p,p.page||'index.html',false);
  });
}

/* ---------- §16 — a picture of the build, and an honest mark ----------
   There is no screenshot API in a tab and no library may be loaded here, so
   the frame's own document is serialised into an SVG foreignObject and drawn
   to a canvas. A document that will not serialise returns nothing, and the
   review is skipped rather than the build being called finished on faith. */
function shot(frame){
  return new Promise(function(resolve){
    var doc=null;try{doc=frame&&frame.contentDocument}catch(e){}
    if(!doc||!doc.documentElement)return resolve('');
    var w=Math.min(1180,doc.documentElement.clientWidth||1180);
    var h=Math.min(1400,Math.max(700,doc.documentElement.clientHeight||900));
    var clone;
    try{
      clone=doc.documentElement.cloneNode(true);
      Array.prototype.slice.call(clone.querySelectorAll('script')).forEach(function(n){n.remove()});
      /* the page's own reveal starts everything at opacity 0 and is switched on
         by one of those scripts — without this the review marks a blank page */
      var unhide=doc.createElement('style');
      unhide.textContent='[data-reveal],[data-reveal] *{opacity:1!important;transform:none!important;'+
        'filter:none!important;clip-path:none!important;visibility:visible!important}'+
        'html,body{overflow:visible!important}*{animation:none!important;transition:none!important}';
      (clone.querySelector('head')||clone).appendChild(unhide);
    }catch(e){return resolve('')}
    /* A foreignObject built from a data: URI never fetches anything external —
       every photograph rendered as its own broken box, so the review called a
       working hero "broken" on every single run. Inlining each photograph as
       a data URI first makes it part of the document instead of a reference
       the foreignObject cannot go and fetch. */
    var imgs=Array.prototype.slice.call(clone.querySelectorAll('img[src]'))
      .filter(function(im){return !/^data:/i.test(im.getAttribute('src')||'')});
    Promise.all(imgs.map(function(im){
      return fetch(im.getAttribute('src'),{credentials:'same-origin'}).then(function(r){
        if(!r.ok)throw 0;return r.blob();
      }).then(function(b){
        return new Promise(function(res){
          var fr=new FileReader();
          fr.onload=function(){res(fr.result)};
          fr.onerror=function(){res(null)};
          fr.readAsDataURL(b);
        });
      }).then(function(data){if(data)im.setAttribute('src',data)}).catch(function(){});
    })).then(function(){
      var html;
      try{html=new XMLSerializer().serializeToString(clone)}catch(e){return resolve('')}
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
        '<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">'+
        html+'</div></foreignObject></svg>';
      var url;try{url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}catch(e){return resolve('')}
      var img=new Image(),settled=false;
      var give=setTimeout(function(){if(!settled){settled=true;resolve('')}},10000);
      img.onload=function(){
        if(settled)return;settled=true;clearTimeout(give);
        try{
          var cv=document.createElement('canvas');
          cv.width=Math.round(w*.62);cv.height=Math.round(h*.62);
          var cx=cv.getContext('2d');
          cx.fillStyle='#ffffff';cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img,0,0,cv.width,cv.height);
          resolve(cv.toDataURL('image/jpeg',.62));
        }catch(e){resolve('')}
      };
      img.onerror=function(){if(!settled){settled=true;clearTimeout(give);resolve('')}};
      img.src=url;
    });
  });
}

var FIXES=[
 'hero:rebuild — the first screen is generic or forgettable',
 'variety:sections — too many sections share one layout',
 'type:scale — the type hierarchy is too flat',
 'space:open — the spacing is cramped or mechanically even',
 'accent:restrain — the accent colour is overused',
 'contrast:raise — text and background are too close',
 'cards:fewer — the page leans on repeated cards',
 'images:weight — the imagery is weak or carries no weight'
];
function review(p,frame){
  return shot(frame).then(function(data){
    if(!data)return null;
    var hint=[
      'This is the home page of a '+((p.direction&&p.direction.trade)||'business')+
        ' called '+((p.direction&&p.direction.name)||p.name)+'.',
      'Its stated visual concept was: '+((p.direction&&p.direction.concept)||'not recorded')+'.',
      'Judge it against that. The fixes list you may choose from, exactly as written before the dash:',
      FIXES.join('\n')
    ].join('\n');
    return req('/api/ai/vision-review',{method:'POST',body:{image:data,mode:'page',hint:hint}})
      .then(function(d){
        var o=jsonFrom(d&&d.text);
        if(!o||!o.scores)return null;
        var s=o.scores,keys=Object.keys(s),low=[];
        keys.forEach(function(k){if(Number(s[k])<8)low.push(k)});
        return {scores:s,low:low,worst:String(o.worst||low[0]||''),
          problems:(Array.isArray(o.problems)?o.problems:[]).slice(0,3),
          fixes:(Array.isArray(o.fixes)?o.fixes:[]).map(function(f){return String(f).split(' ')[0]}).slice(0,2),
          verdict:String(o.verdict||'')};
      },function(){return null});
  });
}

/* ---------- §18 — fix the worst of it, in CSS only ----------
   Appended after everything else, so a correction can improve the build
   without being able to break its markup. */
function patch(p,found){
  var input=[
    B.brand(p),'',
    'A design review of the built page found:',
    found.problems.map(function(x){return '- '+x}).join('\n'),
    found.fixes.length?('It asked for: '+found.fixes.join(', ')):'',
    '',
    'Write CSS that corrects those findings when appended after the existing stylesheet.',
    'Use the custom properties the stylesheet already declares rather than new colours, and do',
    'not change the palette. No @import, no url(), no fonts, no more than two !important rules.',
    'Under 2600 characters.',
    '',
    'Existing stylesheet (truncated):',
    String((U.fileNamed(p.files,'styles.css')||{}).body||'').slice(0,4200),
    '',
    'Answer with the file and nothing else:',
    '@@FILE fix.css',
    '...css...',
    '@@END'
  ].filter(Boolean).join('\n');
  return ask('code',input,{max:1100,temp:.35}).then(function(t){
    var f=parseFiles(t)[0];
    if(!f)return null;
    var css=f.body.trim();
    if(!css||css.length>2900)return null;
    if(/@import|url\s*\(|javascript:|<\/?script|expression\s*\(/i.test(css))return null;
    if((css.match(/\{/g)||[]).length!==(css.match(/\}/g)||[]).length)return null;
    return css;
  },function(){return null});
}

/* ---------- follow-ups (§14) ---------- */
function editFiles(p,text,intent){
  var list=p.files.filter(function(f){return f.path!=='app.js'});
  var body=list.map(function(f){return '@@FILE '+f.path+'\n'+f.body}).join('\n')+'\n@@END';
  var input=[
    B.brand(p),'',
    'The client asked for this change: """'+text+'"""',
    'Classified as: '+intent+'.','',
    'This is the current build. Read it, work out the smallest set of files that has to change,',
    'and return ONLY those files, complete. Do not return a file you did not change. Do not',
    'rewrite the whole site for a small change (§14). Keep the existing structure, copy and',
    'features that work.',
    U.impliesMarkupChange(text)?
      'This request changes markup, not just styling (an element is being added, replaced or removed). '+
      'A CSS-only answer does not satisfy it — you must include the .html file with that element actually changed.':'',
    'Picture tokens like {{img:hero}} are real — leave any you do not touch exactly as they are.',
    'Keep the two exact lines in every page head/body:',
    '  <link rel="stylesheet" href="styles.css"/>',
    '  <scr'+'ipt src="app.js"></scr'+'ipt>',
    '',
    body,'',
    'Answer with the changed files in the same @@FILE form and nothing else, then @@END.',
    'After the last file, on its own line, write:',
    '@@NOTE one or two sentences to the client about what you changed and why.',
    B.langLine(p)
  ].filter(Boolean).join('\n');
  /* 3400 left too little room for a full index.html plus styles.css in one
     answer — under time pressure (esp. the 0.55x retry budget in ask()) the
     model would keep the small CSS file and drop the large HTML file, which
     silently satisfied "at least one file came back" (line below) while
     missing the point of the request entirely. 3900 matches the same
     headroom used in direct() under the gateway's 4096 ceiling. */
  return ask('code',input,{max:3900,temp:.6}).then(function(t){
    var note='';
    var m=/@@NOTE[ \t]*([\s\S]*)$/.exec(t);
    if(m){note=m[1].trim();t=t.slice(0,m.index)}
    var files=parseFiles(t).filter(function(f){return /\.(html|css)$/.test(f.path)});
    if(!files.length)throw Object.assign(new Error('Nothing came back that could be applied'),{status:502});
    /* A file that parsed fine can still have been cut off mid-answer — see
       looksTruncatedCss/Html (§ "editFiles() had no output validation").
       Better to fail the whole edit and let the client retry than save a
       page or stylesheet that ends mid-rule. */
    var broken=files.filter(function(f){
      return /\.css$/.test(f.path)?U.looksTruncatedCss(f.body):U.looksTruncatedHtml(f.body);
    });
    if(broken.length)throw Object.assign(new Error('The answer for '+broken[0].path+
      ' was cut off partway through — nothing was applied'),{status:502});
    files.forEach(function(f){if(/\.html$/.test(f.path))f.body=B.fixPage(f.body,p)});
    return {files:files,note:note};
  });
}

function chat(p,text){
  var input=[
    p.direction?B.brand(p):'Nothing has been built in this project yet.','',
    'The client said: """'+text+'"""',
    'Answer them. Two or three sentences, as a creative partner (§22), not a workflow machine.',
    'Do not start building and do not list steps.',
    B.langLine(p)
  ].join('\n');
  return ask('chat',input,{max:400,temp:.8});
}

window.__SUPER_RUN={placeholder:placeholder,photograph:photograph,paint:paint,docFor:docFor,thumbDoc:thumbDoc,
  phoneCheck:phoneCheck,shot:shot,review:review,patch:patch,editFiles:editFiles,chat:chat,FIXES:FIXES};
})();
</script>

<script>
/* ============================================================
   The studio — what the client sees, and the order it happens in.
   ============================================================ */
(function(){
"use strict";
var U=window.__SUPER,B=window.__SUPER_BUILD,R=window.__SUPER_RUN;
var $=U.$,$$=U.$$,esc=U.esc,toast=U.toast,DB=U.DB,save=U.save,req=U.req,why=U.why,ask=U.ask;
var S={busy:false,stop:false,tab:'preview',device:'desktop',codeFile:'',mode:'build',
       reference:null,chatHidden:false,
       /* under 900px the two columns cannot both be on screen, so one of them
          is showing and the other is not. 'chat' | 'view'. */
       narrow:'chat'};
function isNarrow(){return innerWidth<900}

function L(en,hi){var p=U.active();return (p&&p.lang==='hi'&&hi)?hi:en}
function p(){return U.active()}

/* ---------- session ---------- */
function probe(){
  var tag=$('#sessionTag');
  return req('/api/auth/me').then(function(d){
    var me=d.user||d;
    U.SESSION.state='in';
    U.SESSION.name=String(me.name||me.email||'').split('@')[0]||'there';
    U.SESSION.email=String(me.email||'');
    U.SESSION.role=String(d.role||'');
    tag.className='tag ok';tag.textContent='signed in as '+(U.SESSION.email||U.SESSION.name);
    $('#wsName').textContent=U.SESSION.name+"'s workspace";
    var i=(U.SESSION.name||'S').slice(0,1).toUpperCase();
    $('#wsBadge').textContent=i;$('#avatar').textContent=i;
    $('#heroTitle').textContent='What are we building, '+U.SESSION.name+'?';
    return req('/api/billing/credits').then(function(c){
      U.SESSION.credits=Number((c.wallet&&c.wallet.available!=null)?c.wallet.available:(c.balance!=null?c.balance:(c.credits!=null?c.credits:NaN)));
      if(!isNaN(U.SESSION.credits))tag.textContent+=' · '+U.SESSION.credits+' credits';
    },function(){});
  },function(e){
    U.SESSION.state='out';
    tag.className='tag bad';
    tag.textContent=e&&e.status===401?'signed out — the model will refuse':'the /api routes are not reachable';
    banner(e&&e.status===401
      ? 'You are signed out on this domain. Nothing can be generated until you sign in to Scen in another tab.'
      : 'The /api routes are not reachable from this address, so the gateway cannot be called from here.');
  });
}
function banner(text){
  var b=$('#banner');
  if(!text)return b.classList.add('hidden');
  b.innerHTML='<span>'+esc(text)+'</span><button data-act="recheck">check again</button>';
  b.classList.remove('hidden');
}

/* ---------- home ---------- */
var filter='all',query='';
function setFilter(f){filter=f;drawHome()}
function setQuery(q){query=q;drawHome()}
function drawHome(){
  var list=DB.projects.slice();
  if(filter==='starred')list=list.filter(function(x){return x.starred});
  if(filter==='published')list=list.filter(function(x){return x.published});
  if(filter==='recent')list=list.sort(function(a,b){return (b.openedAt||0)-(a.openedAt||0)}).slice(0,8);
  if(query)list=list.filter(function(x){
    return (x.name+' '+x.brief).toLowerCase().indexOf(query.toLowerCase())>=0});

  var rec=$('#recents');rec.innerHTML='';
  DB.projects.slice(0,8).forEach(function(x){
    var b=document.createElement('button');b.className='r';b.textContent=x.name||'Untitled';
    b.setAttribute('data-open',x.id);rec.appendChild(b);
  });
  if(!DB.projects.length)rec.innerHTML='<div class="empty" style="padding:14px 10px;text-align:left">Nothing yet.</div>';

  var wrap=$('#cards'),blank=$('#cardsEmpty');wrap.innerHTML='';
  if(!list.length){
    blank.classList.remove('hidden');
    blank.textContent=DB.projects.length
      ? 'Nothing matches that.'
      : 'No projects yet. Describe a business above and this fills up.';
    return;
  }
  blank.classList.add('hidden');
  list.slice(0,12).forEach(function(x){
    /* a div, not a button: the thumbnail is a live frame of the build, and an
       iframe inside a button is neither valid nor clickable */
    var card=document.createElement('div');
    card.className='card';card.setAttribute('data-open',x.id);
    card.setAttribute('role','button');card.tabIndex=0;
    var when=new Date(x.updatedAt||x.createdAt);
    card.innerHTML='<div class="thumb"></div><div class="meta"><b>'+esc(x.name||'Untitled')+'</b>'+
      '<span>'+(x.published?'live · ':'')+when.toLocaleDateString()+' · '+
      (x.files.length?x.files.length+' files':'not built yet')+'</span></div>';
    var star=document.createElement('span');
    star.className='star'+(x.starred?' on':'');
    star.setAttribute('data-star',x.id);
    star.innerHTML='<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:'+
      (x.starred?'currentColor':'none')+';stroke-width:1.7"><path d="m12 4 2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/></svg>';
    card.querySelector('.thumb').appendChild(star);
    if(x.files.length){
      var f=document.createElement('iframe');
      f.setAttribute('sandbox','allow-same-origin');
      f.setAttribute('loading','lazy');f.setAttribute('title',x.name||'preview');
      f.srcdoc=R.thumbDoc(x);
      card.querySelector('.thumb').insertBefore(f,star);
    }
    wrap.appendChild(card);
  });
}

/* ---------- project ---------- */
function open(id){
  var x=U.project(id);if(!x)return;
  DB.activeId=id;x.openedAt=Date.now();save();
  $('#home').classList.add('hidden');$('#work').classList.remove('hidden');
  S.tab='preview';S.codeFile='';
  drawProject();drawThread();renderPreview();
  setTimeout(function(){$('#say').focus()},60);
}
function home(){
  $('#work').classList.add('hidden');$('#home').classList.remove('hidden');
  drawHome();
}
function drawProject(){
  var x=p();if(!x)return;
  $('#projName').textContent=x.name||'Untitled';
  $('#projNote').textContent=S.busy?L('Working…','Kaam chal raha hai…')
    :(x.published?('Live at '+x.published.slug):(x.files.length?L('Ready','Taiyaar'):L('Nothing built yet','Abhi kuch bana nahi')));
  $('#pageLabel').textContent=pageTitle(x,x.page||'index.html');
  $$('.seg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===S.tab)});
  $('#codewrap').classList.toggle('hidden',S.tab!=='code');
  $('#frame').classList.toggle('hidden',S.tab==='code');
  $('#frame').className='frame '+S.device+(S.tab==='code'?' hidden':'');
  $('#chatcol').classList.toggle('collapsed',S.chatHidden&&!isNarrow());
  $('#work').classList.toggle('showpreview',isNarrow()&&S.narrow==='view');
  $('#stopBtn').classList.toggle('hidden',!S.busy);
  $('#sendBtn').classList.toggle('hidden',S.busy);
  $('#sayPhotos').checked=x.photos!==false;
  $('#askPhotos').checked=x.photos!==false;
  if(S.tab==='code')drawCode();
}
function pageTitle(x,file){
  var d=x.direction;
  if(d&&d.pages)for(var i=0;i<d.pages.length;i++)if(d.pages[i].file===file)return d.pages[i].title;
  return file==='index.html'?'Homepage':file;
}
function drawCode(){
  var x=p();if(!x)return;
  var nav=$('#codenav'),body=$('#codebody');
  if(!x.files.length){nav.innerHTML='';body.textContent='Nothing built yet.';return}
  if(!S.codeFile||!U.fileNamed(x.files,S.codeFile))S.codeFile=x.files[0].path;
  nav.innerHTML='';
  x.files.forEach(function(f){
    var b=document.createElement('button');
    b.textContent=f.path;b.className=(f.path===S.codeFile?'on':'');
    b.setAttribute('data-code',f.path);nav.appendChild(b);
  });
  body.textContent=(U.fileNamed(x.files,S.codeFile)||{}).body||'';
}
function renderPreview(){
  var x=p();if(!x)return;
  var frame=$('#preview'),blank=$('#frameBlank');
  if(!x.files.length){blank.classList.remove('hidden');frame.srcdoc='';return}
  blank.classList.add('hidden');
  frame.srcdoc=R.docFor(x,x.page||'index.html',true);
}
addEventListener('message',function(e){
  if(!e.data||!e.data.superNav)return;
  var x=p();if(!x)return;
  var f=String(e.data.superNav);
  if(!U.fileNamed(x.files,f))return toast('That page has not been written yet.');
  x.page=f;save();drawProject();renderPreview();
});

/* ---------- the thread ---------- */
function drawThread(){
  var x=p();if(!x)return;
  var t=$('#thread');t.innerHTML='';
  x.messages.forEach(function(m){t.appendChild(node(m,x))});
  t.scrollTop=t.scrollHeight;
}
function node(m,x){
  if(m.role==='you'){
    var d=U.el('div','msg you');
    d.appendChild(U.el('div','bubble',esc(m.text)));
    if(m.image){var i=new Image();i.src=m.image;i.style.cssText='max-width:180px;border-radius:12px;margin-top:8px';
      d.appendChild(i)}
    return d;
  }
  if(m.role==='step'){
    var s=U.el('div','msg step'+(m.done?'':' live'));
    var mark=m.failed
      ?'<span class="tick" style="color:var(--rose)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></span>'
      :(m.done
        ?'<span class="tick"><svg viewBox="0 0 24 24"><path d="m5 13 4 4 10-10"/></svg></span>'
        :'<span class="tick" style="color:var(--muted)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span>');
    s.innerHTML=mark+'<span'+(m.done?'':' class="shim"')+'>'+esc(m.text)+'</span>';
    return s;
  }
  var b=U.el('div','msg bot');
  b.innerHTML=esc(m.text).replace(/\n/g,'<br>');
  if(m.files&&m.files.length){
    var fl=U.el('div','filelist');
    m.files.forEach(function(f){
      var row=document.createElement('button');
      row.className='f';row.setAttribute('data-code',f.path);
      row.innerHTML='<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#9a9aa4;fill:none;stroke-width:1.7">'+
        '<path d="M14 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V7.5z"/><path d="M14 3v4.5h4.5"/></svg>'+
        '<code>'+esc(f.path)+'</code><span class="kind'+(f.kind==='new'?' new':'')+'">'+esc(f.kind)+'</span>';
      fl.appendChild(row);
    });
    b.appendChild(fl);
  }
  if(m.scores){
    var sb=U.el('div','scorebar');
    Object.keys(m.scores).forEach(function(k){
      var v=Number(m.scores[k]);
      sb.appendChild(U.el('span','s'+(v<8?' low':''),esc(k)+' <b>'+v+'</b>'));
    });
    b.appendChild(sb);
  }
  if(m.next&&m.next.length){
    var n=U.el('div','nextup');
    m.next.forEach(function(txt){
      var btn=document.createElement('button');
      btn.textContent='→ '+txt;btn.setAttribute('data-next',txt);n.appendChild(btn);
    });
    b.appendChild(n);
  }
  return b;
}
function say(role,text,extra){
  var x=p();if(!x)return null;
  var m=Object.assign({role:role,text:String(text||'')},extra||{});
  x.messages.push(m);save();
  var t=$('#thread');t.appendChild(node(m,x));t.scrollTop=t.scrollHeight;
  return m;
}
function step(text){return say('step',text,{done:false})}
function seal(m,text){
  if(!m)return;
  m.done=true;if(text)m.text=text;
  save();drawThread();
}
/* A step that runs for minutes needs to say where it has got to. Four
   photographs behind one unchanging line is indistinguishable from a hang. */
function retitle(m,text){
  if(!m||m.done)return;
  m.text=String(text||'');save();drawThread();
}
/* A run that throws used to leave its last step shimmering for the rest of the
   session, so the studio looked like it was still working on something it had
   already given up on. */
function sealOpen(){
  var x=p();if(!x)return;
  for(var i=x.messages.length-1;i>=0;i--){
    var m=x.messages[i];
    if(m.role==='step'&&!m.done){m.done=true;m.failed=true;break}
  }
  save();drawThread();
}
window.__SUPER_UI={S:S,L:L,p:p,say:say,step:step,seal:seal,drawThread:drawThread,drawProject:drawProject,
  drawHome:drawHome,drawCode:drawCode,renderPreview:renderPreview,open:open,home:home,probe:probe,
  banner:banner,pageTitle:pageTitle,setFilter:setFilter,setQuery:setQuery,
  sealOpen:sealOpen,retitle:retitle};
})();
</script>

<script>
/* ============================================================
   The run — §42 in order, and only claiming what came back (§23).
   ============================================================ */
(function(){
"use strict";
var U=window.__SUPER,B=window.__SUPER_BUILD,R=window.__SUPER_RUN,I=window.__SUPER_UI;
var $=U.$,esc=U.esc,toast=U.toast,save=U.save,why=U.why;
var S=I.S,L=I.L,say=I.say,step=I.step,seal=I.seal;

function stopped(){if(S.stop)throw Object.assign(new Error('stopped'),{quiet:true});}
function fileRows(before,after){
  var was={};before.forEach(function(f){was[f.path]=f.body});
  var rows=[];
  after.forEach(function(f){
    if(f.path==='app.js')return;
    if(!(f.path in was))rows.push({path:f.path,kind:'new'});
    else if(was[f.path]!==f.body)rows.push({path:f.path,kind:'changed'});
  });
  rows.sort(function(a,b){
    var ah=/\.html$/.test(a.path)?0:1,bh=/\.html$/.test(b.path)?0:1;
    return ah-bh||a.path.localeCompare(b.path);
  });
  return rows;
}
/* Read off this build, not invented (§20). At most two. */
function nextSteps(x){
  var out=[],html=x.files.filter(function(f){return /\.html$/.test(f.path)});
  var all=x.files.map(function(f){return f.body}).join('');
  var shot=Object.keys(x.images||{}).length;
  var planned=((x.direction||{}).images||[]).length;
  if(planned&&shot<planned)out.push(L('Photograph the set — the pictures are still stand-ins',
                                       'Photos bana lo — abhi placeholder lage hain'));
  if(!x.published)out.push(L('Put it online at a Scen address','Isko live address par daal do'));
  if(!/<form/i.test(all))out.push(L('Give visitors a way to get in touch',
                                    'Visitors ke liye contact form add karo'));
  if(html.length<3)out.push(L('Add the page this business is missing',
                              'Ek aur zaroori page add karo'));
  return out.slice(0,2);
}

async function photographs(x,on){
  var planned=(x.direction.images||[]);
  if(!on||!planned.length)return;
  var have=x.images||(x.images={});
  /* A picture costs 25 credits and it is already in hand. The first build here
     shot four, the stylesheet step then failed, and running it again would have
     shot the same four a second time — a hundred credits for nothing. Only what
     is genuinely missing is ordered. */
  var todo=planned.filter(function(im){return !(have[im.id]&&have[im.id].url)});
  var kept=planned.length-todo.length;
  if(!todo.length){
    seal(step(L('Reusing the '+kept+' pictures already shot — no new credits',
                'Pehle se bani '+kept+' photos hi use kar raha hoon — naye credits nahi')));
    return;
  }
  var s=step(L('Photographing '+todo.length+' pictures — 25 credits each…',
               todo.length+' photos bana raha hoon — 25 credits per picture…'));
  var made=0,failed='';
  for(var i=0;i<todo.length;i++){
    stopped();
    I.retitle(s,L('Photographing '+(i+1)+' of '+todo.length+' — 25 credits each…',
                  todo.length+' mein se '+(i+1)+' photo — 25 credits each…'));
    try{
      var got=await R.photograph(todo[i],x.direction.imageDirection,x.reference);
      have[todo[i].id]=got;made++;save();
      /* each picture is kept the moment it lands, so a failure on the fourth
         does not throw away the three that already cost credits */
      I.renderPreview();
    }catch(e){failed=why(e,'generate the photography');break}
  }
  var total=made+kept;
  seal(s,made===todo.length
    ? L('Photographed all '+total+' pictures'+(kept?' ('+kept+' reused)':''),
        'Saari '+total+' photos taiyaar'+(kept?' ('+kept+' purani)':''))
    : (total
        ? L(total+' of '+planned.length+' photographed — '+failed,
            planned.length+' mein se '+total+' bani — '+failed)
        : L('No photography this time — '+failed+' The layout carries itself instead.',
            'Photos nahi ban paayi — '+failed+' Layout khud sambhal raha hai.')));
}

async function build(x,text,upgrade){
  var before=x.files.map(function(f){return {path:f.path,body:f.body}});

  var s1=step(L('Creating the visual direction…','Visual direction bana raha hoon…'));
  x.direction=await B.direct(x,text,upgrade?'upgrade':'');
  x.name=String(x.direction.name||x.name||'Untitled').slice(0,60);
  save();seal(s1);I.drawProject();
  if(x.direction.opening)say('bot',x.direction.opening);

  if(S.mode==='plan'){
    say('bot',L('That is the direction. Say build when you want it written.',
                'Yeh raha direction. "build" bolo to likh deta hoon.'),
        {next:x.direction.pages.map(function(pg){return pg.title})});
    return;
  }

  await photographs(x,x.photos);
  stopped();

  var s2=step(L('Building the design system…','Design system bana raha hoon…'));
  var css;
  try{
    css=await B.writeBase(x);
    seal(s2);
  }catch(e){
    if(e&&e.quiet)throw e;
    /* One step losing the race must not cost the build — and the photographs
       above it have already been paid for. The direction's own palette and type
       are set here instead, and the step says so rather than claiming the model
       wrote it (§23). */
    css=B.localBase(x.direction);
    seal(s2,L('The model ran out of time on the stylesheet — set your palette and type directly instead',
              'Stylesheet par model ka time khatam ho gaya — aapka palette aur type maine khud laga diya'));
  }

  var pages=x.direction.pages;
  var written=[];
  for(var i=0;i<pages.length;i++){
    stopped();
    var s=step(L('Writing '+pages[i].title+'…',pages[i].title+' likh raha hoon…'));
    try{
      var r=await B.writePage(x,pages[i],i);
      written.push({file:pages[i].file,html:r.html});
      if(r.css)css+='\n\n/* ---------- '+pages[i].file+' ---------- */\n'+r.css;
      seal(s);
    }catch(e){
      if(e&&e.quiet)throw e;
      seal(s,L(pages[i].title+' did not come back — '+why(e,'write that page'),
               pages[i].title+' nahi bana — '+why(e,'woh page likhne')));
      if(i===0)throw e;   /* no home page is not a build */
    }
  }
  if(!written.length)throw new Error('Nothing was written');

  /* only now does the project change, so a failed run leaves the old build alone */
  var next=[];
  written.forEach(function(w){next.push({path:w.file,body:w.html})});
  next.push({path:'styles.css',body:css});
  next.push({path:'app.js',body:B.APPJS});
  x.files=next;x.page='index.html';
  x.versions=(x.versions||[]).concat([{at:Date.now(),label:text.slice(0,60),
    files:next.map(function(f){return {path:f.path,body:f.body}})}]).slice(-4);
  save();I.drawProject();I.renderPreview();

  /* §12 — measured, not asserted */
  stopped();
  var s3=step(L('Checking mobile layouts…','Mobile layout check kar raha hoon…'));
  var m=await R.phoneCheck(x);
  if(!m.ok)seal(s3,L('The phone check could not run — '+(m.reason||'no reason given'),
                     'Phone check nahi chala — '+(m.reason||'')));
  else if(m.overflow>0){
    css+='\n\n/* phone: something was wider than the screen */\n'+
      'html,body{overflow-x:hidden}\n'+
      '@media (max-width:430px){img,video,table,pre{max-width:100%}\n'+
      '  *{min-width:0}\n  .wrap{padding-left:20px;padding-right:20px}}\n';
    U.putFile(x.files,'styles.css',css);save();I.renderPreview();
    seal(s3,L('The phone layout ran '+m.overflow+'px wide — held it back to the screen',
              'Phone par '+m.overflow+'px chauda tha — theek kar diya'));
  }
  else seal(s3,L('Phone layout holds at 390px'+
                   (m.small?', '+m.small+' tap target'+(m.small===1?'':'s')+' under 38px':''),
                 '390px par layout theek hai'+
                   (m.small?', '+m.small+' button'+(m.small===1?'':'s')+' 38px se chhote hain':'')));

  /* §16 — look at it */
  stopped();
  var s4=step(L('Reviewing the design…','Design review kar raha hoon…'));
  var found=await R.review(x,$('#preview'));
  if(!found){seal(s4,L('The review could not read the page — marking it unreviewed',
                       'Review nahi ho paaya — bina review ke chhod raha hoon'))}
  else{
    seal(s4,found.verdict||L('Reviewed','Review ho gaya'));
    x.qa=found;save();
    say('bot',found.problems.length?found.problems.map(function(q){return '· '+q}).join('\n'):'',
        {scores:found.scores});
    if(found.low.length){
      stopped();
      var s5=step(L('Refining the design…','Design refine kar raha hoon…'));
      var fix=await R.patch(x,found);
      if(fix){
        css+='\n\n/* ---------- review pass ---------- */\n'+fix;
        U.putFile(x.files,'styles.css',css);save();I.renderPreview();
        seal(s5,L('Corrected '+found.low.join(', '),found.low.join(', ')+' theek kiya'));
      }else seal(s5,L('The correction came back unusable — the build is unchanged',
                      'Correction sahi nahi aaya — build waisa hi hai'));
    }
  }

  var s6=step(L('Polishing the final details…','Final polish…'));
  seal(s6,L('Ready.','Ho gaya.'));
  say('bot',L('Built '+x.name+' — '+written.length+' pages.','Ban gaya — '+written.length+' pages.'),
      {files:fileRows(before,x.files),next:nextSteps(x)});
}

async function change(x,text,intent){
  var before=x.files.map(function(f){return {path:f.path,body:f.body}});
  var s=step(L('Making that change…','Woh change kar raha hoon…'));
  var out=await R.editFiles(x,text,intent);
  var needsHtml=U.impliesMarkupChange(text);
  var touchedHtml=out.files.some(function(f){return /\.html$/.test(f.path)});
  if(needsHtml&&!touchedHtml){
    /* The request named an element to add/replace/remove but the answer
       only touched CSS — that satisfies editFiles()'s own "at least one
       file came back" check while missing the actual point. One retry with
       the miss spelled out, before this is shown to the client as done. */
    seal(s,L('That only changed styling — the markup itself still needs the change. Trying once more…',
             'Sirf styling badli — markup abhi bhi badalna hai. Ek aur try…'));
    var s2=step(L('Making that change…','Woh change kar raha hoon…'));
    out=await R.editFiles(x,text+'\n\n(Your last answer only returned CSS, but this request needs the '+
      'markup itself changed — you must include the .html file with that element actually added, '+
      'replaced or removed, not just restyled.)',intent);
    touchedHtml=out.files.some(function(f){return /\.html$/.test(f.path)});
    seal(s2);
  }else seal(s);
  out.files.forEach(function(f){U.putFile(x.files,f.path,f.body)});
  x.versions=(x.versions||[]).concat([{at:Date.now(),label:text.slice(0,60),
    files:x.files.map(function(f){return {path:f.path,body:f.body}})}]).slice(-4);
  save();I.renderPreview();I.drawCode();
  var rows=fileRows(before,x.files);
  say('bot',out.note||L('Done.','Ho gaya.'),{files:rows,next:nextSteps(x)});
  if(!rows.length)say('bot',L('Nothing in the build actually changed — say it a different way and I will try again.',
                              'Build mein kuch badla nahi — thoda aur clearly bolo, phir karta hoon.'));
  else if(needsHtml&&!touchedHtml)say('bot',
    L('This still only changed styling, not the markup — try naming the exact file or element and I will try again.',
      'Ye bhi sirf styling badli, markup nahi — file ya element ka naam clearly bolo, phir try karta hoon.'));
}

/* ---------- build cost ---------- */
function refreshCreditsBadge(){
  var tag=$('#sessionTag');if(!tag)return;
  var base=tag.textContent.replace(/\s*·\s*\d+\s*credits\s*$/,'');
  if(!isNaN(U.SESSION.credits))tag.textContent=base+' · '+U.SESSION.credits+' credits';
}
// A first full build costs credits, same wallet image generation already
// spends from — reserved and committed server-side in one call before
// build() ever starts. Follow-up edits to an existing project are never
// charged again (see build() itself for why: a paid-for asset stays paid
// for). Resolves true if the build may proceed, false if it was blocked —
// callers should not throw insufficient-credit failures into the generic
// error path, since that would print a chat line instead of the modal
// this is meant to guarantee.
function chargeForBuild(x){
  var attemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2));
  return U.req('/api/billing/build-charge',{method:'POST',body:{projectId:x.id,buildAttemptId:attemptId}}).then(function(d){
    if(d&&d.wallet&&d.wallet.available!=null){U.SESSION.credits=Number(d.wallet.available);refreshCreditsBadge()}
    return true;
  },function(e){
    if(e&&(e.status===402||e.code==='insufficient_credits')){insufficientCreditsModal();return false}
    throw e;
  });
}
function insufficientCreditsModal(){
  $('#modal').className='modal';
  $('#modal').innerHTML=
    '<div class="acct-head" style="padding-bottom:16px"><span class="av" style="background:var(--rose)">'+
    '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg></span>'+
    '<div><b>'+L('Not enough credits','Credits kam hain')+'</b><span>'+
    L('A build costs 50 credits','Ek build ke 50 credits lagte hain')+'</span></div></div>'+
    '<p>'+L('Your workspace does not have enough credits for this build. Top up to keep building.',
            'Aapke workspace mein is build ke liye poore credits nahi hain. Build jaari rakhne ke liye credits daalo.')+'</p>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Not now','Abhi nahi')+'</button>'+
    '<button class="btn blue" data-act="openPricing">'+L('Add credits','Credits daalo')+'</button></div>';
  $('#scrim').classList.add('open');
}
async function run(text,image){
  var x=I.p();if(!x||S.busy)return;
  S.busy=true;S.stop=false;I.drawProject();
  say('you',text,image?{image:image}:null);
  if(!x.brief)x.brief=text;
  if(image)x.reference=image;
  /* sticky once it is Hinglish: a client who writes "premium karo" and then
     "make the hero bigger" has not switched languages, and flipping back on
     one English sentence made the studio answer in two voices */
  var lang=U.sniffLang(text);
  if(lang==='hi')x.lang='hi';else if(!x.lang&&lang)x.lang=lang;
  save();
  try{
    if(S.mode==='chat'){
      var s=step(L('Reading that…','Padh raha hoon…'));
      var r=await R.chat(x,text);seal(s);say('bot',U.scrub(r));
    }else{
      var s0=step(L('Reading that…','Padh raha hoon…'));
      var c=await B.classify(x,text);
      seal(s0);
      if(c.intent==='normal_chat'&&S.mode!=='plan'){
        say('bot',U.scrub(c.reply||await R.chat(x,text)));
      }else if(c.ask.length&&!x.files.length&&S.mode!=='plan'){
        say('bot',L('Two things before I start:','Shuru karne se pehle:')+'\n'+
          c.ask.map(function(q){return '· '+q}).join('\n'));
      }else if(c.intent==='deploy_or_publish'){
        say('bot',L('Opening the publish box.','Publish box khol raha hoon.'));publish();
      }else if(!x.files.length||c.intent==='create_website'||c.intent==='create_app'){
        var okToBuild=!x.files.length?await chargeForBuild(x):true;
        if(okToBuild)await build(x,text,false);
      }else if(c.intent==='visual_upgrade'){
        await build(x,text,true);
      }else{
        await change(x,text,c.intent);
      }
    }
  }catch(e){
    I.sealOpen();
    if(e&&e.quiet)say('bot',L('Stopped.','Rok diya.'));
    else say('bot',L('That did not go through — '+why(e,'finish that'),
                     'Nahi ho paaya — '+why(e,'yeh poora karne')));
  }
  S.busy=false;S.stop=false;U.touch(x);I.drawProject();
}

/* ---------- publishing ---------- */
function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')
  .replace(/^-+|-+$/g,'').slice(0,48)}
function snapshot(x,slug){
  var ids=[];
  function pub(t){
    return String(t==null?'':t).replace(/\/api\/assets\/([A-Za-z0-9_-]{6,64})\/content/g,function(_,id){
      if(ids.indexOf(id)<0)ids.push(id);
      return '/api/sites/'+encodeURIComponent(slug)+'/asset/'+encodeURIComponent(id);
    });
  }
  var d=x.direction||{},pal=d.palette||{};
  var pages=x.files.filter(function(f){return /\.html$/.test(f.path)}).map(function(f){
    return {page:I.pageTitle(x,f.path),file:f.path,html:pub(R.paint(f.body,x))};
  });
  return {kind:'scen-agent-build',v:1,generatedAt:new Date().toISOString(),
    palette:{accent:pal.accent||'#2f6bff',accent2:pal.ink||'#111'},
    heroTitle:x.name,heroSubtitle:d.concept||'',components:pages.map(function(p2){return p2.page}),
    sectionCopy:[],sections:[],ctas:[],
    accent:pal.accent||'#2f6bff',style:d.concept||'',
    pages:pages,assetIds:ids,
    css:pub(R.paint((U.fileNamed(x.files,'styles.css')||{}).body||'',x)),
    js:(U.fileNamed(x.files,'app.js')||{}).body||''};
}
function publish(){

        '<button class="ico sq" data-act="copyPublishLink" title="'+L('Copy link','Link copy karo')+'">'+
