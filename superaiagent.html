/* Page views only, counted server-side by POST /api/sites/[slug]/track —
   there is no visitor identity anywhere in this system, so "visitors" is
   never shown here: only what was actually counted (per §23, do not claim
   what was not measured). */
function analytics(){
  var x=I.p();if(!x)return;
  $('#modal').className='modal';
  if(!x.published){
    $('#modal').innerHTML='<h3>'+L('Analytics','Analytics')+'</h3>'+
      '<p>'+L('Publish your app to start tracking visitors. Share your app with a live URL to see its traffic here.',
              'Pehle app publish karo, tab visitors track hone shuru honge.')+'</p>'+
      '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button>'+
      '<button class="btn blue" data-act="publish">'+L('Publish','Publish')+'</button></div>';
    $('#scrim').classList.add('open');return;
  }
  $('#modal').innerHTML='<h3>'+L('Analytics','Analytics')+'</h3>'+
    '<p>'+L('Loading…','Load ho raha hai…')+'</p>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  $('#scrim').classList.add('open');
  U.req('/api/sites/'+encodeURIComponent(x.published.slug)+'/analytics').then(function(d){
    if(!$('#scrim').classList.contains('open'))return;
    var max=Math.max(1,Math.max.apply(null,d.last7Days.map(function(r){return r.views})));
    var bars=d.last7Days.map(function(r){

      return '<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1">'+

        '<div style="width:100%;height:'+h+'px;background:var(--blue);border-radius:4px 4px 0 0"></div></div>'+
        '<span style="font-size:10.5px;color:var(--muted)">'+day.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'</span></div>';
    }).join('');
    $('#modal').innerHTML='<h3>'+L('Analytics','Analytics')+'</h3>'+
      '<div style="display:flex;gap:10px;margin-bottom:16px">'+
      '<div style="flex:1;border:1px solid var(--line);border-radius:12px;padding:12px"><span style="font-size:11.5px;color:var(--muted)">'+
      L('Page views','Page views')+'</span><b style="display:block;font-size:22px;margin-top:2px">'+d.pageViews+'</b></div>'+
      '<div style="flex:1;border:1px solid var(--line);border-radius:12px;padding:12px"><span style="font-size:11.5px;color:var(--muted)">'+
      L('Today','Aaj')+'</span><b style="display:block;font-size:22px;margin-top:2px">'+d.today+'</b></div></div>'+
      '<span style="font-size:11.5px;color:var(--muted)">'+L('Last 7 days','Pichle 7 din')+'</span>'+
      '<div style="display:flex;gap:4px;margin-top:8px;align-items:flex-end">'+bars+'</div>'+
      '<div class="modal-row" style="margin-top:16px"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  },function(e){
    if(!$('#scrim').classList.contains('open'))return;
    $('#modal').innerHTML='<h3>'+L('Analytics','Analytics')+'</h3>'+
      '<p>'+esc(why(e,'load analytics'))+'</p>'+
      '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  });
}
/* Real cards only — every row here is read from GET /api/capabilities, the
   same honest source the main Scen app's Connections hub uses. Nothing here
   is a Connect button that leads nowhere: AI/Data/Auth/Storage/Payments/Email
   are server-side, set once by the operator; Domain is the one thing a
   customer can actually add themselves, from Scen itself; Analytics/CRM/
   GitHub/Webhooks have no backend adapter, so they say so instead of
   pretending. See [[scen-connection-capabilities]]. */
var CONNECTOR_ROWS=[
  ['ai','AI generation','Text generation — set by the operator'],
  ['images','Photography','Image generation — set by the operator'],
  ['video','Video','Video generation — set by the operator'],
  ['data','Database','Set by the operator'],
  ['auth','Sign-in','Set by the operator'],
  ['storage','File storage','Set by the operator'],
  ['domain','Custom domain','Added from Scen itself'],
  ['payments','Payments','Set by the operator'],
  ['email','Email','Transactional email — set by the operator'],
  ['analytics','Product analytics','No adapter yet'],
  ['crm','CRM','No adapter yet'],
  ['github','GitHub','No adapter yet'],
  ['webhooks','Webhooks','No adapter yet']
];
function connectorBadge(state){
  var cls=state==='connected'?'ok':(state==='setup_required'?'warn':(state==='error'?'bad':''));
  var label={connected:'Connected',setup_required:'Setup required',not_connected:'Not connected',
    error:'Error',unavailable:'Not available yet'}[state]||state;
  return '<span class="tag '+cls+'">'+esc(L(label,label))+'</span>';
}
function connectors(){
  $('#modal').className='modal';
  $('#modal').innerHTML='<h3>'+L('Connectors','Connectors')+'</h3>'+
    '<p>'+L('Loading…','Load ho raha hai…')+'</p>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';

  U.req('/api/capabilities').then(function(d){
    if(!$('#scrim').classList.contains('open'))return;
    var caps=d.capabilities||{};

        'padding:11px 2px;border-bottom:1px solid var(--line2)">'+
        '<div><b style="font-size:13.5px;font-weight:600;display:block">'+esc(L(r[1],r[1]))+'</b>'+
        '<span style="font-size:11.5px;color:var(--muted)">'+esc(L(r[2],r[2]))+'</span></div>'+

      '<div style="max-height:360px;overflow:auto;margin:4px 0 6px">'+rows+'</div>'+
      '<div class="modal-row" style="margin-top:12px"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  },function(e){
    if(!$('#scrim').classList.contains('open'))return;
    $('#modal').innerHTML='<h3>'+L('Connectors','Connectors')+'</h3>'+
      '<p>'+esc(why(e,'load connectors'))+'</p>'+
      '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  });
}
/* Same two endpoints the main Scen app's own Billing page reads — the
   wallet balance from GET /api/billing/credits (already used to badge the
   avatar at boot, ~line 1553) and payment history from GET /api/billing/invoices
   (returns amount_minor/currency, not a display string, so it's formatted here). */
function billingCredits(){
  $('#modal').className='modal';
  $('#modal').innerHTML='<h3>'+L('Billing & credits','Billing & credits')+'</h3>'+
    '<p>'+L('Loading…','Load ho raha hai…')+'</p>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  $('#scrim').classList.add('open');
  Promise.all([
    U.req('/api/billing/credits'),
    U.req('/api/billing/invoices').catch(function(){return {invoices:[]}})
  ]).then(function(r){
    if(!$('#scrim').classList.contains('open'))return;
    var c=r[0]||{},balance=(c.wallet&&c.wallet.available!=null)?c.wallet.available:(c.balance!=null?c.balance:(c.credits!=null?c.credits:null));
    var invoices=(r[1]&&r[1].invoices)||[];
    var rows=invoices.slice(0,8).map(function(inv){
      var amt=inv.amount_minor!=null?(inv.amount_minor/100).toFixed(2)+' '+(inv.currency||''):'';
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;'+
        'padding:9px 2px;border-bottom:1px solid var(--line2)">'+
        '<div><b style="font-size:12.5px;font-weight:600;display:block">'+
        esc(inv.issued_at?new Date(inv.issued_at).toLocaleDateString():(inv.provider||''))+'</b>'+
        '<span style="font-size:11px;color:var(--muted)">'+esc(inv.status||'')+'</span></div>'+
        '<b style="font-size:13px">'+esc(amt)+'</b></div>';
    }).join('')||'<p style="margin:4px 0 0;font-size:12.5px;color:var(--muted)">'+
      L('No invoices yet.','Abhi koi invoice nahi.')+'</p>';
    $('#modal').innerHTML='<h3>'+L('Billing & credits','Billing & credits')+'</h3>'+
      '<div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px">'+
      '<span style="font-size:11.5px;color:var(--muted)">'+L('Credit balance','Credit balance')+'</span>'+
      '<b style="display:block;font-size:26px;margin-top:2px">'+(balance!=null&&!isNaN(balance)?balance:'—')+'</b></div>'+
      '<span style="font-size:11.5px;color:var(--muted)">'+L('Recent invoices','Recent invoices')+'</span>'+
      '<div style="max-height:240px;overflow:auto;margin-top:6px">'+rows+'</div>'+
      '<div class="modal-row" style="margin-top:16px"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  },function(e){
    if(!$('#scrim').classList.contains('open'))return;
    $('#modal').innerHTML='<h3>'+L('Billing & credits','Billing & credits')+'</h3>'+
      '<p>'+esc(why(e,'load billing'))+'</p>'+
      '<div class="modal-row"><button class="btn" data-act="close">'+L('Close','Band karo')+'</button></div>';
  });
}
function doPublish(){
  var x=I.p(),slug=slugify($('#slug').value);
  if(slug.length<3)return toast(L('That address is too short.','Address bahut chhota hai.'));
  var btn=$('#modal').querySelector('[data-act="doPublish"]');
  var step=$('#modal').querySelector('.pub-status');
  btn.disabled=true;btn.textContent=L('Checking address…','Address check ho raha hai…');
  if(step)step.querySelector('.tag').textContent=L('Checking…','Check ho raha hai…');
  U.req('/api/publish',{method:'POST',body:{slug:slug,projectName:x.name||slug,site:snapshot(x,slug)}})
    .then(function(d){
      x.published={slug:d.slug,url:d.url};save();
      $('#scrim').classList.remove('open');I.drawProject();
      say('bot',L('Live at '+d.url,'Live hai: '+d.url));
      toast(L('Published to '+d.url,'Publish ho gaya: '+d.url),6000);
    },function(e){
      btn.disabled=false;btn.textContent=L('Publish','Publish');
      if(step)step.querySelector('.tag').textContent=L('Not published','Abhi live nahi');
      toast(why(e,'publish this site'),6000);
    });
}
window.__SUPER_ACT={run:run,publish:publish,doPublish:doPublish,copyPublishLink:copyPublishLink,
  shareProject:shareProject,submitInvite:submitInvite,analytics:analytics,connectors:connectors,
  billing:billingCredits,snapshot:snapshot,nextSteps:nextSteps,fileRows:fileRows};
})();

<script>
/* ============================================================
   Events, menus, and the boot.
   ============================================================ */
(function(){
"use strict";
var U=window.__SUPER,B=window.__SUPER_BUILD,R=window.__SUPER_RUN,I=window.__SUPER_UI,A=window.__SUPER_ACT;
var $=U.$,$$=U.$$,esc=U.esc,toast=U.toast,DB=U.DB,save=U.save,why=U.why;
var S=I.S,L=I.L;

/* ---------- popovers ---------- */
function pop(anchor,html){
  var el=$('#pop');
  el.innerHTML=html;el.classList.add('open');
  var r=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  var left=Math.min(Math.max(8,r.left),innerWidth-w-8);
  var top=r.bottom+8;
  if(top+h>innerHeight-8)top=Math.max(8,r.top-h-8);
  el.style.left=left+'px';el.style.top=top+'px';
}
function closePop(){$('#pop').classList.remove('open')}
document.addEventListener('click',function(e){
  if(!e.target.closest('#pop')&&!e.target.closest('[data-act]'))closePop();
});
function closeModal(){$('#scrim').classList.remove('open')}
$('#scrim').addEventListener('click',function(e){if(e.target===this)closeModal()});
addEventListener('keydown',function(e){if(e.key==='Escape'){closePop();closeModal()}});

/* ---------- downloads ---------- */
function selfContained(x,file){return R.docFor(x,file,false)}
function download(name,text,type){
  var blob=new Blob([text],{type:type||'text/html'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
}

/* ---------- menus ---------- */
function modeMenu(btn){
  var rows=[['build','Build','writes and rebuilds the site'],
            ['plan','Plan','the direction only, nothing written'],
            ['chat','Chat','talk it through, no building']];
  pop(btn,'<h5>'+L('What should this message do','Yeh message kya kare')+'</h5>'+
    rows.map(function(r){
      return '<button data-mode="'+r[0]+'">'+esc(r[1])+
        (S.mode===r[0]?' ·':'')+'<br><small style="color:var(--muted);font-size:11.5px">'+esc(r[2])+'</small></button>';
    }).join(''));
}
function setMode(m){
  S.mode=m;closePop();
  var label=m==='build'?'Build':(m==='plan'?'Plan':'Chat');
  var caret='<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="m6 9 6 6 6-6"/></svg>';
  $('#askMode').innerHTML=label+caret;$('#sayMode').innerHTML=label+caret;
}
function projMenu(btn){
  pop(btn,'<button data-act="rename">'+L('Rename','Naam badlo')+'</button>'+
    '<button data-act="duplicate">'+L('Duplicate','Copy banao')+'</button>'+
    '<div class="sep"></div>'+
    '<button class="bad" data-act="deleteProject">'+L('Delete this project','Project delete karo')+'</button>');
}
/* the icon+title+subtitle row this menu uses for every navigable section —
   pulled out once so Analytics/Connections/Billing don't repeat the same
   five lines of markup three times */
function moreRow(act,icon,title,sub){
  return '<button class="more-row" data-act="'+act+'"><span class="ic">'+icon+'</span>'+
    '<span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+
    '<span class="chev"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></button>';
}
function moreMenu(){
  var x=I.p(),G=U.GATE;
  $('#modal').className='modal modal-wide';
  /* the page picker lives in the top bar on a wide screen and has nowhere to
     be on a phone, so it comes in here instead of disappearing */
  var pages=(innerWidth<900&&x&&x.files.length)
    ? '<span style="font-size:11.5px;color:var(--muted)">'+L('Pages','Pages')+'</span>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px">'+
      x.files.filter(function(f){return /\.html$/.test(f.path)}).map(function(f){
        return '<button class="btn sm" data-page="'+esc(f.path)+'">'+esc(I.pageTitle(x,f.path))+
          (x.page===f.path?' ·':'')+'</button>'}).join('')+'</div>'
    : '';
  $('#modal').innerHTML='<h3>'+L('More','More')+'</h3>'+pages+
    '<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px">'+
    '<div class="row" style="padding:3px 0"><span>'+L('Answering','Jawab de raha hai')+'</span><b>'+
      esc(G.provider?(G.provider+' · '+G.model):'not called yet')+'</b></div>'+
    '<div class="row" style="padding:3px 0"><span>'+L('Model calls','Model calls')+'</span><b>'+G.calls+'</b></div>'+
    '<div class="row" style="padding:3px 0"><span>'+L('Estimated cost','Anumaanit cost')+'</span><b>$'+(G.cost||0).toFixed(4)+'</b></div>'+
    (G.lastError?'<div class="row" style="padding:3px 0"><span>'+L('Last error','Aakhri error')+'</span><b>'+esc(G.lastError)+'</b></div>':'')+
    '</div>'+
    moreRow('analytics','<svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
      L('Analytics','Analytics'),L('Page views on your published site','Published site ke page views')) +
    moreRow('connections','<svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M15 7l5 5-5 5"/></svg>',
      L('Connections','Connections'),L('What this workspace can actually do','Yeh workspace kya kar sakta hai')) +
    moreRow('billing','<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>',
      L('Billing & credits','Billing & credits'),L('Balance and recent invoices','Balance aur invoices')) +
    (innerWidth<900?moreRow('review','<svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>',
      L('Design review','Design review'),L('Run a review on this build','Is build ka review karo'))+
      moreRow('account','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>',
      L('Account','Account'),L('Session and sign out','Session aur sign out')):'')+
    '<div class="modal-row" style="margin-top:16px;justify-content:space-between;flex-wrap:wrap;row-gap:10px">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;row-gap:8px">'+
    '<button class="btn sm" data-act="downloadPage">'+L('Download page','Page download')+'</button>'+
    '<button class="btn sm" data-act="downloadAll">'+L('Download all','Sab download')+'</button>'+
    '<button class="btn sm" data-act="clearThread">'+L('Clear chat','Chat saaf')+'</button>'+
    '</div><button class="btn" data-act="close">'+L('Done','Ho gaya')+'</button></div>';
  $('#scrim').classList.add('open');
}
function pageMenu(btn){
  var x=I.p();if(!x||!x.files.length)return toast(L('Nothing built yet.','Abhi kuch bana nahi.'));
  pop(btn,'<h5>'+L('Pages','Pages')+'</h5>'+x.files.filter(function(f){return /\.html$/.test(f.path)})
    .map(function(f){
      return '<button data-page="'+esc(f.path)+'">'+esc(I.pageTitle(x,f.path))+
        (x.page===f.path?' ·':'')+'</button>'}).join(''));
}
function historyMenu(btn){
  var x=I.p();if(!x)return;
  var v=(x.versions||[]).slice().reverse();
  pop(btn,'<h5>'+L('Version history','Version history')+'</h5>'+
    (v.length?v.map(function(ver,i){
      return '<button data-restore="'+(x.versions.length-1-i)+'">'+
        esc(new Date(ver.at).toLocaleString())+'<br><small style="color:var(--muted);font-size:11.5px">'+
        esc(ver.label||'')+'</small></button>'}).join('')
      :'<div class="row"><span>'+L('Nothing saved yet','Abhi kuch save nahi')+'</span></div>'));
}
function accountMenu(btn){
  var s=U.SESSION,signedIn=s.state==='in',initial=(s.name||s.email||'S').slice(0,1).toUpperCase();
  pop(btn,'<div class="acct-head"><span class="av">'+esc(initial)+'</span><div>'+
    '<b>'+esc(signedIn?(s.name||s.email):L('Not signed in','Signed in nahi'))+'</b>'+
    '<span>'+esc(signedIn?(s.email||''):L('Sign in on Scen to build.','Build karne ke liye Scen mein sign in karo.'))+'</span>'+
    '</div></div>'+
    (s.credits!=null&&!isNaN(s.credits)?'<div class="row"><span>'+L('Credits','Credits')+'</span><b>'+s.credits+'</b></div>':'')+
    '<div class="sep"></div>'+
    '<button data-act="openScen">'+L('Open Scen','Scen kholo')+'</button>'+
    '<button data-act="openStudio">'+L('Open Agent Studio','Agent Studio kholo')+'</button>'+
    '<button data-act="recheck">'+L('Check the session again','Session dobara check karo')+'</button>'+
    (signedIn?'<div class="sep"></div><button class="bad" data-act="signOut">'+L('Sign out','Sign out')+'</button>':''));
}
/* the only session token this page has is the cookie — this mirrors the
   exact call agent-studio.html already makes to end it (agent-studio.html
   ~line 7798), then falls back to a hard reload so every bit of in-memory
   state (S, DB, U.SESSION) resets rather than trying to hand-unwind it. */
function signOut(){
  closePop();
  fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(function(){})
    .then(function(){location.reload()});
}

/* ---------- a design review on demand (§16) ---------- */
function manualReview(){
  var x=I.p();if(!x||!x.files.length)return toast(L('Nothing built yet.','Abhi kuch bana nahi.'));
  if(S.busy)return;
  S.busy=true;I.drawProject();
  var s=I.step(L('Reviewing the design…','Design review kar raha hoon…'));
  R.review(x,$('#preview')).then(function(found){
    if(!found){I.seal(s,L('The review could not read the page.','Review nahi ho paaya.'))}
    else{
      I.seal(s,found.verdict||L('Reviewed','Review ho gaya'));
      x.qa=found;save();
      I.say('bot',found.problems.map(function(q){return '· '+q}).join('\n'),{scores:found.scores});
    }
  }).catch(function(e){I.seal(s,why(e,'review the page'))})
    .then(function(){S.busy=false;I.drawProject()});
}

/* ---------- one click handler ---------- */
document.addEventListener('click',function(e){
  var open=e.target.closest('[data-open]');
  if(open)return I.open(open.getAttribute('data-open'));
  var star=e.target.closest('[data-star]');
  if(star){e.stopPropagation();var sx=U.project(star.getAttribute('data-star'));
    if(sx){sx.starred=!sx.starred;save();I.drawHome()}return}
  var code=e.target.closest('[data-code]');
  if(code){S.tab='code';S.codeFile=code.getAttribute('data-code');I.drawProject();return}
  var nx=e.target.closest('[data-next]');
  if(nx){$('#say').value=nx.getAttribute('data-next');$('#say').focus();return}
  var md=e.target.closest('[data-mode]');
  if(md)return setMode(md.getAttribute('data-mode'));
  var pg=e.target.closest('[data-page]');
  if(pg){var x1=I.p();x1.page=pg.getAttribute('data-page');save();closePop();
    I.drawProject();I.renderPreview();return}
  var rs=e.target.closest('[data-restore]');
  if(rs){var x2=I.p(),v=x2.versions[Number(rs.getAttribute('data-restore'))];
    if(v){x2.files=v.files.map(function(f){return {path:f.path,body:f.body}});save();closePop();
      I.renderPreview();I.drawCode();I.say('bot',L('Restored the build from '+new Date(v.at).toLocaleString(),
        new Date(v.at).toLocaleString()+' wala build wapas laga diya'))}
    return}
  var tab=e.target.closest('[data-tab]');
  if(tab){S.tab=tab.getAttribute('data-tab');
    /* on a phone the two columns cannot share the screen, so asking for the
       preview has to actually bring it forward */
    if(innerWidth<900)S.narrow='view';
    I.drawProject();return}
  var flt=e.target.closest('[data-filter]');
  if(flt&&flt.getAttribute('data-act')==='filter'){
    var f2=flt.getAttribute('data-filter');
    $$('[data-filter]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-filter')===f2)});
    I.setFilter(f2);return}

  var act=e.target.closest('[data-act]');if(!act)return;
  var a=act.getAttribute('data-act'),x=I.p();
  if(a==='home')            {e.preventDefault();closePop();I.home()}
  else if(a==='newProject') {startFresh()}
  else if(a==='account')    {accountMenu(act)}
  else if(a==='signOut')    {signOut()}
  else if(a==='billing')    {closePop();A.billing()}
  else if(a==='focusSearch'){$('#search').focus()}
  else if(a==='openStudio') {open2('/agent-studio.html')}
  else if(a==='openScen')   {open2('/')}
  else if(a==='openPricing'){open2('/#pricing')}
  else if(a==='connections'){A.connectors()}
  else if(a==='attach')     {$('#filePick').click()}
  else if(a==='modeMenu')   {modeMenu(act)}
  else if(a==='startBuild') {startFresh($('#ask').value)}
  else if(a==='projMenu')   {projMenu(act)}
  else if(a==='moreMenu')   {moreMenu(act)}
  else if(a==='pageMenu')   {pageMenu(act)}
  else if(a==='history')    {historyMenu(act)}
  else if(a==='toggleChat') {if(innerWidth<900)S.narrow=(S.narrow==='view'?'chat':'view');
                             else S.chatHidden=!S.chatHidden;
                             I.drawProject()}
  else if(a==='device')     {S.device=S.device==='desktop'?'tablet':(S.device==='tablet'?'mobile':'desktop');
                             I.drawProject();toast(S.device)}
  else if(a==='refresh')    {I.renderPreview()}
  else if(a==='openTab')    {if(!x||!x.files.length)return toast(L('Nothing built yet.','Abhi kuch bana nahi.'));
                             var b=new Blob([selfContained(x,x.page||'index.html')],{type:'text/html'});
                             open2(URL.createObjectURL(b))}
  else if(a==='review')     {manualReview()}
  else if(a==='publish')    {A.publish()}
  else if(a==='doPublish')  {A.doPublish()}
  else if(a==='copyPublishLink'){A.copyPublishLink()}
  else if(a==='shareProject'){A.shareProject()}
  else if(a==='analytics'){closePop();A.analytics()}
  else if(a==='submitInvite'){A.submitInvite()}
  else if(a==='close')      {closeModal()}
  else if(a==='send')       {send()}
  else if(a==='stop')       {S.stop=true;toast(L('Stopping after this step.','Is step ke baad ruk jaunga.'))}
  else if(a==='recheck')    {closePop();I.banner('');I.probe()}
  else if(a==='rename')     {closePop();rename()}
  else if(a==='duplicate')  {closePop();duplicate()}
  else if(a==='deleteProject'){closePop();removeProject()}
  else if(a==='downloadPage'){closePop();if(x&&x.files.length)
                              download((x.page||'index.html'),selfContained(x,x.page||'index.html'))}
  else if(a==='downloadAll'){closePop();if(x)x.files.forEach(function(f){
                              download(f.path,R.paint(f.body,x),/\.css$/.test(f.path)?'text/css':
                                (/\.js$/.test(f.path)?'text/javascript':'text/html'))})}
  else if(a==='clearThread'){closePop();if(x){x.messages=[];save();I.drawThread()}}
});
function open2(href){var w=window.open(href,'_blank','noopener');if(!w)toast('The browser blocked that tab.')}

/* a card is a div so it can hold a live frame — so it needs the keyboard back */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var card=e.target.closest&&e.target.closest('.card[data-open]');
  if(!card)return;
  e.preventDefault();I.open(card.getAttribute('data-open'));
});

/* ---------- project lifecycle ---------- */
function startFresh(seed){
  var text=String(seed||'').trim();
  var x=U.newProject(text);
  /* the switch on the home composer is the answer for the project it starts —
     turning photography off there and having the first build shoot anyway is
     the kind of thing that costs 75 credits before anyone notices */
  x.photos=$('#askPhotos').checked;
  U.save();
  I.open(x.id);
  $('#ask').value='';
  if(text)A.run(text,S.reference);
}
function rename(){
  var x=I.p();if(!x)return;
  $('#modal').className='modal';
  $('#modal').innerHTML='<h3>'+L('Rename','Naam badlo')+'</h3>'+
    '<label class="field"><span>'+L('Project name','Project ka naam')+'</span>'+
    '<input id="newName" value="'+esc(x.name||'')+'"></label>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Cancel','Rehne do')+'</button>'+
    '<button class="btn primary" id="saveName">'+L('Save','Save')+'</button></div>';
  $('#scrim').classList.add('open');
  $('#saveName').onclick=function(){
    x.name=$('#newName').value.trim()||x.name;save();closeModal();I.drawProject();I.drawHome();
  };
  setTimeout(function(){$('#newName').select()},50);
}
function duplicate(){
  var x=I.p();if(!x)return;
  var copy=JSON.parse(JSON.stringify(x));
  copy.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  copy.name=(x.name||'Untitled')+' copy';copy.published=null;copy.createdAt=copy.updatedAt=Date.now();
  DB.projects.unshift(copy);save();I.open(copy.id);
  toast(L('Duplicated.','Copy ban gayi.'));
}
function removeProject(){
  var x=I.p();if(!x)return;
  $('#modal').className='modal';
  $('#modal').innerHTML='<h3>'+L('Delete this project?','Yeh project delete karein?')+'</h3>'+
    '<p>'+L('The build, the conversation and the version history go with it. A published site stays live.',
            'Build, chat aur history sab chali jayegi. Published site live rahegi.')+'</p>'+
    '<div class="modal-row"><button class="btn" data-act="close">'+L('Keep it','Rehne do')+'</button>'+
    '<button class="btn" id="reallyDelete" style="background:var(--rose);color:#fff;border-color:var(--rose)">'+
    L('Delete','Delete')+'</button></div>';
  $('#scrim').classList.add('open');
  $('#reallyDelete').onclick=function(){
    DB.projects=DB.projects.filter(function(q){return q.id!==x.id});
    DB.activeId='';save();closeModal();I.home();
  };
}

/* ---------- the composer ---------- */
function grow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,190)+'px'}
function send(){
  var t=$('#say'),text=t.value.trim();
  if(!text)return;
  if(S.busy)return toast(L('It is still working — stop it first.','Abhi chal raha hai — pehle rok do.'));
  t.value='';grow(t);
  A.run(text,S.reference);
  S.reference=null;
}
['#say','#ask'].forEach(function(sel){
  var t=$(sel);
  t.addEventListener('input',function(){grow(t)});
  t.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      if(sel==='#say')send();else startFresh(t.value);
    }
  });
});
$('#search').addEventListener('input',function(){I.setQuery(this.value)});
$('#askPhotos').addEventListener('change',function(){var x=I.p();if(x){x.photos=this.checked;save()}});
$('#sayPhotos').addEventListener('change',function(){var x=I.p();if(x){x.photos=this.checked;save()}});

$('#filePick').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  if(f.size>4.5e6)return toast(L('That image is too large — under 4MB please.','Image bahut badi hai — 4MB se kam.'));
  var r=new FileReader();
  r.onload=function(){
    S.reference=String(r.result||'');
    toast(L('Reference attached — it will steer the photography.',
            'Reference lag gaya — photos isi hisaab se banengi.'));
  };
  r.readAsDataURL(f);
  this.value='';
});

/* ---------- boot ---------- */
U.load();
setMode('build');
I.probe();
I.drawHome();
var hash=/^#p\/(.+)$/.exec(location.hash||'');
if(hash&&U.project(hash[1]))I.open(hash[1]);
})();
</script>
</body>
