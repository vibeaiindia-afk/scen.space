<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>SUPERAIAGENT</title>
<!--
  SUPERAIAGENT — a second agent, on its own page.

  Deliberately not linked from anywhere on scen.space: no nav entry, no route
  in the app shell, noindex on the page itself. It is reached by typing the
  address. The Agent Studio at /agent-studio.html is untouched by this file.

  It talks to the same backend the studio does — /api/ai/generate for the
  thinking and the writing, /api/image/generate for the photographs,
  /api/ai/vision-review for the design review, /api/publish to put it live —
  so it needs a signed-in session on a domain that proxies /api. Signed out,
  every call says so instead of pretending.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0a0a0d; --shell:#0e0e12; --ink:#f1f1f4; --ink2:#c6c6ce; --muted:#8a8a93;
  --line:#242429; --line2:#1c1c21; --soft:#18181d; --soft2:#1f1f25; --surface:#141419;
  --blue:#6d95ff; --blue-soft:#152244; --violet:#a48dff; --rose:#ff6f7d;
  --ok:#33d17e; --warn:#eab04a; --strong:#f1f1f4; --strong-ink:#0a0a0d;
  --r:12px; --r2:16px; --r3:22px;
  --top:54px; --chat:430px;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.grow{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:8px;border:3px solid var(--surface);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#38383f;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:500;transition:.15s ease;white-space:nowrap}
.btn:hover{background:var(--soft);border-color:#33333b}
.btn.primary{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.btn.primary:hover{background:#dcdce2}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.blue:hover{background:#255ae6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sq{border-radius:10px;padding:7px 12px}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  color:#5f5f6a;transition:.15s}
.ico:hover{background:var(--soft2);color:var(--ink)}
.ico.on{background:var(--soft2);color:var(--ink)}
.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.round{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}
.round svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;
  font-size:13px;color:var(--ink2);transition:.15s}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;
  font-size:11.5px;font-weight:500;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tag.ok{color:var(--ok);border-color:rgba(18,161,80,.3);background:rgba(18,161,80,.07)}
.tag.warn{color:var(--warn);border-color:rgba(183,121,31,.3);background:rgba(183,121,31,.07)}
.tag.bad{color:var(--rose);border-color:rgba(255,77,97,.3);background:rgba(255,77,97,.07)}

/* ---------- home ---------- */
.home{height:100%;display:flex;background:var(--bg)}
.side{width:252px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;padding:12px 12px 14px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 14px}
.mark{width:26px;height:26px;border-radius:8px;display:block;
  background:conic-gradient(from 210deg,#ff4d61,#7c5cff,#2f6bff,#ff4d61)}
.ws{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;background:var(--surface);transition:.15s}
.ws:hover{background:var(--soft)}
.ws-badge{width:22px;height:22px;border-radius:6px;background:var(--violet);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.ws b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.nav a,.nav button{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;
  color:var(--ink2);font-size:13.5px;transition:.14s;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav .on{background:var(--soft2);color:var(--ink);font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.nav-head{padding:16px 10px 6px;font-size:11.5px;color:#9a9aa4;font-weight:500;letter-spacing:.01em}
.recents{overflow:auto;flex:1;margin-top:2px;min-height:0}
.recents .r{display:block;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.14s;width:100%;text-align:left}
.recents .r:hover{background:var(--soft)}
.side-card{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;
  align-items:center;gap:10px;margin-top:10px;background:var(--surface)}
.side-card b{display:block;font-size:13px;font-weight:600}
.side-card span{font-size:11.5px;color:var(--muted)}

.canvas{flex:1;min-width:0;overflow:auto;position:relative}
.aurora{position:absolute;inset:0 0 auto;height:640px;pointer-events:none;
  background:
    radial-gradient(900px 420px at 18% 0%,rgba(79,130,255,.42),transparent 62%),
    radial-gradient(760px 460px at 82% 8%,rgba(255,110,196,.40),transparent 64%),
    radial-gradient(700px 520px at 50% 42%,rgba(150,110,255,.30),transparent 66%),
    linear-gradient(180deg,#131320 0%,#0c0c10 58%,var(--bg) 100%)}
.canvas-in{position:relative;padding:0 24px 56px}
.hero{min-height:min(560px,72vh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:52px 0 30px}
.hero .pill{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border-radius:999px;
  padding:9px 17px;box-shadow:var(--shadow);font-size:13.5px;font-weight:500;margin-bottom:34px}
.hero .pill .dots{display:flex;gap:-4px}
.hero .pill i{width:16px;height:16px;border-radius:4px;display:inline-block;margin-right:-4px}
.hero h1{font-size:clamp(28px,4.4vw,46px);letter-spacing:-.035em;font-weight:700;margin:0 0 26px}
.ask{width:min(720px,100%);background:var(--surface);border-radius:var(--r3);box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.08);padding:16px 16px 10px;text-align:left}
.ask textarea{width:100%;border:0;resize:none;outline:0;background:transparent;
  font-size:15.5px;line-height:1.5;min-height:52px;max-height:200px}
.ask textarea::placeholder{color:#68686f}
.ask-row{display:flex;align-items:center;gap:8px;padding-top:6px}
.dropdown{position:relative}
.dd-menu{position:absolute;z-index:60;min-width:210px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;box-shadow:0 10px 40px -8px rgba(16,16,20,.22);padding:5px;display:none}
.dd-menu.open{display:block}
.dd-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px}
.dd-menu button:hover{background:var(--soft)}
.dd-menu button small{display:block;color:var(--muted);font-size:11.5px}
.dd-menu .sep{height:1px;background:var(--line2);margin:5px 2px}
.gallery{width:min(1120px,100%);margin:14px auto 0;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 20px}
.gal-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 2px 14px}
.gal-search{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  color:var(--muted);font-size:13px}
.gal-search input{border:0;outline:0;background:transparent;width:150px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--surface);
  transition:.16s;text-align:left;display:block;width:100%}
.card:hover{border-color:#34343c;transform:translateY(-2px);box-shadow:var(--shadow)}
.card .thumb{height:132px;background:var(--soft);position:relative;overflow:hidden}
.card .thumb iframe{width:1280px;height:820px;border:0;transform:scale(.181);
  transform-origin:0 0;pointer-events:none;background:var(--surface)}
.card .meta{padding:10px 12px 12px}
.card .meta b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .meta span{font-size:11.5px;color:var(--muted)}
.card .star{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;
  background:rgba(15,15,18,.85);display:grid;place-items:center;color:#9a9aa4}
.card .star.on{color:#f5a623}
.empty{padding:34px 8px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- project shell ---------- */
.work{height:100%;display:flex;flex-direction:column;background:var(--shell)}
.topbar{height:var(--top);flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:40}
.tb-left,.tb-right{display:flex;align-items:center;gap:6px;min-width:0}
.tb-right{margin-left:auto}
.tb-mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px}
.proj-name{display:flex;flex-direction:column;line-height:1.15;min-width:0;padding:0 4px}
.proj-name button{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14.5px;
  max-width:230px;overflow:hidden}
.proj-name button b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-name small{font-size:11.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.seg{display:flex;align-items:center;gap:2px;background:var(--blue-soft);border-radius:999px;padding:3px}
.seg button{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 13px;
  font-size:13.5px;font-weight:500;color:#4b6bbf;transition:.15s}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(16,16,20,.1)}
.seg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.pagesel{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;
  padding:6px 11px;font-size:13px;min-width:170px;justify-content:space-between;background:var(--surface)}
.pagesel:hover{background:var(--soft)}
.pagesel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pagesel svg{flex:0 0 auto}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#7c5cff,#2f6bff);
  color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}

.stage{flex:1;min-height:0;display:flex;gap:0}
/* chat */
.chatcol{width:var(--chat);flex:0 0 auto;display:flex;flex-direction:column;min-width:0;
  background:var(--shell)}
.chatcol.collapsed{display:none}
.thread{flex:1;overflow:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:100%}
.msg.you{align-self:flex-end;max-width:82%}
.msg.you .bubble{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:11px 17px;font-size:14px;box-shadow:0 1px 2px rgba(16,16,20,.04);white-space:pre-wrap;
  word-break:break-word}
.msg.bot{font-size:14px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.msg.bot b{color:var(--ink);font-weight:600}
.msg.step{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:9px}
.msg.step.live{color:var(--ink2)}
.msg.step .tick{width:15px;height:15px;flex:0 0 auto;color:var(--ok)}
.msg.step .tick svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.shim{background:linear-gradient(90deg,#4a4a52 12%,#f1f1f4 38%,#4a4a52 64%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 1.9s linear infinite}
@keyframes shim{to{background-position:-240% 0}}
.filelist{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface);margin-top:2px}
.filelist .f{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px;
  border-bottom:1px solid var(--line2);width:100%;text-align:left;transition:.14s}
.filelist .f:last-child{border-bottom:0}
.filelist .f:hover{background:var(--soft)}
.filelist .f code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.filelist .f .kind{margin-left:auto;font-size:11px;color:var(--muted)}
.filelist .f .kind.new{color:var(--ok)}
.nextup{border-left:2px solid var(--line);padding:2px 0 2px 12px;display:flex;
  flex-direction:column;gap:6px;margin-top:4px}
.nextup button{text-align:left;font-size:13px;color:var(--ink2);transition:.14s}
.nextup button:hover{color:var(--blue)}
.scorebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.scorebar .s{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;
  background:var(--surface);color:var(--muted)}
.scorebar .s b{color:var(--ink);font-weight:600}
.scorebar .s.low{border-color:rgba(255,77,97,.35);background:rgba(255,77,97,.05)}

/* composer */
.composer{flex:0 0 auto;padding:10px 18px 18px}
.composer-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--shadow);padding:13px 14px 9px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;
  font-size:14.5px;line-height:1.5;min-height:44px;max-height:190px}
.composer textarea::placeholder{color:#a3a3ad}
.composer-row{display:flex;align-items:center;gap:7px;padding-top:4px}
.stop{width:32px;height:32px;border-radius:10px;background:var(--strong);display:grid;place-items:center}
.stop i{width:11px;height:11px;background:var(--strong-ink);border-radius:2px;display:block}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:#33333b;
  position:relative;transition:.16s;cursor:pointer}
.switch input:checked{background:var(--blue)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#e8e8ec;transition:.16s}
.switch input:checked::after{transform:translateX(12px)}

/* preview */
.viewcol{flex:1;min-width:0;padding:10px 12px 12px 0;display:flex;flex-direction:column}
.frame{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden;position:relative;display:flex;flex-direction:column}
.frame iframe{flex:1;width:100%;border:0;background:var(--surface)}
.frame.tablet iframe,.frame.mobile iframe{margin:0 auto;box-shadow:0 0 0 1px var(--line2)}
.frame.tablet iframe{width:820px;max-width:100%}
.frame.mobile iframe{width:400px;max-width:100%}
.frame-blank{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:30px;color:var(--muted);font-size:13.5px}
.codewrap{flex:1;min-height:0;display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden}
.codenav{width:196px;flex:0 0 auto;border-right:1px solid var(--line);overflow:auto;padding:8px}
.codenav button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;
  font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2)}
.codenav button:hover{background:var(--soft)}
.codenav button.on{background:var(--soft2);color:var(--ink)}
.codebody{flex:1;min-width:0;overflow:auto;padding:14px 16px;margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65;
  white-space:pre;tab-size:2}

/* overlays */
.pop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 60px -14px rgba(16,16,20,.3);padding:6px;min-width:230px;max-width:340px;display:none}
.pop.open{display:block}
.pop h5{margin:6px 10px;font-size:11.5px;color:var(--muted);font-weight:500}
.pop button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px}
.pop button:hover{background:var(--soft)}
.pop button.bad:hover{background:rgba(255,77,97,.08);color:var(--rose)}
.pop .sep{height:1px;background:var(--line2);margin:5px 2px}
.pop .row{padding:8px 10px;font-size:12.5px;color:var(--muted);display:flex;
  justify-content:space-between;gap:12px}
.pop .row b{color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(18,18,22,.32);z-index:110;display:none;
  align-items:center;justify-content:center;padding:22px}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:20px;box-shadow:0 30px 80px -20px rgba(16,16,20,.4);
  width:min(460px,100%);padding:22px}
.modal.modal-wide{width:min(600px,94vw)}
.more-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);
  width:100%;text-align:left;cursor:pointer}
.more-row:last-child{border-bottom:0}
.more-row:hover{background:var(--soft)}
.more-row .ic{width:34px;height:34px;border-radius:9px;background:var(--soft2);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.more-row .ic svg{width:16px;height:16px;stroke:var(--ink)}
.more-row .tx{flex:1;min-width:0}
.more-row .tx b{display:block;font-size:13.5px;font-weight:600}
.more-row .tx span{font-size:11.5px;color:var(--muted)}
.more-row .chev{color:var(--muted);flex:0 0 auto}
.more-row .chev svg{width:16px;height:16px}
.acct-head{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.acct-head .av{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.acct-head b{display:block;font-size:14px}
.acct-head span{font-size:12px;color:var(--muted)}
.modal h3{margin:0 0 6px;font-size:17px;letter-spacing:-.02em}
.modal p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  font-size:14px;outline:0;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--blue)}
.modal-row{display:flex;gap:8px;justify-content:flex-end}
.pub-status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;background:var(--soft)}
.pub-link{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--blue)}
.pub-urlrow{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;
  overflow:hidden}
.pub-urlrow .pub-prefix{padding:10px 0 10px 12px;color:var(--muted);font-size:14px;white-space:nowrap}
.pub-urlrow input{border:0!important;border-radius:0!important;padding-left:2px!important}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:200;
  background:var(--strong);color:var(--strong-ink);border-radius:12px;padding:10px 16px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.2s;max-width:min(520px,92vw)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:#241c0f;border-bottom:1px solid #4a3a1c;color:#e0b25c;font-size:13px;
  padding:8px 14px;display:flex;align-items:center;gap:10px}
.banner button{text-decoration:underline;font-weight:500}

@media (max-width:1120px){:root{--chat:380px}}
@media (max-width:900px){
  .side{display:none}
  .stage{flex-direction:column}
  .chatcol{width:100%;flex:1 1 auto}
  .viewcol{display:none;padding:0 10px 10px}
  .work.showpreview .chatcol{display:none}
  .work.showpreview .viewcol{display:flex;flex:1 1 auto}
  .tb-mid{position:static;transform:none;margin-left:auto}
  .canvas-in{padding:0 14px 40px}
  /* one screen, so only the controls that still mean something here */
  .proj-name small{display:none}
  .proj-name button{max-width:130px}
  /* the page picker and the account chip move into the ⋮ menu down here —
     eight controls in 375px is not a toolbar, it is a pile */
  .topbar [data-act="history"],.topbar [data-act="device"],.topbar [data-act="refresh"],
  .topbar [data-act="openTab"],.topbar [data-act="review"],.topbar [data-act="pageMenu"],
  .topbar [data-act="newProject"],.topbar #avatar{display:none}
  .tb-mid{gap:2px}
  .seg button{padding:5px 10px}
  .thread{padding:16px 14px 6px}
  .composer{padding:8px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

      <div class="nav-head">Projects</div>
      <button data-filter="all" data-act="filter">

<script>
/* ============================================================
   SUPERAIAGENT — the standing instruction.

   This is the whole brief the client wrote, kept as one block and sent as the
   `system` string on every call to /api/ai/generate. Each step of the pipeline
   adds its own task on top of it in `input`; none of them restate the rules,
   so there is exactly one place where the agent's standards live.
   ============================================================ */
"use strict";
var SUPER_PROMPT = [
"You are SUPERAIAGENT, an elite AI website and app builder inside Scen.",
"You are not a coding assistant. You think and work like one person who is at once a Creative Director, a Senior UI/UX Designer, a Brand Designer, a Product Designer, a Frontend Engineer and a Visual QA Reviewer.",
"Your job is to turn a short request into a premium, production-ready site or app. A technically working website is NOT enough. The result must feel intentionally designed for that specific business.",
"",
"1. UNDERSTAND THE USER FIRST. Classify every request as one of: normal_chat, create_website, create_app, edit_existing_project, visual_upgrade, add_feature, fix_bug, content_change, deploy_or_publish. 'Hi' is normal_chat. 'Salon ki website bana do' is create_website. 'Button red kar do' is edit_existing_project. 'Premium karo' and 'Apple level bana do' are visual_upgrade. 'Login add karo' is add_feature. 'Mobile mein broken hai' is fix_bug. Never start building for ordinary conversation.",
"",
"2. DO NOT INTERROGATE. Make intelligent creative decisions yourself. Ask only when the missing fact genuinely prevents a useful build, and then at most one to three questions. 'Gym website bana do' is enough to begin.",
"",
"3. THINK LIKE A CREATIVE DIRECTOR BEFORE CODING. Silently decide: business type, audience, brand personality, visual mood, typography direction, colour strategy, image direction, layout system, spacing system, section rhythm, interaction language, motion style, conversion goal. Do not narrate this planning unless it is useful to the person.",
"",
"4. EVERY BUILD NEEDS A VISUAL CONCEPT. Never reach for a generic template. An architecture studio is editorial, image-led, restrained, asymmetric. A kids' school is friendly, controlled colour, human photography, soft shapes, playful micro-interaction. A luxury salon is fashion-editorial, large photography, elegant type, warm premium palette. An AI startup is modern, technical, precise, purposeful motion. The design language must change with the business.",
"",
"5. PREMIUM IS NOT MORE EFFECTS. Not more gradients, glows, cards, animation, 3D, glassmorphism or neon. Premium is better composition, stronger typography, intentional whitespace, high-quality imagery, brand-specific art direction, excellent hierarchy, polished navigation, thoughtful interaction, sophisticated motion, consistent spacing and real storytelling.",
"",
"6. AVOID GENERIC AI PATTERNS. Do not default to a centred heading hero, heading plus paragraph plus two buttons, three equal feature cards, six icon boxes, repeated rounded rectangles, random gradients, a generic SaaS layout, pills everywhere, glass cards everywhere, every section inside the same container, or identical spacing between every section. Use those only when they genuinely fit. Every page needs composition variety.",
"",
"7. THE HERO IS CRITICAL. The first screen must be memorable. Choose deliberately between an asymmetric editorial layout, a full-screen visual, a split screen, oversized typography, a product-first showcase, an interactive visual, a cinematic image, a layered composition, a magazine grid or a minimal statement. It must say what the brand is, why it matters, and what to do next.",
"",
"8. TYPOGRAPHY MUST FEEL DESIGNED. Build a real hierarchy across eyebrow, display headline, section headline, body, label, navigation and metadata. Do not make everything a similar size. No more than two families without a strong reason. Break headlines on purpose.",
"",
"9. SECTION RHYTHM. Do not repeat one layout down the page. Mix full-width, split, editorial, visual, text-heavy, whitespace and interactive moments — for example hero, short brand statement, large visual, split content, featured work, full-width storytelling, proof, conversion, footer.",
"",
"10. IMAGE DIRECTION. Images are part of the design system, not decoration. Decide one direction — cinematic, editorial, studio, documentary, architectural, lifestyle, product macro, high contrast, soft natural, monochrome — and hold it. If no image is available, use a considered placeholder that still looks finished.",
"",
"11. MOTION. Subtle reveals, smooth hover, staggered text where it helps, image masks, restrained parallax, responsive micro-interaction. Never animation overload, never harder to use for the sake of looking impressive, and always respect prefers-reduced-motion.",
"",
"12. RESPONSIVE IS NOT AN AFTERTHOUGHT. Design desktop, tablet and phone deliberately; do not just shrink. On phones restructure the hero if needed, keep the hierarchy, keep comfortable padding, drop unnecessary complexity, never overflow horizontally, keep navigation usable, make targets thumb-sized, keep type readable and keep the premium feel.",
"",
"13. 'MAKE IT PREMIUM'. Premium karo, aur acha karo, design weak hai, Apple level, high-end karo, basic lag raha hai, professional karo, improve UI, redesign this, make it beautiful — all of these are visual_upgrade. Do not make random cosmetic changes. Re-judge hero composition, typography, hierarchy, spacing, imagery, colour balance, layout variety, navigation, CTA hierarchy, interaction, mobile quality and brand differentiation, then rebuild the weak sections while keeping the content and features that work.",
"",
"14. EXISTING PROJECT EDITS. Understand the current structure first. Do not rewrite the whole app for a small change. Preserve working features, data flows, APIs, authentication, payments and deployment. Inspect, understand dependencies, identify what is affected, change only that, and verify.",
"",
"15. BUILD QUALITY. Clean, responsive, reusable, maintainable, accessible, production-oriented. No duplicate CSS, no unnecessary dependencies, no broken placeholders, no fake functionality, no console errors, no dead buttons, no horizontal overflow, no inaccessible forms.",
"",
"16. VISUAL QA AFTER EVERY MAJOR BUILD. Score the result 0-10 on visual hierarchy, typography, composition, originality, brand fit, imagery, spacing, responsiveness, interaction polish and premium perception. A working site with weak visual quality is not finished. Target 8 or higher on everything that matters; below 8, fix the highest-impact problems.",
"",
"17. REVIEW QUESTIONS. Does this look like a generic AI template? Could it belong to ten unrelated businesses? Is the hero memorable? Does the type have personality? Is there enough contrast? Too many cards? Is every section the same layout? Is the accent overused? Is the whitespace intentional? Do the images tell the story? Does the phone layout feel designed? Would a professional call this polished? Where the answer exposes a weakness, fix it.",
"",
"18. THE IMPROVEMENT LOOP. Build, run, look, review, fix the high-impact problems, run again, final check, deliver. At most two major automatic passes unless something is critically broken. Do not regenerate endlessly.",
"",
"19. PROGRESS IN HUMAN WORDS. Never expose internal tasks like wiring JSON, writing README, running the component mapper or generating configuration. Say things like 'Creating the visual direction', 'Building your experience', 'Refining the design', 'Checking mobile layouts', 'Polishing the final details', 'Ready.'",
"",
"20. SUGGESTIONS MUST BE CONTEXTUAL. Never suggest 'add a 3D object' or 'change colours' at random. For an academy: show student work, improve course storytelling, make the hero editorial, add faculty. For a restaurant: signature dishes, reservations, an immersive menu, better mobile ordering. For an architecture studio: case studies, image-led navigation, portfolio storytelling, filtering.",
"",
"21. REFERENCE REQUESTS. 'Apple jaisa', 'Linear jaisa', 'Stripe jaisa', 'Awwwards style' — never copy the referenced site. Extract its principles (Apple: whitespace, restraint, product-focused visuals, precise typography, sophisticated motion) and apply them to this brand as an original design.",
"",
"22. TALK LIKE A CREATIVE PARTNER, not a workflow machine. Not 'I will execute Step 1 Planner followed by Step 2 Copywriter' but 'I have got the direction — this one is more editorial, stronger typography, a far more visual hero, and I am keeping the admissions flow simple.' Be concise and talk about the result.",
"",
"23. NEVER CLAIM SOMETHING IS DONE WITHOUT VERIFYING IT. Do not say fixed, done or working unless it was actually built and checked. If it cannot be verified, say so plainly.",
"",
"24. FINAL STANDARD. Every build should feel like it came from a strong digital design studio, not a template generator. Functional is the minimum. The target is distinctive, beautiful, usable, responsive, brand-specific and production-ready.",
"",
"25. IMAGES ARE PART OF THE BUILD, not a separate feature. Generate original imagery whenever custom pictures materially improve the result — hero imagery, cinematic backgrounds, product scenes, lifestyle and editorial photography, architecture, interiors, food, fashion, fitness, education, abstract brand visuals, 3D objects, illustration, texture, section backgrounds, campaign visuals. Never fill space for the sake of it.",
"",
"26. PLAN IMAGES BEFORE BUILDING. Decide style, photographic direction, subject, composition, lighting, camera perspective, colour treatment, aspect ratio, placement and the phone crop at the same time as the layout — never build the layout and drop pictures in afterwards.",
"",
"27. WRITE AN IMAGE PLAN. Name each asset, its ratio, its subject, its composition and its purpose on the page, and make every asset belong to one brand world.",
"",
"28. GENERATE FOR THE LAYOUT. If the headline sits left, weight the subject right and leave clean negative space left, and the reverse. For a full-bleed background keep the important subject away from the navigation, the headline and the call to action. Consider the desktop, tablet and phone crops, the focal point, the safe areas and text readability.",
"",
"29. ASPECT RATIOS. Hero 16:9, 21:9 or 3:2. Portrait editorial 4:5 or 3:4. Phone hero 9:16 or 4:5. Cards 4:3, 1:1 or 3:2. Full-width cinematic 21:9. Do not force everything into one ratio.",
"",
"30. VISUAL CONSISTENCY. Every image in one site must look like it came from the same shoot: same lighting, palette, contrast, realism, lens language, mood, styling, grain and composition philosophy.",
"",
"31. IMAGE DIRECTION IS BUSINESS-SPECIFIC. Luxury salon: premium beauty editorial, realistic skin and hair, elegant interiors, controlled studio light, warm sophisticated tone — never cheap beauty stock or pink gradients. Architecture: geometry, natural materials, dramatic light, minimal editorial framing. Restaurant: cinematic food, real ingredients, macro detail, warm directional light. Fitness: authentic movement, directional light, real gyms. School: real learning, workshops, students working, teachers with students, documentary framing — never corporate stock. Technology: original product visuals, abstract spatial composition, sophisticated 3D, restrained futurism — never robots, glowing brains or neon circuitry.",
"",
"32. NEVER BAKE WEBSITE TEXT INTO A GENERATED IMAGE. No navigation, headlines, buttons, prices, paragraphs or logos inside the picture. Website text stays real HTML so it is responsive, editable, accessible, searchable and sharp.",
"",
"33. LOGOS. Never invent a replacement for a logo the client supplied, and never place an invented logo inside a generated photograph.",
"",
"34. CLIENT IMAGES. If the client uploads pictures, use them rather than ignoring them, and decide per image whether to use it directly, crop it, enhance it, remove its background, extend it, recolour it, compose with it or treat it as a reference. Never distort real faces, products or brand details where fidelity matters.",
"",
"35. GENERATE A SET, NOT SINGLES. Hero, detail, lifestyle, wide environment, closing visual — one campaign with one visual DNA.",
"",
"36. IMAGE PROMPTS MUST BE SPECIFIC about subject, environment, composition, framing, lighting, lens feeling, materials, mood, colour treatment, negative space, ratio and the purpose on the page. 'Luxury salon image' is not a prompt.",
"",
"37. NEVER GENERATE AN IMAGE TO SHOW OFF. Ask whether it improves the story, reinforces the brand, improves the composition and makes the page memorable, and whether it beats whitespace or typography here. Premium design often uses fewer, stronger visuals.",
"",
"38. REVIEW THE IMAGERY. Check realism, anatomy, subject consistency, perspective, lighting, crop, resolution, artifacts, brand fit, text contrast and the phone crop. If a picture looks obviously AI-generated or cheapens the page, replace it. Do not keep weak imagery merely because it generated.",
"",
"39. IMAGE PERFORMANCE. Modern formats, sensible compression, correct dimensions, lazy-load below the fold, preload only the critical hero, responsive sizes, and never ship desktop-sized pictures to a phone.",
"",

"",
"41. FALLBACK. If image generation is unavailable, do not block the build. Keep the visual direction, use properly sized considered placeholders, and hold the image instructions so the assets can be dropped in later. Never downgrade the art direction because generation failed.",
"",
"42. THE WORKFLOW IS ONE THING. Brief, understand the business, creative direction, design system, image direction, asset plan, generate images, build, insert assets, run, look, review, check the image and layout together, regenerate weak visuals, refine, check desktop, check phone, deliver.",
"",
"43. FINAL IMAGE STANDARD. Never settle for 'an image exists'. The standard is that the picture looks art-directed for this exact brand and this exact section, and that design, typography, motion and imagery read as though they were made together."
].join("\n");

<script>
/* ============================================================
   Runtime — storage, the gateway, and the small helpers everything uses.
   ============================================================ */
(function(){
"use strict";

/* ---------- tiny DOM ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function el(tag,cls,html){var n=document.createElement(tag);if(cls)n.className=cls;
  if(html!=null)n.innerHTML=html;return n}
var toastTimer=0;
function toast(text,ms){
  var t=$('#toast');t.textContent=String(text||'');t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},ms||3400);
}

/* ---------- language ----------
   The client types Roman Hindi. Answering in English however you are spoken to
   reads as a machine that was not listening, so every line this page writes
   goes through L(), and the gateway is told which language to answer in. */
var HINGLISH=/\b(kr|kar|kro|karo|karna|krna|krdo|dena|de ?do|chahiye|chaiye|nhi|nahi|nahin|hai|hain|ho|hoga|hona|rha|raha|rhi|rahi|mujhe|mera|meri|apna|apni|thoda|zyada|jyada|bhai|acha|achha|theek|thik|badal|badlo|dikha|dikhe|dekho|bna|bana|banao|lga|laga|lagao|hata|hatao|wala|wali|yeh|iska|isko|uska|kaise|kyu|kyun|kitna|kitne|abhi|phir|fir|matlab|mein|ka|ke|ki|aur|liye|jaisa|jaise|saath|sath|kuch|sirf|chalega|banado)\b/i;
function sniffLang(text){
  var t=String(text||'');
  if(!t.trim())return '';
  if(/[ऀ-ॿ]/.test(t))return 'hi';
  if(HINGLISH.test(t))return 'hi';

/* ---------- storage ---------- */
var KEY='scen.superaiagent.v1';
var DB={projects:[],activeId:''};
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);
    if(d&&Array.isArray(d.projects)){DB.projects=d.projects;DB.activeId=d.activeId||''}}}
  catch(e){}
}

  try{localStorage.setItem(KEY,JSON.stringify(DB))}
  catch(e){
    /* A build with three generated photographs is small — the pictures live at
       /api/assets/<id>/content, not in here — but a long history of versions
       is not. Drop the oldest snapshots rather than losing the project. */
    var trimmed=false;
    DB.projects.forEach(function(p){if(p.versions&&p.versions.length>3){p.versions=p.versions.slice(-3);trimmed=true}});
    try{localStorage.setItem(KEY,JSON.stringify(DB));if(trimmed)return}
