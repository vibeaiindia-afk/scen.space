<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scen Agent Studio — brief → plan → build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507;--panel:#0d0d12;--panel2:#13131a;--ink:#f7f7f4;--muted:#9a9aa7;--line:rgba(255,255,255,.105);
  --acid:#dfff45;--cyan:#7beeff;--violet:#7d6cff;--coral:#ff6b64;--cream:#f4f0df;--danger:#ff7676;--ok:#7ee787;
  --topbar:56px;--rail:52px;--chat:400px;--tools:236px;--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--acid);color:#0b0b0d}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#22222b;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#33333f;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}.muted{color:var(--muted)}.grow{flex:1}
.caps{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#6d6d78;font-weight:600}
.tiny{font-size:11.5px}.small{font-size:12.5px}

/* ---------- shared controls ---------- */
.btn{border:1px solid var(--line);background:#141419;color:#f5f5f2;padding:7px 13px;border-radius:10px;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;font-size:13px;transition:.16s ease;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.24);background:#1a1a21}
.btn.primary{background:var(--acid);color:#090a08;border-color:var(--acid);font-weight:700}
.btn.primary:hover{background:#e8ff6a}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.42;pointer-events:none}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#8b8b96;transition:.16s}
.ico:hover{background:#17171e;color:#fff}
.pill{padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:#b9b9c2;background:rgba(255,255,255,.035);white-space:nowrap}
.pill.acid{border-color:rgba(223,255,69,.4);color:var(--acid);background:rgba(223,255,69,.08)}
.pill.warn{border-color:rgba(255,190,90,.35);color:#ffcf87;background:rgba(255,190,90,.07)}
.pill.ok{border-color:rgba(126,231,135,.32);color:var(--ok);background:rgba(126,231,135,.07)}
button.pill{font:inherit;font-size:11px;cursor:pointer;transition:.16s}
button.pill:hover{border-color:rgba(255,255,255,.28);color:#fff}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid);flex:0 0 auto}
.dot.idle{background:#4b4b57;box-shadow:none}

/* ---------- app frame ---------- */
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--line);background:#08080b;position:relative;z-index:20}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px}
.tb-right{margin-left:auto}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.04em;padding-right:4px}
.logo b{text-transform:lowercase;font-size:16px;
  background:linear-gradient(180deg,#fff 0%,#e7edf1 34%,#9aa6ae 52%,#f4f8fa 66%,#aab5bd 86%,#79848c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo-mark{width:24px;height:24px;flex:0 0 auto;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22p%22%20x1%3D%220.1%22%20y1%3D%220%22%20x2%3D%220.9%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238dff5e%22%2F%3E%3Cstop%20offset%3D%22.38%22%20stop-color%3D%22%2325c455%22%2F%3E%3Cstop%20offset%3D%22.78%22%20stop-color%3D%22%230a7a32%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23053b18%22%2F%3E%3C%2FlinearGradient%3E%3Cpath%20id%3D%22pet%22%20d%3D%22M53%2053C51%2033%2061%2016%2084%209c7%2022%200%2040-19%2049-5%202-10%201-12-5Z%22%2F%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22url%28%23p%29%22%3E%3Cuse%20href%3D%22%23pet%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%2890%2050%2050%29%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%28180%2050%2050%29%22%2F%3E%3Cuse%20href%3D%22%23pet%22%20transform%3D%22rotate%28270%2050%2050%29%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/contain no-repeat;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo-mark{animation:none}}
.proj{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;font-size:13px;color:#d6d6de;max-width:220px}
.proj:hover{background:#15151c}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj i{font-style:normal;color:#6f6f7a;font-size:11px}
.seg{display:flex;background:#101016;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;margin-left:4px}
.seg button{padding:5px 13px;border-radius:8px;font-size:12.5px;color:#8d8d99;transition:.16s}
.seg button.on{background:#20202a;color:#fff}
.seg button:hover:not(.on){color:#d5d5de}
.tab{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;font-size:13px;color:#8d8d99;transition:.16s}
.tab:hover{color:#e2e2e8;background:#141419}
.tab.on{color:#fff;background:#17171f;box-shadow:inset 0 0 0 1px var(--line)}
.tab em{font-style:normal;opacity:.85}
.tab .badge{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 8px var(--acid)}
/* Wide enough for both, the chat is never hidden and needs no tab of its own. */
.tab-chat{display:none}

.shell{flex:1;min-height:0;display:flex}

/* ---------- left rail ---------- */
.rail{width:var(--rail);flex:0 0 auto;border-right:1px solid var(--line);background:#08080b;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0}
.rail button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#6c6c78;font-size:16px;transition:.16s;position:relative}
.rail button:hover{background:#15151c;color:#e6e6ec}
.rail button.on{background:#191921;color:var(--acid);box-shadow:inset 0 0 0 1px rgba(223,255,69,.25)}

/* ---------- chat panel ---------- */
.chat{width:var(--chat);flex:0 0 auto;border-right:1px solid var(--line);background:#0a0a0e;display:flex;flex-direction:column;min-width:0}
.chat-head{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 8px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{width:7px}

/* The conversation, in the shape of the one the client asked for: no name and
   no avatar over every reply, the person's own message as a soft pill on the
   right, the agent's as plain text at reading size, and the work as a bordered
   card. Their colours, in black. */
.msg{margin-bottom:22px;animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:#17171d;border:1px solid #22222b;color:#ececed;
  padding:11px 16px;border-radius:18px;max-width:84%;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
/* the label over every agent message is gone; the thinking row keeps the mark */
.msg.agent .who{display:none;align-items:center;gap:8px;margin-bottom:8px}
.msg.agent.think .who{display:flex}
.msg.agent .who b{font-size:12px;font-weight:600;color:#c9c9d2;letter-spacing:-.01em}
.avatar{width:20px;height:20px;border-radius:7px;flex:0 0 auto;
  background:conic-gradient(from 210deg,#dfff45,#7beeff,#7d6cff,#dfff45);
  box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.avatar.thinking{animation:pulseAv 1.15s ease-in-out infinite}
@keyframes pulseAv{50%{filter:brightness(1.5) saturate(1.3)}}
.msg.agent .text{font-size:14.4px;line-height:1.65;color:#e4e4e8;white-space:pre-wrap;word-break:break-word;
  letter-spacing:-.006em}
.msg.agent .text b{color:#fff;font-weight:600}
.msg.agent .text code{background:#16161d;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px;color:var(--cyan)}
.msg.agent .text ul{margin:8px 0 0;padding-left:17px}
.msg.agent .text li{margin-bottom:4px}
.msg .worked{display:inline-flex;align-items:center;gap:5px;margin-left:9px;color:#5f5f6a;font-size:11px;font-weight:400}
.msg .worked .ring{width:10px;height:10px;border-radius:50%;border:1.5px solid #2a2a34;border-top-color:#6e6e7c}
.msg .worked.run .ring{animation:spin .8s linear infinite}

.typing{display:inline-flex;gap:4px;align-items:center;height:16px}
.typing i{width:5px;height:5px;border-radius:50%;background:#5c5c68;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* answer chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips{gap:8px;margin-top:14px}
.chips button{border:1px solid #26262f;background:#0f0f14;color:#cfcfd6;border-radius:11px;padding:9px 14px;
  font-size:13px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.chips button:hover{border-color:rgba(223,255,69,.45);color:#fff;background:rgba(223,255,69,.07)}
.chips button.on{border-color:var(--acid);color:var(--acid);background:rgba(223,255,69,.1)}
.chips button.on:before{content:"✓";font-size:10px}
.chips .sw{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.chips-go{display:flex;align-items:center;gap:9px;margin-top:11px}
.chips-go .hint{font-size:11.5px;color:#5f5f6a}
.skip{color:#6e6e7a;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.skip:hover{color:#b9b9c4}

/* attachments */
.att-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.att{width:62px;height:62px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:#111117}
.att-strip{display:flex;gap:7px;flex-wrap:wrap;padding:0 2px 9px}
.att-strip .a{position:relative}
.att-strip img{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--line);display:block}
.att-strip .x{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:#1c1c24;
  border:1px solid #33333e;color:#c9c9d2;font-size:10px;display:grid;place-items:center}

/* composer */
.composer{flex:0 0 auto;padding:10px 14px 14px;border-top:1px solid var(--line);background:#0a0a0e}
.comp-box{border:1px solid #24242e;background:#0f0f14;border-radius:22px;padding:13px 14px 9px;transition:.18s}
.comp-box:focus-within{border-color:rgba(223,255,69,.42);box-shadow:0 0 0 3px rgba(223,255,69,.06)}
.comp-box textarea{width:100%;background:transparent;border:0;outline:0;resize:none;min-height:44px;max-height:150px;
  font-size:13.5px;line-height:1.55;padding:3px 4px}
.comp-box textarea::placeholder{color:#5e5e6a}
.comp-bar{display:flex;align-items:center;gap:6px;padding-top:5px}
.comp-bar .ico{width:29px;height:29px;font-size:14px}
.mini{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;font-size:11.5px;color:#8d8d99;transition:.15s}
.mini:hover{background:#17171e;color:#dcdce3}
.mini.on{background:rgba(223,255,69,.1);color:var(--acid);box-shadow:inset 0 0 0 1px rgba(223,255,69,.28)}
.mini i{font-style:normal;font-size:10px;opacity:.7}
.send{width:32px;height:32px;border-radius:50%;background:var(--acid);color:#090a08;display:grid;place-items:center;
  font-weight:800;font-size:14px;transition:.16s}
.send[disabled]{background:#1c1c24;color:#5a5a66;pointer-events:none}
.send:hover{transform:translateY(-1px)}
.note{font-size:11px;color:#5b5b66;text-align:center;padding:9px 6px 0;line-height:1.5}

/* the build, inside the conversation */
.workcard{padding:0;background:none;border:0}
.work{border:1px solid #22222b;border-radius:16px;background:#0d0d12;padding:14px 16px 8px}
/* what you can do with a reply, under it — copy is real, rebuild is real */
.acts{display:flex;gap:2px;margin-top:9px}
.acts button{width:28px;height:28px;border-radius:8px;color:#61616d;font-size:13px;display:grid;place-items:center;transition:.14s}
.acts button:hover{background:#16161d;color:#d6d6de}
.seg2{display:inline-flex;gap:3px;padding:3px;border:1px solid #22222b;border-radius:11px;background:#0b0b0f;margin-top:10px}
.seg2 button{padding:6px 16px;border-radius:8px;font-size:12.5px;color:#83838f;font-weight:500}
.seg2 button.on{background:#191921;color:#fff}
.work-h{display:block;font-size:12.5px;font-weight:600;color:#e9e9ef;margin-bottom:6px}
.work .steps{max-height:236px;overflow-y:auto;scrollbar-width:thin}
.work .step{font-size:12.4px}
.work .step:before{left:8.5px}

/* build stream in the chat column */
.stream{padding:16px}
.stream .caps{margin-bottom:12px;display:block}
.step{display:flex;gap:11px;padding:8px 0;font-size:12.8px;color:#7e7e8a;position:relative}
.step:before{content:"";position:absolute;left:8.5px;top:26px;bottom:-8px;width:1px;background:#1e1e26}
.step:last-child:before{display:none}
.step .mark{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:1.5px solid #26262f;display:grid;place-items:center;font-size:9px;background:#0a0a0e;margin-top:1px}
.step.run .mark{border-color:var(--acid);border-top-color:transparent;animation:spin .75s linear infinite}
.step.run{color:#e9e9ef}
.step.done .mark{border-color:rgba(126,231,135,.5);color:var(--ok);background:rgba(126,231,135,.09)}
.step.done{color:#a6a6b2}
.step .ms{margin-left:auto;font-size:11px;color:#4f4f5a;font-variant-numeric:tabular-nums}
.step .sub{display:block;color:#5c5c67;font-size:11.5px;margin-top:2px}

/* ---------- tools column ---------- */
.tools{width:var(--tools);flex:0 0 auto;border-right:1px solid var(--line);background:#08080b;overflow-y:auto;padding:14px 10px}
.tools .caps{padding:0 8px;margin:14px 0 7px;display:block}
.tools .caps:first-child{margin-top:0}
.tool{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:10px;font-size:13px;color:#9d9da8;transition:.14s;text-align:left}
.modeRow{display:flex;gap:3px;padding:3px;border:1px solid #1e1e26;border-radius:10px;background:#0b0b0f;margin:0 0 12px}
.modeRow button{flex:1;padding:6px 5px;border-radius:7px;font-size:11px;font-weight:700;color:#7d7d88;transition:.14s}
.modeRow button.on{background:#17171e;color:#fff}
.toolAdv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;margin-top:12px;border-top:1px solid #1a1a22;
  border-radius:0 0 10px 10px;font-size:13px;color:#7f7f8a;text-align:left;transition:.14s}
.toolAdv:hover{color:#fff}
.toolAdv .cnt{margin-left:auto;font-size:10px;color:#5d5d67}
.tool:hover{background:#101017;color:#e6e6ec}
.tool.on{background:#15151c;color:#fff}
.tool em{font-style:normal;width:16px;text-align:center;opacity:.9;font-size:13px}
.tool .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;color:#5a5a65;text-transform:uppercase}
.tool .tag.live{color:var(--acid)}
.tool .cnt{margin-left:auto;font-size:10.5px;color:#5a5a65;font-variant-numeric:tabular-nums}

/* ---------- main pane ---------- */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--bg);position:relative}
.pane{padding:26px 30px 60px;max-width:1000px}
.pane.wide{max-width:none}
.pane h1{font-size:27px;letter-spacing:-.035em;margin:0 0 6px;font-weight:650}
.pane>p.lead{color:#8c8c98;margin:0 0 22px;font-size:13.5px;line-height:1.6;max-width:640px}
.pane h2{font-size:15px;margin:26px 0 11px;letter-spacing:-.02em;font-weight:600}
.info{display:flex;gap:11px;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:#0e0e13;
  font-size:12.8px;line-height:1.55;color:#a4a4b0;margin-bottom:20px}
.info em{font-style:normal;font-size:14px;line-height:1.2}
.info b{color:#e4e4ea;display:block;margin-bottom:3px;font-weight:600}
.info.warn{border-color:rgba(255,190,90,.22);background:rgba(255,190,90,.045)}

.empty{display:grid;place-items:center;min-height:65vh;text-align:center;padding:30px}
.empty .orb{width:88px;height:88px;border-radius:50%;margin:0 auto 20px;
  background:radial-gradient(circle at 32% 28%,#fff 0 2%,#e8ff99 5%,#6d7e20 15%,#222516 36%,#090a08 66%,#020203 80%);
  box-shadow:0 0 50px rgba(223,255,69,.22),0 0 110px rgba(123,238,255,.08);animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-11px) rotate(8deg)}}
.empty h2{font-size:21px;margin:0 0 8px;letter-spacing:-.03em}
.empty p{color:#7d7d89;max-width:400px;margin:0 auto;line-height:1.6;font-size:13px}

/* brief */
.meter{height:4px;border-radius:99px;background:#17171e;overflow:hidden;margin:4px 0 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--cyan));transition:width .5s cubic-bezier(.2,.7,.3,1)}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.bcard{padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#0c0c11;min-height:78px;transition:.2s}
.bcard.filled{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border-color:rgba(255,255,255,.14)}
.bcard .k{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.bcard .v{font-size:13.5px;color:#eaeaf0;line-height:1.5;word-break:break-word}
.bcard .v.none{color:#4e4e59;font-style:italic}
.bcard .v .tk{display:inline-block;background:#16161d;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11.5px;margin:0 4px 4px 0;color:#c3c3cc}
.swatch{width:15px;height:15px;border-radius:5px;display:inline-block;vertical-align:-3px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.16)}

/* plan */
.plan-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;align-items:start}
@media (max-width:1180px){.plan-grid{grid-template-columns:1fr}}
.page-row{border:1px solid var(--line);border-radius:13px;background:#0c0c11;margin-bottom:9px;overflow:hidden}
.page-row>button{width:100%;display:flex;align-items:center;gap:11px;padding:13px 15px;text-align:left}
.page-row>button:hover{background:#101017}
.page-row .num{width:22px;height:22px;border-radius:7px;background:#16161d;display:grid;place-items:center;
  font-size:10.5px;color:#8b8b96;flex:0 0 auto;font-variant-numeric:tabular-nums}
.page-row b{font-size:13.5px;font-weight:600}

@media (max-width:1160px){:root{--chat:344px;--tools:206px}}
@media (max-width:980px){
  .tools{display:none}.tb-center{position:static;transform:none;margin-left:auto}
  .chat{width:100%;border-right:0}.main{display:none}

  /* The pane swaps places with the chat here, so there has to be a way back. */
  .tab-chat{display:flex}
}
/* §51 — on a phone the header ran to 904px on a 375px screen, so Invite,
   Publish and the account pill sat off the edge with nothing to scroll them
   into view. The row now wraps and the tabs scroll on their own. */
@media (max-width:560px){
  .topbar{flex-wrap:wrap;height:auto;min-height:0;padding:8px 10px;gap:8px;align-items:center}
  .tb-left{min-width:0;flex:1 1 100%;order:1;overflow:hidden}
  .tb-right{margin-left:0;order:3;width:100%;justify-content:flex-start;gap:6px}
  .tb-right .btn,.tb-right .pill{min-width:0;text-align:center;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  /* The pill holds an email and will happily run through the buttons beside
     it. Let it take the slack and truncate; the buttons keep their own size. */
  .tb-right .pill{flex:1 1 auto}
  .tb-right .btn{flex:0 0 auto}
  .tb-right .ico{flex:0 0 auto}
  .tb-center{order:2;width:100%;margin-left:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tb-center::-webkit-scrollbar{display:none}
  .tb-center .tab{flex:0 0 auto}
  /* The 980px rule gives the chat width:100%, but it sits in a flex row after
     a ~52px icon rail, so 100% of the shell overshot the screen by exactly the
     rail's width. Let it take what is left instead of all of it. */
  .chat{flex:1 1 auto;width:auto;min-width:0}
  /* iOS zooms the whole page when a focused field is under 16px. */
  #input,.comp textarea,.comp input{font-size:16px}
}

/* ------------------------------------------------------------
   Seeds — the studio can be opened straight from a template card
   on the site: agent-studio.html?template=mostar  (a real preset)
   or                              ?start=restaurant (an agent pack)
   A seed pre-fills the brief and the interview drops to the five
   questions the seed cannot answer for you.
   ------------------------------------------------------------ */
var TEMPLATE_SEEDS={
  mostar:{label:'the Mostar template',name:'Mostar',industry:'travel',
    pitch:'A stone arch, emerald water, and a compact old city made for slow mornings, late light, and one unforgettable crossing.',
    accent:'#74b5e0',style:'cinematic',motion:'full',kind:'website',content:'agent',
    pages:['Home','Old Bridge','Old Town','Routes','Contact'],
    features:['gallery','maps'],languages:['English'],
    preset:{slug:'mostar',file:'/mostar/index.html',name:'Mostar',
      title:'MOSTAR',subtitle:'',accent:'#74b5e0'}}
};
var SEED_SKIP=['kind','industry','pitch','audience','pages','style','motion','content','languages'];
function urlTemplate(){
  var t=new URLSearchParams(location.search).get('template');
  return t?slug(t):'';        /* slug('') answers 'untitled', so the guard matters */
}
function seedFromUrl(){
  var p=new URLSearchParams(location.search);
  var t=urlTemplate();
  if(t){
    // the site hands the full template over in storage, since it knows more
    // about the preset than a query string can carry
    try{
      var raw=localStorage.getItem('scen.agentstudio.seed');
      // both sides slugified: the address says "kinetic-cut" where the seed
      // was written as "kinetic cut", and a raw comparison dropped the seed
      if(raw){var o=JSON.parse(raw);if(o&&slug(o.slug||'')===t)return o}
    }catch(e){}
    if(TEMPLATE_SEEDS[t])return TEMPLATE_SEEDS[t];
  }
  var i=(p.get('start')||'').toLowerCase().trim();
  if(i&&INDUSTRIES[i]){
    var P=INDUSTRIES[i];
    return{label:P.l.toLowerCase()+' starting point',industry:i,pitch:P.pitch,accent:P.accent,
      style:'cinematic',motion:'cinematic',kind:'website',content:'agent',
      pages:P.pages.slice(),features:P.feats.slice(),languages:['English']};
  }
  return null;
}
/* Even with no seed to read — a shared link, a cleared storage — the address
   still names the preset, and the preset pages are served under that same
   slug. Enough to show the visitor the page they pressed Customize on; the
   interview is untouched, since a slug says nothing about their business. */
function presetFromUrl(){
  var t=urlTemplate();
  if(!t)return null;
  return{slug:t,file:'/templates/'+t+'.html',name:titleCase(t.replace(/-/g,' ')),
    title:'',subtitle:'',accent:''};
}
function applySeed(seed){
  S.preset=(seed.preset&&seed.preset.file)?seed.preset:null;
  Object.keys(seed).forEach(function(k){
    if(k==='label'||k==='slug'||k==='preset')return;
    var v=seed[k];
    if(v==null||v===''||(Array.isArray(v)&&!v.length))return;   // blanks fall through to the pack
    S.brief[k]=v;
  });
  var b=S.brief,P=INDUSTRIES[b.industry]||INDUSTRIES.other;
  if(!b.industry)b.industry='other';
  if(!b.pages.length)b.pages=P.pages.slice();
  if(!b.features.length)b.features=P.feats.slice();
  if(!b.accent)b.accent=P.accent;
  if(!b.pitch)b.pitch=P.pitch;
  if(!b.style)b.style='cinematic';
  if(!b.motion)b.motion='cinematic';
  if(!b.kind)b.kind='website';
  if(!b.content)b.content='agent';
  if(!b.languages.length)b.languages=['English'];
  S.seedLabel=seed.label||'a template';
  S.skip=SEED_SKIP.slice();
  S.projectName=b.name||'';
}

function save(){try{
  var copy=JSON.parse(JSON.stringify(S));
  copy.files=[];               // regenerated on load, keeps storage small
  localStorage.setItem(KEY,JSON.stringify(copy));
}catch(e){}}
function load(){try{
  var raw=localStorage.getItem(KEY);if(!raw)return false;
  var o=JSON.parse(raw);if(!o||o.v!==1)return false;
  Object.keys(o).forEach(function(k){S[k]=o[k]});
  if(!S.brief)S.brief=freshBrief();
  return true;
}catch(e){return false}}

var ORDERISH=/\b(bna ?do|bna|bana ?do|banao|bnao|banwana|banani|chahiye|chaiye|i want|i need|want a|need a|make me|build me|create a|create me|design me|please make)\b/i;

  var P=pack(b),p=String(b.pitch||'').replace(/\s+/g,' ').trim();

/* ---------- site javascript ---------- */
/* The search bar is the first thing anyone touches on a games site, so it
   filters the cards as you type rather than waiting for a back end. */
function gameJs(b){
  var P=pack(b),all=(P.catalogue||INDUSTRIES.games.catalogue);
  var cat=all.map(function(g,i){
    return '{s:"'+slug(g[0])+'",n:'+JSON.stringify(g[0])+',c:'+JSON.stringify(g[1])+',art:'+JSON.stringify(gmShot(g[1],i))+',url:""}';
  }).join(',\n    ');
  return ['',
'  /* The catalogue the whole site reads. Give a game its embed address in',
'     url and the player loads it; until then the player says it is waiting. */',
'  var GAMES=[',
'    '+cat,
'  ];',
'  var KEY='+JSON.stringify(slug(b.name))+';',
'  function read(k){try{return JSON.parse(localStorage.getItem(KEY+"."+k)||"[]")}catch(e){return[]}}',
'  function write(k,v){try{localStorage.setItem(KEY+"."+k,JSON.stringify(v.slice(0,60)))}catch(e){}}',
'  function favs(){return read("favs")}',
'  function toggleFav(sl){',
'    var f=favs(),i=f.indexOf(sl);',
'    if(i<0)f.unshift(sl);else f.splice(i,1);',
'    write("favs",f);return f.indexOf(sl)>=0;',
'  }',
'  function played(sl){var r=read("recent").filter(function(x){return x!==sl});r.unshift(sl);write("recent",r)}',
'',
'  /* hearts on every card */',
'  [].slice.call(document.querySelectorAll(".gm-heart")).forEach(function(h){',
'    if(favs().indexOf(h.dataset.fav)>=0)h.classList.add("on");',
'    h.addEventListener("click",function(e){',
'      e.preventDefault();e.stopPropagation();',
'      h.classList.toggle("on",toggleFav(h.dataset.fav));',
'    });',
'  });',
'  /* opening a card is what makes it recently played */',
'  [].slice.call(document.querySelectorAll(".gm-card")).forEach(function(c){',
'    c.addEventListener("click",function(){played(c.dataset.slug)});',
'  });',
'',
'  /* the player page */',
'  var stage=document.getElementById("gstage");',
'  if(stage){',
'    var q=(location.search.match(/[?&]g=([^&]+)/)||[])[1]||"";',
'    var game=GAMES.filter(function(g){return g.s===decodeURIComponent(q)})[0]||GAMES[0];',
'    document.getElementById("gname").textContent=game.n;',
'    document.getElementById("gcat").textContent=game.c;',
'    document.getElementById("gwaitname").textContent=game.n;',
'    document.title=game.n+" · "+document.title.split("· ").pop();',
'    played(game.s);',
'    var frame=document.getElementById("gframe"),wait=document.getElementById("gwait");',
'    function load(){',
'      if(!game.url)return;',
'      frame.src=game.url;wait.style.display="none";',
'    }',
'    load();',
'    var fav=document.getElementById("gfav");',
'    if(favs().indexOf(game.s)>=0)fav.style.color="var(--a)";',
'    fav.addEventListener("click",function(){fav.style.color=toggleFav(game.s)?"var(--a)":""});',
'    document.getElementById("gshare").addEventListener("click",function(){',
'      var url=location.href;',
'      if(navigator.share)navigator.share({title:game.n,url:url});',
'      else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){alert("Link copied")});',
'    });',
'    function full(){ (stage.requestFullscreen||stage.webkitRequestFullscreen||function(){}).call(stage) }',
'    document.getElementById("gfull").addEventListener("click",full);',
'    document.getElementById("gfull2").addEventListener("click",full);',
'    document.getElementById("gplay").addEventListener("click",function(){',
'      if(game.url)load();',
'      else alert("No embed address for this game yet — put it in the GAMES list in app.js.");',
'    });',
'    document.getElementById("grestart").addEventListener("click",function(){',
'      if(game.url){frame.src="";setTimeout(load,60)}',
'    });',
'    /* more like this */',
'    var more=document.getElementById("gmore");',
'    GAMES.filter(function(g){return g.c===game.c&&g.s!==game.s}).slice(0,6).forEach(function(g){',
'      var a=document.createElement("a");',
'      a.className="gm-card";a.href="game.html?g="+g.s;a.dataset.slug=g.s;',
'      a.innerHTML=\'<div class="gm-shot" style="background:\'+g.art+\'"><span>\'+g.c+\'</span>\'+',
'        \'<div class="gm-play"><b>▶</b></div></div><div class="gm-meta"><b>\'+g.n+\'</b><span>\'+g.c+\'</span></div>\';',
'      more.appendChild(a);',
'    });',
'  }',
'',
'  /* search across every card on the page */',
'  var q=document.getElementById("gmq");',
'  if(q){',
'    var cards=[].slice.call(document.querySelectorAll(".gm-card"));',
'    var rows=[].slice.call(document.querySelectorAll("[data-row]"));',
'    q.addEventListener("input",function(){',
'      var v=q.value.trim().toLowerCase();',
'      cards.forEach(function(c){',
'        c.style.display=!v||(c.dataset.game||"").indexOf(v)>=0?"":"none";',
'      });',
'      rows.forEach(function(r){',
'        var any=[].slice.call(r.querySelectorAll(".gm-card")).some(function(c){return c.style.display!=="none"});',
'        r.style.display=any?"":"none";',
'      });',
'    });',
'  }',
'  /* the rail categories filter the same way */',
'  [].slice.call(document.querySelectorAll("[data-cat]")).forEach(function(a){',
'    a.addEventListener("click",function(e){',
'      e.preventDefault();',
'      if(!q)return;',
'      var c=a.dataset.cat;',
'      if(c==="fav"||c==="recent"){',
'        var keep=read(c==="fav"?"favs":"recent");',
'        cards.forEach(function(x){x.style.display=keep.indexOf(x.dataset.slug)>=0?"":"none"});',
'        rows.forEach(function(r){',
'          var any=[].slice.call(r.querySelectorAll(".gm-card")).some(function(x){return x.style.display!=="none"});',
'          r.style.display=any?"":"none";',
'        });',
'        return;',
'      }',
'      q.value=c;',
'      q.dispatchEvent(new Event("input"));',
'    });',
'  });',
''].join('\n');
}
function makeJs(b){
  var lines=[
'/* '+b.name+' — behaviour */',
'(function(){',
'  var burger=document.querySelector(".burger"),links=document.querySelector(".nav-links");',
'  if(burger)burger.addEventListener("click",function(){links.classList.toggle("open")});',
'',
'  var reveal=[].slice.call(document.querySelectorAll("[data-reveal]"));',
'  reveal.forEach(function(el,i){el.style.transitionDelay=(i%4)*70+"ms"});',
'  function revealNow(){',
'    var vh=window.innerHeight||document.documentElement.clientHeight;',
'    reveal=reveal.filter(function(el){',
'      if(el.getBoundingClientRect().top<vh*0.92){el.classList.add("in");return false}',
'      return true;',
'    });',
'  }',
'  addEventListener("scroll",revealNow,{passive:true});',
'  addEventListener("resize",revealNow);',
'  addEventListener("load",revealNow);',
'  revealNow();requestAnimationFrame(revealNow);setTimeout(revealNow,250);'];
  if(b.motion==='full'||b.motion==='cinematic')lines=lines.concat([
'',
'  var stage=document.querySelector(".stage");',
'  if(stage&&!matchMedia("(prefers-reduced-motion:reduce)").matches){',
'    addEventListener("pointermove",function(e){',
'      var x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);',
'      stage.style.transform="rotateY("+(x*7)+"deg) rotateX("+(-y*5)+"deg)";',
'    },{passive:true});',
'  }']);
  if(has(b,'store'))lines=lines.concat([
'',
'  var count=0,badge=document.querySelector("[data-cart-count]");',
'  document.querySelectorAll("[data-add]").forEach(function(btn){',
'    btn.addEventListener("click",function(){',
'      count++;if(badge)badge.textContent=count;',
'      btn.textContent="Added ✓";setTimeout(function(){btn.textContent="Add to cart"},1400);',
'    })});']);
  if(has(b,'bookings'))lines=lines.concat([
'',
'  function group(sel){',
'    var els=document.querySelectorAll(sel);',
'    els.forEach(function(el){el.addEventListener("click",function(){',
'      els.forEach(function(o){o.setAttribute("aria-pressed","false")});',
'      el.setAttribute("aria-pressed","true");',
'      var out=document.querySelector("[data-booking-summary]");',
'      if(out){var s=document.querySelector(\'.svc[aria-pressed="true"] b\'),',
'        t=document.querySelector(\'.slot[aria-pressed="true"]\');',
'        out.textContent=(s?s.textContent:"Pick a service")+(t?" · "+t.textContent:"");}',
'    })})}',
'  group(".svc");group(".slot");']);
  if(has(b,'forms'))lines=lines.concat([
'',
'  document.querySelectorAll("form.enq").forEach(function(f){',
'    f.addEventListener("submit",function(e){',
'      e.preventDefault();',
'      var note=f.querySelector(".formnote");',
'      if(note)note.textContent="Thanks — connect a form endpoint in Scen to start receiving these.";',
'      f.reset();',
'    })});']);
  if(b.languages&&b.languages.length>1)lines=lines.concat([
'',
'  var langs=document.querySelectorAll(".langs button");',
'  langs.forEach(function(l){l.addEventListener("click",function(){',
'    langs.forEach(function(o){o.setAttribute("aria-pressed","false")});',
'    l.setAttribute("aria-pressed","true");',
'    document.documentElement.lang=l.dataset.lang;',
'  })});']);
  lines.push('})();');
  if(b.industry==='games')lines.push(gameJs(b));
  return lines.join('\n');
}

/* ---------- section renderers ---------- */
function tint(t,i,ratio){return mix(t.a,t.st.bg,ratio==null?(.72+((i||0)%4)*.06):ratio)}
/* Figures a business has not given are placeholders that read as placeholders,
   never numbers a visitor could believe. */
function hasProof(b){return !!(b.__stats&&b.__stats.length)}
function proof(b,i){
  var real=b.__stats&&b.__stats.length?b.__stats:null;
  return real?real[i%real.length]:['',''];
}
/* A generated photograph when the client paid for one, the drawn placeholder
   when they did not. Everything that shows art asks here, so one switch turns
   a whole build from swatches into pictures. */
function artFor(b,t,i,extra){
  var list=(b&&b.__art)||[];
  if(list.length){
    var u=list[i%list.length];
    if(u)return 'style="background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.42)),url(\''+esc(u)+'\') center/cover no-repeat'+(extra||'')+'"';
  }
  return ph(t,i,extra);
}
function ph(t,i,extra){ /* placeholder art block */
  return 'style="background:linear-gradient('+(120+i*26)+'deg,'+tint(t,i,.68)+','+t.bg3+' 62%,'+t.st.bg+')'+(extra||'')+'"';
}

function nav(b,current){
  var links=b.pages.map(function(p){
    return '      <a href="'+pageFile(p)+'"'+(p===current?' aria-current="page"':'')+'>'+esc(p)+'</a>'}).join('\n');
  var cta=pack(b).cta[2];
  return ['  <header class="nav">',
'    <div class="wrap nav-in">',
'      <a class="brand" href="index.html"><i></i>'+esc(b.name)+'</a>',
'      <button class="burger" aria-label="Menu">☰</button>',
'      <nav class="nav-links">',links,'      </nav>',
      (has(b,'store')?'      <a class="btn ghost nav-cta" href="'+pageFile(b.pages.filter(function(p){return /shop|menu|tickets/i.test(p)})[0]||'Contact')+'">Cart (<span data-cart-count>0</span>)</a>':''),
'      <a class="btn nav-cta" href="'+pageFile(lastPage(b))+'">'+esc(cta)+'</a>',
'    </div>',
'  </header>'].filter(Boolean).join('\n');
}
function lastPage(b){
  var pref=['Contact','Book','Reservations','Shop','Pricing'];
  for(var i=0;i<pref.length;i++)if(b.pages.indexOf(pref[i])>=0)return pref[i];
  return b.pages[b.pages.length-1]||'Home';
}

var SEC={
  hero:function(b,t){
    var P=pack(b),art;
    if(b.__heroImage){
      art='      <div class="stage" data-reveal style="aspect-ratio:4/3;border-radius:var(--rad);overflow:hidden;border:1px solid var(--line)">\n'+
'        <img src="'+esc(b.__heroImage)+'" alt="'+esc(b.name)+'" style="width:100%;height:100%;object-fit:cover"/>\n'+
'      </div>';
    }else if(b.motion==='full'){
      art='      <div class="stage" data-reveal>\n'+
'        <div class="ring r1"></div><div class="ring r2"></div>\n'+
'        <div class="orb"></div>\n'+
(hasProof(b)?'        <div class="card3d c1"><b>'+esc(proof(b,0)[0])+'</b>'+esc(proof(b,0)[1])+'</div>\n'+
'        <div class="card3d c2"><b>'+esc(proof(b,2)[0])+'</b>'+esc(proof(b,2)[1])+'</div>\n':'')+
'      </div>';
    }else{
      art='      <div class="stage" data-reveal style="display:grid;grid-template-columns:1fr 1fr;gap:14px;aspect-ratio:auto">\n'+
        P.gallery.slice(0,4).map(function(g,i){
          return '        <div class="tile" '+ph(t,i)+'><b>'+esc(g)+'</b></div>'}).join('\n')+'\n      </div>';
    }
    /* The company name in 104px type is a letterhead, not a page. The claim
       goes there and the name sits small above it — which is what every page
       the client has ever pointed at does, and what the writer is now asked
       for. Without a live writer the claim is built from the brief rather
       than borrowed from the name. */
    var head=P.headline||heroClaim(b),lead=P.headline?saneLine(b):heroLead(b,head);
    /* Five openings, not one. The art director picks the shape for this
       business — a centred claim is right for a product and wrong for an
       architecture studio, and shipping one shape for everything is how every
       build ends up recognisably ours rather than theirs. */
    /* When the art director names a shape it wins. When it does not — no
       gateway, or a design that came back without the field — falling back to
       one shape gave every build the same centred hero, which is the single
       loudest way a site looks generated. The project picks its own from its
       name instead, so two businesses do not open the same way. */
    var kind=(b.__ui&&b.__ui.hero)||heroKindFor(b);
    var cta='      <div class="hero-cta" data-reveal>\n'+
'        <a class="btn" href="'+pageFile(lastPage(b))+'">'+esc(P.cta[2])+'</a>\n'+
'        <a class="tlink" href="'+pageFile(b.pages[1]||'Home')+'">'+esc(b.pages[1]||'Learn more')+' \u203a</a>\n'+
'      </div>';
    var proofRow=hasProof(b)?'      <div class="proof" data-reveal>'+[0,1,2].map(function(i){
      var st=proof(b,i);return '<span>'+esc(st[0]+' '+st[1])+'</span>'}).join('')+'</div>':'';
    var over='      <span class="over" data-reveal>'+esc(b.name)+'</span>';
    var h1='      <h1 data-reveal>'+esc(head)+'</h1>';
    var leadP='      <p class="lead" data-reveal>'+esc(lead)+'</p>';

    if(kind==='split'){
      return ['  <section class="hero k-split">','    <div class="wrap hero-split">',
'      <div class="hero-copy">',over,h1,leadP,cta,proofRow,'      </div>',
'      <div class="hero-visual tall" data-reveal>',art,'      </div>',
'    </div>','  </section>'].join('\n');
    }
    if(kind==='full'){
      return ['  <section class="hero k-full">',
'    <div class="hero-bleed" data-reveal>',art,'    </div>',
'    <div class="wrap hero-over">',over,h1,leadP,cta,'    </div>','  </section>'].join('\n');
    }
    if(kind==='editorial'){
      return ['  <section class="hero k-editorial">','    <div class="wrap hero-ed">',
'      <div class="ed-l">',over,h1,'      </div>',
'      <div class="ed-r">',leadP,cta,proofRow,'      </div>',
'    </div>',
'    <div class="wrap hero-visual wide" data-reveal>',art,'    </div>',
'  </section>'].join('\n');
    }
    /* statement and product both centre the claim; product puts the thing
       itself directly under it, tight, with nothing in between. */
    return ['  <section class="hero k-'+esc(kind)+'">','    <div class="wrap hero-stack">',
over,h1,leadP,cta,proofRow,'    </div>',

function sectionsFor(page,b,pro){
  // a live-AI plan wins; it is already validated down to known section ids
  if(b.__plan&&b.__plan[page]&&b.__plan[page].length)return b.__plan[page].slice();
  var n=page.toLowerCase(),out=[];
  if(n==='home'){
    out.push('hero');
    if(pro)out.push('logos');
    out.push('services');
    out.push('statement');
    if(has(b,'gallery')||pro||b.industry==='games')out.push('showcase');
    if(pro)out.push('stats');
    if(has(b,'store'))out.push('products');
    if(has(b,'bookings'))out.push('booking');
    if(b.goal==='sell'||b.goal==='signup')out.push('pricing');
    if(pro)out.push('testimonial');
    if(pro)out.push('faq');
    out.push('cta');
    return out;
  }
  out.push('phero');
  if(/shop|menu|tickets|store/.test(n))out.push('products');
  else if(/reserv|book|appoint/.test(n))out.push('booking',has(b,'maps')?'map':null);
  else if(/service|treatment|class|course/.test(n))out.push('servicelist',pro?'pricing':null,pro?'faq':null);
  else if(/game|arcade|multiplayer|trending|popular|new games|\.io/.test(n))out.push('showcase',pro?'stats':null);
  else if(/work|gallery|lookbook|listing|venue/.test(n))out.push('showcase',pro?'testimonial':null);
  else if(/pricing|membership/.test(n))out.push('pricing',pro?'faq':null);
  else if(/blog|writing|news/.test(n))out.push('posts');
  else if(/team|trainer|faculty|people/.test(n))out.push('team');
  else if(/contact/.test(n))out.push('contact',has(b,'maps')?'map':null);
  else if(/faq|question/.test(n))out.push('faq');
  else if(/admission|apply|join/.test(n))out.push('steps','contact');
  else if(/about|story|studio/.test(n))out.push('prose','statement',pro?'stats':null,pro?'team':null);
  else out.push('prose',pro?'services':null);
  out.push('cta');
  return out.filter(Boolean);
}

function makePage(b,page,pro,t){
  var body=sectionsFor(page,b,pro).map(function(id){
    return SEC[id]?SEC[id](b,t,page):''}).filter(Boolean).join('\n\n');
  var title=page.toLowerCase()==='home'?b.name+' — '+pack(b).kicker.replace(/ · /g,', '):page+' · '+b.name;
  return ['<!doctype html>','<html lang="'+((b.languages[0]||'English').slice(0,2).toLowerCase())+'">','<head>',
'<meta charset="utf-8"/>',
'<meta name="viewport" content="width=device-width,initial-scale=1"/>',
'<title>'+esc(title)+'</title>',
'<meta name="description" content="'+esc(b.pitch)+'"/>',
'<meta property="og:title" content="'+esc(title)+'"/>',
'<meta property="og:description" content="'+esc(b.pitch)+'"/>',
'<link rel="stylesheet" href="styles.css"/>',
'</head>','<body>',
nav(b,page),'',body,'',footer(b),
'<scr'+'ipt src="app.js"></scr'+'ipt>',
'</body>','</html>'].join('\n');
}

function gmShot(cat,i){

  if(h==null)h=(i*47)%360;
  var h2=(h+34)%360,art=GM_ART[k]||GM_ART.arcade;
  /* percent-encoded end to end and wrapped in an unquoted url(), so the value
     survives being written into a double-quoted style attribute */
  return 'url('+art+') center/cover no-repeat,'+
    'radial-gradient(120% 90% at 18% 8%,hsl('+h+' 84% 46%/.6),transparent 62%),'+
    'radial-gradient(90% 80% at 88% 92%,hsl('+h2+' 88% 50%/.45),transparent 58%),'+
    'linear-gradient(158deg,hsl('+h+' 38% 16%),hsl('+h2+' 32% 8%))';
}

/* One long page, in the client's own chapter order. Each chapter is a full
   band with its own title, a line of copy and a piece of art, alternating
   sides — the shape of a product page, not a stack of cards. */
var CH_SKIP=/^(hero|header|nav(igation)?|footer|top ?bar|menu)$/i;
/* Art for a chapter, drawn from the chapter's own name. A launch page shows
   the thing; the generator has no photographs, so it draws: a lens ring for a
   camera, bars for performance, a cell for battery, a slab for design. */
function chapterArt(name,i){
  var n=String(name).toLowerCase();
  if(/camera|lens|photo|video/.test(n))
    return '<figure class="lp-fig"><div class="lp-ring"><i></i></div><figcaption>'+esc(name)+'</figcaption></figure>';
  if(/performance|speed|chip|power|engine/.test(n))
    return '<figure class="lp-fig"><div class="lp-bars"><b></b><b></b><b></b></div><figcaption>'+esc(name)+'</figcaption></figure>';
  if(/battery|charge|power|life/.test(n))
    return '<figure class="lp-fig"><div class="lp-cell"></div><figcaption>'+esc(name)+'</figcaption></figure>';
  if(/design|material|build|body|finish/.test(n))
    return '<figure class="lp-fig"><div class="lp-slab"></div><figcaption>'+esc(name)+'</figcaption></figure>';
  return '<figure class="lp-fig"><div class="lp-ring"><i></i></div><figcaption>'+esc(name)+'</figcaption></figure>';
}
/* The device the hero stands on. Rounded body, a screen lit from the top and a
   camera cluster — generic hardware, drawn in CSS, no photograph needed. */
/* A phone on a school's page is a stock image nobody asked for. The device is
   drawn only when the brief is about a device; everything else gets a panel
   that reads as the photograph it is waiting for. */
function deviceLike(b){
  var t=[b.pitch,b.name,(b.__onepage||[]).join(' ')].join(' ').toLowerCase();
  return /\b(phone|handset|device|hardware|gadget|laptop|tablet|watch|camera|wearable)\b/.test(t);
}

function makeOnePage(b,pro,t){
  var P=pack(b),list=(b.__onepage||[]).filter(function(n){return !CH_SKIP.test(n)});
  var links=list.map(function(n){return '      <a href="#'+slug(n)+'">'+esc(n)+'</a>'}).join('\n');
  var body=[],i=0;
  list.forEach(function(name){
    var n=name.toLowerCase();
    if(/buy|price|pricing|purchase|order/.test(n))body.push(SEC.pricing(b,t,'Home'));
    else if(/faq|question/.test(n))body.push(SEC.faq(b,t,'Home'));

'  document.documentElement.style.cursor=pick?"crosshair":"";});'+
'function label(el){var t=(el.innerText||el.textContent||"").replace(/\\s+/g," ").trim();return t.slice(0,80)}'+

<script>
(function(){
"use strict";
/* ============================================================
   Live AI — the Scen gateway
   POST /api/ai/generate  { feature, input, system, maxOutputTokens, temperature }
   →      { text, provider, model, usage, requestId }
   The route requires a signed-in session cookie, so this only works on a
   domain that proxies /api to the Scen backend. Every call falls back to
   the local generators, and the UI says which one produced the build.
   ============================================================ */
var C=window.__SCEN_CORE;
var INDUSTRIES=C.INDUSTRIES,STYLES=C.STYLES,FEATURES=C.FEATURES,GOALS=C.GOALS;

var AI={
  enabled:true,
  /* '' means let the gateway route it. Anything else is the client's pick,
     honoured when that provider is configured and answering. */
  pick:'', available:[],
  state:'unknown',        // unknown | ready | live | signedout | offline | error
  provider:'',model:'',requests:0,inTok:0,outTok:0,cost:0,lastMs:0,lastError:'',
  fell:'',                // why the primary did not answer, when something else did
  usedForBuild:''         // '' | 'live' | 'local'
};

function post(feature,input,system,opts){
  opts=opts||{};
  var pick=AI.pick;
  /* A request that never settles freezes the whole build: the step chain waits
     on the promise, so the pill said "Building…" for as long as the tab was
     open and nothing was written. The gateway's own timeout is 45s; this one
     sits just past it so the server's error usually wins, and a hang still
     ends in a fallback rather than a stall. */
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var died=setTimeout(function(){try{ctl&&ctl.abort()}catch(e){}},58000);
  return fetch('/api/ai/generate',{
    method:'POST',credentials:'same-origin',
    signal:ctl?ctl.signal:undefined,
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({feature:feature,input:input,system:system,
      provider:pick||undefined,
      maxOutputTokens:opts.maxOutputTokens||1400,
      temperature:opts.temperature==null?0.7:opts.temperature})
  }).then(function(r){
    clearTimeout(died);
    return r.text().then(function(t){
      var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t||('HTTP '+r.status)}}
      if(!r.ok){
        var err=new Error(d.error||('Request failed ('+r.status+')'));
        err.status=r.status;err.code=d.code;throw err;
      }
      return d;
    });
  });
}
function record(d,ms){
  AI.requests++;AI.lastMs=ms;AI.state='live';AI.lastError='';
  if(d.provider)AI.provider=d.provider;
  if(d.model)AI.model=d.model;
  /* The gateway tries the primary first and moves on when it fails. That used
     to leave the pane reading "openai · gpt-5.6, last error: none" while the
     provider the client actually configured had not answered a single call —
     the reason existed only in a server log nobody was watching. */
  AI.fell='';
  if(Array.isArray(d.attempts)&&d.attempts.length){
    AI.fell=d.attempts.map(function(a){
      return String(a.provider)+' failed ('+a.status+(a.code?', '+a.code:'')+'): '+scrubAI(a.message);
    }).join(' · ');
  }
  var u=d.usage||{};
  AI.inTok+=Number(u.inputTokens||0);
  AI.outTok+=Number(u.outputTokens||0);
  AI.cost+=Number(u.estimatedCostUsd||0);
}
function scrubAI(text){
  return String(text==null?'':text)
    .replace(/\b(?:xai-|sk-(?:ant-|proj-|live-|test-)?|gsk_|AIza|ghp_|glpat-)[A-Za-z0-9_\-]{12,}\b/g,'[redacted]')
    .replace(/\b[A-Za-z0-9_\-]{40,}\b/g,'[redacted]');
}
function failed(e){
  if(e&&(e.name==='AbortError'||/aborted/i.test(String(e.message||'')))){
    e=new Error('The gateway did not answer in time');e.status=504;e.code='timeout';
  }
  var s=e&&e.status;
  if(s===401||s===403){AI.state='signedout';AI.lastError='Not signed in on this domain.'}
  else if(s===503||(e&&e.code==='missing_key')){AI.state='error';AI.lastError='No provider key configured on the server.'}
  else if(!s||s===404){AI.state='offline';AI.lastError='The /api routes are not reachable from this page.'}
  else{AI.state='error';AI.lastError=scrubAI((e&&e.message)||('Gateway error ('+s+')'))}
  return null;
}
/* Which models this workspace actually has. /api/capabilities answers with
   configured provider ids and nothing else — no keys, no endpoints — so the
   picker only ever offers what the gateway can really reach. */
function readModels(){
  return fetch('/api/capabilities',{credentials:'same-origin'}).then(function(r){
    return r.ok?r.json():null;
  }).then(function(d){
    var list=(d&&(d.ai||(d.capabilities&&d.capabilities.ai)))||[];
    AI.available=Array.isArray(list)?list:[];
    if(AI.pick&&AI.available.indexOf(AI.pick)<0)AI.pick='';
    return AI.available;
  }).catch(function(){AI.available=[];return []});
}
function probe(){
  return fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){
    if(r.ok){if(AI.state!=='live')AI.state='ready';AI.lastError='';readModels();return AI.state}
    if(r.status===401){AI.state='signedout';AI.lastError='Not signed in on this domain.';return AI.state}
    AI.state='offline';AI.lastError='The /api routes are not reachable from this page.';return AI.state;
  }).catch(function(){
    AI.state='offline';AI.lastError='The /api routes are not reachable from this page.';return AI.state;
  });
}

/* ---------- tolerant JSON ---------- */
function jsonFrom(text){
  if(!text)return null;
  var s=String(text).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{return JSON.parse(s.slice(a,b+1))}catch(e){}
  // one repair pass: models sometimes trail a comma before a closer
  try{return JSON.parse(s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1'))}catch(e){}
  return null;
}
function str(v,fb){return typeof v==='string'&&v.trim()?v.trim():fb}
function pairList(v,n,fb){
  if(!Array.isArray(v))return fb;
  var out=v.map(function(x){
    if(Array.isArray(x))return[str(x[0],''),str(x[1],'')];
    if(x&&typeof x==='object')return[str(x.title||x.t||x.k||x.q||x.name||x.value,''),
      str(x.body||x.d||x.v||x.a||x.answer||x.label||x.text,'')];
    return null;
  }).filter(function(p){return p&&p[0]});
  return out.length>=n?out.slice(0,n):fb;
}
function strList(v,n,fb){
  if(!Array.isArray(v))return fb;
  var out=v.map(function(x){return str(x,'')}).filter(Boolean);
  return out.length>=n?out.slice(0,n):fb;
}

/* ---------- the brief, as the model sees it ---------- */

var UI_FONTS={
  geist:'"Geist",Inter,system-ui,-apple-system,sans-serif',
  general:'"General Sans","Geist",system-ui,sans-serif',
  system:'-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif',
  serif:'Georgia,"Times New Roman",serif',
  mono:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'

var DIRECTION_RULES=
  '\n\nWhat premium means here:\n'+
  '- Not more gradients, glows, cards, glass, neon or 3D. Composition, typography, whitespace, '+
  'hierarchy, art direction and restraint.\n'+
  '- The design language must change with the business. An architecture studio is editorial, '+
  'image-led, asymmetric; a kids school is warm, human, clear; a luxury salon is fashion-editorial '+
  'with large photography; an AI product is precise and technical.\n'+
  '- Never the generic AI page: centred heading, paragraph, two buttons, three equal cards, six icon '+
  'boxes, every section the same width with the same spacing.\n'+
  '- Two type families at most, with real hierarchy between eyebrow, display, section head, body and '+
  'labels. Not everything the same size.\n'+
  '- If the client names a site they admire, take its principles, not its layout.';

function designPrompt(b,hist){

  '\n\nReturn one JSON object and nothing else:\n'+

  ' "radius":0-32,"heroAlign":"left|center","density":"airy|balanced|tight",\n'+
  ' "hero":"editorial|split|full|statement|product",\n'+

  ' "motion":"subtle|cinematic|full","caps":true|false}\n\n'+
  'Rules:\n'+

/* ---------- visual review ---------- */
/* §16–§18. A working page with weak design is not finished, so the build
   marks its own work and then acts on it.

   It reads the page it just wrote rather than a screenshot: the markup says
   how many sections share one layout, how often the accent appears, whether
   anything but the hero is display-sized — which is what §17 actually asks —
   and a text call is cheaper and steadier than shipping a picture. What comes
   back has to be an instruction the studio can carry out, so the fixes are a
   closed list of levers that exist. Anything else is advice nobody acts on. */
var QA_FIXES=['hero:editorial','hero:split','hero:full','hero:statement','hero:product',
  'density:airy','density:balanced','density:tight','align:left','align:center',
  'caps:on','caps:off','radius:sharp','radius:soft','sections:more','sections:fewer',
  'images:regenerate','nothing'];
function reviewPrompt(b,html){
  var ui=b.__ui||{};
  return 'Mark this page as a design director would, then name what to change.\n\n'+
  'BRIEF:\n'+briefSummary(b)+'\n\n'+
  'The design in use: hero '+(ui.hero||'statement')+', '+(ui.heroAlign||'center')+'-aligned, '+
  (ui.density||'balanced')+' density, radius '+(ui.radius==null?'default':ui.radius+'px')+
  ', accent '+(b.accent||'')+'.\n\n'+
  'THE PAGE (markup, truncated):\n'+String(html||'').slice(0,9000)+'\n\n'+
  'Score 0-10, honestly, and low where it deserves it:\n'+
  '{"scores":{"hierarchy":0,"typography":0,"composition":0,"originality":0,"brandFit":0,'+
  '"spacing":0,"premium":0},"worst":"one key from scores",'+
  '"fixes":["at most two, from this list exactly: '+QA_FIXES.join(', ')+'"],'+
  '"verdict":"one sentence, plain, about this page"}\n\n'+
  'Ask yourself: could this design belong to ten unrelated businesses? Is every section the '+
  'same layout? Is the accent overused? Is there anything memorable about the first screen? '+
  'Does the type have real hierarchy or is everything a similar size?\n'+
  'If it is genuinely good, return "nothing" as the only fix. Do not invent work.\n'+
  'JSON only.';
}
function readReview(o){
  if(!o||typeof o!=='object')return null;
  var sc=o.scores&&typeof o.scores==='object'?o.scores:{};
  var out={scores:{},worst:str(o.worst,''),verdict:str(o.verdict,''),fixes:[]};
  ['hierarchy','typography','composition','originality','brandFit','spacing','premium'].forEach(function(k){
    var v=Number(sc[k]);out.scores[k]=(isFinite(v)&&v>=0&&v<=10)?v:null;
  });
  (Array.isArray(o.fixes)?o.fixes:[]).forEach(function(f){
    f=String(f||'').trim().toLowerCase();
    if(QA_FIXES.indexOf(f)>=0&&f!=='nothing'&&out.fixes.length<2)out.fixes.push(f);
  });
  return out;
}
/* The same review, from a picture instead of the markup — §42's "screenshot →
   critique". The vision route answers with the same shape, so everything
   downstream is unchanged. */
function reviewShot(b,dataUri){
  var t0=Date.now();

    '\n\nfixes must come from this list exactly: '+QA_FIXES.join(', ');
  /* this block is evaluated before the API block exists, so the route is
     looked up when it is called rather than when it is defined */
  return window.__SCEN_API.visionReview(dataUri,'page',hint).then(function(d){
    var o=jsonFrom(d&&d.text);
    if(!o)throw Object.assign(new Error('The review was not JSON'),{status:502});
    var r=readReview(o);
    if(!r)throw Object.assign(new Error('The review came back unusable'),{status:502});
    AI.lastMs=Date.now()-t0;
    return{review:r,provider:(d&&d.provider)||'openai',model:(d&&d.model)||'',ms:Date.now()-t0};
  }).catch(function(e){failed(e);return null});
}

/* Is one generated photograph fit to publish — §38. */
function reviewPhoto(url){
  return imageData(url).then(function(dataUri){
    if(!dataUri)return null;
    return window.__SCEN_API.visionReview(dataUri,'photo','Can this be published on a client website?')
      .then(function(d){
        var o=jsonFrom(d&&d.text);if(!o)return null;
        return{usable:o.usable!==false,score:Number(o.score)||0,
               faults:(Array.isArray(o.faults)?o.faults:[]).slice(0,3).map(String),
               reshoot:String(o.reshoot||'').slice(0,400)};
      });
  }).catch(function(){return null});
}
/* A generated image lives behind the session cookie, so it is fetched here and
   turned into the data URI the review route takes. */
function imageData(url){
  if(!url)return Promise.resolve('');
  return fetch(url,{credentials:'same-origin'}).then(function(r){
    if(!r.ok)throw new Error(String(r.status));
    return r.blob();
  }).then(function(bl){
    if(bl.size>5000000)return '';
    return new Promise(function(res){
      var fr=new FileReader();
      fr.onload=function(){res(String(fr.result||''))};
      fr.onerror=function(){res('')};
      fr.readAsDataURL(bl);
    });
  }).catch(function(){return ''});
}

/* What the review saw, turned into a stylesheet patch by the model that writes

/* ---------- page plan ---------- */
var SECTION_IDS=['logos','statement','services','servicelist','showcase','stats','products','booking',
  'pricing','testimonial','faq','posts','team','contact','map','steps','prose'];
function planPrompt(b,hist){
  return 'Lay out the sections for each page of this website.\n\nBRIEF:\n'+briefSummary(b)+
  /* Same reason as readEdit: the brief cannot carry what was actually said —
     an aside about tone, a name they rejected, the customer they described. */
  (hist&&hist.length?'\n\nConversation so far (oldest first):\n'+hist.join('\n')+'\n':'')+
  '\n\nAllowed section ids, use these exact strings:\n'+SECTION_IDS.join(', ')+
  '\n\nRules: 4 to 7 sections per page. Do not include a hero, a page header or a closing '+
  'call to action — those are added automatically. Only use "products" if the brief has a store, '+
  '"booking" if it has bookings, "posts" if it has a blog, "map" if it has a map. '+
  'Never repeat a section within one page.\n\n'+
  'Return: {"pages":[{"name":"'+(b.pages[0]||'Home')+'","sections":["services","showcase"]}]} '+
  'with one entry for every page in the brief.';
}
function readPlan(o,b){
  if(!o||!Array.isArray(o.pages))return null;
  var out={},hits=0;
  o.pages.forEach(function(p){
    var name=str(p&&p.name,'');
    var match=b.pages.filter(function(x){return x.toLowerCase()===name.toLowerCase()})[0];
    if(!match||!Array.isArray(p.sections))return;
    var seen={},ids=[];
    p.sections.forEach(function(s){
      s=str(s,'').toLowerCase();
      if(SECTION_IDS.indexOf(s)<0||seen[s])return;
      seen[s]=1;ids.push(s);
    });
    if(!ids.length)return;
    // the frame is ours: hero or page header first, call to action last
    out[match]=[match.toLowerCase()==='home'?'hero':'phero'].concat(ids.slice(0,7)).concat(['cta']);
    hits++;
  });
  return hits?out:null;
}
function writePlan(b,hist){
  var t0=Date.now();
  return post('planning',planPrompt(b,hist),
    'You plan website structure. Reply with one JSON object and nothing else.',
    {maxOutputTokens:900,temperature:.4})
    .then(function(d){
      record(d,Date.now()-t0);
      var plan=readPlan(jsonFrom(d.text),b);
      if(!plan)throw Object.assign(new Error('The model did not return a usable plan'),{status:502});
      return{plan:plan,provider:d.provider,model:d.model,ms:Date.now()-t0};
    })
    .catch(function(e){failed(e);return null});

  '- If the client says you decide, or anything like it, choose and set ready_to_build.\n'+
  '- Once a kind, a trade and a name (or a workable placeholder) are known, set ready_to_build '+
  'true and should_ask_question false. A strong first version beats a complete form.\n'+
  '- Feature names must come from: '+Object.keys(FEATURES).join(', ')+'.\n'+
  '- Answer in the client\'s own language. If they write Hinglish, answer in Hinglish '+
  '(Roman script, not Devanagari). Be brief and decisive. '+
  'Do not restate everything they said.';
}
/* A timeout is worth one more try with less to read: the same turn, no
   history, half the brief. Anything else fails straight to the local path. */
function retryable(e){return e&&(e.status===504||e.code==='timeout'||/in time/i.test(String(e.message||'')))}
function readTurn(text,b,hist){
  var t0=Date.now();
  function ask(msg,history){
    return post('analysis',turnPrompt(msg,b,history),
      'You read a client message and reply with one JSON object and nothing else.',
      {maxOutputTokens:700,temperature:.3})
      .then(function(d){
        record(d,Date.now()-t0);
        var o=jsonFrom(d.text);
        if(!o)throw Object.assign(new Error('The model did not return usable JSON'),{status:502});
        return o;
      });
  }
  return ask(text,hist).catch(function(e){
    /* one more try with less to read — a long brief is what ran the clock out */
    if(!retryable(e))throw e;
    return ask(String(text).slice(0,1200),[]);
  }).catch(function(e){failed(e);return null});
}

function readEdit(text,b,hist){
  var t0=Date.now();
  return post('analysis',editPrompt(text,b,hist),
    'You turn a website change request into JSON. Reply with one JSON object and nothing else.',
    {maxOutputTokens:600,temperature:.2})
    .then(function(d){
      record(d,Date.now()-t0);
      var o=jsonFrom(d.text);
      if(!o)throw Object.assign(new Error('The model did not return usable JSON'),{status:502});
      return o;
    })
    .catch(function(e){failed(e);return null});
}

function test(){
  var t0=Date.now();
  return post('chat','Reply with exactly one word: ready',
    'You reply with one word and nothing else.',{maxOutputTokens:16,temperature:0})
    .then(function(d){record(d,Date.now()-t0);return{ok:true,text:(d.text||'').trim(),provider:d.provider,model:d.model,ms:Date.now()-t0}})
    .catch(function(e){failed(e);return{ok:false,error:AI.lastError}});
}

window.__SCEN_AI={AI:AI,probe:probe,usable:usable,label:label,readModels:readModels,designUI:designUI,
  reviewBuild:reviewBuild,reviewShot:reviewShot,reviewPhoto:reviewPhoto,patchCss:patchCss,
  writeCopy:writeCopy,writePlan:writePlan,readEdit:readEdit,readTurn:readTurn,test:test,SECTION_IDS:SECTION_IDS};
})();
</script>
<script>
(function(){
"use strict";
/* ============================================================
   Scen backend — the rest of the API
   Everything here hits the same origin with the session cookie, exactly
   like the main app does. Nothing is mocked: if a call fails, the pane
   shows the failure instead of inventing a number.
   ============================================================ */
var C=window.__SCEN_CORE,slug=C.slug;

var API={
  me:null,credits:null,projects:null,domains:null,assets:null,sessions:null,products:null,
  err:{},busy:{},projectId:'',projectSlug:'',published:null,onchange:null
};

function req(path,opts){
  opts=opts||{};
  return fetch(path,{
    method:opts.method||'GET',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    return r.text().then(function(t){
      var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t||('HTTP '+r.status)}}
      if(!r.ok){
        var e=new Error(d.error||('Request failed ('+r.status+')'));
        e.status=r.status;e.code=d.code;throw e;
      }
      return d;
    });
  });
}
/* Defence in depth: whatever the gateway hands back, nothing key-shaped is
   ever drawn into the chat or the composer note. */
function scrub(text){
  return String(text==null?'':text)
    .replace(/\b(?:xai-|sk-(?:ant-|proj-|live-|test-)?|gsk_|AIza|ghp_|glpat-)[A-Za-z0-9_\-]{12,}\b/g,'[redacted]')
    .replace(/\b[A-Za-z0-9_\-]{40,}\b/g,'[redacted]');
}
function msg(e){
  if(!e)return 'Failed';
  if(e.status===401)return 'Not signed in on this domain.';
  if(e.status===404)return 'This route is not reachable from here.';
  return scrub(e.message||'Failed');
}

var LOADERS={
  /* The studio asserted "Publishing is not connected" as a fixed string and
     never checked. It might have been connected the whole time; nobody could
     tell from in here. Ask, and say what comes back. */
  capabilities:function(){return req('/api/capabilities')},
  me:function(){return req('/api/auth/me')},
  credits:function(){return req('/api/billing/credits')},
  projects:function(){return req('/api/projects').then(function(d){return d.projects||[]})},
  domains:function(){return req('/api/domains').then(function(d){return d.domains||d.list||[]})},
  assets:function(){return req('/api/assets?limit=50').then(function(d){return d.assets||[]})},
  sessions:function(){return req('/api/auth/sessions').then(function(d){return d.sessions||[]})},
  products:function(){return req('/api/store/products').then(function(d){return d.products||[]})}
};

function ensure(name,force){
  if(!LOADERS[name])return;
  if(!force&&(API[name]!==null||API.busy[name]))return;
  API.busy[name]=true;
  LOADERS[name]().then(function(v){API[name]=v;API.err[name]=''},
                       function(e){API.err[name]=msg(e);if(API[name]===null)API[name]=Array.isArray(API[name])?[]:false})
    .then(function(){API.busy[name]=false;if(API.onchange)API.onchange(name)});
}
function ensureAll(){['me','credits','projects'].forEach(function(n){ensure(n)})}
function reset(){
  ['me','credits','projects','domains','assets','sessions','products'].forEach(function(n){API[n]=null});
  API.err={};API.busy={};
}

/* ---------- what gets stored and published ---------- */
function manifest(gen){
  return (gen&&gen.files||[]).map(function(f){return{path:f.path,bytes:f.body.length,lang:f.lang}});
}
function settingsFor(b,gen,depth){
  return{
    source:'agent-studio',
    brief:{kind:b.kind,name:b.name,industry:b.industry,pitch:b.pitch,goal:b.goal,
      audience:b.audience,pages:b.pages,features:b.features,style:b.style,accent:b.accent,
      motion:b.motion,content:b.content,languages:b.languages,domain:b.domain},
    depth:depth,files:manifest(gen),
    copyWrittenBy:b.__copy?'gateway':'local',
    planWrittenBy:b.__plan?'gateway':'local'
  };
}
function siteSnapshot(b,gen){
  var pages=(gen&&gen.site&&gen.site.pages||[]).map(function(p){
    return{page:p.page,file:p.file.replace(/^site\//,''),html:p.html}});
  return{
    kind:'scen-agent-build',v:1,generatedAt:new Date().toISOString(),
    /* the older renderer reads these, so a snapshot is never blank */
    palette:{accent:b.accent,accent2:'#7beeff'},
    heroTitle:b.name,heroSubtitle:b.pitch,
    components:b.pages.slice(0,6),sectionCopy:[],sections:[],ctas:[],
    /* what the agent build actually needs */
    accent:b.accent,style:b.style,pages:pages,
    css:gen&&gen.site?gen.site.css:'',js:gen&&gen.site?gen.site.js:''
  };
}

/* ---------- writes ---------- */
function saveProject(b,gen,depth){
  var body={name:b.name||'Untitled project',slug:slug(b.name||''),settings:settingsFor(b,gen,depth)};
  if(API.projectId)
    return req('/api/projects/'+encodeURIComponent(API.projectId),{method:'PATCH',body:body})
      .then(function(d){var p=d.project||d;API.projectSlug=p.slug||API.projectSlug;return p});
  return req('/api/projects',{method:'POST',body:body}).then(function(d){
    var p=d.project||d;API.projectId=p.id||'';API.projectSlug=p.slug||'';
    if(Array.isArray(API.projects))API.projects.unshift(p);
    return p;
  });
}
function saveVersion(label,b,gen,depth){
  if(!API.projectId)return Promise.resolve(null);
  return req('/api/projects/'+encodeURIComponent(API.projectId)+'/versions',
    {method:'POST',body:{label:label,summary:label,data:settingsFor(b,gen,depth)}})
    .then(function(d){return d.version||null},function(){return null});
}
function listVersions(){
  if(!API.projectId)return Promise.resolve([]);
  return req('/api/projects/'+encodeURIComponent(API.projectId)+'/versions')
    .then(function(d){return d.versions||[]},function(){return []});
}
function publish(address,b,gen){
  return req('/api/publish',{method:'POST',body:{
    slug:address,projectName:b.name||address,site:siteSnapshot(b,gen)}})
    .then(function(d){API.published=d;return d});
}
function addDomain(host,address){
  return req('/api/domains',{method:'POST',body:{host:host,slug:address||undefined}})
    .then(function(d){
      if(d.domain){if(!Array.isArray(API.domains))API.domains=[];API.domains.unshift(d.domain)}
      return d;
    });
}
function invite(email,role){
  return req('/api/workspaces/invitations',{method:'POST',body:{email:email,role:role||'member'}});
}
function revokeOtherSessions(){
  return req('/api/auth/sessions?others=true',{method:'DELETE'}).then(function(d){
    ensure('sessions',true);return d;});
}
/* A picture, and a question about it. mode 'page' marks a screenshot of the
   build; mode 'photo' decides whether one generated image can be published. */
function visionReview(dataUri,mode,hint){
  return req('/api/ai/vision-review',{method:'POST',body:{image:dataUri,mode:mode||'page',hint:hint||''}});
}

function heroImage(prompt,aspect){
  return req('/api/image/generate',{method:'POST',body:{
    mode:'generate',prompt:prompt,aspectRatio:aspect||'16:9',size:'1K',quality:'medium',
    format:'webp',count:1}}).then(function(d){
    var img=(d.images||[])[0]||null;
    if(!img)throw new Error('The image gateway returned nothing');
    ensure('credits',true);ensure('assets',true);
    return{url:img.url||('/api/assets/'+encodeURIComponent(img.assetId||img.id||'')+'/content'),
      assetId:img.assetId||img.id||'',provider:d.provider||'',model:d.model||''};
  });
}

window.__SCEN_API={API:API,ensure:ensure,ensureAll:ensureAll,reset:reset,req:req,msg:msg,
  saveProject:saveProject,saveVersion:saveVersion,listVersions:listVersions,publish:publish,
  addDomain:addDomain,invite:invite,revokeOtherSessions:revokeOtherSessions,heroImage:heroImage,
  visionReview:visionReview,
  siteSnapshot:siteSnapshot,settingsFor:settingsFor};
})();
</script>
<script>
(function(){
"use strict";
var C=window.__SCEN_CORE,G=window.__SCEN_GEN,X=window.__SCEN_AI,AI=X.AI;
var N=window.__SCEN_API,API=N.API;
var S=C.S,FLOW=C.FLOW,INDUSTRIES=C.INDUSTRIES,STYLES=C.STYLES,FEATURES=C.FEATURES,GOALS=C.GOALS;
/* The copy pack and the brief's own usable sentence live in the generator.
   imagePrompts() has been calling pack() from here since it was written, and
   this block does not have it — a ReferenceError on the first line of the
   image run, every time, inside a setTimeout where nobody saw it. The build
   went on with grey placeholders and never said why. */
var pack=G.pack,saneLine=G.saneLine;
var $=C.$,$$=C.$$,esc=C.esc,toast=C.toast,modal=C.modal,closeModal=C.closeModal;
/* Every state change already ends in save(); the preview follows it rather
   than waiting for a rebuild, which is how a preset takes on the answers as
   they are given. syncPreview() is a no-op once there is a build to show. */
function save(){C.save();syncPreview();maybeDraft()}
var slug=C.slug,wait=C.wait,bytes=C.bytes,findColor=C.findColor;
var gen=null;               // current generated file set

/* ============================================================
   Chat rendering
   ============================================================ */
var body=$('#chatBody'),stream=$('#streamBody'),input=$('#input'),sendBtn=$('#sendBtn');

/* The studio answered in English however it was spoken to, so a client writing
   Hinglish got "The site is already built — just tell me what you want
   changed." Every line the studio writes itself now goes through L(), and the
   gateway is told which language to answer in. Roman Hindi, not Devanagari:
   it is what the clients type. */
var HINGLISH=/\b(kr|kar|kro|karo|karna|krna|do|dena|de ?do|chahiye|nhi|nahi|nahin|hai|hain|ho|hoga|hona|rha|raha|rhi|rahi|mujhe|mera|meri|apna|apni|thoda|zyada|jyada|bhai|acha|achha|theek|thik|badal|badlo|dikha|dikhe|dekho|bna|bana|banao|lga|laga|lagao|hata|hatao|wala|wali|ye|yeh|is|iska|isko|uska|kaise|kyu|kyun|kitna|kitne|abhi|phir|fir|bhi|sab|matlab)\b/i;
function noteLang(text){
  var t=String(text||'');
  if(/[\u0900-\u097F]/.test(t)||HINGLISH.test(t)){if(S.lang!=='hi'){S.lang='hi';save()}}
  else if(!S.lang&&t.trim()){S.lang='en';save()}
}
function L(en,hi){return (S.lang==='hi'&&hi)?hi:en}

function scrollChat(){requestAnimationFrame(function(){body.scrollTop=body.scrollHeight})}
/* The chat scrolls smoothly, which is right for a message and wrong for a
   build: seventeen rows land in a few seconds, each one restarting an
   animation aimed at where the bottom used to be, and the view never catches
   up — the card was being written off screen while the client looked at an
   empty column. Rows jump. */
function jumpChat(){
  var was=body.style.scrollBehavior;
  body.style.scrollBehavior='auto';
  body.scrollTop=body.scrollHeight;
  body.style.scrollBehavior=was;
}

function nodeFor(m){
  var d=document.createElement('div');
  d.className='msg '+m.who;
  if(m.who==='user'){
    d.innerHTML=(m.atts&&m.atts.length?'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">':'')+
      '<div class="bubble">'+esc(m.text)+'</div>'+
      (m.atts&&m.atts.length?'<div class="att-row">'+m.atts.map(function(a){
        return '<img class="att" src="'+a.url+'" alt=""/>'}).join('')+'</div></div>':'');
  }else{
    /* No timing on replies. A chat does not report how long it thought. */
    d.innerHTML='<div class="who"><span class="avatar"></span><b>Scen Agent</b></div>'+
      '<div class="text">'+m.html+'</div>'+
      /* Two actions, both real. Nothing here is a button that only looks like
         one — a thumbs-up that goes nowhere is the fake functionality the
         build standard forbids. */
      '<div class="acts"><button data-act="copy" title="Copy">⧉</button>'+
      (S.built?'<button data-act="rebuild" title="Build it again">↻</button>':'')+'</div>';
    d.addEventListener('click',function(e){
      var t=e.target.closest('button[data-act]');if(!t)return;
      if(t.dataset.act==='copy'){
        var txt=d.querySelector('.text').innerText;
        try{navigator.clipboard.writeText(txt);toast(L('Copied','Copy ho gaya'))}
        catch(x){toast(L('Could not copy','Copy nahi hua'))}
        return;
      }
      if(t.dataset.act==='rebuild'){rebuild(L('Rebuilt it.','Dobara bana diya.'))}
    });
  }
  return d;
}
/* Last few turns as plain text. Tags out, entities back, length capped so a
   long build log cannot crowd out the actual request. */
/* Ten turns of a conversation that began with a two-thousand-word brief is a
   request big enough to time the gateway out — which is what "The gateway did
   not answer in time" was. Six turns, and each one clipped. */
function transcript(n){
  return (S.msgs||[]).slice(-(n||6)).map(function(m){
    var t=String(m.html||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ')
           .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
           .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
    if(!t)return '';
    return (m.who==='agent'?'Agent: ':'Client: ')+t.slice(0,220);
  }).filter(Boolean);
}
function pushMsg(m,animate){
  S.msgs.push(m);
  var n=nodeFor(m);
  if(!animate)n.style.animation='none';
  body.appendChild(n);scrollChat();save();
  return n;
}
function agentSay(html,worked){return pushMsg({who:'agent',html:html,worked:worked||null},true)}
function userSay(text,atts){noteLang(text);return pushMsg({who:'user',text:text,atts:atts||[]},true)}

/* Three dots on their own say "wait" and nothing else. A line that changes
   while it waits says what is being done, which is the difference between a
   pause and a stall — and it says it in the client's language. */
var THINK_EN=['Reading that…','Working it out…','Choosing the words…','Almost there…'],
    THINK_HI=['Padh raha hoon…','Soch raha hoon…','Words chun raha hoon…','Bas ho hi gaya…'],
    thinkTimer=0;
function thinking(label){
  clearThinking();
  var d=document.createElement('div');
  d.className='msg agent think';d.id='thinkNode';
  d.innerHTML='<div class="who"><span class="avatar thinking"></span><b>Scen Agent</b></div>'+
    '<div class="text"><span class="typing"><i></i><i></i><i></i></span>'+
    '<span class="thinkline" id="thinkLine"></span></div>';
  body.appendChild(d);scrollChat();
  var list=label?[label]:(S.lang==='hi'?THINK_HI:THINK_EN),i=0;
  var line=$('#thinkLine');
  if(line)line.textContent=list[0];
  clearInterval(thinkTimer);
  if(list.length>1)thinkTimer=setInterval(function(){
    var el=$('#thinkLine');
    if(!el)return clearInterval(thinkTimer);
    i=(i+1)%list.length;el.textContent=list[i];
  },2600);
  return d;
}
/* while the build runs, the same line carries the file being written */
function thinkingSay(text){var el=$('#thinkLine');if(el){clearInterval(thinkTimer);el.textContent=text}}
function clearThinking(){clearInterval(thinkTimer);var t=$('#thinkNode');if(t)t.remove()}

function clearAnswerBox(){var a=$('#answerBox');if(a)a.remove()}

/* What the client pointed at, kept in front of them until it is used or
   dropped — a selection you cannot see is a selection you forget you made. */
function showPick(){
  var host=$('#pickChip');
  if(!S.pick){if(host)host.remove();return}
  if(!host){
    host=document.createElement('div');
    host.id='pickChip';host.className='pickchip';
    var comp=$('#composer')||input.parentNode;
    comp.parentNode.insertBefore(host,comp);
  }
  host.innerHTML='<span>'+L('Editing','Badal rahe ho')+': “'+esc(S.pick.slice(0,60))+'”</span>'+
    '<button type="button" title="'+L('Clear','Hatao')+'">✕</button>';
