<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <title>Orbit — Secure system</title>
  <style>
    /* ── Type ─────────────────────────────────────────────────────────────
       "Orbit Sans" and "Orbit Display" are the two custom faces this poster
       was cut for. No copy of them exists in this repo, so the families are
       declared and the specified fallbacks carry the page: Arial for the UI
       type, Times New Roman for the wordmark. Dropping the two TTFs into an
       @font-face block here is the only change needed. */
    :root{
      --ink:#ffffff;
      --surface:#161616;
      --orb-reveal:cubic-bezier(.16,1,.3,1);
      --orb-soft:cubic-bezier(.25,.8,.28,1);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#161616}
    body{font-family:"Orbit Sans",Arial,Helvetica,sans-serif;color:#fff;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    .viewport{position:fixed;inset:0;background:#000}
    .stage{position:absolute;inset:0;contain:strict;isolation:isolate;background:var(--surface)}

    /* ── Brand mark (z4) ─────────────────────────────────────────────────── */
    .brand-mark{position:absolute;z-index:4;top:2.141745dvh;left:3.854167vw;
      width:clamp(34px,min(3.4375vw,5.2dvh),66px);height:auto;display:block}
    .brand-mark line{stroke:#fff;stroke-width:5px;stroke-linecap:square}

    /* ── Nav (z4) ────────────────────────────────────────────────────────── */
    .primary-nav{position:absolute;inset:0;z-index:4;margin:0;padding:0;list-style:none;
      pointer-events:none}
    .primary-nav li{position:absolute;top:3.426791dvh;
      font-size:clamp(13px,min(1.302083vw,2.05dvh),25px);line-height:1;transform-origin:left center}
    .primary-nav a{color:#fff;text-decoration:none;pointer-events:auto;display:inline-block}
    .nav-home{left:10.104167vw;transform:scaleX(1.165)}
    .nav-resources{left:17.526042vw;transform:scaleX(1.052)}
    .nav-benefits{left:27.578125vw;transform:scaleX(1.126)}
    .nav-contact{left:36.171875vw;transform:scaleX(1.168)}

    /* ── Secure system pill (z4) ─────────────────────────────────────────── */
    .pill{position:absolute;z-index:4;top:2.336449dvh;right:7.5vw;
      display:inline-flex;align-items:center;justify-content:center;
      height:clamp(34px,4.439252dvh,57px);padding:0 clamp(16px,1.5vw,28px);
      background:#fff;color:#161616;border-radius:999px;text-decoration:none;
      font-size:clamp(12px,min(1.041667vw,1.7dvh),20px);letter-spacing:.026923em;
      pointer-events:auto}

    /* ── Wordmark (z1) ───────────────────────────────────────────────────── */
    .orbit-word{position:absolute;z-index:1;top:11.565421dvh;left:4.348958vw;margin:0;
      font-family:"Orbit Display","Times New Roman",Times,serif;font-weight:400;
      font-size:min(27.8125vw,55dvh);line-height:.8;letter-spacing:.033708em;
      white-space:nowrap;-webkit-user-select:none;user-select:none}
    .orbit-word__mask{display:block}
    .orbit-word__inner{display:block}
    .orbit-word__white{color:#fff}
    .orbit-word__o{display:inline-block;transform:scaleX(1.0866);margin-right:.042135em}
    .orbit-word__pink{background:linear-gradient(180deg,#ffc5dc 0%,#fd86db 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent}

    /* ── Flower (z2) ─────────────────────────────────────────────────────── */
    .flower{position:absolute;z-index:2;top:14.749065dvh;left:49.121328vw;
      height:106.109034dvh;transform:translateX(-50%);pointer-events:none}
    .flower__sizer{visibility:hidden;height:100%;width:auto;display:block}
    .flower__layer{position:absolute;inset:0}
    .flower__layer img{width:100%;height:100%;object-fit:cover;display:block}
    /* The reveal layer starts fully masked out; the trail paints it back in. */
    .flower__layer--top{-webkit-mask-image:linear-gradient(#0000,#0000);
      mask-image:linear-gradient(#0000,#0000)}

    /* ── Corner copy (z3) ────────────────────────────────────────────────── */
    .support-copy{position:absolute;z-index:3;bottom:4.361371dvh;color:#f7f7f7;
      font-size:clamp(14px,min(1.40625vw,2.102804dvh),27px);line-height:1.25;
      transform-origin:left bottom}
    .support-copy--left{left:3.177083vw;transform:scaleX(1.073)}
    .support-copy--right{left:78.28125vw;transform:scaleX(1.058)}
    .support-copy__inner{display:block}

    /* ── Mobile chrome ───────────────────────────────────────────────────── */
    .burger,.sheet,.scrim{display:none}
    .burger{position:absolute;z-index:12;top:1.6dvh;right:4vw;width:44px;height:44px;
      border:0;border-radius:999px;background:#fff;color:#161616;cursor:pointer;
      align-items:center;justify-content:center;pointer-events:auto}
    .burger span{position:absolute;left:12px;width:20px;height:1.5px;background:#161616;
      transition:transform .4s var(--orb-soft),opacity .25s ease}
    .burger span:nth-child(1){top:16px}
    .burger span:nth-child(2){top:21px}
    .burger span:nth-child(3){top:26px}
    .burger[aria-expanded="true"] span:nth-child(1){top:21px;transform:rotate(45deg)}
    .burger[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(0)}
    .burger[aria-expanded="true"] span:nth-child(3){top:21px;transform:rotate(-45deg)}

    .scrim{position:absolute;inset:0;z-index:9;border:0;padding:0;
      background:rgba(10,10,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      opacity:0;pointer-events:none;transition:opacity .4s ease}
    .sheet{position:absolute;z-index:10;inset:auto 4vw 4vw;flex-direction:column;gap:1.1rem;
      padding:1.6rem;border-radius:26px;background:rgba(22,22,22,.86);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.14);
      transform:translateY(12px);opacity:0;pointer-events:none;
      transition:opacity .4s ease,transform .5s var(--orb-reveal)}
    .sheet a{color:#fff;text-decoration:none;font-size:1.15rem}
    .sheet .pill{position:static;align-self:flex-start;margin-top:.3rem}
    body.menu-open .scrim{opacity:1;pointer-events:auto}
    body.menu-open .sheet{opacity:1;transform:translateY(0);pointer-events:auto}

    @media (max-width:900px),(max-aspect-ratio:4/5){
      .primary-nav{display:none}
      .stage>.pill{display:none}
      .burger{display:inline-flex}
      .scrim{display:block}
      .sheet{display:flex}
    }

    /* ── Entrance ────────────────────────────────────────────────────────── */
    @keyframes orb-word{from{transform:translateY(118%)}to{transform:translateY(0)}}
    @keyframes orb-subject{
      from{opacity:0;transform:translateX(-50%) translateY(3.4dvh)}
      to{opacity:1;transform:translateX(-50%) translateY(0)}
    }
    @keyframes orb-corner{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes orb-quiet{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes orb-dim{from{opacity:0}to{opacity:1}}
    @keyframes orb-fade{from{opacity:0}to{opacity:1}}

    /* While animating, the mask clips so the serif can rise from below without
       the descender box changing the layout. */
    .anim .orbit-word__mask{overflow:hidden;padding:.12em 0 .16em;margin:-.12em 0 -.16em}
    .anim .orbit-word__inner{animation:orb-word 1150ms var(--orb-reveal) 300ms both}
    .anim .flower{animation:orb-subject 1150ms var(--orb-reveal) 660ms both}
    .anim .brand-mark{animation:orb-quiet 620ms var(--orb-soft) 100ms both}
    .anim .stage>.pill{animation:orb-quiet 620ms var(--orb-soft) 340ms both}
    .anim .primary-nav a{animation:orb-dim 550ms var(--orb-soft) both}
    .anim .nav-home a{animation-delay:180ms}
    .anim .nav-resources a{animation-delay:225ms}
    .anim .nav-benefits a{animation-delay:270ms}
    .anim .nav-contact a{animation-delay:315ms}
    /* Both corners land together. */
    .anim .support-copy__inner{animation:orb-corner 720ms var(--orb-soft) 980ms both}
    .anim .burger{animation:orb-quiet 620ms var(--orb-soft) 300ms both}

    @media (max-width:900px),(max-aspect-ratio:4/5){
      .anim .orbit-word__inner{animation-delay:260ms}
      .anim .flower{animation-delay:560ms}
      .anim .support-copy__inner{animation-delay:860ms}
    }

    /* ── Responsive geometry ─────────────────────────────────────────────── */
    @media (max-width:1200px),(orientation:portrait){
      .orbit-word{left:0;width:100%;text-align:center}
    }
    @media (max-aspect-ratio:4/5){
      .flower{height:min(55dvh,110vw);left:50vw;top:auto;bottom:16dvh}
      .orbit-word{font-size:min(27.5vw,18dvh);top:9dvh}
      .support-copy{font-size:clamp(13px,3.4vw,18px)}
      .support-copy--left{left:5vw;right:auto;max-width:44vw;transform:none}
      .support-copy--right{left:auto;right:5vw;max-width:44vw;transform:none;text-align:right}
    }

    @media (prefers-reduced-motion:reduce){
      .anim .orbit-word__inner,.anim .flower,.anim .brand-mark,.anim .stage>.pill,
      .anim .primary-nav a,.anim .support-copy__inner,.anim .burger{animation:none}
      .anim .orbit-word__mask{overflow:visible;padding:0;margin:0}
      .anim .stage{animation:orb-fade 280ms var(--orb-soft) both}
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage" id="stage">

      <svg class="brand-mark" viewBox="0 0 66 62" fill="none" aria-hidden="true">
        <line x1="33" y1="1" x2="33" y2="61" />
        <line x1="3" y1="31" x2="63" y2="31" />
        <line x1="11.8" y1="9.8" x2="54.2" y2="52.2" />
        <line x1="54.2" y1="9.8" x2="11.8" y2="52.2" />
      </svg>

      <ul class="primary-nav">
        <li class="nav-home"><a href="#home">Home</a></li>
        <li class="nav-resources"><a href="#resources">Resources</a></li>
        <li class="nav-benefits"><a href="#benefits">Benefits</a></li>
        <li class="nav-contact"><a href="#contact">Contact</a></li>
      </ul>

      <a class="pill" href="#contact">Secure system</a>

      <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span>
            <span class="orbit-word__pink">BIT</span>
          </span>
        </span>
      </h1>

      <div class="flower" id="flower">
        <img class="flower__sizer"
          src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85"
          alt="" aria-hidden="true">
        <div class="flower__layer flower__layer--bg" id="flower-bg">
          <img
            src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85"
            alt="Pixel-art pink and violet lily">
        </div>
        <div class="flower__layer flower__layer--top" id="flower-top" aria-hidden="true">
          <img
            src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85"
            alt="">
        </div>
      </div>

      <p class="support-copy support-copy--left">
        <span class="support-copy__inner">Every workflow,<br>intelligently connected.</span>
      </p>
      <p class="support-copy support-copy--right">
        <span class="support-copy__inner">Less manual work.<br>More meaningful output.</span>
      </p>

      <button class="scrim" id="scrim" type="button" aria-label="Close menu"></button>
      <div class="sheet" id="sheet">
        <a href="#home">Home</a>
        <a href="#resources">Resources</a>
        <a href="#benefits">Benefits</a>
        <a href="#contact">Contact</a>
        <a class="pill" href="#contact">Secure system</a>
      </div>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sheet">
        <span></span><span></span><span></span>
      </button>

    </section>
  </main>

<script>
(function(){
  'use strict';

  /* ── Entrance: drop .anim once the last orb-* animation has played, so it
     never replays on a resize or a class change. ───────────────────────── */
  (function(){
    var root=document.documentElement;
    if(!root.classList.contains('anim'))return;
    var done=false;
    function finish(){if(done)return;done=true;root.classList.remove('anim')}
    var last=document.querySelector('.support-copy__inner');
    if(last)last.addEventListener('animationend',finish);
    setTimeout(finish,6000);            /* safety */
  })();

  /* ── Mobile sheet ─────────────────────────────────────────────────────── */
  (function(){
    var burger=document.getElementById('burger');
    var scrim=document.getElementById('scrim');
    var sheet=document.getElementById('sheet');
    function set(open){
      document.body.classList.toggle('menu-open',open);
      burger.setAttribute('aria-expanded',open?'true':'false');
    }
    burger.addEventListener('click',function(){
      set(!document.body.classList.contains('menu-open'));
    });
    scrim.addEventListener('click',function(){set(false)});
    sheet.addEventListener('click',function(e){if(e.target.closest('a'))set(false)});
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&document.body.classList.contains('menu-open'))set(false);
    });
  })();

  /* ── Morph-reveal trail ───────────────────────────────────────────────────
     One shared trail of decaying points. Each layer renders the same trail
     into its own offscreen canvas and uses it as a mask: the front lily gets
     holes punched in it, the reveal lily is painted only inside them. ───── */
  var TRAIL_MAX_POINTS  = 60;
  var TRAIL_HEAD_R      = 140;
  var TRAIL_NOISE_AMP   = 44;
  var TRAIL_BLOB_PTS    = 24;
  var TRAIL_FADE_SPEED  = 0.92;
  var TRAIL_SAMPLE_DIST = 8;

  var stage=document.getElementById('stage');
  var flower=document.getElementById('flower');
  var bgLayer=document.getElementById('flower-bg');
  var topLayer=document.getElementById('flower-top');
  if(!stage||!flower||!bgLayer||!topLayer)return;

  function drawMorphBlob(ctx,cx,cy,r,t,seed){
    if(r<2)return;
    var pts=[],i,angle,n1,n2,n3,noise,rad;
    for(i=0;i<TRAIL_BLOB_PTS;i++){
      angle=(i/TRAIL_BLOB_PTS)*Math.PI*2;
      n1=Math.sin(angle*3+t*1.4+seed)*0.45;
      n2=Math.sin(angle*5-t*0.9+seed*2.3)*0.3;
      n3=Math.cos(angle*2+t*1.8+seed*0.7)*0.25;
      noise=(n1+n2+n3)*TRAIL_NOISE_AMP*(r/TRAIL_HEAD_R);
      rad=r+noise;
      pts.push([cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad]);
    }
    /* Closed path through the midpoints, so the outline curves instead of
       showing 24 straight facets. */
    ctx.beginPath();
    var mx=(pts[TRAIL_BLOB_PTS-1][0]+pts[0][0])/2;
    var my=(pts[TRAIL_BLOB_PTS-1][1]+pts[0][1])/2;
    ctx.moveTo(mx,my);
    for(i=0;i<TRAIL_BLOB_PTS;i++){
      var cur=pts[i],next=pts[(i+1)%TRAIL_BLOB_PTS];
      ctx.quadraticCurveTo(cur[0],cur[1],(cur[0]+next[0])/2,(cur[1]+next[1])/2);
    }
    ctx.closePath();
    ctx.fillStyle='#fff';
    ctx.fill();
  }

  function MorphTrailLayer(el,invert){
    this.el=el;
    this.invert=invert;
    this.canvas=document.createElement('canvas');
    this.canvas.style.display='none';
    document.body.appendChild(this.canvas);
    this.ctx=this.canvas.getContext('2d');
    this.wasActive=false;
  }
  MorphTrailLayer.prototype.size=function(w,h){
    if(this.canvas.width!==w||this.canvas.height!==h){
      this.canvas.width=w;this.canvas.height=h;
    }
  };
  MorphTrailLayer.prototype.render=function(points,head,time){
    var c=this.canvas,ctx=this.ctx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,c.width,c.height);
    if(this.invert){
      /* only the trail shows */
      ctx.globalCompositeOperation='source-over';
    }else{
      /* opaque, with the trail cut out of it */
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.globalCompositeOperation='destination-out';
    }
    for(var i=0;i<points.length;i++){
      var p=points[i];
      ctx.globalAlpha=p.alpha;
      drawMorphBlob(ctx,p.x,p.y,p.r,time,p.seed);
    }
    if(head){
      ctx.globalAlpha=1;
      drawMorphBlob(ctx,head.x,head.y,head.r,time,head.seed);
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    var url=c.toDataURL();
    this.el.style.webkitMaskImage='url('+url+')';
    this.el.style.maskImage='url('+url+')';
    this.el.style.webkitMaskSize='100% 100%';
    this.el.style.maskSize='100% 100%';
    this.el.style.webkitMaskRepeat='no-repeat';
    this.el.style.maskRepeat='no-repeat';
  };
  MorphTrailLayer.prototype.rest=function(){
    /* Nothing hovering: the front lily is whole, the reveal lily is gone. */
    var fill=this.invert?'linear-gradient(#0000,#0000)':'linear-gradient(#fff,#fff)';
    this.el.style.webkitMaskImage=fill;
    this.el.style.maskImage=fill;
  };

  var layers=[new MorphTrailLayer(bgLayer,false),new MorphTrailLayer(topLayer,true)];
  var points=[],headRadius=0,time=0,hovering=false;
  var mouse={x:0,y:0},lastSample=null,headSeed=Math.random()*100;

  function toCanvas(e){
    var rect=flower.getBoundingClientRect();
    if(!rect.width||!rect.height)return null;
    var sx=layers[0].canvas.width/rect.width;
    var sy=layers[0].canvas.height/rect.height;
    return {x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sy};
  }

  stage.addEventListener('mousemove',function(e){
    var p=toCanvas(e);
    if(!p)return;
    mouse=p;hovering=true;
  });
  stage.addEventListener('mouseenter',function(e){
    var p=toCanvas(e);
    if(p)mouse=p;
    hovering=true;
  });
  stage.addEventListener('mouseleave',function(){hovering=false});

  function frame(){
    var rect=flower.getBoundingClientRect();
    if(rect.width&&rect.height){
      layers[0].size(Math.round(rect.width),Math.round(rect.height));
      layers[1].size(Math.round(rect.width),Math.round(rect.height));
    }

    var targetR=hovering?TRAIL_HEAD_R:0;
    headRadius+=(targetR-headRadius)*(hovering?0.14:0.04);

    if(hovering&&headRadius>5){
      if(!lastSample||Math.hypot(mouse.x-lastSample.x,mouse.y-lastSample.y)>TRAIL_SAMPLE_DIST){
        points.push({x:mouse.x,y:mouse.y,r:headRadius,alpha:1,seed:Math.random()*100});
        if(points.length>TRAIL_MAX_POINTS)points.shift();
        lastSample={x:mouse.x,y:mouse.y};
      }
    }

    for(var i=points.length-1;i>=0;i--){
      var p=points[i];
      p.alpha*=TRAIL_FADE_SPEED;
      p.r*=0.995;
      if(p.alpha<0.01)points.splice(i,1);
    }

    time+=0.016;

    var active=points.length>0||headRadius>5;
    var head=(hovering&&headRadius>2)?{x:mouse.x,y:mouse.y,r:headRadius,seed:headSeed}:null;

    for(var j=0;j<layers.length;j++){
      if(active)layers[j].render(points,head,time);
      else if(layers[j].wasActive!==false||!layers[j].__rested){
        layers[j].rest();layers[j].__rested=true;
      }
      if(active)layers[j].__rested=false;
    }

    requestAnimationFrame(frame);
  }
  layers.forEach(function(l){l.rest();l.__rested=true});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
