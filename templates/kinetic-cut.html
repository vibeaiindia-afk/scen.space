<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cinematic Scroll Film — Kinetic Cut</title>
  <link rel="preconnect" href="https://pub-429d8fb4f8ff4b7d9c2624c0d7e4b4b5.r2.dev" crossorigin>
  <style>
    :root{
      color-scheme:dark;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#000;color:#fff;
      --scene:0;--drift:0px;--zoom:1.02;--glow:.10;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;overscroll-behavior:none}
    body{overflow-x:hidden}

    .stage{position:fixed;inset:0;z-index:0;width:100vw;height:100vh;overflow:hidden;background:#000}
    .stage video{
      width:100%;height:100%;display:block;object-fit:cover;object-position:center;
      transform:translate3d(var(--drift),0,0) scale(var(--zoom));
      transform-origin:center;backface-visibility:hidden;will-change:transform;
    }
    .stage::before{
      content:"";position:absolute;inset:-10%;z-index:1;pointer-events:none;
      background:radial-gradient(circle at 50% 50%,rgba(255,255,255,var(--glow)),transparent 18%,transparent 58%,rgba(0,0,0,.52) 100%);
      mix-blend-mode:soft-light;opacity:.85;
    }
    .stage::after{
      content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 28%,transparent 66%,rgba(0,0,0,.32));
    }

    main{position:relative;z-index:3}
    section{position:relative;min-height:124vh;display:flex;align-items:center;padding:8vw 7vw;overflow:hidden}
    .copy{max-width:min(1000px,88vw);text-shadow:0 4px 34px rgba(0,0,0,.42)}
    .eyebrow{margin:0 0 14px;font-size:clamp(11px,1vw,14px);font-weight:650;letter-spacing:.23em;text-transform:uppercase;opacity:.72}
    h1,h2{margin:0;font-size:clamp(54px,9vw,148px);line-height:.84;letter-spacing:-.07em;font-weight:650;text-wrap:balance}
    p{margin:18px 0 0;font-size:clamp(13px,1.25vw,19px);font-weight:520;letter-spacing:.1em;text-transform:uppercase;opacity:.8}

    /* SCENE 1 — horizontal mask + tracking collapse */
    .scene-one .line{display:block;overflow:hidden;padding:.08em 0}
    .scene-one .line span{display:block;transform:translateY(115%);filter:blur(10px);letter-spacing:.08em;opacity:.15}
    .scene-one.active .line span{animation:riseReveal .95s cubic-bezier(.16,.84,.24,1) forwards}
    .scene-one.active .line:nth-child(2) span{animation-delay:.08s}
    .scene-one .eyebrow,.scene-one p{opacity:0;transform:translateY(14px)}
    .scene-one.active .eyebrow,.scene-one.active p{animation:softIn .7s .22s ease forwards}

    /* SCENE 2 — two lines cross from opposite sides */
    .scene-two{justify-content:flex-end;text-align:right}
    .scene-two .split{display:block;clip-path:inset(0 0 0 0)}
    .scene-two .a{transform:translateX(-24vw);opacity:0;filter:blur(12px)}
    .scene-two .b{transform:translateX(24vw);opacity:0;filter:blur(12px)}
    .scene-two.active .a{animation:slideFromLeft .9s cubic-bezier(.16,.84,.24,1) forwards}
    .scene-two.active .b{animation:slideFromRight .9s .06s cubic-bezier(.16,.84,.24,1) forwards}
    .scene-two p{opacity:0;transform:translateX(30px)}
    .scene-two.active p{animation:softInX .65s .18s ease forwards}

    /* SCENE 3 — words burst into place */
    .scene-three{justify-content:center;text-align:center}
    .scene-three h2{display:flex;flex-wrap:wrap;justify-content:center;gap:.05em .18em}
    .scene-three .word{display:inline-block;opacity:0;filter:blur(18px);transform:scale(.62) rotate(-4deg) translateY(24px)}
    .scene-three.active .word{animation:wordBurst .85s cubic-bezier(.12,.8,.22,1) forwards}
    .scene-three.active .word:nth-child(2){animation-delay:.08s}
    .scene-three.active .word:nth-child(3){animation-delay:.16s}
    .scene-three p{opacity:0;transform:translateY(18px)}
    .scene-three.active p{animation:softIn .65s .24s ease forwards}

    /* SCENE 4 — vertical crop / lift */
    .scene-four{justify-content:flex-end;text-align:right}
    .scene-four .wipe{display:inline-block;clip-path:inset(100% 0 0 0);transform:translateY(34px);filter:blur(6px)}
    .scene-four.active .wipe{animation:verticalWipe .9s cubic-bezier(.16,.84,.24,1) forwards}
    .scene-four .outline{-webkit-text-stroke:1px rgba(255,255,255,.75);color:transparent}
    .scene-four p{opacity:0;transform:translateY(18px)}
    .scene-four.active p{animation:softIn .65s .22s ease forwards}

    /* SCENE 5 — giant final word compresses into frame */
    .scene-five{min-height:142vh;align-items:flex-end;padding-bottom:10vh}
    .scene-five .copy{max-width:96vw}
    .scene-five h2{font-size:clamp(58px,11vw,176px);transform-origin:left bottom;transform:scaleX(1.28) translateY(52px);opacity:0;filter:blur(14px)}
    .scene-five.active h2{animation:finalLock 1.05s cubic-bezier(.16,.84,.24,1) forwards}
    .scene-five .ghost{display:block;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.38);opacity:.9}
    .scene-five p{opacity:0;transform:translateY(20px)}
    .scene-five.active p{animation:softIn .7s .26s ease forwards}

    @keyframes riseReveal{to{transform:translateY(0);filter:blur(0);letter-spacing:-.07em;opacity:1}}
    @keyframes slideFromLeft{to{transform:translateX(0);opacity:1;filter:blur(0)}}
    @keyframes slideFromRight{to{transform:translateX(0);opacity:1;filter:blur(0)}}
    @keyframes wordBurst{to{opacity:1;filter:blur(0);transform:scale(1) rotate(0) translateY(0)}}
    @keyframes verticalWipe{to{clip-path:inset(0 0 0 0);transform:translateY(0);filter:blur(0)}}
    @keyframes finalLock{to{transform:scaleX(1) translateY(0);opacity:1;filter:blur(0)}}
    @keyframes softIn{to{opacity:.82;transform:translateY(0)}}
    @keyframes softInX{to{opacity:.82;transform:translateX(0)}}

    @media(max-width:760px){
      section,.scene-two,.scene-three,.scene-four{justify-content:flex-start;text-align:left;padding:8vw 7vw;min-height:122vh}
      .scene-five{min-height:138vh;align-items:flex-end;padding-bottom:9vh}
      .copy{max-width:92vw}
      h1,h2{font-size:clamp(54px,15vw,92px)}
      .scene-three h2{justify-content:flex-start}
      .scene-five h2{font-size:clamp(58px,17vw,104px)}
      p{font-size:12px;letter-spacing:.1em}
      .eyebrow{font-size:10px}
    }

    @media(prefers-reduced-motion:reduce){
      .stage video{transform:none!important}
      .scene-one .line span,.scene-one .eyebrow,.scene-one p,
      .scene-two .a,.scene-two .b,.scene-two p,
      .scene-three .word,.scene-three p,
      .scene-four .wipe,.scene-four p,
      .scene-five h2,.scene-five p{
        animation:none!important;opacity:1!important;filter:none!important;transform:none!important;clip-path:none!important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <video id="film" muted playsinline preload="auto">
      <source src="https://pub-429d8fb4f8ff4b7d9c2624c0d7e4b4b5.r2.dev/workspaces/ws_197efd1b-8385-48a7-a09f-2c155a7c6e62/2026/08/hf_20260409_094505_e898193e-ec14-4ecc-92ed-be976174fc88_min.mp4" type="video/mp4" />
    </video>
  </div>

  <main>
    <section class="scene-one active">
      <div class="copy">
        <div class="eyebrow">A NEW POINT OF VIEW</div>
        <h1><span class="line"><span>ENTER</span></span><span class="line"><span>THE FRAME.</span></span></h1>
        <p>Nothing ordinary.</p>
      </div>
    </section>

    <section class="scene-two">
      <div class="copy">
        <h2><span class="split a">MOVE</span><span class="split b">DIFFERENT.</span></h2>
        <p>Follow no pattern.</p>
      </div>
    </section>

    <section class="scene-three">
      <div class="copy">
        <h2><span class="word">FEEL</span><span class="word">THE</span><span class="word">SHIFT.</span></h2>
        <p>Motion becomes emotion.</p>
      </div>
    </section>

    <section class="scene-four">
      <div class="copy">
        <h2><span class="wipe">BREAK</span><br><span class="wipe outline">THE STATIC.</span></h2>
        <p>Keep the world moving.</p>
      </div>
    </section>

    <section class="scene-five">
      <div class="copy">
        <h2>BE<br><span class="ghost">UNFORGETTABLE.</span></h2>
        <p>Leave the frame changed.</p>
      </div>
    </section>
  </main>

  <script>
  (()=>{
    const video=document.getElementById('film');
    const sections=[...document.querySelectorAll('section')];
    const root=document.documentElement;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');

    let duration=0,ready=false,target=0,current=0,last=performance.now();
    let seeking=false,pendingTime=0,lastCommitted=-1;

    const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
    const progress=()=>{
      const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
      return clamp(scrollY/max,0,1);
    };

    const updateTarget=()=>{
      const p=progress();
      target=(ready&&!reduced.matches)?p*duration:0;
      if(!reduced.matches){
        const drift=(p-.5)*18;
        const zoom=1.025+Math.sin(p*Math.PI*3)*.012;
        const glow=.05+Math.max(0,Math.sin(p*Math.PI*5))*.08;
        root.style.setProperty('--drift',drift.toFixed(2)+'px');
        root.style.setProperty('--zoom',zoom.toFixed(4));
        root.style.setProperty('--glow',glow.toFixed(3));
      }
    };

    const commitSeek=()=>{
      if(!ready||reduced.matches||seeking)return;
      const next=clamp(pendingTime,0,duration);
      const threshold=Math.max(1/90,duration/15000);
      if(Math.abs(next-lastCommitted)<threshold)return;
      seeking=true;lastCommitted=next;
      try{video.currentTime=next}catch(e){seeking=false}
    };

    const frame=now=>{
      const dt=Math.min(.05,Math.max(0,(now-last)/1000));
      last=now;
      video.pause();
      if(ready){
        if(reduced.matches){
          current=target=pendingTime=0;
          if(!seeking&&video.currentTime>.001){seeking=true;try{video.currentTime=0}catch(e){seeking=false}}
        }else{
          current+=(target-current)*(1-Math.exp(-dt*8));
          pendingTime=current;
          commitSeek();
        }
      }
      requestAnimationFrame(frame);
    };

    const activate=()=>{
      const c=innerHeight*.52;
      let best=sections[0],dist=Infinity;
      for(const s of sections){
        const r=s.getBoundingClientRect();
        const d=Math.abs((r.top+r.height/2)-c);
        if(d<dist){dist=d;best=s}
      }
      sections.forEach(s=>s.classList.toggle('active',s===best));
    };

    video.addEventListener('loadedmetadata',()=>{
      duration=Number.isFinite(video.duration)?video.duration:0;
      ready=duration>0;video.pause();
      current=target=pendingTime=0;lastCommitted=-1;
      updateTarget();commitSeek();
    },{once:true});
    video.addEventListener('seeked',()=>{seeking=false;commitSeek()});
    video.addEventListener('seeking',()=>{seeking=true});
    video.addEventListener('playing',()=>video.pause());
    video.addEventListener('canplay',()=>video.pause());

    addEventListener('scroll',()=>{updateTarget();activate()},{passive:true});
    addEventListener('resize',()=>{updateTarget();activate()},{passive:true});
    reduced.addEventListener?.('change',()=>{updateTarget();if(reduced.matches){current=target=pendingTime=0}});

    video.pause();video.load();updateTarget();activate();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
