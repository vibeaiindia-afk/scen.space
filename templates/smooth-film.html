<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smooth Scroll Film</title>
  <link rel="preconnect" href="https://pub-429d8fb4f8ff4b7d9c2624c0d7e4b4b5.r2.dev" crossorigin>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { overflow-x: hidden; }

    .film {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    .film video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
    }
    .film::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.10) 48%, rgba(0,0,0,.18) 100%);
    }

    main {
      position: relative;
      z-index: 1;
    }
    section {
      min-height: 125vh;
      display: flex;
      align-items: center;
      padding: 8vw;
    }
    .copy {
      max-width: 720px;
      opacity: .18;
      transform: translateY(26px);
      filter: blur(7px);
      transition: opacity .45s ease, transform .45s ease, filter .45s ease;
      text-shadow: 0 2px 24px rgba(0,0,0,.38);
    }
    section.is-active .copy {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    .eyebrow {
      margin: 0 0 14px;
      font-size: clamp(12px, 1.1vw, 16px);
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .76;
    }
    h1, h2 {
      margin: 0;
      font-size: clamp(42px, 7vw, 108px);
      line-height: .92;
      letter-spacing: -.055em;
      font-weight: 650;
      text-wrap: balance;
    }
    p {
      margin: 18px 0 0;
      font-size: clamp(17px, 1.7vw, 27px);
      line-height: 1.25;
      font-weight: 450;
      opacity: .88;
    }
    section:nth-child(even) {
      justify-content: flex-end;
      text-align: right;
    }
    section:last-child {
      min-height: 135vh;
      align-items: flex-end;
      padding-bottom: 11vh;
    }

    @media (max-width: 760px) {
      section { padding: 8vw 7vw; min-height: 120vh; }
      section:nth-child(even) { justify-content: flex-start; text-align: left; }
      .copy { max-width: 92vw; }
      h1, h2 { font-size: clamp(46px, 14vw, 78px); }
      p { max-width: 30ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      .copy {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="film" aria-hidden="true">
    <video id="film" muted playsinline preload="auto">
      <source src="https://pub-429d8fb4f8ff4b7d9c2624c0d7e4b4b5.r2.dev/workspaces/ws_197efd1b-8385-48a7-a09f-2c155a7c6e62/2026/08/215933c9-a0d5-458b-a2bc-d46a1cc8f558.mp4" type="video/mp4" />
    </video>
  </div>

  <main>
    <section class="is-active">
      <div class="copy">
        <div class="eyebrow">01</div>
        <h1>IDEAS<br>BECOME REAL.</h1>
        <p>Built differently.</p>
      </div>
    </section>

    <section>
      <div class="copy">
        <div class="eyebrow">02</div>
        <h2>DESIGN<br>IN MOTION.</h2>
        <p>Every detail matters.</p>
      </div>
    </section>

    <section>
      <div class="copy">
        <div class="eyebrow">03</div>
        <h2>BUILT<br>TO FEEL.</h2>
        <p>Not just function.</p>
      </div>
    </section>

    <section>
      <div class="copy">
        <div class="eyebrow">04</div>
        <h2>THE NEXT<br>FRAME.</h2>
        <p>Starts here.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const video = document.getElementById('film');
      const sections = [...document.querySelectorAll('section')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let current = 0;
      let target = 0;
      let duration = 0;
      let ready = false;
      let seeking = false;
      let lastTime = performance.now();
      let lastCommitted = -1;

      // Keep the element permanently paused. We never call play().
      const freezeFirstFrame = () => {
        video.pause();
        current = 0;
        target = 0;
        if (ready && !video.seeking) {
          try { video.currentTime = 0; } catch (_) {}
        }
      };

      const getProgress = () => {
        const root = document.documentElement;
        const maxScroll = Math.max(1, root.scrollHeight - window.innerHeight);
        return Math.min(1, Math.max(0, window.scrollY / maxScroll));
      };

      const updateTarget = () => {
        if (!ready || reducedMotion.matches) {
          target = 0;
          return;
        }
        target = getProgress() * duration;
      };

      // Important: never pile multiple seeks on top of each other.
      // We calculate the playhead at RAF speed, but only ask the media
      // element for another frame after the previous seek has completed.
      const commitFrame = () => {
        if (!ready || seeking || reducedMotion.matches) return;

        const frameThreshold = Math.max(1 / 120, duration / 20000);
        if (Math.abs(current - lastCommitted) < frameThreshold) return;

        seeking = true;
        lastCommitted = current;
        try {
          video.currentTime = Math.min(duration, Math.max(0, current));
        } catch (_) {
          seeking = false;
        }
      };

      const tick = (now) => {
        const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;

        if (ready) {
          video.pause();

          if (reducedMotion.matches) {
            current = 0;
            target = 0;
            if (!seeking && Math.abs(video.currentTime) > 0.001) {
              seeking = true;
              lastCommitted = 0;
              try { video.currentTime = 0; } catch (_) { seeking = false; }
            }
          } else {
            // Exact smoothing requested by the brief.
            current += (target - current) * (1 - Math.exp(-dt * 8));
            commitFrame();
          }
        }

        requestAnimationFrame(tick);
      };

      const onSeekFinished = () => {
        seeking = false;
        // If the target moved while the browser was seeking, immediately
        // request the newest smoothed frame instead of replaying stale seeks.
        commitFrame();
      };

      const activateClosestSection = () => {
        const center = window.innerHeight * 0.5;
        let best = sections[0];
        let bestDistance = Infinity;

        for (const section of sections) {
          const rect = section.getBoundingClientRect();
          const midpoint = rect.top + rect.height / 2;
          const distance = Math.abs(midpoint - center);
          if (distance < bestDistance) {
            bestDistance = distance;
            best = section;
          }
        }

        sections.forEach(section => section.classList.toggle('is-active', section === best));
      };

      video.addEventListener('loadedmetadata', () => {
        duration = Number.isFinite(video.duration) ? video.duration : 0;
        ready = duration > 0;
        current = 0;
        target = 0;
        lastCommitted = -1;
        video.pause();
        updateTarget();
        commitFrame();
      }, { once: true });

      video.addEventListener('seeking', () => { seeking = true; });
      video.addEventListener('seeked', onSeekFinished);
      video.addEventListener('canplay', () => video.pause());
      video.addEventListener('playing', () => video.pause());

      const onViewportChange = () => {
        updateTarget();
        activateClosestSection();
      };

      window.addEventListener('scroll', onViewportChange, { passive: true });
      window.addEventListener('resize', onViewportChange, { passive: true });

      reducedMotion.addEventListener?.('change', () => {
        if (reducedMotion.matches) freezeFirstFrame();
        updateTarget();
      });

      video.pause();
      video.load();
      updateTarget();
      activateClosestSection();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
