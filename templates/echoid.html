<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ECHOID — Your voice ID to the E network</title>

  <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000000;
      --text:#ffffff;
      --text-dim:rgba(255,255,255,.62);
      --text-dimmer:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.14);
      --line-strong:rgba(255,255,255,.26);
      --fill-ghost:rgba(255,255,255,.05);
      --fill-solid:rgba(255,255,255,.10);
      --gutter:clamp(20px,5vw,100px);
      --ease-premium:cubic-bezier(.16,1,.3,1);
      --font-display:"Sora","Helvetica Neue",Helvetica,Arial,sans-serif;
      --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:var(--bg);color:var(--text)}
    body{font-family:var(--font-display);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    /* ── Shell ───────────────────────────────────────────────────────────────
       Three rows: nav, the right-hand panel, the legal line. */
    .hero{position:relative;width:100%;height:100vh;height:100svh;min-height:640px;
      overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;isolation:isolate}

    .hero__media{position:absolute;inset:0;z-index:-1;background:#000}
    .hero__media video{width:100%;height:100%;object-fit:cover;object-position:center;display:block}

    /* Scrim — darkens the right edge so the form holds, and both ends so the
       nav and the legal line stay legible. */
    .hero__scrim{position:absolute;inset:0;pointer-events:none;
      background:
        linear-gradient(to right,transparent 0%,transparent 45%,rgba(0,0,0,.45) 72%,rgba(0,0,0,.72) 100%),
        linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.65) 100%)}
    @media(max-width:720px){
      .hero__scrim{background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.75) 100%)}
    }

    /* ── Nav ─────────────────────────────────────────────────────────────── */
    .nav{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:32px;
      padding:clamp(20px,2.4vw,34px) var(--gutter);
      padding-left:max(var(--gutter),env(safe-area-inset-left));
      padding-right:max(var(--gutter),env(safe-area-inset-right));
      padding-top:max(clamp(20px,2.4vw,34px),env(safe-area-inset-top))}
    .logo{font-family:var(--font-display);font-weight:200;font-size:clamp(20px,1.75vw,30px);
      letter-spacing:.16em;color:var(--text);text-decoration:none;line-height:1}

    .nav__right{display:flex;align-items:center;gap:clamp(24px,3.2vw,62px)}
    .nav__links{display:flex;align-items:center;gap:clamp(20px,2.8vw,56px)}
    .nav__links a{font-family:var(--font-mono);font-weight:400;font-size:clamp(11px,.78vw,14px);
      letter-spacing:.18em;text-transform:uppercase;color:var(--text);text-decoration:none;
      transition:color .25s ease}
    .nav__links a:hover{color:var(--text-dim)}

    .cta{font-family:var(--font-mono);font-weight:400;font-size:clamp(11px,.78vw,14px);
      letter-spacing:.18em;text-transform:uppercase;color:var(--text);text-decoration:none;
      padding:clamp(12px,1vw,17px) clamp(20px,1.8vw,32px);border:1px solid var(--line-strong);
      transition:background .25s ease,border-color .25s ease}
    .cta:hover{background:var(--fill-ghost);border-color:rgba(255,255,255,.5)}

    .toggle{display:none;position:relative;width:44px;height:44px;background:none;border:0;cursor:pointer}
    .toggle span{position:absolute;left:50%;width:22px;height:1px;background:var(--text);
      transform:translateX(-50%);
      transition:transform .45s var(--ease-premium),opacity .25s ease}
    .toggle span:nth-child(1){top:16px}
    .toggle span:nth-child(2){top:22px}
    .toggle span:nth-child(3){top:28px}
    .toggle[aria-expanded="true"] span:nth-child(1){top:22px;transform:translateX(-50%) rotate(45deg)}
    .toggle[aria-expanded="true"] span:nth-child(2){opacity:0;transform:translateX(-50%) scaleX(0)}
    .toggle[aria-expanded="true"] span:nth-child(3){top:22px;transform:translateX(-50%) rotate(-45deg)}

    @media(max-width:900px){
      .nav__links,.cta{display:none}
      .toggle{display:block}
    }

    /* ── Mobile menu ─────────────────────────────────────────────────────── */
    .menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:clamp(22px,5vh,34px);
      background:rgba(4,4,6,.94);backdrop-filter:blur(28px) saturate(140%);
      -webkit-backdrop-filter:blur(28px) saturate(140%);
      clip-path:circle(3% at calc(100% - 42px) 42px);opacity:0;pointer-events:none;
      transition:clip-path .7s var(--ease-premium),opacity .45s ease}
    .menu.open{clip-path:circle(150% at calc(100% - 42px) 42px);opacity:1;pointer-events:auto}
    .menu a{font-family:var(--font-mono);font-weight:400;text-transform:uppercase;color:var(--text);
      text-decoration:none;font-size:clamp(20px,5.5vw,28px);letter-spacing:.14em;
      opacity:0;transform:translateY(16px);
      transition:opacity .4s ease,transform .5s var(--ease-premium);
      transition-delay:calc(180ms + var(--i) * 70ms)}
    .menu .menu__cta{font-family:var(--font-mono);font-weight:400;text-transform:uppercase;
      color:var(--text);text-decoration:none;letter-spacing:.22em;padding:16px 40px;
      border:1px solid var(--line-strong);font-size:clamp(12px,3.4vw,15px);
      opacity:0;transform:translateY(16px);
      transition:opacity .4s ease,transform .5s var(--ease-premium);
      transition-delay:calc(180ms + var(--i) * 70ms)}
    .menu.open a,.menu.open .menu__cta{opacity:1;transform:translateY(0)}

    /* ── Panel ───────────────────────────────────────────────────────────── */
    .hero__body{display:flex;align-items:center;justify-content:flex-end;
      padding:0 var(--gutter);min-height:0;overflow-y:auto}
    .panel{display:flex;flex-direction:column;align-items:flex-start;
      width:min(34vw,620px);min-width:380px}
    @media(max-width:1100px){.panel{width:min(70vw,520px);min-width:0}}
    @media(max-width:720px){
      .hero__body{justify-content:center}
      .panel{width:100%;align-items:stretch}
      .chip{align-self:flex-start}
    }

    .chip{font-family:var(--font-mono);font-weight:400;font-size:clamp(11px,.72vw,14px);
      letter-spacing:.2em;text-transform:uppercase;background:rgba(255,255,255,.09);
      padding:clamp(9px,.8vw,14px) clamp(14px,1.1vw,20px);line-height:1;align-self:flex-start}

    h1{font-family:var(--font-display);font-weight:200;font-size:clamp(54px,6.2vw,118px);
      letter-spacing:.03em;line-height:.95;margin-top:clamp(28px,3vw,52px)}
    @media(max-width:380px){h1{font-size:clamp(44px,15vw,64px)}}

    .tagline{font-family:var(--font-mono);font-weight:300;text-transform:uppercase;
      font-size:clamp(11px,.94vw,17px);letter-spacing:.14em;color:var(--text-dim);
      margin-top:clamp(14px,1.4vw,24px);line-height:1.4}

    form{display:flex;flex-direction:column;gap:clamp(14px,1.3vw,22px);width:100%;
      margin-top:clamp(38px,4.6vw,82px)}
    .vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;border:0}
    input[type=email]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);
      border-radius:0;padding:0 2px clamp(12px,1.1vw,18px);
      font-family:var(--font-display);font-weight:300;font-size:clamp(16px,.95vw,18px);
      color:var(--text);transition:border-color .25s ease}
    input[type=email]::placeholder{color:var(--text-dim)}
    input[type=email]:focus{outline:none;border-bottom-color:rgba(255,255,255,.85)}
    input[type=email]:focus::placeholder{color:var(--text-dimmer)}
    input[type=email]:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:3px}

    .btn{width:100%;border:0;border-radius:0;cursor:pointer;
      padding:clamp(17px,1.6vw,27px) 20px;font-family:var(--font-mono);font-weight:400;
      text-transform:uppercase;letter-spacing:.22em;font-size:clamp(11px,.78vw,14px);
      transition:background .25s ease,color .25s ease}
    .btn--ghost{background:var(--fill-ghost);color:var(--text-dimmer)}
    .btn--ghost:hover{background:rgba(255,255,255,.09);color:var(--text)}
    .btn--solid{background:var(--fill-solid);color:var(--text)}
    .btn--solid:hover{background:rgba(255,255,255,.17)}

    .referral{font-family:var(--font-mono);font-weight:400;text-transform:uppercase;
      font-size:clamp(11px,.74vw,14px);letter-spacing:.18em;color:var(--text);text-decoration:none;
      margin-top:clamp(26px,2.6vw,46px);align-self:center;transition:color .25s ease}
    .referral:hover{color:var(--text-dim);text-decoration:underline;text-underline-offset:4px}

    /* ── Legal ───────────────────────────────────────────────────────────── */
    .legal{border-top:1px solid var(--line);text-align:center;
      padding:clamp(18px,1.7vw,30px) var(--gutter);
      padding-bottom:max(clamp(18px,1.7vw,30px),env(safe-area-inset-bottom));
      font-family:var(--font-display);font-weight:300;font-size:clamp(12px,.82vw,16px);
      color:var(--text-dim);line-height:1.5}
    .legal a{color:var(--text);text-decoration:underline;text-underline-offset:3px;
      text-decoration-thickness:1px;transition:color .25s ease}
    .legal a:hover{color:var(--text-dim)}

    /* ── Focus ───────────────────────────────────────────────────────────── */
    .btn:focus-visible,.cta:focus-visible,.toggle:focus-visible,.referral:focus-visible,
    .menu a:focus-visible,.menu .menu__cta:focus-visible,.nav__links a:focus-visible,
    .logo:focus-visible,.legal a:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:3px}

    body.menu-open{overflow:hidden}

    /* ── Short viewports ─────────────────────────────────────────────────── */
    @media(max-height:640px){
      .hero{min-height:100svh}
      .nav{padding-top:14px;padding-bottom:14px}
      h1{font-size:clamp(36px,7vw,64px);margin-top:20px}
      .tagline{margin-top:10px}
      form{margin-top:24px;gap:12px}
      .btn{padding:13px 20px}
      .referral{margin-top:18px}
      .legal{padding-top:12px;padding-bottom:12px;font-size:11px}
      .menu{gap:16px}
    }

    /* ── Reduced motion ──────────────────────────────────────────────────── */
    @media(prefers-reduced-motion:reduce){
      .hero__media video{display:none}
      .hero__media{
        background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png");
        background-size:cover;background-position:center}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
        transition-duration:.01ms!important}
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero__media">
    <video autoplay muted loop playsinline preload="auto"
      poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_133255_956f653f-5d80-4b06-abd5-0f46c98b60fa.mp4"></video>
    <div class="hero__scrim"></div>
  </div>

  <nav class="nav">
    <a class="logo" href="#">ECHOID</a>
    <div class="nav__right">
      <div class="nav__links">
        <a href="#story">Story</a>
        <a href="#platforms">Platforms</a>
        <a href="#identity">Identity</a>
        <a href="#contact">Contact</a>
      </div>
      <a class="cta" href="#join">Join up</a>
      <button class="toggle" type="button" id="toggle"
        aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="hero__body">
    <div class="panel">
      <span class="chip">[ Voice entry ]</span>
      <h1>ECHOID</h1>
      <p class="tagline">Your voice ID to the E network.</p>

      <form action="#" method="post" novalidate id="entry">
        <div>
          <label class="vh" for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" />
        </div>
        <button class="btn btn--ghost" type="submit">Proceed using email</button>
        <button class="btn btn--solid" type="submit">Access</button>
      </form>

      <a class="referral" href="#invite">I've got an invite key</a>
    </div>
  </div>

  <div class="legal">
    Opening an e.xyz account signals that you accept our
    <a href="#privacy-notice">Privacy Notice</a> and
    <a href="#service-contract">Service Contract</a>.
  </div>

  <!-- Inside the hero, because `isolation: isolate` on it means a menu placed
       outside would paint over the nav — and the nav has to stay above the
       overlay for the close icon to be reachable. -->
  <div class="menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Site menu" aria-hidden="true" inert>
    <a href="#story" style="--i:0">Story</a>
    <a href="#platforms" style="--i:1">Platforms</a>
    <a href="#identity" style="--i:2">Identity</a>
    <a href="#contact" style="--i:3">Contact</a>
    <a class="menu__cta" href="#join" style="--i:4">Join up</a>
  </div>
</section>

<script>
(function(){
  'use strict';
  var toggle=document.getElementById('toggle');
  var menu=document.getElementById('mobileMenu');
  var form=document.getElementById('entry');
  var open=false;

  function setOpen(next){
    open=next;
    menu.classList.toggle('open',open);
    menu.setAttribute('aria-hidden',open?'false':'true');
    if(open)menu.removeAttribute('inert');else menu.setAttribute('inert','');
    document.body.classList.toggle('menu-open',open);
    toggle.setAttribute('aria-expanded',open?'true':'false');
    toggle.setAttribute('aria-label',open?'Close menu':'Open menu');
    if(open){var first=menu.querySelector('a');if(first)first.focus()}
    else{toggle.focus()}
  }

  toggle.addEventListener('click',function(){setOpen(!open)});

  /* Click the backdrop — anywhere that is not a link — to close. */
  menu.addEventListener('click',function(e){
    if(e.target===menu||e.target.closest('a'))setOpen(false);
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&open)setOpen(false);
  });

  /* The menu is a mobile affordance; on a wide viewport it should not be able
     to stay open behind the desktop nav. */
  window.addEventListener('resize',function(){
    if(open&&window.innerWidth>=901)setOpen(false);
  });

  form.addEventListener('submit',function(e){e.preventDefault()});
})();
</script>
</body>
</html>
